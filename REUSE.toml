version = 1
SPDX-PackageName = "TaskSmack"
SPDX-PackageSupplier = "Matt Gradwohl"
SPDX-PackageDownloadLocation = "https://github.com/mgradwohl/tasksmack"

# REUSE (https://reuse.software) licensing metadata for the whole repository (#150).
# Checked by the `reuse` pre-commit hook (`reuse lint`). When annotations overlap, the LAST matching
# [[annotations]] block wins, so the project-wide default comes first and third-party material
# follows. New third-party files MUST get their own block below -- see CONTRIBUTING.md.

# Default: everything is TaskSmack's own work under the MIT License (LICENSE).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2024-2026 Matt Gradwohl"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------------------------
# Third-party material (notices in assets/fonts/LICENSE.txt)
# ---------------------------------------------------------------------------------------------

# Inter (https://github.com/rsms/inter)
[[annotations]]
path = ["assets/fonts/Inter-Regular.ttf", "assets/fonts/Inter-Bold.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2016-2020 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Sixtyfour (https://github.com/jenskutilek/homecomputer-fonts)
[[annotations]]
path = "assets/fonts/Sixtyfour.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2021 The Sixtyfour Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Font Awesome 6.7.2 Free Solid (https://fontawesome.com). Font Awesome Free licenses icons packaged as
# web and desktop font files under SIL OFL 1.1; its CC BY 4.0 applies only to the SVG/JS packaging,
# which TaskSmack does not ship (assets/fonts/LICENSE.txt).
[[annotations]]
path = "assets/fonts/fa-solid-900.ttf"
precedence = "override"
SPDX-FileCopyrightText = "Fonticons, Inc. <https://fontawesome.com>"
SPDX-License-Identifier = "OFL-1.1"

# Patch against toml++ (https://github.com/marzer/tomlplusplus, MIT); its context lines are toml++ code.
[[annotations]]
path = "cmake/patches/tomlplusplus-parse-value-terminator.patch"
precedence = "override"
SPDX-FileCopyrightText = [
    "2024-2026 Matt Gradwohl",
    "Mark Gillard <mark.gillard@outlook.com.au>",
]
SPDX-License-Identifier = "MIT"

# Adapted from the Contributor Covenant 2.1 (https://www.contributor-covenant.org), CC BY 4.0.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"
