License: MIT
LicenseUrl: https://github.com/mgradwohl/tasksmack/blob/main/LICENSE
ShortDescription: A system monitor and task manager for Windows and Linux
Description: |-
  TaskSmack is an open-source system monitor and task manager. It has a sortable, filterable process table with
  a tree view and per-process details, CPU, memory, storage, network, GPU, NPU and battery histories, Services
  and Startup tabs, a System Information report, and 22 themes. It can act on elevated processes through a
  signed helper and UAC, and can replace Task Manager.
