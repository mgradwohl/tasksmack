# Pre-commit hooks for TaskSmack
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.patch$'  # a diff's blank context lines are a single space; trimming it breaks the patch
      - id: end-of-file-fixer
        name: Fix end of files
        # CHANGELOG.md: auto-generated by git-cliff; manual edits are not allowed.
        # tests/fuzz/corpus/toml-regressions/: minimised crash inputs, kept byte for byte.
        exclude: '^CHANGELOG\.md$|^tests/fuzz/corpus/toml-regressions/'
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
        exclude: '^\.vscode/.*\.json$|^\.devcontainer/.*\.json$'  # VS Code and DevContainers use JSONC (JSON with comments)
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: Check for merge conflicts
      # Text is UTF-8 without a BOM (#1648; CONTRIBUTING.md "Text encoding and locale").
      - id: fix-byte-order-marker
        name: Remove UTF-8 byte-order marks
        exclude: '^CHANGELOG\.md$|^tests/fuzz/corpus/'

  # UTF-8 decode check (#1648): every staged text file must decode as strict UTF-8; failures are
  # reported as file:line. pre-commit-hooks has no such hook, so it's a local script. `types: [text]`
  # leaves out binary assets (the same set .gitattributes marks binary); fuzz corpora are raw bytes.
  - repo: local
    hooks:
      - id: check-utf8
        name: Check text files are UTF-8
        # language: python gives the hook its own interpreter, so 'python' resolves on every OS.
        entry: python -I -X utf8 tools/check-utf8.py
        language: python
        types: [text]
        exclude: '^tests/fuzz/corpus/'

  # C++ formatting with clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: Format C++ code
        args: [--style=file]
        types_or: [c++, c]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        args: [-x]  # Follow sourced files

  # GitHub Actions workflow linting (#1187): expression/context/type errors, bad `needs:`, unknown
  # inputs, and -- when shellcheck is on PATH -- warning-level shellcheck findings in `run:` blocks.
  # Info/style shellcheck findings are ignored in .github/actionlint.yaml.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows

  # REUSE licensing compliance (#150): every file needs copyright + licence info. Annotations live
  # in REUSE.toml, licence texts in LICENSES/. See CONTRIBUTING.md "Licensing (REUSE)".
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        name: Check REUSE licensing compliance

  # Include-what-you-use (IWYU) - optional, runs in report-only mode
  # Prerequisites:
  #   - IWYU installed (apt install iwyu or brew install include-what-you-use)
  #   - Project built at least once (cmake --preset debug && cmake --build build/debug)
  # This hook is slow and advisory-only, so it's set to manual stage
  - repo: local
    hooks:
      - id: iwyu
        name: Include What You Use (IWYU)
        entry: ./tools/iwyu.sh --report
        language: script
        files: \.(cpp|h|hpp)$
        exclude: ^(build/|\.cache/)
        stages: [manual]  # Run with: pre-commit run iwyu --hook-stage manual
        pass_filenames: false
        require_serial: true
        verbose: true
