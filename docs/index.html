<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaskSmack Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <!-- Docsify 5's core theme, with its Vue look as an add-on (#3168) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css"
    integrity="sha384-u1ltA0BWEetQbGokjUjglT9sN702RQwy8JESh3Ha4GNlyzMU57usk6duY0/BOTMj"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/vue.min.css"
    integrity="sha384-Juf4pwILpOysilbsFQxO8a3Ct3yDvSPolGmartfG+QQRLj6m7c1mYWV38WDI1N93"
    crossorigin="anonymous"
  />
  <style>
    :root {
      --theme-color: #3d7ebf;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // The site's root is the User Guide's own route, not the guide shown at the root (#2967): with
    // relativePath, a page's links resolve from its route, so the guide's faq.md#... and ../images/...
    // would resolve from the root and 404 there. A redirect, so the root URL and the name link both work.
    function toUserGuide() {
      if (location.hash === '' || location.hash === '#' || location.hash === '#/') {
        location.replace(location.pathname + location.search + '#/guide/user-guide');
      }
    }
    toUserGuide();
    window.addEventListener('hashchange', toUserGuide);
    window.$docsify = {
      name: 'TaskSmack',
      repo: 'mgradwohl/tasksmack',
      // What Docsify loads for the root route, which toUserGuide() redirects before it's shown; without
      // it, Docsify (and search) would ask for a README.md the site doesn't have.
      homepage: 'guide/user-guide.md',
      // Links and images resolve from the page they're in, as GitHub renders them (#2953).
      relativePath: true,
      loadSidebar: true,
      coverpage: false,
      notFoundPage: '_404.md',
      maxLevel: 3,
      subMaxLevel: 2,
      themeColor: '#3d7ebf',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs…',
        noData: 'No results.',
        depth: 2
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      mermaid: {
        theme: 'default'
      },
      plugins: [
        // Each heading also answers to GitHub's anchor for it (#2967). The docs link sections as GitHub
        // renders them (faq.md#process-io-fds-or-network-show-na-on-linux), but Docsify's slugs differ
        // for some characters: a heading's double quotes become "quot", an apostrophe "39". Without
        // this, such a link lands at the top of the page instead of the section. Docsify has scrolled to
        // the route's id by the time this runs, so a link to an added anchor scrolls here.
        function (hook, vm) {
          function githubSlug(text) {
            return text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
          }
          hook.doneEach(function () {
            document.querySelectorAll('.markdown-section :is(h1, h2, h3, h4, h5, h6)').forEach(function (heading) {
              var slug = githubSlug(heading.textContent);
              if (slug && slug !== heading.id && !document.getElementById(slug)) {
                var anchor = document.createElement('span');
                anchor.id = slug;
                heading.prepend(anchor);
              }
            });
            var wanted = vm.route.query.id && document.getElementById(decodeURIComponent(vm.route.query.id));
            if (wanted && wanted.tagName === 'SPAN') {
              wanted.parentElement.scrollIntoView();
            }
          });
        }
      ]
    };
  </script>
  <!-- Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js" integrity="sha384-w6yZXzkazsxmservgGooUY9zjEHzIFHubRNZMLJ3enj/JD+Z8BvAGBqdrjfnLNhu" crossorigin="anonymous"></script>
  <!-- Search -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js" integrity="sha384-wZGyhbW44GtFpUJG1z6siOX84RFRDAht5UTeOlV/LlRP6T2GXj3LrLwcUHTyzfby" crossorigin="anonymous"></script>
  <!-- Copy code button -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js" integrity="sha384-t4d9b4/0dEBkoJ5e77XEPBrqJ790jbFQFmEaTbBqIlTDeGosM1AbZvC1NQwqTg+5" crossorigin="anonymous"></script>
  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" integrity="sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I" crossorigin="anonymous"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js" integrity="sha384-U2Wy2Wa3grc0soLXlky3iZWvD6N5p3o+Udi8RpPWlbscpUEfi7RuQHzMmSstkHou" crossorigin="anonymous"></script>
  <!-- Prism syntax highlighting (C++ grammar) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-clike.min.js" integrity="sha384-7LHwxHIDSHTBleLmgDWZbC/IMJsfYfFVOihKhvsrxYW4j47YQcRwZja4ToFE3bA8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-c.min.js" integrity="sha384-gaD4ncierlmWk42Z3BmTp37/z+Dqt8V4Wf74UjTvFeo+M+SgnEI6Ysd98pWhksQv" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-cpp.min.js" integrity="sha384-NiOrAquf32LSG3Vuig99LKS03EZPUuM8a51NOp+XXsqx08hUVo3wbNWALY7K/2J8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-cmake.min.js" integrity="sha384-N/R9aEWuB6s4BOuh/QelSwBnfARmerMJJI8ffDEpotQfjjUiRUBlEM/uZzItj0pi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js" integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-powershell.min.js" integrity="sha384-xbI9krqyYp4npK9Cn94XyNoSR+TYZKddrk0NUVZ44zZ+OVpKz/LL0U1PB0MjR7Vx" crossorigin="anonymous"></script>
</body>
</html>
