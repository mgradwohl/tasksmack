# Configuration for git-cliff
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md following the Keep a Changelog format.
# Triggered automatically by .github/workflows/changelog.yml on every strict vMAJOR.MINOR.PATCH tag.

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

<!-- This file is auto-generated by [git-cliff](https://git-cliff.org/) on release. Do not edit manually. -->
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING CHANGE:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.github.username %} ([@{{ commit.github.username }}](https://github.com/{{ commit.github.username }})){% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
"""

trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
  # Link issue/PR references like (fixes #123) or (#123) to GitHub.
  # ${1} preserves the optional leading word (e.g. "fixes ") so context is not lost.
  # NOTE: The URL here duplicates [remote.github]; regex replacements cannot
  # reference TOML sections, so this is the one remaining hard-coded occurrence.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "(${1}[#${2}](https://github.com/mgradwohl/tasksmack/issues/${2}))" },
]

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^perf",     group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^style",    group = "Changed" },
  { message = "^docs",     group = "Documentation" },
  { message = "^test",     group = "Infrastructure" },
  { message = "^ci",       group = "Infrastructure" },
  { message = "^build",    group = "Infrastructure" },
  { message = "^chore",    group = "Maintenance" },
  { message = "^revert",   group = "Reverted" },
  # Skip bare merge commits — they add noise without information
  { message = "^Merge",    skip = true },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# Remote configuration: owner/repo are defined here once and referenced in the
# changelog body template via {{ remote.github.owner }}/{{ remote.github.repo }}.
# The GITHUB_TOKEN passed by the workflow enables git-cliff to enrich commits
# with GitHub metadata (PR titles, usernames, etc.).
[remote.github]
owner = "mgradwohl"
repo = "tasksmack"
