# Configuration for git-cliff
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md following the Keep a Changelog format.
# Triggered automatically by .github/workflows/changelog.yml on every strict vMAJOR.MINOR.PATCH tag.
#
# Groups carry a hidden "<!-- N -->" prefix so they sort in reading order (Security first,
# Maintenance last) instead of alphabetically; the body template strips it with striptags.

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

<!-- This file is auto-generated by [git-cliff](https://git-cliff.org/) on release. Do not edit manually. -->
"""

# scope_label turns a commit scope into a readable label ("windows" -> "Windows",
# "sysinfo" -> "System Information"); a multi-scope "ui,gpu" becomes "UI, GPU".
#
# Releases up to v0.8.0 were generated while untyped commits were filtered out. The
# workflow regenerates the whole file, so those sections keep showing conventional
# commits only; untyped squash titles appear from v0.9.0 on.
body = """
{%- macro one_scope(s) -%}
{%- if s == "ui" %}UI\
{%- elif s == "gpu" %}GPU\
{%- elif s == "npu" %}NPU\
{%- elif s == "cpu" %}CPU\
{%- elif s == "ci" %}CI\
{%- elif s == "net" %}Network\
{%- elif s == "deps" %}Dependencies\
{%- elif s in ["sysinfo", "systeminfo", "system-info"] %}System Information\
{%- elif s in ["details", "process-details"] %}Process Details\
{%- elif s in ["tools", "tooling"] %}Tools\
{%- elif s in ["clang-tidy", "tidy"] %}clang-tidy\
{%- elif s == "codeql" %}CodeQL\
{%- elif s == "cmake" %}CMake\
{%- elif s == "cflite" %}CFLite\
{%- elif s == "readme" %}README\
{%- elif s == "crashhistory" %}Crash history\
{%- elif s == "process-model" %}ProcessModel\
{%- else %}{{ s | replace(from="-", to=" ") | upper_first }}\
{%- endif -%}
{%- endmacro one_scope -%}
{%- macro scope_label(scope) -%}
{%- for s in scope | split(pat=",") -%}
{%- if not loop.first %}, {% endif %}{{ self::one_scope(s=s | trim) }}\
{%- endfor -%}
{%- endmacro scope_label -%}
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% if version and version is matching("^v0\\.([5-7]\\.[0-9]+|8\\.0)$") %}\
{% set shown = commits | filter(attribute="conventional", value=true) %}\
{% else %}\
{% set shown = commits %}\
{% endif %}\
{% for group, commits in shown | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING CHANGE:** {% endif %}\
{% if commit.scope %}**{{ self::scope_label(scope=commit.scope) }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.remote.username %} ([@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})){% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
"""

trim = true
footer = ""

[git]
conventional_commits = true
# Untyped commits stay in: the June-July 2026 squash merges (#743 Wayland, #688 PDH GPU and
# others) have plain titles, and the parsers below sort them by their leading verb.
filter_unconventional = false
split_commits = false

commit_preprocessors = [
  # Link issue/PR references like (fixes #123) or (#123) to GitHub.
  # ${1} preserves the optional leading word (e.g. "fixes ") so context is not lost.
  # NOTE: The URL here duplicates [remote.github]; regex replacements cannot
  # reference TOML sections, so this is the one remaining hard-coded occurrence.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "(${1}[#${2}](https://github.com/mgradwohl/tasksmack/issues/${2}))" },
]

# First match wins, so the specific rules come before the generic "^fix"/"^feat"/"^perf" ones.
# Conventional types are lower-case and the untyped squash titles start upper-case, so the
# "^[A-Z]" rules only ever see untyped commits.
commit_parsers = [
  # --- Skipped: noise -------------------------------------------------------------------------
  { message = "^Merge",                                         skip = true },
  # The changelog workflow's own commit ("Update CHANGELOG.md for vX.Y.Z") and similar bot commits.
  { message = '(?i)^(Update CHANGELOG|chore(\([^)]*\))?!?: (update|regenerate) changelog)', skip = true },
  # Dependabot/Renovate bumps of GitHub Actions and Python dev tools: none of them ships in
  # TaskSmack, and at ~65 a release they would outnumber everything but Fixed.
  { message = '^(ci|build)\(deps(-dev)?\)',                     skip = true },
  # New tests (~240 a release) would swamp Infrastructure; fixes to the test harness itself
  # (fix(test)) still land there below.
  { message = '^test(\(|!|:)',                                  skip = true },
  { message = '^(Add|Increase|Link) .*\b(tests|coverage)\b',    skip = true },

  # --- Security -------------------------------------------------------------------------------
  { message = '^security',                                      group = "<!-- 0 -->Security" },
  { message = '^[a-z]+\(([^)]*,)?security(,[^)]*)?\)',         group = "<!-- 0 -->Security" },
  # Binary hardening and DLL-loading fixes (e.g. "fix(windows): harden TaskSmackHelper.exe",
  # "load pdh.dll ... from System32 only"); limited to fix/build so "ci: harden toolchain
  # determinism" stays Infrastructure.
  { message = '(?i)^(fix|build)(\([^)]*\))?!?: .*\b(harden|hardens|hardening|dll)\b', group = "<!-- 0 -->Security" },

  # --- Infrastructure: developer tooling, whatever the type -----------------------------------
  { message = '^fix\((test|tests|tools|tooling|ci|build|cmake|coverage|bench|fuzz|perf|training|setup|packaging|claude|code-scanning)\)', group = "<!-- 7 -->Infrastructure" },
  { message = '^feat\((tools|tooling|test|tests|perf|bench)\)', group = "<!-- 7 -->Infrastructure" },
  # perf(bench), perf(tools), perf(tooling), "perf toolset:", "perf(platform) + tooling:"
  { message = '^perf(\((bench|tools|tooling)\)|[^:]*\btool(s|set|ing)\b)', group = "<!-- 7 -->Infrastructure" },
  { message = '^tool(s|ing)?(\(|!|:)',                          group = "<!-- 7 -->Infrastructure" },
  # Multi-type subjects such as "docs, tooling, test: ..." are developer housekeeping.
  { message = '^[a-z]+(, ?[a-z]+)+:',                           group = "<!-- 7 -->Infrastructure" },
  # Untyped titles about the build, CI or tooling.
  { message = '^[A-Z].*(\bCI\b|\bCMake|\bCMP[0-9]{4}\b|\bIWYU\b|\bThinLTO\b|\bclang-tidy\b|\bRenovate\b|\bCopilot\b|toolchain\b|\bbenchmark\b|\brelease workflow\b|\bfuzzing\b|\.(sh|ps1|py)\b)', group = "<!-- 7 -->Infrastructure" },

  # --- Untyped titles, by leading verb --------------------------------------------------------
  { message = '^(Speed up|Optimi[sz]e)\b|^[A-Z].*\bfaster\b',  group = "<!-- 4 -->Performance" },
  { message = '^(Document|Docs?)\b|^[A-Z].*\bdocs\b',          group = "<!-- 5 -->Documentation" },
  { message = '^(Fix|Fixes|Fixed|Resolve|Resolves|Resolved)\b', group = "<!-- 2 -->Fixed" },
  { message = '^(Add|Adds|Added|Implement|Implements|Introduce)\b', group = "<!-- 1 -->Added" },
  { message = '^Bump\b',                                        group = "<!-- 6 -->Dependencies" },
  { message = '^Update\b',                                      group = "<!-- 8 -->Maintenance" },
  { message = '^(Refactor|Clean|Extract|Unify|Modularize|Rewrite)\b', group = "<!-- 3 -->Changed" },

  # --- Conventional types ---------------------------------------------------------------------
  { message = "^feat",     group = "<!-- 1 -->Added" },
  { message = "^fix",      group = "<!-- 2 -->Fixed" },
  { message = "^perf",     group = "<!-- 4 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^style",    group = "<!-- 3 -->Changed" },
  { message = "^docs?",    group = "<!-- 5 -->Documentation" },
  { message = "^ci",       group = "<!-- 7 -->Infrastructure" },
  { message = "^build",    group = "<!-- 7 -->Infrastructure" },
  { message = "^chore",    group = "<!-- 8 -->Maintenance" },
  { message = "^revert",   group = "<!-- 9 -->Reverted" },

  # Anything else (an untyped title with another verb, or an unknown type) is a change.
  { message = ".*",        group = "<!-- 3 -->Changed" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# Remote configuration: owner/repo are defined here once and referenced in the
# changelog body template via {{ remote.github.owner }}/{{ remote.github.repo }}.
# The GITHUB_TOKEN passed by the workflow enables git-cliff to enrich commits
# with GitHub metadata (PR titles, usernames, etc.).
[remote.github]
owner = "mgradwohl"
repo = "tasksmack"
