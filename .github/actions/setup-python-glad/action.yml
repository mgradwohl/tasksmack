name: 'Setup Python for GLAD'
description: 'Install the pinned Python interpreter with pip cache and install jinja2 for GLAD code generation'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: 'requirements-glad.txt'

    - name: Install Python dependencies for GLAD
      shell: pwsh
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r requirements-glad.txt
