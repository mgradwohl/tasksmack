name: 'Setup Python for GLAD'
description: 'Install pinned Python 3.14 with pip cache and install jinja2 for GLAD code generation'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: 'requirements-glad.lock'

    - name: Install Python dependencies for GLAD
      shell: pwsh
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r requirements-glad.lock
