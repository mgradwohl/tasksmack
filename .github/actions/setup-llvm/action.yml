name: 'Setup LLVM'
description: 'Install and configure LLVM toolchain on Ubuntu'
inputs:
  llvm-version:
    description: 'LLVM version to install'
    required: false
    default: '23'
  install-clang-format:
    description: 'Install clang-format'
    required: false
    default: 'false'
  install-clang-tidy:
    description: 'Install clang-tidy'
    required: false
    default: 'false'
  install-clangd:
    description: 'Install clangd'
    required: false
    default: 'false'
  install-coverage-tools:
    description: 'Install llvm-profdata and llvm-cov for coverage'
    required: false
    default: 'false'
  install-ninja:
    description: 'Install ninja build system'
    required: false
    default: 'true'
  install-ccache:
    description: 'Install ccache'
    required: false
    default: 'true'
  expect-release:
    description: >
      Upstream LLVM release to require (e.g. '23.1.5', which must be in llvm-version's major). When
      set, the step fails unless clang-<llvm-version>'s package version starts with '1:<release>~'
      and clang reports that release, so a release build never silently picks up another upstream
      release. The apt.llvm.org snapshot inside that release (the part after the '~') may change:
      apt.llvm.org rebuilds it every few days and keeps only the newest (#3393), so pinning the
      whole build string broke releases on its own (#3307, #3392). The exact build string is the
      caller's to record (record-build-inputs.sh beside this action).
      Setting it also changes the LLVM package cache (see "LLVM package cache key" below): the
      key names the release instead of the week, only the exact key is restored, and on a miss
      the .debs are staged in package-cache-path for the caller to save (outputs below), since
      the release's own jobs decide which runs save. Leave empty (the default) for no check.
    required: false
    default: ''
  generate-test-locales:
    description: >
      Generate the de_DE, fr_FR and en_US UTF-8 locales, so the locale-display tests (#1648) run
      instead of skipping. Only the jobs that run those tests need them.
    required: false
    default: 'false'

outputs:
  package-cache-key:
    description: 'The LLVM package cache key'
    value: ${{ steps.package-cache-key.outputs.key }}
  package-cache-path:
    description: 'The directory the LLVM .debs are restored to and staged in'
    value: ${{ steps.package-cache-key.outputs.path }}
  package-cache-hit:
    description: "'true' when LLVM was installed from the exact key's cached .debs"
    value: ${{ steps.install.outputs.cache-hit }}
  package-cache-staged:
    description: >-
      'true' after a cache miss once every installed LLVM .deb is staged in package-cache-path.
      Without expect-release this action saves it itself (main and release/* runs only); with
      expect-release the caller saves it with actions/cache/save under package-cache-key (main and
      release/* runs only, as the repo's other caches)
    value: ${{ steps.install.outputs.staged }}

runs:
  using: 'composite'
  steps:
    - name: Use a UTF-8 locale
      shell: bash
      run: |
        # Every later step in the job runs in C.UTF-8, so tools and tests see UTF-8 text the
        # same way a developer's machine does, not the runner's POSIX default (#1648).
        echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
        echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"

    - name: Generate the test locales
      if: inputs.generate-test-locales == 'true'
      shell: bash
      run: |
        sudo locale-gen de_DE.UTF-8 fr_FR.UTF-8 en_US.UTF-8
        locale -a | grep -iE '^(de_DE|fr_FR|en_US)\.utf-?8$'

    - name: Remove stale Microsoft apt sources
      shell: bash
      run: |
        # Ubuntu GitHub runners ship Microsoft apt repos that intermittently
        # return 403 Forbidden, causing apt-get update (called by llvm.sh internally
        # via add-apt-repository) to exit non-zero and abort the step. Remove them
        # before any apt operations so only the repos we need are active.
        sudo rm -f \
          /etc/apt/sources.list.d/azure-cli.list \
          /etc/apt/sources.list.d/azure-cli.sources \
          /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/apt/sources.list.d/microsoft-prod.sources \
          /etc/apt/sources.list.d/packages-microsoft-prod.list
        sudo find /etc/apt/sources.list.d/ -name '*microsoft*' -delete 2>/dev/null || true

    # The LLVM package cache (#3393; every caller since #3635), so a warm run installs LLVM without
    # reaching apt.llvm.org at all: an apt.llvm.org outage (2026-11-11) otherwise fails every Linux
    # job. The key names everything that decides which .debs a run needs: the LLVM version, the OS
    # image (Ubuntu 24.04 and 26.04 are different apt.llvm.org repositories), the architecture and
    # the requested apt.llvm.org packages (a hash of the optional ones, so callers with clang-tidy or
    # clang-format keep their own entry). A cached set keeps installing the snapshot it was saved
    # from after apt.llvm.org moves on, which is the point. Bump the -v suffix to discard a bad entry.
    #   - Without expect-release: the key ends in the ISO week (-2026-W46), so the first run of a week
    #     on main refreshes from apt.llvm.org and saves, and every later run that week is a hit. The
    #     restore-key (the same key without the week) falls back to the newest earlier week's entry;
    #     install-llvm.sh tries apt.llvm.org for a fresh set then, and installs that older entry with a
    #     warning when apt.llvm.org is down. cache-prune.yml keeps only each set's newest week on main
    #     (tools/cache-prune-stale.py), so there is one live entry per set (~160 MB each).
    #   - With expect-release: the key names the release instead of the week, and only the exact key is
    #     used, never a restore-key, so a release can't build with another release's snapshot; a new
    #     release gets a new key by itself.
    - name: LLVM package cache key
      id: package-cache-key
      shell: bash
      env:
        EXPECT_RELEASE: ${{ inputs.expect-release }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        VER="${LLVM_VERSION:-23}"
        if [[ ! "$VER" =~ ^[0-9]+$ ]]; then
          echo "::error::llvm-version must be a numeric major version, not '$VER'."
          exit 1
        fi
        if [[ -n "$EXPECT_RELEASE" ]]; then
          if [[ ! "$EXPECT_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expect-release must be an X.Y.Z LLVM release, not '$EXPECT_RELEASE'."
            exit 1
          fi
          if [[ "${EXPECT_RELEASE%%.*}" != "$VER" ]]; then
            echo "::error::expect-release $EXPECT_RELEASE is not in llvm-version ${VER}'s major."
            exit 1
          fi
        fi
        # shellcheck disable=SC1091
        image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")
        # The optional apt.llvm.org packages (install-llvm.sh's LLVM_PACKAGES); clangd is always in.
        packages="format=${INSTALL_CLANG_FORMAT} tidy=${INSTALL_CLANG_TIDY}"
        set_id=$(printf '%s' "$packages" | sha256sum | cut -c1-12)
        if [[ -n "$EXPECT_RELEASE" ]]; then
          echo "key=Linux-llvm-debs-${EXPECT_RELEASE}-${image}-${RUNNER_ARCH}-${set_id}-v1" >> "$GITHUB_OUTPUT"
          echo "restore-keys=" >> "$GITHUB_OUTPUT"
        else
          family="Linux-llvm-debs-${VER}-${image}-${RUNNER_ARCH}-${set_id}-v1"
          echo "key=${family}-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "restore-keys=${family}-" >> "$GITHUB_OUTPUT"
        fi
        echo "path=${RUNNER_TEMP}/llvm-debs" >> "$GITHUB_OUTPUT"

    - name: Restore the LLVM package cache
      id: package-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.package-cache-key.outputs.path }}
        key: ${{ steps.package-cache-key.outputs.key }}
        restore-keys: ${{ steps.package-cache-key.outputs.restore-keys }}

    - name: Install LLVM ${{ inputs.llvm-version }}
      id: install
      shell: bash
      env:
        CACHE_DIR: ${{ steps.package-cache-key.outputs.path }}
        CACHE_RESTORED: ${{ steps.package-cache.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.package-cache.outputs.cache-matched-key }}
        EXPECT_RELEASE: ${{ inputs.expect-release }}
        INSTALL_CCACHE: ${{ inputs.install-ccache }}
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_NINJA: ${{ inputs.install-ninja }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
      # The cache-hit path, apt.llvm.org's installer, the retries and the older-entry fallback are in
      # the script (#3393, #3635).
      run: bash "$GITHUB_ACTION_PATH/install-llvm.sh"

    # Without expect-release, this action saves the set it staged after a miss. Only main and
    # release/* save, as the repo's other caches (#1406); a pull request reads its base branch's
    # entry. Saving here makes every workflow that uses this action a cache saver to
    # tools/check-cache-prune-triggers.py, so each is in cache-prune.yml's list. Two jobs that miss
    # in the same week race to save one key; the loser only warns.
    - name: Save the LLVM package cache (main and release/* only)
      if: >-
        inputs.expect-release == '' && steps.install.outputs.staged == 'true' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.package-cache-key.outputs.path }}
        key: ${{ steps.package-cache-key.outputs.key }}

    - name: Assert the LLVM release
      if: inputs.expect-release != ''
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        EXPECT_RELEASE: ${{ inputs.expect-release }}
      run: |
        VER="${LLVM_VERSION:-23}"
        ACTUAL_VERSION=$(dpkg-query -W -f='${Version}' "clang-${VER}")
        if [[ "$ACTUAL_VERSION" != "1:${EXPECT_RELEASE}~"* ]]; then
          echo "::error::clang-${VER} is package version '$ACTUAL_VERSION', which is not LLVM ${EXPECT_RELEASE} (expected '1:${EXPECT_RELEASE}~...')."
          echo "apt.llvm.org now serves another upstream release for LLVM ${VER}. Review it, then bump LLVM_LINUX_RELEASE in release.yml (docs/dev/release-process.md, \"The Linux LLVM pin\")." >&2
          exit 1
        fi
        CLANG_LINE=$("clang-${VER}" --version | head -n 1)
        if [[ "$CLANG_LINE" != *"clang version ${EXPECT_RELEASE}"* ]]; then
          echo "::error::clang-${VER} reports '$CLANG_LINE', not clang version ${EXPECT_RELEASE}."
          exit 1
        fi
        # The linker and C++ library must be the same apt.llvm.org build as the compiler, so a mix
        # of two snapshots (a partial upgrade, or a stale cache entry) can't build a release.
        for pkg in "lld-${VER}" "libc++-${VER}-dev" "libc++abi-${VER}-dev"; do
          other=$(dpkg-query -W -f='${Version}' "$pkg")
          if [[ "$other" != "$ACTUAL_VERSION" ]]; then
            echo "::error::$pkg is '$other', but clang-${VER} is '$ACTUAL_VERSION'."
            exit 1
          fi
        done
        echo "Verified LLVM ${EXPECT_RELEASE}: clang-${VER} package ${ACTUAL_VERSION} (${CLANG_LINE})"

    - name: Configure LLVM alternatives
      shell: bash
      env:
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_COVERAGE_TOOLS: ${{ inputs.install-coverage-tools }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        VER="$LLVM_VERSION"
        if [[ -z "$VER" ]]; then
          VER='23'
        fi

        # Core LLVM tools (always configured)
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-$VER 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-$VER 100
        sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-$VER 100
        sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-$VER 100

        # Set alternatives explicitly
        sudo update-alternatives --set clang /usr/bin/clang-$VER
        sudo update-alternatives --set clang++ /usr/bin/clang++-$VER

        # Optional: clang-format
        if [[ "$INSTALL_CLANG_FORMAT" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-$VER 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-$VER
        fi

        # Optional: clang-tidy
        if [[ "$INSTALL_CLANG_TIDY" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-$VER 100
          sudo update-alternatives --set clang-tidy /usr/bin/clang-tidy-$VER
        fi

        # Optional: clangd
        if [[ "$INSTALL_CLANGD" == "true" ]] && [[ -x "/usr/bin/clangd-$VER" ]]; then
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-$VER 100
          sudo update-alternatives --set clangd /usr/bin/clangd-$VER
        fi

        # Optional: coverage tools
        if [[ "$INSTALL_COVERAGE_TOOLS" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/llvm-profdata llvm-profdata /usr/bin/llvm-profdata-$VER 100
          sudo update-alternatives --install /usr/bin/llvm-cov llvm-cov /usr/bin/llvm-cov-$VER 100
          sudo update-alternatives --set llvm-profdata /usr/bin/llvm-profdata-$VER
          sudo update-alternatives --set llvm-cov /usr/bin/llvm-cov-$VER
        fi

    - name: Verify installation
      shell: bash
      env:
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_COVERAGE_TOOLS: ${{ inputs.install-coverage-tools }}
      run: |
        echo "=== LLVM Installation Summary ==="
        clang --version | head -1
        clang++ --version | head -1
        ld.lld --version
        if [[ "$INSTALL_CLANG_FORMAT" == "true" ]]; then
          clang-format --version
        fi
        if [[ "$INSTALL_CLANG_TIDY" == "true" ]]; then
          clang-tidy --version | head -1
        fi
        if [[ "$INSTALL_CLANGD" == "true" ]]; then
          clangd --version | head -1
        fi
        if [[ "$INSTALL_COVERAGE_TOOLS" == "true" ]]; then
          llvm-profdata --version 2>&1 | head -1 || echo "llvm-profdata: $(which llvm-profdata || echo 'not found')"
          llvm-cov --version 2>&1 | head -1 || echo "llvm-cov: $(which llvm-cov || echo 'not found')"
        fi
