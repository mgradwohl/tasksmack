name: 'Setup LLVM'
description: 'Install and configure LLVM toolchain on Ubuntu'
inputs:
  llvm-version:
    description: 'LLVM version to install'
    required: false
    default: '22'
  install-clang-format:
    description: 'Install clang-format'
    required: false
    default: 'false'
  install-clang-tidy:
    description: 'Install clang-tidy'
    required: false
    default: 'false'
  install-clangd:
    description: 'Install clangd'
    required: false
    default: 'false'
  install-coverage-tools:
    description: 'Install llvm-profdata and llvm-cov for coverage'
    required: false
    default: 'false'
  install-ninja:
    description: 'Install ninja build system'
    required: false
    default: 'true'
  install-ccache:
    description: 'Install ccache'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Remove stale Microsoft apt sources
      shell: bash
      run: |
        # Ubuntu 24.04 GitHub runners ship Microsoft apt repos that intermittently
        # return 403 Forbidden, causing apt-get update (called by llvm.sh internally
        # via add-apt-repository) to exit non-zero and abort the step. Remove them
        # before any apt operations so only the repos we need are active.
        sudo rm -f \
          /etc/apt/sources.list.d/azure-cli.list \
          /etc/apt/sources.list.d/azure-cli.sources \
          /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/apt/sources.list.d/microsoft-prod.sources \
          /etc/apt/sources.list.d/packages-microsoft-prod.list
        sudo find /etc/apt/sources.list.d/ -name '*microsoft*' -delete 2>/dev/null || true

    - name: Install LLVM ${{ inputs.llvm-version }}
      shell: bash
      env:
        INSTALL_CCACHE: ${{ inputs.install-ccache }}
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_NINJA: ${{ inputs.install-ninja }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        LLVM_VER="$LLVM_VERSION"
        if [[ -z "$LLVM_VER" ]]; then
          LLVM_VER='22'
        fi
        if [[ ! "$LLVM_VER" =~ ^[0-9]+$ ]]; then
          echo "llvm-version must be a numeric major version" >&2
          exit 1
        fi

        # GitHub's Ubuntu mirror list prefers azure.archive.ubuntu.com, which can
        # accept a connection and then stall indefinitely. Select the standard
        # archive before any apt operation so a hung Azure request cannot prevent
        # fallback logic from ever running.
        sudo tee /etc/apt/apt.conf.d/80-tasksmack-network >/dev/null <<'APT_CONFIG'
        Acquire::Retries "2";
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        APT_CONFIG
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          echo 'https://archive.ubuntu.com/ubuntu/' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        sudo sed -i \
          's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

        # Verify the installer before granting it root privileges.
        LLVM_INSTALLER_SHA256='03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae'
        curl --fail --silent --show-error --location \
          --output llvm.sh https://apt.llvm.org/llvm.sh
        echo "$LLVM_INSTALLER_SHA256  llvm.sh" | sha256sum --check --strict
        chmod +x llvm.sh
        sudo timeout --kill-after=10s 300s ./llvm.sh "$LLVM_VER"
        rm -f llvm.sh

        # Build package list - always include GUI dependencies
        PACKAGES="libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libc++-${LLVM_VER}-dev libc++abi-${LLVM_VER}-dev libfreetype6-dev"

        if [[ "$INSTALL_NINJA" == "true" ]]; then
          PACKAGES="$PACKAGES ninja-build"
        fi
        if [[ "$INSTALL_CCACHE" == "true" ]]; then
          PACKAGES="$PACKAGES ccache"
        fi
        if [[ "$INSTALL_CLANG_FORMAT" == "true" ]]; then
          PACKAGES="$PACKAGES clang-format-${LLVM_VER}"
        fi
        if [[ "$INSTALL_CLANG_TIDY" == "true" ]]; then
          PACKAGES="$PACKAGES clang-tidy-${LLVM_VER}"
        fi
        if [[ "$INSTALL_CLANGD" == "true" ]]; then
          PACKAGES="$PACKAGES clangd-${LLVM_VER}"
        fi

        # Install packages
        sudo timeout --kill-after=10s 180s apt-get update
        sudo timeout --kill-after=10s 300s apt-get install -y $PACKAGES

    - name: Configure LLVM alternatives
      shell: bash
      env:
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_COVERAGE_TOOLS: ${{ inputs.install-coverage-tools }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        VER="$LLVM_VERSION"
        if [[ -z "$VER" ]]; then
          VER='22'
        fi

        # Core LLVM tools (always configured)
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-$VER 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-$VER 100
        sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-$VER 100
        sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-$VER 100

        # Set alternatives explicitly
        sudo update-alternatives --set clang /usr/bin/clang-$VER
        sudo update-alternatives --set clang++ /usr/bin/clang++-$VER

        # Optional: clang-format
        if [[ "$INSTALL_CLANG_FORMAT" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-$VER 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-$VER
        fi

        # Optional: clang-tidy
        if [[ "$INSTALL_CLANG_TIDY" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-$VER 100
          sudo update-alternatives --set clang-tidy /usr/bin/clang-tidy-$VER
        fi

        # Optional: clangd
        if [[ "$INSTALL_CLANGD" == "true" ]] && [[ -x "/usr/bin/clangd-$VER" ]]; then
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-$VER 100
          sudo update-alternatives --set clangd /usr/bin/clangd-$VER
        fi

        # Optional: coverage tools
        if [[ "$INSTALL_COVERAGE_TOOLS" == "true" ]]; then
          sudo update-alternatives --install /usr/bin/llvm-profdata llvm-profdata /usr/bin/llvm-profdata-$VER 100
          sudo update-alternatives --install /usr/bin/llvm-cov llvm-cov /usr/bin/llvm-cov-$VER 100
          sudo update-alternatives --set llvm-profdata /usr/bin/llvm-profdata-$VER
          sudo update-alternatives --set llvm-cov /usr/bin/llvm-cov-$VER
        fi

    - name: Verify installation
      shell: bash
      env:
        INSTALL_CLANGD: ${{ inputs.install-clangd }}
        INSTALL_CLANG_FORMAT: ${{ inputs.install-clang-format }}
        INSTALL_CLANG_TIDY: ${{ inputs.install-clang-tidy }}
        INSTALL_COVERAGE_TOOLS: ${{ inputs.install-coverage-tools }}
      run: |
        echo "=== LLVM Installation Summary ==="
        clang --version | head -1
        clang++ --version | head -1
        if [[ "$INSTALL_CLANG_FORMAT" == "true" ]]; then
          clang-format --version
        fi
        if [[ "$INSTALL_CLANG_TIDY" == "true" ]]; then
          clang-tidy --version | head -1
        fi
        if [[ "$INSTALL_CLANGD" == "true" ]]; then
          clangd --version | head -1
        fi
        if [[ "$INSTALL_COVERAGE_TOOLS" == "true" ]]; then
          llvm-profdata --version 2>&1 | head -1 || echo "llvm-profdata: $(which llvm-profdata || echo 'not found')"
          llvm-cov --version 2>&1 | head -1 || echo "llvm-cov: $(which llvm-cov || echo 'not found')"
        fi
