name: 'Setup Windows LLVM'
description: 'Install LLVM, Ninja, and ccache on Windows via Chocolatey and add to PATH'
inputs:
  llvm-version:
    description: 'Full LLVM semver version to install (e.g. 22.1.7)'
    required: false
    default: '22.1.7'
  ninja-version:
    description: 'Ninja version to install (pinned for deterministic CI)'
    required: false
    default: '1.13.2'
  ccache-version:
    description: 'ccache version to install (pinned for deterministic CI)'
    required: false
    default: '4.14.0'

runs:
  using: 'composite'
  steps:
    - name: Install LLVM / Ninja / ccache
      shell: pwsh
      run: |
        choco install llvm --version ${{ inputs.llvm-version }} -y
        choco install ninja --version ${{ inputs.ninja-version }} -y
        choco install ccache --version ${{ inputs.ccache-version }} -y
        # Refresh PATH so subsequent steps find clang, ninja, ccache without a new shell
        $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
