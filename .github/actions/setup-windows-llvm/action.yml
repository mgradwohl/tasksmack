name: 'Setup Windows LLVM'
description: >-
  Restore LLVM from the Actions cache (on a miss: the SHA-256-pinned win64 or woa64 MSI from
  LLVM's GitHub release, for the runner's architecture), verify the runner
  image Ninja, and add LLVM to PATH. ccache comes from hendrikmuhs/ccache-action.
inputs:
  llvm-version:
    description: 'Full LLVM semver version to install (e.g. 23.1.5)'
    required: false
    default: '23.1.5'
  ninja-version:
    description: >-
      Ninja version the windows-2025 runner image must ship (verified, not installed). Ninja is
      preinstalled on the image; a mismatch fails the step so a runner-image change is visible
      instead of silently changing the build generator.
    required: false
    default: '1.13.2'

runs:
  using: 'composite'
  steps:
    - name: Verify preinstalled Ninja
      shell: pwsh
      env:
        EXPECTED_NINJA: ${{ inputs.ninja-version }}
      run: |
        $ninja = Get-Command ninja -ErrorAction SilentlyContinue
        if (-not $ninja) {
          Write-Host "::error title=Ninja missing::ninja is not on PATH on this runner image. Expected the image to ship ninja $env:EXPECTED_NINJA (see runner-images Windows2025-Readme); install it explicitly or update setup-windows-llvm."
          exit 1
        }
        $actual = (& $ninja.Source --version).Trim()
        if ($actual -ne $env:EXPECTED_NINJA) {
          Write-Host "::error title=Ninja version changed::The runner image ships ninja $actual at $($ninja.Source), but setup-windows-llvm expects $env:EXPECTED_NINJA. The windows-2025 image was updated; review the change and bump the ninja-version input in .github/actions/setup-windows-llvm/action.yml."
          exit 1
        }
        Write-Host "ninja $actual at $($ninja.Source)"

    # The installed LLVM tree is cached (#1406): an install downloads the ~600 MB installer and
    # runs it for about 70 s on every Windows job. The tree is restored into a staging directory
    # and swapped in only on an exact hit, so a miss leaves the runner image untouched and falls
    # back to the pinned MSI install below. Only runs on main save the entry (the same rule as the ccache and FetchContent
    # caches), so pull requests read main's copy and never add their own. Bump the -v suffix to
    # discard a bad entry; a new llvm-version gets a new key automatically.
    #
    # v2 leaves out ~1.2 GB of tools no job here runs (see "Stage LLVM install"), so the restore
    # extracts ~40% less. restore-keys accepts an older -v entry of the same llvm-version: it is a
    # complete install too, and main then re-stages and saves the current -v (#1406).
    - name: Restore cached LLVM install
      id: llvm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\llvm-cache
        key: windows-llvm-${{ inputs.llvm-version }}-${{ runner.arch }}-v2
        restore-keys: windows-llvm-${{ inputs.llvm-version }}-${{ runner.arch }}-

    - name: Use cached LLVM install
      if: steps.llvm-cache.outputs.cache-matched-key != ''
      shell: pwsh
      # Renames the image's own LLVM aside and moves the cached tree into its place, retrying the
      # rename and falling back to copying over the image's tree when a held handle refuses it
      # (#1761). The script's header says why the destination can't move elsewhere.
      run: '& "$env:GITHUB_ACTION_PATH\use-cached-llvm.ps1"'

    # A cache miss installs LLVM's own MSI from its GitHub release, pinned by version and SHA-256 per
    # architecture (the release asset's digest: gh release view llvmorg-<ver> -R llvm/llvm-project
    # --json assets). x64 used to run `choco install llvm`, but the Chocolatey community feed lags
    # upstream (#752: 22.1.8 upstream while it had 22.1.7; #3452: 23.1.5 upstream while it had only
    # 23.1.3) and returns 5xx now and then (#1406); its llvm package ran this same win64 installer.
    # ARM64 (windows-11-arm, #2214) always needed the native woa64 installer: Chocolatey's package is
    # x64 only, which would run emulated and target x64, and the image's own LLVM is 20. Each
    # installer's default target is the runner's (x86_64-/aarch64-pc-windows-msvc), so the presets
    # need no --target. To update, bump LLVM_PINNED_VERSION and both SHA-256 values together; a
    # different llvm-version fails here rather than installing an unpinned file.
    - name: Install LLVM
      if: steps.llvm-cache.outputs.cache-matched-key == ''
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        LLVM_PINNED_VERSION: '23.1.5'
        WIN64_SHA256: 288ab326377157a9e02e6fb9724914cc2b55963882d493a405f31dc66e837c12
        WOA64_SHA256: 0e8a80e8c8a9a17958e65ec706b62fd07b172792bccfed54a32006e1823a79b7
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:LLVM_VERSION -ne $env:LLVM_PINNED_VERSION) {
          Write-Host "::error title=LLVM installer pin::llvm-version $env:LLVM_VERSION has no pinned installer (pinned: $env:LLVM_PINNED_VERSION). Update LLVM_PINNED_VERSION, WIN64_SHA256 and WOA64_SHA256 in .github/actions/setup-windows-llvm/action.yml."
          exit 1
        }
        switch ($env:RUNNER_ARCH) {
          'X64' { $flavor = 'win64'; $expected = $env:WIN64_SHA256 }
          'ARM64' { $flavor = 'woa64'; $expected = $env:WOA64_SHA256 }
          default { Write-Host "::error title=LLVM installer pin::no pinned LLVM installer for runner arch $env:RUNNER_ARCH"; exit 1 }
        }
        # LLVM 23 ships its Windows installers as MSI (22 had NSIS .exe).
        $name = "LLVM-$env:LLVM_PINNED_VERSION-$flavor.msi"
        $installer = Join-Path $env:RUNNER_TEMP $name
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_PINNED_VERSION/$name"
        Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
        $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $expected) {
          Write-Host "::error title=LLVM installer SHA-256 mismatch::$name expected $expected, got $actual"
          exit 1
        }
        # MSI, quiet, into its default C:\Program Files\LLVM, which the presets expect and the next
        # step checks; 3010 is "succeeded, restart needed", which a CI runner never needs. The log
        # goes to RUNNER_TEMP for a failed install.
        $log = Join-Path $env:RUNNER_TEMP "llvm-$flavor-msi.log"
        $proc = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          Write-Host "::error title=LLVM install failed::$name exited with $($proc.ExitCode) (log: $log)"
          Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue
          exit 1
        }
        # The installer can stay locked for a moment after it exits (Access denied); it is in
        # RUNNER_TEMP, which the runner cleans anyway, so a failed delete isn't an error.
        Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
        exit 0

    - name: Verify LLVM
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        LLVM_SOURCE: ${{ steps.llvm-cache.outputs.cache-matched-key != '' && format('cache {0}', steps.llvm-cache.outputs.cache-matched-key) || (runner.arch == 'ARM64' && 'woa64 installer' || 'win64 installer') }}
      run: |
        $clang = 'C:\Program Files\LLVM\bin\clang.exe'
        if (-not (Test-Path -LiteralPath $clang)) {
          Write-Host "::error title=LLVM install failed::$clang not found ($env:LLVM_SOURCE)"
          exit 1
        }
        $versionLine = (& $clang --version | Select-Object -First 1)
        if ($versionLine -notmatch "version $([regex]::Escape($env:LLVM_VERSION))(\s|$)") {
          Write-Host "::error title=LLVM version mismatch::expected clang $env:LLVM_VERSION, got: $versionLine"
          exit 1
        }
        Write-Host "$versionLine (from $env:LLVM_SOURCE)"
        # A native toolchain for this runner: an x64 clang on an ARM64 runner would run emulated and
        # build x64 binaries (#2214).
        $expectedTarget = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
        $target = (& $clang -print-target-triple).Trim()
        if ($target -ne $expectedTarget) {
          Write-Host "::error title=LLVM target mismatch::clang's default target is $target, expected $expectedTarget on this $env:RUNNER_ARCH runner"
          exit 1
        }
        Write-Host "clang default target $target"
        # ccache's default compiler check compares the compiler's size and mtime, so a cached tree
        # must keep the installer's timestamps or every Windows ccache entry misses. Logged so the
        # two install paths can be compared.
        $item = Get-Item -LiteralPath $clang
        Write-Host "clang.exe size $($item.Length) mtime $($item.LastWriteTimeUtc.ToString('o'))"

        # Make clang/clang-tidy/lld visible to subsequent steps.
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        exit 0

    # Save on main only, after a miss (a new llvm-version, an evicted entry, or an older -v restored
    # through restore-keys). The staged copy is what the restore step above expects at
    # C:\llvm-cache\LLVM.
    #
    # The copy leaves out what no workflow or tools/ script here runs, ~1.2 GB of the ~3 GB install:
    # Fortran (flang, bbc, fir-*, tco), LLDB (lldb*, liblldb.dll), the offload/SYCL/CUDA link
    # wrappers, clang-repl, the static analyzer's cross-TU mapper, clang-installapi (Apple TBD
    # files), clang-ssaf-*, and the wasm/Mach-O linker copies of lld. The compilers, lld-link,
    # ld.lld, clang-tidy, clang-format, clangd and every llvm-* tool (llvm-rc, llvm-ar, llvm-cov,
    # llvm-profdata, llvm-symbolizer, ...) stay.
    - name: Stage LLVM install for the cache (main only)
      id: llvm-stage
      # Caching is an optimisation: a failed copy must not fail the build.
      continue-on-error: true
      if: >-
        steps.llvm-cache.outputs.cache-hit != 'true' &&
        github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: pwsh
      run: |
        # After an older -v hit, the overlay fallback leaves the restored tree here; stage afresh.
        if (Test-Path -LiteralPath 'C:\llvm-cache') { Remove-Item -LiteralPath 'C:\llvm-cache' -Recurse -Force }
        robocopy 'C:\Program Files\LLVM' 'C:\llvm-cache\LLVM' /E /COPY:DAT /DCOPY:DAT /R:2 /W:5 /NFL /NDL /NP `
          /XF flang*.exe bbc.exe fir-*.exe tco.exe lldb*.exe liblldb.dll clang-repl.exe `
              clang-linker-wrapper.exe clang-nvlink-wrapper.exe clang-sycl-linker.exe clang-offload-*.exe `
              clang-extdef-mapping.exe clang-installapi.exe clang-ssaf-*.exe wasm-ld.exe ld64.lld.exe
        # robocopy exit codes below 8 mean success.
        if ($LASTEXITCODE -ge 8) { exit 1 }
        exit 0

    - name: Save LLVM install cache (main only)
      if: steps.llvm-stage.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\llvm-cache
        key: windows-llvm-${{ inputs.llvm-version }}-${{ runner.arch }}-v2
