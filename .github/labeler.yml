# PR auto-labeler configuration for actions/labeler
# Maps file path globs to labels. Labels are applied when any matching file is changed.
# See: https://github.com/actions/labeler

# ── Platform ──────────────────────────────────────────────────────────────────

"linux":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Platform/Linux/**"
      - "tests/Platform/Linux/**"

"windows":
  - changed-files:
    - any-glob-to-any-file:
      - "src/Platform/Windows/**"
      - "tests/Platform/Windows/**"

# ── Layers ────────────────────────────────────────────────────────────────────

"testing":
  - changed-files:
    - any-glob-to-any-file:
      - "tests/**"
      - "**/test_*.cpp"
      - "benchmarks/**"

"documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - "docs/**"
      - "assets/themes/README.md"

"ci":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/**"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      - ".github/actionlint.yaml"
      - "CMakePresets.json"

# Build-system and architecture-specific changes: pr-labeler adds this, and arm64.yml runs on a PR that
# carries it (#3820). Not a required check. The label is added with GITHUB_TOKEN, and an event made with
# that token starts no workflow, so the first ARM64 run is the PR's next push (`synchronize`), not the label
# being added; the label stays (sync-labels is false), so every later push runs it.
"ci:arm64":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/actions/**"
      - ".github/workflows/arm64.yml"
      - ".github/workflows/reusable-build-test.yml"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg*.json"
      - "src/Platform/ProcessArchitecture.h"
      - "src/Platform/Windows/WindowsProcessMachine*"
      - "src/Platform/Windows/WindowsProcessDump*"
      - "src/Platform/Windows/WindowsProcessEnvironmentReader*"
      - "src/Platform/Linux/ElfArchitecture.h"
      - "src/Platform/Linux/ProcFdParser.h"
      - "src/Platform/Linux/bpf/**"

"tooling":
  - changed-files:
    - any-glob-to-any-file:
      - "tools/**"
      - ".clang-format"
      - ".clang-tidy"
      - ".pre-commit-config.yaml"
      - "CMakeLists.txt"
      - "cmake/**"

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "CMakeLists.txt"
      - "cmake/Dependencies.cmake"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      - "requirements*.in"
      - "requirements*.txt"

"security":
  - changed-files:
    - any-glob-to-any-file:
      - "SECURITY.md"
      - ".github/codeql/**"
      - ".github/workflows/osv-scanner.yml"

"release":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/workflows/release.yml"
      - "assets/app.manifest.in"
      - "assets/tasksmack.rc.in"
