# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Note: Dependabot covers GitHub Actions and pip only. C++ dependencies are fetched via CMake
# FetchContent (SHA-pinned in cmake/Dependencies.cmake, plus tests/CMakeLists.txt and
# benchmarks/CMakeLists.txt); the scheduled osv-scanner workflow monitors them for known
# vulnerabilities, and the scheduled Renovate workflow (.github/renovate.json5,
# .github/workflows/renovate.yml) opens PRs when newer releases are available. See #89.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Python dependencies (for GLAD/jinja2)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
      include: "scope"
