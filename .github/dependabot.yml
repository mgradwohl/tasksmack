# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Note: Dependabot covers GitHub Actions and pip only. C++ dependencies are fetched via CMake
# FetchContent (SHA-pinned in cmake/Dependencies.cmake, plus tests/CMakeLists.txt and
# benchmarks/CMakeLists.txt); the scheduled osv-scanner workflow monitors them for known
# vulnerabilities, and the scheduled Renovate workflow (.github/renovate.json5,
# .github/workflows/renovate.yml) opens PRs when newer releases are available. See #89.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Every github/codeql-action step in a run must be the same version, or CodeQL fails
      # ("Loaded a configuration file for version X, but running version Y"); separate PRs for
      # init, analyze and upload-sarif each fail on their own.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Python dependencies (requirements.txt, requirements-glad.txt, requirements-icons.txt,
  # requirements-dev-tools.txt -- see #856/#857/#858 -- and requirements-docs-site.txt, #2967)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
      include: "scope"
