name: Renovate

# Self-hosted Renovate run, scoped (via .github/renovate.json5's enabledManagers) to exactly the
# gap Dependabot doesn't cover: C++ libraries pulled in via CMake FetchContent
# (cmake/Dependencies.cmake, tests/CMakeLists.txt, benchmarks/CMakeLists.txt) and the LLVM
# toolchain version pinned for CI/local dev setup (ci.yml, tools/setup-dev.ps1). Dependabot
# already handles GitHub Actions and Python packages weekly on Mondays; osv-scanner.yml already
# scans all of these for known vulnerabilities weekly on Sundays. See issue #89.
#
# This workflow only opens PRs -- it never merges. Full CI (build+test, sanitizers, static
# analysis) gates every proposed update the same as any human-authored PR.

on:
  schedule:
    # Staggered from Dependabot (Monday) and osv-scanner (Sunday 06:00 UTC).
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run mode (log what would happen without opening/updating PRs)'
        type: choice
        options: ['disabled', 'extract', 'lookup', 'full']
        default: 'disabled'

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # PRs opened with the default GITHUB_TOKEN don't trigger other workflows (ci.yml
          # included) -- GitHub's loop-prevention behavior for the built-in token. Falls back to
          # it so this workflow still runs and opens PRs with no setup, but CI won't actually
          # run on those PRs until a fine-grained PAT (contents:write, pull-requests:write) is
          # added as the RENOVATE_TOKEN repo secret. See CONTRIBUTING.md.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          # inputs.* is only populated for workflow_dispatch runs; this workflow also runs on
          # schedule, where referencing inputs.dryRun directly risks undefined-context behavior.
          # The && short-circuits before inputs.dryRun is ever evaluated on non-dispatch triggers.
          RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dryRun) || 'disabled' }}
          LOG_LEVEL: info
