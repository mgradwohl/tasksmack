name: Renovate

# Self-hosted Renovate run, scoped (via .github/renovate.json5's enabledManagers) to exactly the
# gap Dependabot doesn't cover: C++ libraries pulled in via CMake FetchContent
# (cmake/Dependencies.cmake, tests/CMakeLists.txt, benchmarks/CMakeLists.txt) and the full
# build/dev toolchain -- LLVM (11 files: every CI workflow that runs a compiler or clang-tooling
# step, both setup-llvm actions, and both dev-box scripts), Python interpreter (4 files),
# CMake/Ninja/ccache dev-box pins, and (via
# Renovate's native pre-commit manager) .pre-commit-config.yaml's own hook-tool pins -- see #89
# and #798 for the full audit and rationale. Dependabot already handles GitHub Actions and Python
# packages (requirements*.txt) weekly on Mondays; osv-scanner.yml already scans all of these for
# known vulnerabilities weekly on Sundays.
#
# This workflow only opens PRs -- it never merges. Full CI (build+test, sanitizers, static
# analysis) gates every proposed update the same as any human-authored PR.

on:
  schedule:
    # Staggered from Dependabot (Monday) and osv-scanner (Sunday 06:00 UTC).
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run mode: disabled = real run (opens/updates PRs); extract/lookup/full only log what would happen'
        type: choice
        options: ['disabled', 'extract', 'lookup', 'full']
        default: 'disabled'

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Needed for Renovate to create/update the Dependency Dashboard issue
      # (dependencyDashboard: true in renovate.json5).
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require RENOVATE_TOKEN
        # PRs opened with the default GITHUB_TOKEN don't trigger other workflows (ci.yml
        # included) -- GitHub's loop-prevention behavior for the built-in token. Previously this
        # workflow silently fell back to GITHUB_TOKEN when RENOVATE_TOKEN was unset, so it kept
        # "working" (opening PRs) while every dependency-update PR skipped CI entirely and could
        # be merged unvalidated. Fail loudly instead: a fine-grained PAT with Contents, Pull
        # requests, and Issues (dependency dashboard) repo permissions, PLUS Workflows (this
        # config also updates the LLVM pin in ci.yml itself, and GitHub rejects any push touching
        # .github/workflows/* from a token without that scope, even with Contents:write), added
        # as the RENOVATE_TOKEN repo secret -- see CONTRIBUTING.md's "Keeping Dependencies
        # Current" section -- is a one-time, least-privilege setup cost worth paying up front.
        #
        # The check is in the script, not a step `if:`: the `secrets` context is not available in
        # `if:` conditions, and using it there made GitHub reject the whole file -- every push then
        # showed a failed zero-job run of this workflow, and the schedule never ran at all (#1053).
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN}" ]; then
            echo "::error::RENOVATE_TOKEN repo secret is not set. Without it, Renovate PRs would silently skip CI (GitHub's loop-prevention for the default GITHUB_TOKEN) and could be merged unvalidated. Add a fine-grained PAT (Contents, Pull requests, Issues, Workflows scopes) as the RENOVATE_TOKEN secret -- see CONTRIBUTING.md's \"Keeping Dependencies Current\" section -- then re-run this workflow."
            exit 1
          fi

      - name: Select dry-run mode
        # Renovate's dryRun accepts only 'extract', 'lookup' or 'full'; unset means a real run. The
        # 'disabled' choice above is this workflow's own label for "real run" and must never reach
        # Renovate: passing RENOVATE_DRY_RUN=disabled still made every run a dry run, so scheduled
        # runs went green while never opening a PR or the Dependency Dashboard (#2527). Export the
        # variable (via GITHUB_ENV, which the Renovate action forwards to its container) only for an
        # explicit dry-run dispatch, and fail on anything unexpected rather than guess. inputs.* is
        # only populated for workflow_dispatch; the && short-circuits to '' on scheduled runs, which
        # is the real-run case.
        env:
          DRY_RUN_INPUT: ${{ (github.event_name == 'workflow_dispatch' && inputs.dryRun) || '' }}
        run: |
          case "${DRY_RUN_INPUT}" in
            '' | disabled)
              echo "Renovate real run: dependency PRs and the Dependency Dashboard get created/updated."
              ;;
            extract | lookup | full)
              echo "RENOVATE_DRY_RUN=${DRY_RUN_INPUT}" >> "${GITHUB_ENV}"
              echo "Renovate dry run (${DRY_RUN_INPUT}): nothing gets pushed."
              ;;
            *)
              echo "::error::Unknown dryRun input '${DRY_RUN_INPUT}' (expected disabled, extract, lookup or full)."
              exit 1
              ;;
          esac

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # RENOVATE_DRY_RUN is deliberately not set here: the "Select dry-run mode" step above
          # exports it only for an explicit extract/lookup/full dispatch (#2527).
          LOG_LEVEL: info
