name: Cache Prune

# Deletes superseded Actions cache entries on main (#1583). ccache-action saves a new timestamped
# entry (ccache-<key>-<ISO timestamp>) on every main run, and the FetchContent cache saves
# <OS>-fetchcontent-<hash> whenever its key changes; the clang-tidy result cache saves
# <OS>-tidy-results-<run id>-<attempt> on every scheduled CI run (#1785), and CodeQL saves its TRAP
# cache, codeql-trap-<N>-<CLI version>-<language>-<commit SHA> (about 640 MB), for every main commit
# it analyzes (#3101). Restores only ever use the newest entry of each
# family, but the old ones stayed until GitHub's quota eviction removed them: main alone reached
# 12.4 GB of the 10 GB quota (2026-10-09). Keeping only the newest entry per family keeps usage under
# quota, so least-recently-used eviction never has to touch a live entry (such as the Windows LLVM
# cache). The TRAP caches weren't pruned until #3101: 20-30 a day kept the repository over its limit,
# and the eviction took main's clang-tidy result caches, which only pull requests read between
# nightly saves. Other entries (LLVM, setup-python) have a single live key and are left alone.
# tools/cache-prune-stale.py decides what a family is; a non-x64 runner's entries carry its
# architecture in the key, so x64 and ARM64 each keep their own newest entry (#2528).
# workflow_run always runs this file from the default branch, with this file's permissions.
on:
  workflow_run:
    # Every workflow that can save a cache on main (a push, the nightly schedule, or a manual run off
    # main), so the newest entry of each family is kept whichever workflow finishes last (#2410).
    # tools/check-cache-prune-triggers.py (a pre-commit hook) fails if one is missing.
    workflows:
      - CI
      - Sanitizers
      - Heavy Checks
      - ARM64
      - CodeQL Security Analysis
      - Static Analysis
      - Manual Build
      - Release
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List what would be deleted without deleting it'
        type: boolean
        default: true

# The newest run sees every entry, so a queued one replaces an older one.
concurrency:
  group: cache-prune
  cancel-in-progress: true

permissions: {}

jobs:
  prune:
    name: Prune superseded caches
    # Only main's own runs; a PR from a fork's branch named "main" would also match `branches`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # Only the grouping script. workflow_run checks out the default branch's latest commit, never a PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/cache-prune-stale.py
          sparse-checkout-cone-mode: false

      - name: Delete all but the newest entry of each cache family
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/caches?ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[] | [.id, .key, .created_at, .size_in_bytes] | @tsv' > caches.tsv

          # family <TAB> created_at <TAB> id <TAB> bytes <TAB> key for every superseded entry, newest
          # first within a family. The script (tested by tests/tools/test_cache_prune_stale.py) says
          # what a family is; it keeps each architecture's entries apart (#2528).
          python3 -I tools/cache-prune-stale.py < caches.tsv > stale.tsv

          count=$(wc -l < stale.tsv)
          bytes=$(awk -F'\t' '{ total += $4 } END { printf "%.0f", total }' stale.tsv)
          {
            echo "## Cache prune"
            echo ""
            echo "Superseded entries on main: **$count** ($(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1e9 }') GB); dry run: $DRY_RUN"
            echo ""
            awk -F'\t' '{ printf "- `%s` (%.0f MB, %s)\n", $5, $4 / 1e6, $2 }' stale.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DRY_RUN" == 'true' ]]; then
            cat stale.tsv
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r _family _created id _bytes key; do
            if gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null 2>&1; then
              echo "deleted $key"
            else
              # Another run may have deleted it already; that's fine.
              echo "::warning title=Cache prune::could not delete $key (id $id)"
              failed=$((failed + 1))
            fi
          done < stale.tsv
          echo "Deleted $((count - failed)) of $count superseded entries."
