name: Release Dashboard

# Generates the Release Command Center's data (#4524) and publishes it to the data-only `dashboard-data`
# branch, which docs/release/ on the docs site reads (https://mgradwohl.github.io/tasksmack/release/).
# tools/release-dashboard.py reads the milestones, their issues and pull requests, the release tracker, the
# `ci-red-main` issues and the workflow runs, and writes one JSON file per release milestone plus an index.
# docs/dev/release-process.md, "The release dashboard", says what the page shows and what it reads.
#
# Two jobs, so the token that can write never runs the generator:
#   - generate: read-only. Runs the generator's tests, then the generator, and hands what it wrote to publish
#               as a job output. No artifact (#4717): one a run was hundreds a day in a list that every
#               ClusterFuzzLite lookup pages through (#4617). Only a run that can't publish keeps one, for
#               its reviewer: a pull request's, or a manual one on a branch.
#   - publish:  `contents: write`, and no repository code: it replaces dashboard-data's single commit with the
#               files it was handed. The branch holds one commit, replaced on every run, so a few hundred runs a
#               day don't grow the repository; every figure can be regenerated from the API, so no history is
#               lost. The "Main Builds" ruleset covers only main and release/*, so the forced update is allowed
#               there and nowhere else. A push made with GITHUB_TOKEN starts no workflow.
#
# A pull request that changes the generator, its tests or this file runs `generate` only, as that change's
# proof: nothing is published from a pull request. A failed run publishes nothing, so the page keeps the last
# good data and says how old it is.
on:
  schedule:
    # Two lines, each every 10 minutes (the maintainer's cadence, 2026-11-19) and off the hour: the backstop,
    # and what moves the figures only the clock changes. GitHub starts scheduled runs late and skips some when
    # it's busy (#4604: 13 of a day's 120 slots never started, three in a row at midnight UTC), so the events
    # below carry the changes. The generator reads once an hour what changes slowly, and a usual run is about
    # 7 REST calls and 50 GraphQL points of the hourly budget this token shares with every other workflow
    # here. No run but a person's publishes sooner than five minutes after the last, so an hour is 12 runs at
    # the most: about 100 calls and 600 points of 5,000 each. Each run's log says what it used and what's left.
    - cron: '3-59/10 * * * *'
    # The same again, five minutes off (#4700). The hour's first slot starts about eight minutes late or not
    # at all, and in a quiet stretch that left the page 15 to 21 minutes behind. With twice the slots, one that
    # GitHub skips leaves half the hole. A scheduled run that finds the published figures read after it was
    # created stops without reading, and otherwise it waits until the data is five minutes old, so in a quiet
    # hour this publishes about every five to six minutes, not twice as often as the events allow.
    - cron: '8-59/10 * * * *'
  # A person's run ("Refresh now" on the page), and Main Health's when it opens or closes a `ci-red-main`
  # issue (#4700): those issues are written with the workflow token, which starts no workflow except by a
  # dispatch. The two are told apart by who sent them. A person's cancels the run in progress and always
  # generates. Main Health's queues like any other run, doesn't wait for the five minutes, and stops if the
  # published data already has main's new state.
  workflow_dispatch:
  # What the page shows changes when an issue closes, reopens or changes milestone, and when main moves
  # (#4604), so each of those starts a run. Such a run stops at once if the published data already has its
  # event, and otherwise waits until that data is five minutes old (the "Stop here" and "Wait" steps).
  #
  # Every event starts a run, and GitHub has no way to hold one back: one run goes, one waits, and each
  # further one replaces the waiting one, which the run list shows as cancelled. So the events here are the
  # few that are worth a run (#4620). Left out on purpose, for the next run to read:
  #   - `opened` (#4700): the page shows only issues on a milestone, and putting one there fires `milestoned`,
  #     also when the issue is created with it. Both together were two runs for every new issue, and 23 issues
  #     filed at once were 46 runs;
  #   - labels and edits: a new issue fires one event for each of its labels;
  #   - comments: every lane note would start a run (a freeze or an approval on the tracker is one too);
  #   - pull requests: `pull_request` below is this workflow's own proof, and can't also carry every pull
  #     request's events. One put on a milestone does start a run: that's an `issues` event;
  #   - Main Health as a `workflow_run`: it finishes several times after every push and was two runs in
  #     three, nearly all of them changing nothing here. It dispatches a run itself when main's state changes.
  issues:
    types: [closed, reopened, deleted, milestoned, demilestoned]
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/release-dashboard.py'
      - 'tests/tools/test_release_dashboard.py'
      - 'tests/tools/fixtures/release-dashboard/**'
      - '.github/workflows/release-dashboard.yml'
      # The generator reads this workflow's WATCHED list, so the two judge main by the same workflows.
      - '.github/workflows/main-health.yml'

# One publishing run at a time: a queued one replaces a waiting one, and reads fresher data anyway. GitHub
# lists the replaced run as cancelled, so cancelled runs here are the group at work, not failures. A person's
# manual run ("Refresh now" on the page) doesn't queue: it cancels the run in progress, which may be minutes
# into its wait, and publishes what it reads itself. Stopping a run mid-publish is safe: the branch moves in
# one push or not at all. Main Health's dispatch comes from the workflow token and queues: if it cancelled a
# run and then found the API budget gone, nothing would publish. A pull request's runs only cancel each other.
concurrency:
  group: release-dashboard-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]') }}

permissions: {}

jobs:
  generate:
    name: Generate the data
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # up to 5 minutes of waiting (below), then a run that has taken 1 to 5
    permissions:
      actions: read  # the watched workflows' runs, and release.yml's dry runs
      contents: read  # the generator, and the published releases
      issues: read  # milestones, their issues, the release tracker and the ci-red-main issues
      pull-requests: read  # the open pull requests and the ones that close a milestone's issues
    outputs:
      # 'true' when this run generated data for `publish` to push: neither "Stop here when this run has nothing
      # to add" nor the budget check after the wait stopped it.
      publish: ${{ steps.gate.outputs.proceed == 'true' && steps.wait.outputs.proceed != 'false' }}
      # The JSON files as one string: see "Pack the data for the publish job".
      data: ${{ steps.pack.outputs.data }}
    steps:
      # Only what the generator and its tests read: the generator takes main-health.yml's WATCHED list, and its
      # test checks every workflow that list names is there. A pull request runs its own copy; it has no token
      # that writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/release-dashboard.py
            tests/tools/test_release_dashboard.py
            tests/tools/fixtures/release-dashboard
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Run the generator's tests
        run: python3 -I -X utf8 tests/tools/test_release_dashboard.py

      # The last run's files: a finished release is copied from them, and so are the figures that are only
      # read once an hour. With no branch yet (the first run), everything is generated.
      - name: Fetch the last published data
        id: previous
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          if git ls-remote --exit-code --heads "$REPO_URL" dashboard-data > /dev/null; then
            git fetch --quiet --depth 1 "$REPO_URL" dashboard-data
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/previous"
            echo "Last published: $(git log -1 --format=%s FETCH_HEAD)"
            # When it was published, in seconds: the branch's one commit is made by the run that publishes it.
            echo "at=$(git log -1 --format=%ct FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release dashboard::No dashboard-data branch yet: generating every release."
          fi

      # Two reasons to read nothing (#4620), each cheaper than a run that fails or publishes what's there:
      #   - The budget. Every workflow here shares the token's hourly REST calls and GraphQL points, and when
      #     either is gone (#4617) a run could only fail at its first read, once for every event.
      #     GET /rate_limit costs nothing.
      #   - The published data already has everything this run would add: its figures were read after this run
      #     was created, by more than two clocks can disagree (the generator stamps the read on its runner,
      #     GitHub stamps the run). That's the second run of a merge (a push and an issue closing, two seconds
      #     apart) and most runs that waited behind another. A scheduled run is judged the same way: whatever
      #     run it replaced in the waiting place was created before it, so data read after the scheduled run
      #     was created has that run's event too.
      # A person's manual run goes on unless the budget is gone, and a pull request's proof always does: it
      # must fail when it can't read. Main Health's dispatch is judged like an issue's run.
      - name: Stop here when this run has nothing to add
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_PATH: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISHED_AT: ${{ steps.previous.outputs.at }}
          PREVIOUS_INDEX: ${{ runner.temp }}/previous/index.json
          MIN_REST_CALLS: 100
          MIN_GRAPHQL_POINTS: 150
          MARGIN_SECONDS: 10
        run: |
          set -euo pipefail
          go_on() {
            echo "$1"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          stop() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$EVENT" == pull_request ]]; then
            go_on "A pull request's run is its proof: it always generates."
          fi
          now=$(date +%s)

          # What's left of each budget and when its hour ends, in seconds; nothing when the question fails.
          budget=$(gh api rate_limit --jq '.resources | "\(.core.remaining) \(.core.reset) \(.graphql.remaining) \(.graphql.reset)"' 2> /dev/null || true)
          read -r rest rest_reset points points_reset <<< "$budget" || true
          spent=""
          if [[ "${rest:-}" =~ ^[0-9]+$ && "${rest_reset:-}" =~ ^[0-9]+$ ]] && (( rest < MIN_REST_CALLS )); then
            spent="$rest REST calls left"
            reset=$rest_reset
          elif [[ "${points:-}" =~ ^[0-9]+$ && "${points_reset:-}" =~ ^[0-9]+$ ]] && (( points < MIN_GRAPHQL_POINTS )); then
            spent="$points GraphQL points left"
            reset=$points_reset
          fi
          if [[ -n "$spent" ]]; then
            minutes=$(( (reset - now + 59) / 60 ))
            if (( minutes < 1 )); then
              minutes=1
            fi
            said="The repository's API budget is used up: $spent for about $minutes more minutes. Nothing read, nothing published."
            echo "::warning title=Release dashboard::$said"
            stop "$said"
          fi
          # A person's manual run. Main Health's dispatch comes from the workflow token, and goes on to the
          # question below like an issue's run: is it in the published data already?
          if [[ "$EVENT" == workflow_dispatch && "$ACTOR" != 'github-actions[bot]' ]]; then
            go_on "A manual run always generates."
          fi
          if [[ ! "$PUBLISHED_AT" =~ ^[0-9]+$ ]]; then
            go_on "Nothing is published yet."
          fi

          # When this run was created: when its event happened, or when the schedule fired. The wait below
          # reads it too.
          created=$(gh api "$RUN_PATH" --jq '.created_at | fromdateiso8601' 2> /dev/null || true)
          if [[ ! "$created" =~ ^[0-9]+$ ]]; then
            go_on "This run's own start couldn't be read, so it generates."
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"

          # When the published figures were read: the generator stamps index.json before its first read.
          generated=$(jq -r '.generated_at // empty' "$PREVIOUS_INDEX" 2> /dev/null || true)
          read_at=""
          if [[ -n "$generated" ]]; then
            read_at=$(date -u -d "$generated" +%s 2> /dev/null || true)
          fi
          if [[ ! "$read_at" =~ ^[0-9]+$ ]]; then
            go_on "The published data doesn't say when it was read, so this run generates."
          fi
          if (( read_at >= created + MARGIN_SECONDS )); then
            stop "The published data was read $(( read_at - created )) s after this run was created: it has everything this run would add."
          fi
          go_on "The published data was read before this run was created, or too close to it to be sure."

      # A run that has something to add waits here twice over, whichever is longer (#4604, #4620):
      #   - until the published data is five minutes old. The concurrency group keeps one run going and one
      #     waiting, so every change that lands in those minutes is in this run's data or the waiting run's:
      #     nothing is dropped, and runs publish at most every five minutes however fast the changes come.
      #   - until SETTLE_SECONDS after this run was created. A merge is a push and an issue closing two seconds
      #     apart, and reading this long after the first puts the second in the same data by more than the
      #     margin above, so the second's run stops instead of publishing the same thing five minutes later.
      # Only a person's manual run can publish meanwhile, and it cancels this one, so the data fetched above is
      # still the last when the wait ends. A dispatched run and a pull request's proof never wait.
      - name: Wait until the published data is five minutes old
        id: wait
        if: steps.gate.outputs.proceed == 'true' && contains(fromJSON('["issues", "push", "schedule"]'), github.event_name)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_AT: ${{ steps.previous.outputs.at }}
          CREATED_AT: ${{ steps.gate.outputs.created }}
          MIN_AGE_SECONDS: 300
          SETTLE_SECONDS: 15
          MIN_REST_CALLS: 100
          MIN_GRAPHQL_POINTS: 150
        run: |
          set -euo pipefail
          now=$(date +%s)
          wait=0
          if [[ "$PUBLISHED_AT" =~ ^[0-9]+$ ]]; then
            age=$(( now - PUBLISHED_AT ))
            wait=$(( MIN_AGE_SECONDS - age ))
            # A runner whose clock is behind the commit's can't ask for more than the whole wait.
            if (( wait > MIN_AGE_SECONDS )); then
              wait=$MIN_AGE_SECONDS
            fi
            echo "The published data is ${age} s old."
          else
            echo "Nothing is published yet."
          fi
          if [[ "$CREATED_AT" =~ ^[0-9]+$ ]]; then
            settle=$(( CREATED_AT + SETTLE_SECONDS - now ))
            if (( settle > SETTLE_SECONDS )); then
              settle=$SETTLE_SECONDS
            fi
            if (( settle > wait )); then
              wait=$settle
            fi
          fi
          if (( wait <= 0 )); then
            echo "No wait."
            exit 0
          fi
          echo "Waiting ${wait} s."
          sleep "$wait"

          # The step before this asked about the budget, and another workflow can spend it during the wait
          # (#4717: a fuzzing run took the last calls in 50 seconds, and the read after it failed). So ask
          # again, with the same floors, and stop the same way: a warning, and nothing read.
          budget=$(gh api rate_limit --jq '.resources | "\(.core.remaining) \(.graphql.remaining)"' 2> /dev/null || true)
          read -r rest points <<< "$budget" || true
          spent=""
          if [[ "${rest:-}" =~ ^[0-9]+$ ]] && (( rest < MIN_REST_CALLS )); then
            spent="$rest REST calls left"
          elif [[ "${points:-}" =~ ^[0-9]+$ ]] && (( points < MIN_GRAPHQL_POINTS )); then
            spent="$points GraphQL points left"
          fi
          if [[ -n "$spent" ]]; then
            said="The repository's API budget was used up during this run's wait: $spent. Nothing read, nothing published."
            echo "::warning title=Release dashboard::$said"
            echo "$said" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate
        if: steps.gate.outputs.proceed == 'true' && steps.wait.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -X utf8 tools/release-dashboard.py --out "$RUNNER_TEMP/data" --previous "$RUNNER_TEMP/previous"

      # The page reads index.json, then the file each release names: check they're all there and all JSON.
      - name: Check what was written
        if: steps.gate.outputs.proceed == 'true' && steps.wait.outputs.proceed != 'false'
        run: |
          set -euo pipefail
          python3 -I -X utf8 - "$RUNNER_TEMP/data" <<'PY'
          import json, pathlib, sys
          data = pathlib.Path(sys.argv[1])
          index = json.loads((data / "index.json").read_text(encoding="utf-8"))
          titles = [release["title"] for release in index["releases"]]
          if not titles or index["current"] not in titles:
              sys.exit(f"::error title=Release dashboard::index.json names no current release ({index['current']!r} of {titles})")
          for title in titles:
              release = json.loads((data / f"{title}.json").read_text(encoding="utf-8"))
              if release["milestone"]["title"] != title or release["schema"] != index["schema"]:
                  sys.exit(f"::error title=Release dashboard::{title}.json doesn't match index.json")
          print(f"{len(titles)} releases, current {index['current']}: {', '.join(titles)}")
          PY

      # The publish job gets the files as a job output, not as an artifact (#4717). They live a few seconds,
      # and an artifact for every run was about 290 a day in a list that ClusterFuzzLite pages through for
      # every lookup (#4617). tar, gzip and base64 make them one line of plain characters: about 56,000 today.
      # A job's outputs may hold a megabyte, and whether that counts characters or bytes of another encoding
      # isn't written down, so the ceiling here is well under half of it.
      - name: Pack the data for the publish job
        id: pack
        if: steps.gate.outputs.proceed == 'true' && steps.wait.outputs.proceed != 'false'
        env:
          MAX_CHARACTERS: 400000
        run: |
          set -euo pipefail
          packed=$(tar -C "$RUNNER_TEMP/data" -czf - . | base64 -w 0)
          if (( ${#packed} > MAX_CHARACTERS )); then
            echo "::error title=Release dashboard::The data is ${#packed} characters packed, over the $MAX_CHARACTERS a job output can safely carry: it needs another way to the publish job."
            exit 1
          fi
          echo "data=$packed" >> "$GITHUB_OUTPUT"
          echo "Packed $(find "$RUNNER_TEMP/data" -name '*.json' | wc -l) files into ${#packed} characters."

      # A run that can't publish (a pull request's, or a manual one on a branch) keeps its JSON where a
      # reviewer can open it. Only then: a handful of artifacts, where one for every run was hundreds a day.
      - name: Keep the data of a run that can't publish
        if: >-
          (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') &&
          steps.gate.outputs.proceed == 'true' && steps.wait.outputs.proceed != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dashboard-data
          path: ${{ runner.temp }}/data
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish to dashboard-data
    needs: generate
    # Never from a pull request, only main's copy of the generator publishes, and only a run that generated
    # something (`generate` stops early when it has nothing to add).
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.generate.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 8  # three pushes of a minute each at the most, and the pauses between them
    permissions:
      contents: write  # replace the dashboard-data branch
    steps:
      # The files, from `generate`'s output. This job holds the token that can write, and `generate` runs the
      # generator over other people's text, so nothing it hands over is trusted:
      #   - The string reaches this script as JSON (`toJSON`), which is always one line, inside a quoted
      #     here-document. A line break in the string is two characters there, so it can't end the document
      #     and have what follows run as commands, and the shell expands nothing in it.
      #   - It must be one line of base64 and nothing else, or the step says so and stops. GitHub hands over
      #     nothing at all when an output is too large or looks to it like a secret.
      #   - It is unpacked into an empty folder, and anything there that isn't a plain JSON file at the top
      #     stops the run.
      - name: Unpack the data
        run: |
          set -euo pipefail
          refuse() {
            echo "::error title=Release dashboard::$1 Nothing is published."
            exit 1
          }
          # `strings` passes a string and drops anything else (a missing output is null). A jq built for
          # Windows ends its lines with a carriage return, which is where this step's tests run.
          jq -r 'strings' <<'PACKED' | tr -d '\r' > data.b64
          ${{ toJSON(needs.generate.outputs.data) }}
          PACKED
          if [[ ! -s data.b64 ]] || (( $(wc -c < data.b64) <= 1 )); then
            refuse "The generate job handed over no data: GitHub drops an output that is too large or that it takes for a secret."
          fi
          if (( $(wc -l < data.b64) != 1 )) || ! grep -Eqx '[A-Za-z0-9+/]+=*' data.b64; then
            refuse "The generate job handed over $(wc -c < data.b64) characters that aren't one line of base64."
          fi
          mkdir data
          if ! base64 -d data.b64 > data.tgz || ! tar -xzf data.tgz -C data --no-same-owner; then
            refuse "What the generate job handed over doesn't unpack."
          fi
          rm data.b64 data.tgz
          odd=$(find data -mindepth 1 \( ! -type f -o ! -name '*.json' \) -print)
          if [[ -n "$odd" || ! -s data/index.json ]]; then
            echo "::error title=Release dashboard::What the generate job handed over isn't a flat set of JSON files with an index.json."
            printf '%s\n' "$odd"
            exit 1
          fi
          echo "Unpacked $(find data -name '*.json' | wc -l) files."

      - name: Replace the branch's one commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd data
          {
            echo "# Release dashboard data"
            echo
            echo "Generated by [tools/release-dashboard.py]($SOURCE/blob/main/tools/release-dashboard.py) in"
            echo "[this run]($RUN_URL), for [the Release Command Center](https://mgradwohl.github.io/tasksmack/release/)."
            echo "This branch holds one commit, replaced every few minutes. Don't edit it or build on it."
          } > README.md
          git init --quiet --initial-branch dashboard-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --quiet --message "Release dashboard data, ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"
          # A one-off credential helper hands git the token from the environment, so it is never on a command line.
          # A push that can't reach github.com is tried again (#4717: one hung for two minutes and failed a run
          # whose data was already read): three times, each cut off after a minute.
          pushed=""
          for pause in 0 15 45; do
            if (( pause > 0 )); then
              echo "Trying the push again in $pause s."
              sleep "$pause"
              # The next run waits five minutes from this commit's time, so it is the time of the push that
              # lands, not of the first try.
              git commit --quiet --amend --no-edit
            fi
            if timeout 60 git -c credential.helper= \
              -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' \
              push --quiet --force "$REPO_URL" HEAD:refs/heads/dashboard-data; then
              pushed=yes
              break
            fi
          done
          if [[ -z "$pushed" ]]; then
            echo "::error title=Release dashboard::The push to dashboard-data failed three times."
            exit 1
          fi
          echo "Published $(find . -name '*.json' | wc -l) files to dashboard-data." >> "$GITHUB_STEP_SUMMARY"
