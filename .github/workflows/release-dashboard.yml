name: Release Dashboard

# Generates the Release Command Center's data (#4524) and publishes it to the data-only `dashboard-data`
# branch, which docs/release/ on the docs site reads (https://mgradwohl.github.io/tasksmack/release/).
# tools/release-dashboard.py reads the milestones, their issues and pull requests, the release tracker, the
# `ci-red-main` issues and the workflow runs, and writes one JSON file per release milestone plus an index.
# docs/dev/release-process.md, "The release dashboard", says what the page shows and what it reads.
#
# Two jobs, so the token that can write never runs the generator:
#   - generate: read-only. Runs the generator's tests, then the generator, and uploads what it wrote.
#   - publish:  `contents: write`, and no repository code: it replaces dashboard-data's single commit with the
#               uploaded files. The branch holds one commit, replaced on every run, so a few hundred runs a
#               day don't grow the repository; every figure can be regenerated from the API, so no history is
#               lost. The "Main Builds" ruleset covers only main and release/*, so the forced update is allowed
#               there and nowhere else. A push made with GITHUB_TOKEN starts no workflow.
#
# A pull request that changes the generator, its tests or this file runs `generate` only, as that change's
# proof: nothing is published from a pull request. A failed run publishes nothing, so the page keeps the last
# good data and says how old it is.
on:
  schedule:
    # Every 10 minutes (maintainer, 2026-11-19), off the hour: the backstop, and what moves the figures only
    # the clock changes. GitHub starts scheduled runs late and skips some when it's busy (#4604: 13 of a day's
    # 120 slots never started, three in a row at midnight UTC), so the events below carry the changes. The
    # generator reads once an hour what changes slowly, and a usual run is about 7 REST calls and 50 GraphQL
    # points of the hourly budget this token shares with every other workflow here. Each run's log says what
    # it used and what's left.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
  # What the page shows changes when an issue does, when main moves and when main's health is judged (#4604),
  # so each of those starts a run. Such a run waits until the published data is five minutes old (the "Wait
  # until the published data is five minutes old" step), so a burst of labels is one run, not twenty. Left
  # out on purpose: comments (every lane note would start a run; the next run reads a freeze or an approval
  # on the tracker) and pull requests (`pull_request` below is this workflow's own proof, and can't also carry
  # every pull request's events; the next run reads them).
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  push:
    branches: [main]
  # Main Health opens and closes the `ci-red-main` issues with the workflow token, and what that token does
  # starts no workflow, so `issues` never sees them. Its runs are always on main, whichever branch they judge.
  # Every completion counts, a skipped or a replaced run's too: a job-level `if:` on the result would let a
  # run that does nothing take the waiting place of one that would publish.
  workflow_run:
    workflows: [Main Health]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'tools/release-dashboard.py'
      - 'tests/tools/test_release_dashboard.py'
      - 'tests/tools/fixtures/release-dashboard/**'
      - '.github/workflows/release-dashboard.yml'
      # The generator reads this workflow's WATCHED list, so the two judge main by the same workflows.
      - '.github/workflows/main-health.yml'

# One publishing run at a time: a queued one replaces a waiting one, and reads fresher data anyway. GitHub
# lists the replaced run as cancelled, so cancelled runs here are the group at work, not failures. A manual run
# ("Refresh now" on the page) doesn't queue: it cancels the run in progress, which may be minutes into its
# wait, and publishes what it reads itself. Stopping a run mid-publish is safe: the branch moves in one push or
# not at all. A pull request's runs only cancel each other.
concurrency:
  group: release-dashboard-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

permissions: {}

jobs:
  generate:
    name: Generate the data
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # up to 5 minutes of waiting (below), then a run that has taken 1 to 5
    permissions:
      actions: read  # the watched workflows' runs, and release.yml's dry runs
      contents: read  # the generator, and the published releases
      issues: read  # milestones, their issues, the release tracker and the ci-red-main issues
      pull-requests: read  # the open pull requests and the ones that close a milestone's issues
    steps:
      # Only what the generator and its tests read: the generator takes main-health.yml's WATCHED list, and its
      # test checks every workflow that list names is there. A pull request runs its own copy; it has no token
      # that writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/release-dashboard.py
            tests/tools/test_release_dashboard.py
            tests/tools/fixtures/release-dashboard
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Run the generator's tests
        run: python3 -I -X utf8 tests/tools/test_release_dashboard.py

      # The last run's files: a finished release is copied from them, and so are the figures that are only
      # read once an hour. With no branch yet (the first run), everything is generated.
      - name: Fetch the last published data
        id: previous
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          if git ls-remote --exit-code --heads "$REPO_URL" dashboard-data > /dev/null; then
            git fetch --quiet --depth 1 "$REPO_URL" dashboard-data
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/previous"
            echo "Last published: $(git log -1 --format=%s FETCH_HEAD)"
            # When it was published, in seconds: the branch's one commit is made by the run that publishes it.
            echo "at=$(git log -1 --format=%ct FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release dashboard::No dashboard-data branch yet: generating every release."
          fi

      # A run that an issue, a push or Main Health started waits here until the published data is five minutes
      # old (#4604). The concurrency group keeps one run going and one waiting, so every change that lands in
      # those minutes is in this run's data or the waiting run's: nothing is dropped, and these runs publish
      # at most every five minutes however fast the changes come. Only a manual run can publish meanwhile, and
      # it cancels this one, so the data fetched above is still the last when the wait ends. The schedule, a
      # manual run and a pull request's proof have no wait of their own: a scheduled run queues behind a run
      # that is waiting, and a manual run cancels it.
      - name: Wait until the published data is five minutes old
        if: contains(fromJSON('["issues", "push", "workflow_run"]'), github.event_name)
        env:
          PUBLISHED_AT: ${{ steps.previous.outputs.at }}
          MIN_AGE_SECONDS: 300
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHED_AT" =~ ^[0-9]+$ ]]; then
            echo "Nothing is published yet: no wait."
            exit 0
          fi
          age=$(( $(date +%s) - PUBLISHED_AT ))
          wait=$(( MIN_AGE_SECONDS - age ))
          if (( wait <= 0 )); then
            echo "The published data is ${age} s old: no wait."
            exit 0
          fi
          # A runner whose clock is behind the commit's can't ask for more than the whole wait.
          if (( wait > MIN_AGE_SECONDS )); then
            wait=$MIN_AGE_SECONDS
          fi
          echo "The published data is ${age} s old: waiting ${wait} s."
          sleep "$wait"

      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -X utf8 tools/release-dashboard.py --out "$RUNNER_TEMP/data" --previous "$RUNNER_TEMP/previous"

      # The page reads index.json, then the file each release names: check they're all there and all JSON.
      - name: Check what was written
        run: |
          set -euo pipefail
          python3 -I -X utf8 - "$RUNNER_TEMP/data" <<'PY'
          import json, pathlib, sys
          data = pathlib.Path(sys.argv[1])
          index = json.loads((data / "index.json").read_text(encoding="utf-8"))
          titles = [release["title"] for release in index["releases"]]
          if not titles or index["current"] not in titles:
              sys.exit(f"::error title=Release dashboard::index.json names no current release ({index['current']!r} of {titles})")
          for title in titles:
              release = json.loads((data / f"{title}.json").read_text(encoding="utf-8"))
              if release["milestone"]["title"] != title or release["schema"] != index["schema"]:
                  sys.exit(f"::error title=Release dashboard::{title}.json doesn't match index.json")
          print(f"{len(titles)} releases, current {index['current']}: {', '.join(titles)}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dashboard-data
          path: ${{ runner.temp }}/data
          if-no-files-found: error
          retention-days: 1  # only the publish job reads it, seconds later

  publish:
    name: Publish to dashboard-data
    needs: generate
    # Never from a pull request, and only main's copy of the generator publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write  # replace the dashboard-data branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dashboard-data
          path: data

      - name: Replace the branch's one commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd data
          {
            echo "# Release dashboard data"
            echo
            echo "Generated by [tools/release-dashboard.py]($SOURCE/blob/main/tools/release-dashboard.py) in"
            echo "[this run]($RUN_URL), for [the Release Command Center](https://mgradwohl.github.io/tasksmack/release/)."
            echo "This branch holds one commit, replaced every few minutes. Don't edit it or build on it."
          } > README.md
          git init --quiet --initial-branch dashboard-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --quiet --message "Release dashboard data, ${GITHUB_SHA::8} (run ${GITHUB_RUN_ID})"
          # A one-off credential helper hands git the token from the environment, so it is never on a command line.
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' \
            push --quiet --force "$REPO_URL" HEAD:refs/heads/dashboard-data
          echo "Published $(find . -name '*.json' | wc -l) files to dashboard-data." >> "$GITHUB_STEP_SUMMARY"
