name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 10:00 UTC
    - cron: '0 10 * * 0'
  workflow_dispatch:

# A new commit on a PR branch cancels that branch's in-progress analysis, as CI, Static Analysis and
# Heavy Checks already do (#1331): a full CodeQL analysis is long (see the job's timeout) and stale
# ones starved the required jobs of runners. Pushes to main, the weekly schedule and manual runs are never cancelled mid-run, so
# code scanning's baseline for main stays complete; at most one waits behind the running one (GitHub
# drops an older *queued* run in the same group when a newer one arrives).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: '22'

permissions: {}

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    # 45, not 30: full C++ analyses grew past the old 30-minute limit on busy runners, which cancelled
    # otherwise-clean runs and left PRs without a CodeQL result to gate on.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-ccache: 'false'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      # Configure and generate GLAD before CodeQL init. Build-free extraction compiles nothing, but
      # it still needs the files a build would have fetched or generated to resolve includes: the
      # FetchContent sources (SDL3, ImGui, spdlog, ...) and the generated GLAD loader headers.
      # Before init also keeps CMake's try_compile() scratch files out of the database (they once
      # caused false-positive cpp/uninitialized-local alerts in CMakeScratch/TryCompile-*/src.c).
      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Generate GLAD loader
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          # Build-free C/C++ extraction (#1406 trial): no traced build, and PR runs can use
          # overlay (incremental) analysis on top of main's database. The traced build blocked
          # overlay ("build-mode is set to undefined instead of none").
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"
