name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 10:00 UTC
    - cron: '0 10 * * 0'
  workflow_dispatch:

# A new commit on a PR branch cancels that branch's in-progress analysis, as CI, Static Analysis and
# Heavy Checks already do (#1331): a full CodeQL analysis is long (see the job's timeout) and stale
# ones starved the required jobs of runners. Pushes to main, the weekly schedule and manual runs are never cancelled mid-run, so
# code scanning's baseline for main stays complete; at most one waits behind the running one (GitHub
# drops an older *queued* run in the same group when a newer one arrives).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: '22'

permissions: {}

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    # 45, not 30: full C++ analyses grew past the old 30-minute limit on busy runners, which cancelled
    # otherwise-clean runs and left PRs without a CodeQL result to gate on.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          # No ccache in this job (#1406): nothing restores a cache here, so every traced compile
          # paid for a cold-cache miss (an extra preprocessor pass plus hashing) for nothing. And
          # a cache *hit* would skip the real compiler, which hides that translation unit from the
          # CodeQL tracer. The Configure step also turns the launcher off explicitly.
          install-ccache: 'false'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      # Configure before CodeQL init so CMake's try_compile() scratch files are
      # compiled outside the CodeQL trace and never enter the analysis database.
      # Doing this after init is what caused false-positive cpp/uninitialized-local
      # alerts in build/debug/CMakeFiles/CMakeScratch/TryCompile-*/src.c.
      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_CCACHE=OFF

      # Build the third-party libraries before CodeQL init, outside the trace (#1406). They are
      # outside the scanned paths (codeql-config.yml scans only src/ and tests/), so tracing their
      # ~370 translation units (mostly SDL3 and FreeType) only cost build and TRAP-import time and
      # grew the database. Their headers are still extracted wherever our own sources include them.
      # The traced Build step below then compiles only TaskSmack, its tests and the test mocks.
      # A renamed or removed dependency target fails this step loudly; a new dependency missing
      # from this list is still built (and traced) by the Build step, so it is only slower.
      - name: Build third-party dependencies (untraced)
        run: >-
          cmake --build --preset debug --target
          SDL3-static freetype spdlog imgui_lib implot_lib glad_gl_core_33
          gtest gtest_main gmock gmock_main

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: cmake --build --preset debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"
