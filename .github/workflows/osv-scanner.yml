name: OSV Dependency Scan

# Scans C++ FetchContent dependencies (via Syft SBOM) and Python requirements.txt
# against the OSV vulnerability database (https://osv.dev).
#
# Dependabot covers GitHub Actions and pip; this workflow fills the gap for C++ deps.
# Syft's cmake cataloger reads FetchContent_Declare entries from CMakeLists.txt and
# emits them into an SPDX-JSON SBOM without requiring a build.
#
# This only flags known CVEs against the currently pinned versions; it doesn't check whether
# newer (non-vulnerable) releases are available. That's the Renovate workflow's job
# (.github/renovate.json5, .github/workflows/renovate.yml) -- see #89.
#
# google/osv-scanner-action is a reusable workflow, not a step-level composite action.
# The SBOM is generated and uploaded as an artifact by the first job, then downloaded
# inside the reusable workflow via its download-artifact input.
#
# Also runs on pull_request (see #830): dependency-review.yml already gates PRs against known
# CVEs, but only for ecosystems GitHub's dependency graph understands -- it has no CMake/
# FetchContent parser, so a PR bumping a FetchContent SHA to a vulnerable version previously
# sailed through review with no CVE check until this workflow's push-to-main trigger caught it
# *after* merge. Deliberately `pull_request`, not `pull_request_target`: the SBOM-generation
# step builds directly from the PR's own (untrusted) CMakeLists.txt content, and
# pull_request_target would run that under the base branch's elevated permissions -- the
# classic GitHub Actions privilege-escalation pattern. The `security-events: write` permission
# requested for vulnerability-scan is capped to read-only by GitHub for fork-originated PRs
# regardless of what's requested here, so `upload-sarif` is turned off for those (the scan and
# its pass/fail gate still run either way; only the Security-tab SARIF upload -- which needs
# the write scope forks never get -- is skipped), the same fork-vs-same-repo distinction
# dependency-review.yml already makes for its own PR-comment step.
#
# Path-relevance filtering happens *inside* the workflow (detect-relevant-changes below), not
# via a top-level `on.pull_request.paths:` filter, and osv-scan-required always runs
# (`if: always()`) regardless of whether the scan itself ran or was skipped as not-applicable.
# This mirrors ci.yml's detect-docs-only / "CI Success" pattern for the same reason: a
# top-level `paths:` filter means the workflow (and every check name it would report) simply
# never triggers for a non-matching PR, and a *required* status check that never gets reported
# leaves GitHub waiting on it forever -- confirmed directly (PR #866, a docs-only change,
# stuck at mergeable_state "blocked" the moment "vulnerability-scan / osv-scan" was added as a
# required check under the old top-level-`paths:` design). osv-scan-required is the one that
# should be listed as the required check instead.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 06:00 UTC (offset from CodeQL at 10:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Determine whether this PR touches anything that could change what the scan below would
  # find. push/schedule/workflow_dispatch always run the full scan (relevant=true
  # unconditionally) -- only pull_request gets the narrower, diff-based check.
  detect-relevant-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.set_output.outputs.relevant }}
    steps:
      - name: Detect changes to CMake/Python dependency manifests
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            relevant:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'tests/CMakeLists.txt'
              - 'benchmarks/CMakeLists.txt'
              - 'requirements*.txt'
              - '.github/workflows/osv-scanner.yml'

      - name: Normalize output
        id: set_output
        run: |
          if [[ "${{ github.event_name }}" = 'pull_request' ]]; then
            echo "relevant=${{ steps.filter.outputs.relevant }}" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  # Generate an SPDX-JSON SBOM from the source tree so the scanner can see
  # C++ FetchContent dependencies detected by Syft's cmake cataloger.
  generate-sbom:
    name: Generate SBOM from source
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-file
          path: sbom.spdx.json
          retention-days: 1

  # Scan the SBOM and all four Python dependency manifests against OSV.
  # The reusable workflow handles checkout, download of the artifact, scanning,
  # SARIF upload to the Security tab, and job failure on vulnerabilities.
  vulnerability-scan:
    needs: [detect-relevant-changes, generate-sbom]
    if: needs.detect-relevant-changes.outputs.relevant == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=requirements.txt
        --lockfile=requirements-glad.txt
        --lockfile=requirements-icons.txt
        --lockfile=requirements-dev-tools.txt
        --sbom=./sbom.spdx.json
      download-artifact: sbom-file
      results-file-name: results.sarif
      # Fork PRs never receive a write-capable token regardless of the security-events: write
      # requested above (GitHub caps it to read-only for pull_request events from forks), so
      # attempting the upload there would just fail -- skip it for forks; same-repo PRs, push,
      # schedule, and workflow_dispatch all keep uploading normally. fail-on-vuln (default
      # true) still gates the check either way.
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Always runs regardless of whether the scan above ran or was skipped as not-applicable --
  # this, not vulnerability-scan directly, is the check name to list as required. See the
  # top-of-file comment for why.
  osv-scan-required:
    name: OSV Scan Required
    if: always()
    needs: [detect-relevant-changes, generate-sbom, vulnerability-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check scan result
        env:
          DETECT_RESULT: ${{ needs.detect-relevant-changes.result }}
          RELEVANT: ${{ needs.detect-relevant-changes.outputs.relevant }}
          SBOM_RESULT: ${{ needs.generate-sbom.result }}
          SCAN_RESULT: ${{ needs.vulnerability-scan.result }}
        run: |
          if [[ "$DETECT_RESULT" != 'success' ]]; then
            echo "Change detection did not succeed: $DETECT_RESULT" >&2
            exit 1
          fi
          if [[ "$RELEVANT" != 'true' ]]; then
            echo "No CMake/Python dependency manifest changes -- scan not applicable."
            exit 0
          fi
          if [[ "$SBOM_RESULT" != 'success' ]]; then
            echo "SBOM generation did not succeed: $SBOM_RESULT" >&2
            exit 1
          fi
          if [[ "$SCAN_RESULT" != 'success' ]]; then
            echo "Vulnerability scan did not succeed: $SCAN_RESULT" >&2
            exit 1
          fi
          echo "Vulnerability scan passed."
