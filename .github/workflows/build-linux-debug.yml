name: Build Linux Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-linux-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-debug:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: debug
      llvm-version: '22'
