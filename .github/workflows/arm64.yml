name: ARM64

# Linux aarch64 and Windows ARM64 build and test (#2214, phases 1-2): the debug preset and the full
# ctest suite, natively on GitHub's free arm64 runners, through the same reusable-build-test.yml as
# ci.yml's x64 jobs. ARM64 bakes in CI for a release cycle before release.yml ships it (phase 3).
#
# Kept out of ci.yml on purpose: it is not part of "CI Success" or any required check, and a pull
# request runs it only when it carries the `ci:arm64` label or changes one of the paths that label is
# for (#3930): pr-labeler adds the label for a change to the build system or arch-specific code
# (`.github/labeler.yml`, #3820), and anyone can add it by hand. The labeler's GITHUB_TOKEN can't start
# a run by adding the label, so the `detect` job reads those same globs itself and a PR's first push
# runs ARM64 without waiting for the label. Opting in needs the `labeled` event, which in
# ci.yml would re-run (and cancel) the whole x64 CI whenever pr-labeler or anyone adds a label.
# For any other PR every build job is skipped before a runner is assigned (detect is a few seconds on
# a small runner), so a PR's cost is nearly unchanged.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, an hour after ci.yml's nightly, so the two don't queue against each other.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Like ci.yml: one group per commit on main or a release/* branch (never cancelled), otherwise a
# newer run of the same ref cancels the older one. A `labeled` event for some other label can't run
# anything here (see the jobs' `if:`), so it gets a group of its own instead of cancelling a real
# run in progress.
concurrency:
  group: >-
    arm64-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'ci:arm64' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

permissions: {}

jobs:
  # Decides whether the build jobs run (#3930): always for a push, the schedule or a manual run; for a
  # pull request when it carries `ci:arm64` or its changes match the labeler's `ci:arm64` globs, read from
  # .github/labeler.yml by tools/arm64-paths.py so the paths are listed once. A `labeled` event for some
  # other label runs nothing. Anything unexpected (git or the script failing) runs ARM64.
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # The merge commit GitHub builds (refs/pull/N/merge) and its two parents, so HEAD^1..HEAD is
      # exactly what the pull request changes on the base branch it would merge into. Skipped when the
      # label is already there, or the event can't run anything.
      - name: Check out the pull request's merge commit
        if: >-
          github.event_name == 'pull_request' && github.event.action != 'labeled' &&
          !contains(github.event.pull_request.labels.*.name, 'ci:arm64')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether ARM64 runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:arm64') }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            run=true; why="a ${EVENT_NAME} run always runs ARM64"
          elif [[ "$EVENT_ACTION" == 'labeled' && "$LABEL_NAME" != 'ci:arm64' ]]; then
            run=false; why="the '${LABEL_NAME}' label doesn't run ARM64"
          elif [[ "$HAS_LABEL" == 'true' ]]; then
            run=true; why="the pull request has the ci:arm64 label"
          elif run="$(python3 -I tools/arm64-paths.py --labeler .github/labeler.yml --base 'HEAD^1' --head HEAD)"; then
            if [[ "$run" == 'true' ]]; then
              why="the changes match the ci:arm64 paths in .github/labeler.yml"
            else
              why="the changes match none of the ci:arm64 paths in .github/labeler.yml"
            fi
          else
            run=true; why="the path check failed, so ARM64 runs"
            echo "::warning title=ARM64::tools/arm64-paths.py failed; running ARM64."
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "ARM64 run: ${run} (${why})" | tee -a "$GITHUB_STEP_SUMMARY"

  # ubuntu-26.04-arm: clang-23/libc++ from apt.llvm.org's arm64 packages (setup-llvm), Xvfb plus
  # Mesa's llvmpipe for the display suites, as on x64.
  build-linux-arm64:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-26.04-arm
      build_type: debug

  # windows-11-arm: native ARM64 LLVM (the pinned woa64 installer, setup-windows-llvm) building
  # plain ARM64, not ARM64EC, and mmozeiko/build-mesa's ARM64 llvmpipe for the display suites
  # (setup-mesa-llvmpipe), test-only. The PowerShell script tests (`pwsh-script` label) get a
  # second attempt on this runner only, where pwsh itself crashes now and then (#2832): see
  # "Test (Windows ARM64)" in reusable-build-test.yml.
  build-windows-arm64:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-11-arm
      build_type: debug

  # Nightly and manual runs also build the release preset on both ARM64 targets (#4349): ThinLTO, -O3 and,
  # on Linux, -mbranch-protection=standard and _FORTIFY_SOURCE=3 were otherwise first built by release.yml
  # on the tag, where a break stops a release at its last step. Not on pushes or pull requests, so they add
  # nothing to a PR's cost. Linux runs the ctest suite as the release job on x64 does; Windows only builds
  # (run_tests: false) plus the benchmark target, since ARM64's debug leg already runs the Windows tests.
  build-linux-arm64-release:
    needs: detect
    if: needs.detect.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-26.04-arm
      build_type: release
      build_benchmarks: true

  build-windows-arm64-release:
    needs: detect
    if: needs.detect.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-11-arm
      build_type: release
      build_benchmarks: true
      run_tests: false
