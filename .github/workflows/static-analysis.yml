name: Static Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushes to main get one group per commit and are never cancelled, so back-to-back merges each get a
# complete run and a regression is blamed on the commit that caused it (#1187). A run on any other
# ref (a PR, dev/**, a merge group, a manual run off main) still cancels the run it supersedes.
concurrency:
  group: static-analysis-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.7'

permissions: {}

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-tidy-llvm${{ env.LLVM_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build GLAD
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Run clang-tidy
        shell: bash
        run: |
          ./tools/clang-tidy.sh debug 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          retention-days: 14

  # Windows-only code (src/Platform/Windows/, the _WIN32 branches of shared files). Blocking,
  # like the Linux job: ci.yml runs the same job on pull requests and gates CI Success on it
  # (#1233); this one covers push to main, which ci.yml leaves to this workflow.
  static-analysis-windows:
    name: Static Analysis (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LLVM_ROOT: C:\Program Files\LLVM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows-tidy-llvm${{ env.LLVM_SEMVER_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        shell: pwsh
        run: cmake --preset win-debug -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"

      - name: Build GLAD
        shell: pwsh
        run: cmake --build --preset win-debug --target glad_gl_core_33

      - name: Run clang-tidy (Windows)
        shell: pwsh
        run: |
          pwsh -File tools/clang-tidy.ps1 debug 2>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          exit $LASTEXITCODE

      - name: Upload clang-tidy results (Windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results-windows
          path: clang-tidy-windows-output.txt
          retention-days: 14
