name: Static Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '22'

permissions: read-all

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-tidy
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build GLAD
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Run clang-tidy
        shell: bash
        run: |
          ./tools/clang-tidy.sh debug 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          retention-days: 14
