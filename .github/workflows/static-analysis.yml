name: Static Analysis

# Manual full clang-tidy run (Linux + Windows) on any branch. It no longer runs on every push to
# main (#1406): the PR's own clang-tidy already checked the merge tree, and ci.yml's nightly
# schedule runs the full analysis on main. Both use the per-file result cache (#1785) unless this
# run's `cache` input is off, which analyzes every file from scratch and re-seeds the cache.
on:
  workflow_dispatch:
    inputs:
      cache:
        description: 'Skip files unchanged since a clean run (off: analyze every file and re-seed the cache)'
        type: boolean
        default: true

# Pushes to main get one group per commit and are never cancelled, so back-to-back merges each get a
# complete run and a regression is blamed on the commit that caused it (#1187). A run on any other
# ref (a manual run off another branch) still cancels the run it supersedes.
concurrency:
  group: static-analysis-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.7'

permissions: {}

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'
          # No ccache in the tidy jobs (#1406): clang-tidy doesn't compile through it.
          install-ccache: 'false'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      # Restore only; reusable-build-test.yml's main-branch builds save it (#1406).
      - name: Restore FetchContent dependencies
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: restore

      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Build GLAD
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Restore clang-tidy results
        id: tidy-cache
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: restore
          fresh: ${{ !inputs.cache }}

      - name: Run clang-tidy
        shell: bash
        env:
          RESULT_CACHE: ${{ steps.tidy-cache.outputs.cache-dir }}
        run: |
          ./tools/clang-tidy.sh --cache-dir "$RESULT_CACHE" debug 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Summarize clang-tidy findings
        if: always()
        shell: bash
        run: python3 -I -X utf8 tools/tidy-findings.py clang-tidy-output.txt --title 'clang-tidy findings (Linux)' >> "$GITHUB_STEP_SUMMARY"

      # Clean results are valid whether or not other files failed, so save after a failure too.
      - name: Save clang-tidy results
        if: always() && steps.tidy-cache.outcome == 'success'
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: save

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          retention-days: 5

  # Windows-only code (src/Platform/Windows/, the _WIN32 branches of shared files). Blocking,
  # like the Linux job. ci.yml runs the same analysis inside its Windows debug job on pull requests
  # and nightly, and gates CI Success on it (#1233, #1875); this one is the manual full run.
  static-analysis-windows:
    name: Static Analysis (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LLVM_ROOT: C:\Program Files\LLVM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      # Restore only; reusable-build-test.yml's main-branch builds save it (#1406).
      - name: Restore FetchContent dependencies
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: restore

      - name: Configure
        shell: pwsh
        # No ccache in the tidy jobs (#1406); keep CMake from finding the stale ccache that
        # Strawberry Perl puts on the image PATH. The other options match ci.yml's Windows debug
        # build, whose tree its clang-tidy run analyzes (#1875), so both compute the same per-file
        # result-cache keys from the same compile commands.
        run: cmake --preset win-debug -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" -DTASKSMACK_ENABLE_CCACHE=OFF -DTASKSMACK_ENABLE_PCH=OFF

      - name: Build GLAD
        shell: pwsh
        run: cmake --build --preset win-debug --target glad_gl_core_33

      - name: Restore clang-tidy results
        id: tidy-cache
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: restore
          fresh: ${{ !inputs.cache }}

      - name: Run clang-tidy (Windows)
        shell: pwsh
        env:
          RESULT_CACHE: ${{ steps.tidy-cache.outputs.cache-dir }}
        run: |
          pwsh -File tools/clang-tidy.ps1 debug -CacheDir $env:RESULT_CACHE 2>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          exit $LASTEXITCODE

      - name: Summarize clang-tidy findings (Windows)
        if: always()
        shell: bash
        run: python -I -X utf8 tools/tidy-findings.py clang-tidy-windows-output.txt --title 'clang-tidy findings (Windows)' >> "$GITHUB_STEP_SUMMARY"

      - name: Save clang-tidy results
        if: always() && steps.tidy-cache.outcome == 'success'
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: save

      - name: Upload clang-tidy results (Windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results-windows
          path: clang-tidy-windows-output.txt
          retention-days: 5
