# Renovate's docs-site bumps (#3661): Renovate moves the jsDelivr versions in docs/index.html but keeps the old
# integrity="sha384-..." attributes and docs/cdn-integrity.json, so every such PR failed docs-hygiene and pre-commit's
# SRI check until the hashes were regenerated by hand. Here they are regenerated on the PR's own branch and pushed
# back with RENOVATE_TOKEN, so CI runs on the new commit (a GITHUB_TOKEN push wouldn't trigger it). Renovate ignores
# this commit's author (gitIgnoredAuthors in .github/renovate.json5), so it keeps rebasing the branch; a rebase that
# drops the commit just brings this job back, which finds the hashes right and pushes nothing.
name: Renovate docs SRI

on:
  pull_request:
    paths:
      - 'docs/index.html'

permissions:
  contents: read

concurrency:
  group: renovate-docs-sri-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Only Renovate's own branches in this repository: never a fork, never a person's branch.
    if: ${{ startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Only the base commit is checked out: the tool that runs is main's, never code from the PR. The PR's two
      # docs files are fetched as data and the result is written back through Git's data API (CodeQL
      # actions/untrusted-checkout).
      - name: Check out the base commit (trusted tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Regenerate the PR's SRI hashes
        # main's tools/docs-sri.py on the PR's docs/index.html and docs/cdn-integrity.json, in a scratch root: --update
        # fetches each pinned file from jsDelivr and rewrites both; --check then confirms them, offline.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr/docs"
          for file in docs/index.html docs/cdn-integrity.json; do
            gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$file?ref=$HEAD_SHA" > "$RUNNER_TEMP/pr/$file"
            cp "$RUNNER_TEMP/pr/$file" "$RUNNER_TEMP/pr/$file.orig"
          done
          python -I tools/docs-sri.py --update --root "$RUNNER_TEMP/pr"
          python -I tools/docs-sri.py --check --root "$RUNNER_TEMP/pr"

      - name: Commit what changed to the PR branch
        # One commit by github-actions[bot] (which Renovate ignores), on top of the head this job read: the ref update
        # is a fast-forward, so a branch that moved meanwhile is left alone and its own run does the work.
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          args=()
          for file in docs/index.html docs/cdn-integrity.json; do
            if ! cmp -s "$RUNNER_TEMP/pr/$file" "$RUNNER_TEMP/pr/$file.orig"; then
              blob=$(gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$(base64 -w0 "$RUNNER_TEMP/pr/$file")" --jq .sha)
              args+=(-f "tree[][path]=$file" -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=$blob")
            fi
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "The SRI hashes already match the pinned versions."
            exit 0
          fi
          base_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha)
          tree=$(gh api "repos/$REPO/git/trees" -f base_tree="$base_tree" "${args[@]}" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" -f message="build(docs): regenerate the docs site's SRI hashes (#3661)" \
            -f tree="$tree" -f "parents[]=$HEAD_SHA" \
            -f "author[name]=github-actions[bot]" -f "author[email]=41898282+github-actions[bot]@users.noreply.github.com" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=false > /dev/null
          echo "Pushed $commit to $BRANCH."
