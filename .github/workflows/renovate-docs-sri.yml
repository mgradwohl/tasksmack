# Renovate's docs-site bumps (#3661): Renovate moves the jsDelivr versions in docs/index.html but keeps the old
# integrity="sha384-..." attributes and docs/cdn-integrity.json, so every such PR failed docs-hygiene and pre-commit's
# SRI check until the hashes were regenerated by hand. Here they are regenerated on the PR's own branch and pushed
# back with RENOVATE_TOKEN, so CI runs on the new commit (a GITHUB_TOKEN push wouldn't trigger it). Renovate ignores
# this commit's author (gitIgnoredAuthors in .github/renovate.json5), so it keeps rebasing the branch; a rebase that
# drops the commit just brings this job back, which finds the hashes right and pushes nothing.
name: Renovate docs SRI

on:
  pull_request:
    paths:
      - 'docs/index.html'

permissions:
  contents: read

concurrency:
  group: renovate-docs-sri-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Only Renovate's own branches in this repository: never a fork, never a person's branch.
    if: ${{ startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RENOVATE_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Regenerate the SRI hashes
        # --update fetches each pinned file from jsDelivr and rewrites docs/cdn-integrity.json and the integrity
        # attributes in docs/index.html; --check then confirms them, offline.
        run: |
          python -I tools/docs-sri.py --update
          python -I tools/docs-sri.py --check

      - name: Commit and push what changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- docs/index.html docs/cdn-integrity.json; then
            echo "The SRI hashes already match the pinned versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/cdn-integrity.json
          git commit -m "build(docs): regenerate the docs site's SRI hashes (#3661)"
          git push origin "HEAD:${BRANCH}"
