name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        # A dispatched run is a rehearsal unless explicitly told otherwise: it builds, tests,
        # packages, validates, generates the SBOM and signs exactly as a tag run does, but
        # skips the tag checks in `validate` and creates/publishes nothing -- create-release
        # uploads the would-be release assets as a workflow artifact instead. Dispatch it from
        # main (or a PR branch) to rehearse the whole pipeline before pushing a tag. Turning it
        # off only makes sense when dispatching against an existing tag ref, to re-run a release.
        description: 'Dry run: build, package, validate and sign, but create no release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.8'
  # Exact apt.llvm.org package versions currently served for clang-22 (noble),
  # one per architecture: apt.llvm.org builds amd64 and arm64 separately, so
  # one can lag the other or miss a snapshot, and each Linux leg asserts its
  # own architecture's pin (#2778). apt.llvm.org does not retain old snapshots
  # per major version -- it only ever serves the latest build for a given
  # major -- so these pins cannot survive indefinitely. When apt rotates a
  # snapshot forward, that architecture's build-linux "Assert exact LLVM
  # package version" step fails with the new version string instead of
  # silently building with it. Review the change, then update that value
  # (found via:
  #   curl -fsSL https://apt.llvm.org/noble/dists/llvm-toolchain-noble-22/main/binary-<arch>/Packages.gz \
  #     | gunzip | grep -A2 '^Package: clang-22$'
  # with binary-amd64 for LLVM_LINUX_EXACT_VERSION and binary-arm64 for
  # LLVM_LINUX_EXACT_VERSION_ARM64) so a Linux toolchain change is always a
  # deliberate, reviewed PR rather than a change in apt repository state
  # between two runs of the same tag. The matrix picks the pin: arm64 legs
  # pass LLVM_LINUX_EXACT_VERSION_ARM64 to setup-llvm, x64 legs the other.
  LLVM_LINUX_EXACT_VERSION: '1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'
  LLVM_LINUX_EXACT_VERSION_ARM64: '1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'

  # 'true' only for a dispatched run with dry_run left on; a tag push has no inputs, so it is
  # always a real release. Read as $DRY_RUN in scripts and env.DRY_RUN in `if:` conditions.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  # Authenticode signing of the Windows x64 .zip through SignPath (#2302; docs/code-signing-policy.md): the
  # SignPath signing policy sign-windows submits to. 'test-signing' signs with SignPath's self-signed test
  # certificate, "TaskSmack Test Signing (untrusted)", with no approval: it proves the pipeline end to end, and
  # nothing it signs is trusted outside this workflow. To sign releases with the SignPath Foundation certificate
  # once the Foundation approves the project, change the LAST 'test-signing' below to 'release-signing', and the
  # LAST signer under it to 'SignPath Foundation'. Those two lines move tag runs (and dry_run=false dispatches)
  # to the policy whose every request the maintainer approves in SignPath (sign-windows waits for it), while
  # dry runs stay on test-signing. Until then, validate refuses a real release once signing is on (#2745).
  SIGNPATH_SIGNING_POLICY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'test-signing' || 'test-signing' }}
  # The signer common name the policy's certificate carries: what build-windows configures as
  # TASKSMACK_EXPECTED_SIGNER and validate-windows-package's signature check requires, defined once so the two
  # can't drift (#2779). A workflow-level env value can't read another, so this repeats the policy's condition
  # instead of mapping from SIGNPATH_SIGNING_POLICY; a policy/signer mismatch fails that check, never publishes.
  # 'TaskSmack Test Signing (untrusted)' is test-signing's certificate, 'SignPath Foundation' release-signing's.
  WINDOWS_EXPECTED_SIGNER: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'TaskSmack Test Signing (untrusted)' || 'TaskSmack Test Signing (untrusted)' }}

  # The switch for the whole signing path: 'true' only when the repository variable
  # SIGNPATH_SIGNING_ENABLED is 'true'. It stays unset until the SignPath Foundation approves the
  # project, because SignPath's free organization doesn't include the GitHub.com trusted build
  # system sign-windows needs. Off, the Windows x64 .zip is packaged as before #2302: no
  # TaskSmackHelper.exe (it never ships unsigned), no sign-windows, no signature check. Jobs read
  # vars.SIGNPATH_SIGNING_ENABLED directly, since a job's `if:` can't read `env`.
  SIGNING_ENABLED: ${{ vars.SIGNPATH_SIGNING_ENABLED == 'true' }}

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    permissions:
      contents: read
    steps:
      - name: Report dry run
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice::Dry run from '$TAG_NAME' ($REF_TYPE): the tag, branch-ancestry, existing-release and version-equals-tag checks are skipped, and create-release creates and publishes nothing."

      - name: Validate ref is an actual tag
        # github.ref_name is just the short name with no "refs/tags/"/"refs/heads/"
        # prefix, so a workflow_dispatch run manually triggered from a branch named
        # e.g. "v0.8.0" would pass the semver regex below identically to a real tag --
        # and if that branch happened to be on main, every later check would
        # also pass, letting build/sign/publish run without an actual tag ever having
        # been pushed. Reject anything that isn't really a tag ref before checking its name.
        if: env.DRY_RUN != 'true'
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Ref '$TAG_NAME' is a $REF_TYPE, not a tag. Releases must be triggered by an actual tag push (or a workflow_dispatch run against an existing tag ref with dry_run off). Aborting release." >&2
            exit 1
          fi

      - name: Validate tag is strict semver
        # Mirrors changelog.yml's tag validation: reject anything that is not
        # exactly vMAJOR.MINOR.PATCH (pre-releases, 4-part tags, branch names
        # from a stray workflow_dispatch) before any build/sign/publish work runs.
        # Each numeric identifier must be "0" or have no leading zero (real SemVer
        # rule) -- v01.2.3 is invalid, so a bare [0-9]+ per component is too loose.
        if: env.DRY_RUN != 'true'
        run: |
          if ! [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Ref '$TAG_NAME' is not strict semver (vMAJOR.MINOR.PATCH, no leading zeroes). Aborting release." >&2
            exit 1
          fi

      - name: Refuse to sign a real release under the test-signing policy
        # Fail closed (#2745): with SIGNPATH_SIGNING_ENABLED set, a real release (a tag push, or a
        # dispatch with dry_run off) must not ship a .zip signed by SignPath's self-signed test
        # certificate. validate-windows-package trusts that certificate on its own runner, so its
        # signature gate would pass while users saw an untrusted publisher. Until the policy line
        # at the top moves real releases to release-signing, signing is for dry runs only.
        if: env.DRY_RUN != 'true' && env.SIGNING_ENABLED == 'true'
        run: |
          if [[ "$SIGNPATH_SIGNING_POLICY" == "test-signing" ]]; then
            echo "::error::SIGNPATH_SIGNING_ENABLED is 'true', but a real release can't be signed under the test-signing policy. Move SIGNPATH_SIGNING_POLICY's tag-run value to release-signing (see the env block at the top of release.yml), or dispatch a dry run. Aborting release."
            exit 1
          fi
          echo "Signing policy for this release: $SIGNPATH_SIGNING_POLICY"

      - name: Refuse to replace a published release
        # A re-pushed (deleted and recreated) tag must not silently swap the assets of a
        # release users may already have downloaded and verified. The releases/tags endpoint
        # returns only published releases, never drafts, so any hit here is a public release;
        # a draft left by a failed earlier run is fine, and create-release reuses it.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err=$(mktemp)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.html_url' 2> "$err"; then
            echo "A published release for '$TAG_NAME' already exists (above). Delete it, or bump the version, before re-running; refusing to replace its assets." >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$err"; then
            echo "Could not check for an existing release for '$TAG_NAME':" >&2
            cat "$err" >&2
            exit 1
          fi
          echo "No published release for '$TAG_NAME' yet."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (every branch and tag) is required to resolve the tag SHA and check
          # it against origin/main and origin/release/X.Y below.
          fetch-depth: 0

      - name: Verify tag is on main or its release branch
        # A release must publish something that is on main, or on the release branch the tag
        # names (#2741): vX.Y.Z may be on `release/X.Y`, which the maintainer cuts at the
        # candidate commit, where vX.Y.0 is tagged on both branches and later patch tags go on
        # the branch's head after backports. Ancestry rather than equality, so a merge landing
        # on the branch between the tag push and this job can't abort the release.
        if: env.DRY_RUN != 'true'
        run: |
          TAG_SHA=$(git rev-list -n1 "$TAG_NAME")
          VERSION="${TAG_NAME#v}"
          RELEASE_BRANCH="release/${VERSION%.*}"
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is on main."
          elif git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH" &&
               git merge-base --is-ancestor "$TAG_SHA" "origin/$RELEASE_BRANCH"; then
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is on $RELEASE_BRANCH."
          else
            MAIN_SHA=$(git rev-parse origin/main)
            if git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
              BRANCH_STATE="currently $(git rev-parse "origin/$RELEASE_BRANCH")"
            else
              BRANCH_STATE="no such branch"
            fi
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is neither on main (not an ancestor of origin/main, currently ${MAIN_SHA}) nor on ${RELEASE_BRANCH} (${BRANCH_STATE}). Aborting release." >&2
            exit 1
          fi

      - name: Verify tag matches project version
        # Catches a missed version bump before it ships assets whose embedded
        # metadata/filenames disagree with the GitHub Release tag. A dry run still
        # reads PROJECT_VERSION, so a malformed project() line fails the rehearsal
        # too, but has no tag to compare it with.
        run: |
          # \S+ (not a fixed X.Y.Z group count) so a 4-component or otherwise malformed
          # PROJECT_VERSION is compared in full rather than silently truncated to a false
          # match. "|| true" stops a non-matching grep (exit 1) from tripping this job's
          # `set -e` before the explicit empty-value check below can report a clear error.
          PROJECT_VERSION=$(grep -oP '^project\(TaskSmack VERSION \K\S+' CMakeLists.txt || true)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "Could not determine PROJECT_VERSION from CMakeLists.txt." >&2
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: PROJECT_VERSION is $PROJECT_VERSION (a real release needs tag v$PROJECT_VERSION)."
            exit 0
          fi
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' does not match CMakeLists.txt PROJECT_VERSION '$PROJECT_VERSION'. Aborting release." >&2
            exit 1
          fi
          echo "Tag version matches PROJECT_VERSION: $PROJECT_VERSION"

  # Every build, reproducibility and validation job runs once per architecture (#2214): x64, and
  # ARM64 natively on GitHub's arm64 runners (ubuntu-24.04-arm, windows-11-arm), as arm64.yml does
  # in CI. Each build leg uploads <os>-packages-<arch>, and create-release takes all four. x64 keeps
  # its asset names; ARM64's carry -linux-aarch64 / -windows-arm64 (CPACK_SYSTEM_NAME, set in
  # cmake/Packaging.cmake). The ARM64 legs get 60 minutes: their 4-vCPU runners start from a cold
  # ccache unless a run off main has saved one.
  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One architecture failing must not cancel the other's build: its log is still worth having.
      fail-fast: false
      matrix:
        include:
          # x64: 45 minutes. Its build alone grew from about 16 to over 25 minutes (about 1,580 to
          # 1,670 Ninja steps; run 39285215761 was cancelled at 30 while linking the tests). ccache
          # can't cover that: under 15% of its compiles are cacheable.
          - arch: x64
            runner: ubuntu-24.04
            timeout: 45
          - arch: arm64
            runner: ubuntu-24.04-arm
            timeout: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        # Reproducible-builds.org SOURCE_DATE_EPOCH, derived from the tagged
        # commit rather than wall-clock time. CMake's generated version.h and
        # CPack's archive entry timestamps both honor it (see CMakeLists.txt),
        # so two independent builds of the same tag produce identical output.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          # This architecture's own pin (#2778; both are documented in the env block at the top).
          expect-exact-version: ${{ matrix.arch == 'arm64' && env.LLVM_LINUX_EXACT_VERSION_ARM64 || env.LLVM_LINUX_EXACT_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action's pinned, SHA-256-verified ccache (4.13.6): Ubuntu's 4.9.1 lacks the
          # --evict-older-than that evict-old-files uses, and Windows images ship 4.9.1 via Perl.
          install: binary
          # x64 keeps its existing key; another architecture's carries the architecture after the
          # prefix, so cache-prune keeps each architecture's newest entry (#2528).
          key: linux-release-package-${{ matrix.arch != 'x64' && format('{0}-', matrix.arch) || '' }}llvm${{ env.LLVM_VERSION }}
          max-size: 500M
          # Main-only saving, as in every other workflow (#1406): a cache saved by a tag run can only
          # be restored by that same tag, so tag runs only restore.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Record toolchain versions
        # Documents the exact release environment for cross-run investigation.
        run: |
          echo "=== Release toolchain versions (Linux) ==="
          clang --version
          ld.lld --version
          cmake --version
          ninja --version
          python3 --version
          dpkg-query -W -f='clang-${{ env.LLVM_VERSION }} package: ${Version}\n' "clang-${{ env.LLVM_VERSION }}"

      - name: Configure
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -j "$(nproc)" --output-on-failure --timeout 60

      - name: Package
        run: |
          cd build/release
          cpack -G "TGZ;DEB"

      - name: Upload artifacts
        # Only the packages: dist/ is also CPACK_PACKAGE_DIRECTORY, so it holds CPack's
        # _CPack_Packages staging tree too, which doubled the artifact and made `gh run download`
        # refuse it ("would result in path traversal", #2799).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  verify-reproducibility:
    name: Verify Linux Build Reproducibility (${{ matrix.arch }})
    needs: [validate, build-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # Each architecture rebuilds on its own runner type and compares with its own build-linux leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64: 45 minutes, as build-linux's (see its comment); this rebuild never uses ccache.
          - arch: x64
            runner: ubuntu-24.04
            timeout: 45
          - arch: arm64
            runner: ubuntu-24.04-arm
            timeout: 60
    # Advisory only: rebuilds the same tag from a clean workspace and compares
    # digests against build-linux's packages. Surfaces regressions in the
    # reproducible-build policy (see CONTRIBUTING.md's Release Reproducibility
    # section) without blocking publishing on it -- it is not part of
    # create-release's `needs`.
    continue-on-error: true
    permissions:
      contents: read
      actions: read  # Required to download the linux-packages-<arch> artifact from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          # This architecture's own pin (#2778; both are documented in the env block at the top).
          expect-exact-version: ${{ matrix.arch == 'arm64' && env.LLVM_LINUX_EXACT_VERSION_ARM64 || env.LLVM_LINUX_EXACT_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Configure
        # No ccache here (unlike build-linux): a genuinely independent rebuild must not
        # be able to serve a translation unit's compiled output from a prior run instead
        # of actually re-invoking the compiler, or this check would compare a cached
        # object against itself instead of testing real build determinism.
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Package
        run: |
          cd build/release
          cpack -G "TGZ;DEB"

      - name: Download build-linux's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages-${{ matrix.arch }}
          path: original-dist/

      - name: Compare digests
        # This job's own cpack leaves CPack's _CPack_Packages staging directory in dist/
        # (CPACK_PACKAGE_DIRECTORY is dist/ itself); original-dist/ holds only the packages,
        # since build-linux uploads just those (#2799). sha256sum on a directory errors and,
        # under this job's `set -e` default, would abort before ever comparing anything, so
        # both operations stay restricted to regular files.
        run: |
          echo "=== build-linux (first build) ==="
          find original-dist -maxdepth 1 -type f -exec sha256sum {} +
          echo "=== verify-reproducibility (second, independent build) ==="
          find dist -maxdepth 1 -type f -exec sha256sum {} +
          FAILED=0
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f")
            orig="original-dist/${name}"
            if [[ ! -f "$orig" ]]; then
              echo "::warning::No matching original artifact for $name -- treating as a reproducibility failure, not skipping it."
              FAILED=1
              continue
            fi
            if ! cmp -s "$f" "$orig"; then
              echo "::warning::$name differs between the two independent builds of this tag -- see CONTRIBUTING.md's Release Reproducibility section."
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 0 ]]; then
            echo "All Linux packages are byte-for-byte identical across two independent builds of this tag."
          else
            echo "Reproducibility check found differences (advisory only; did not block the release)." >&2
            exit 1
          fi

  build-windows:
    name: Build Windows Packages (${{ matrix.arch }})
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # windows-11-arm: setup-windows-llvm installs the pinned native woa64 LLVM (plain ARM64, not
    # ARM64EC), and setup-mesa-llvmpipe fetches mmozeiko/build-mesa's ARM64 llvmpipe for the tests.
    # signed: the leg whose .zip sign-windows sends to SignPath (#2302) when SIGNING_ENABLED is
    # 'true'; with signing off, every leg packages and uploads as before. Only x64: SignPath's
    # artifact configuration `windows-zip` describes the win64 .zip, so ARM64 ships unsigned and
    # without TaskSmackHelper.exe until a second artifact configuration covers its .zip.
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 runs 45 minutes like the Linux legs (#2596): the build plus tests passed 30 in dry run 39314253661.
          - arch: x64
            runner: windows-2025
            timeout: 45
            signed: true
          - arch: arm64
            runner: windows-11-arm
            timeout: 60
            signed: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        # Reproducible-builds.org SOURCE_DATE_EPOCH, derived from the tagged
        # commit rather than wall-clock time. CMake's generated version.h and
        # CPack's archive entry timestamps both honor it (see CMakeLists.txt),
        # so two independent builds of the same tag produce identical output.
        shell: pwsh
        run: |
          $epoch = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # Force the action's pinned, SHA-256-verified ccache binary; 'detect' would pick up
          # Strawberry Perl's bundled ccache 4.9.1 already on the image PATH (#1406).
          install: binary
          # x64 keeps its existing key; see build-linux's.
          key: windows-release-package-${{ matrix.arch != 'x64' && format('{0}-', matrix.arch) || '' }}llvm${{ env.LLVM_SEMVER_VERSION }}
          max-size: 500M
          # Main-only saving, as in every other workflow (#1406): a cache saved by a tag run can only
          # be restored by that same tag, so tag runs only restore.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Record toolchain versions
        # Documents the exact release environment for cross-run investigation.
        shell: pwsh
        run: |
          Write-Host "=== Release toolchain versions (Windows) ==="
          clang --version
          ld.lld --version
          cmake --version
          ninja --version
          python --version

      - name: Configure
        # The signed leg packages TaskSmackHelper.exe (#2550) for sign-windows to sign with TaskSmack.exe.
        # TASKSMACK_SIGN_AFTER_PACKAGING moves cmake/VerifyWindowsSignatures.cmake's check from CPack,
        # where the .zip isn't signed yet, to validate-windows-package, which runs it on the signed
        # .zip, so an unsigned helper still can't be published. TASKSMACK_EXPECTED_SIGNER is the signer
        # the policy's certificate names, the one that check requires (WINDOWS_EXPECTED_SIGNER, from
        # the workflow's env).
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
          SIGNED: ${{ matrix.signed && env.SIGNING_ENABLED == 'true' }}
        run: |
          $signing = @()
          if ($env:SIGNED -eq 'true') {
            $signing = @(
              '-DTASKSMACK_PACKAGE_WINDOWS_HELPER=ON',
              '-DTASKSMACK_SIGN_AFTER_PACKAGING=ON',
              "-DTASKSMACK_EXPECTED_SIGNER=$env:WINDOWS_EXPECTED_SIGNER"
            )
          }
          cmake --preset win-release -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" @signing

      - name: Build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-release

      # The runner has no GPU (only GDI Generic OpenGL 1.1, below the 3.3 core the window, title
      # bar, HWND and GL icon suites need), so without this the display suites skip on the build
      # that ships (#2256). Mesa's llvmpipe goes only beside the test executables in
      # build/win-release/tests: the Package step installs TaskSmack.exe and explicit files from
      # cmake/InstallRules.cmake, never the tests directory, so the DLLs stay out of the zip.
      # Same action and pins as reusable-build-test.yml (#2134); validate-windows-package's smoke
      # check fetches the same pinned archives inline because that job has no checkout. On ARM64 the
      # action takes mmozeiko/build-mesa's ARM64 llvmpipe (#2214), test-only like the x64 one.
      - name: Software OpenGL for the display tests
        uses: ./.github/actions/setup-mesa-llvmpipe
        with:
          copy-to: build/win-release/tests

      - name: Test
        shell: pwsh
        env:
          # llvmpipe gives the display suites a GL 3.3+ context, so they must fail rather than
          # skip if it goes missing, as in reusable-build-test.yml (#2134).
          TASKSMACK_REQUIRE_DISPLAY: '1'
          GALLIUM_DRIVER: llvmpipe
        run: ctest --preset win-release -j $env:NUMBER_OF_PROCESSORS --output-on-failure --timeout 60

      - name: Package
        shell: pwsh
        run: |
          cd build/win-release
          cpack -G "ZIP"

      - name: Record build inputs
        # build-inputs/<package>-build-inputs.json (#2802): the MSVC toolset, the SHA-256 of the
        # CRT/UCRT libraries the link consumed, the Windows SDK, the runner image and the compiler.
        # Two runs of one commit can link different bytes when the runner image's serviced CRT
        # changes under an unchanged directory name (VS 18.10 vs 18.11, both VC\Tools\MSVC\14.51.36231),
        # so a differing TaskSmack.exe is explained when the manifests differ and is a build problem
        # only when they match. verify-reproducibility-windows compares against this one, and
        # create-release ships it beside the .zip.
        uses: ./.github/actions/windows-build-inputs
        with:
          job: build-windows

      - name: Upload the build-inputs manifest
        # Its own artifact, on every leg: the signed leg's .zip travels alone (SignPath's artifact
        # configuration wants the .zip at the artifact's root) and sign-windows re-uploads only the
        # .zip, so the manifest can't ride windows-packages-<arch>. verify-reproducibility-windows
        # and create-release download it by this name.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-inputs-${{ matrix.arch }}
          path: build-inputs/*-build-inputs.json
          if-no-files-found: error
          retention-days: 90

      # The signed leg's .zip isn't a release package yet: it goes to sign-windows as
      # windows-unsigned-<arch>, a name create-release's '*-packages-*' download never matches, and
      # sign-windows uploads the signed .zip as windows-packages-<arch>. Only the .zip, at the
      # artifact's root, where SignPath's `windows-zip` artifact configuration looks for it.
      - name: Upload the unsigned .zip for signing
        if: matrix.signed && env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-unsigned-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifacts
        # Only the .zip, never CPack's _CPack_Packages staging tree beside it (see build-linux's
        # upload, #2799).
        if: ${{ !matrix.signed || env.SIGNING_ENABLED != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

  sign-windows:
    name: Sign Windows Package (x64, SignPath)
    needs: [build-windows]
    # Skipped while signing is off (SIGNING_ENABLED); validate-windows-package and create-release
    # accept that skip only then.
    if: vars.SIGNPATH_SIGNING_ENABLED == 'true'
    # No checkout and no build: this job only hands build-windows' .zip to SignPath and takes the
    # signed one back, so the SignPath token never shares a job with third-party build code (#2302's
    # decision). SignPath signs TaskSmack.exe and TaskSmackHelper.exe inside the .zip, as the
    # project's `windows-zip` artifact configuration says, and returns the .zip otherwise unchanged.
    # SignPath only signs artifacts every job before it built on GitHub-hosted runners.
    runs-on: ubuntu-24.04
    # Covers release-signing's manual approval in SignPath (wait-for-completion-timeout below), not
    # just test-signing's minute or two.
    timeout-minutes: 75
    permissions:
      # What SignPath's documentation asks of the token it's given (github-token, the job's token by
      # default): read this run's job details for its origin check, and download the artifact.
      contents: read
      actions: read
    steps:
      - name: Find the unsigned .zip's artifact
        # build-windows is a matrix, so its x64 leg can't hand an output to this job reliably; the
        # artifact is looked up by name instead. A re-run attempt can leave more than one, so the
        # newest wins.
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: windows-unsigned-x64
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT}" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [[ -z "$id" ]]; then
            echo "No ${ARTIFACT} artifact in this run." >&2
            exit 1
          fi
          echo "${ARTIFACT}: artifact ${id}"
          echo "artifact-id=${id}" >> "$GITHUB_OUTPUT"

      - name: Sign with SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tasksmack
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: windows-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # An hour for the maintainer to approve a release-signing request; test-signing needs none.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Check the signed artifact
        # The action unpacks the signed GitHub artifact into signed/: it must hold just the x64 .zip,
        # under the name build-windows gave it. validate-windows-package checks the signatures.
        env:
          REQUEST_URL: ${{ steps.signpath.outputs.signing-request-web-url }}
        run: |
          echo "SignPath signing request (${SIGNPATH_SIGNING_POLICY}): ${REQUEST_URL}"
          mapfile -t files < <(find signed -type f -printf '%P\n')
          if [[ ${#files[@]} -ne 1 || ! ${files[0]} =~ ^TaskSmack-[^/]+-win64\.zip$ ]]; then
            echo "Expected one TaskSmack-<version>-win64.zip from SignPath, found: ${files[*]}" >&2
            exit 1
          fi
          echo "Signed package: ${files[0]}"

      - name: Upload the signed .zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages-x64
          path: signed/*.zip
          if-no-files-found: error
          retention-days: 90

  verify-reproducibility-windows:
    name: Verify Windows Build Reproducibility (${{ matrix.arch }})
    needs: [validate, build-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    # The original is build-windows' unsigned .zip for this architecture. With signing on
    # (SIGNING_ENABLED), x64's is the one it sent to SignPath (windows-unsigned-x64), since
    # Authenticode signatures carry a timestamp, so the signed
    # .zip differs on every run by design and isn't compared. This rebuild is unsigned and
    # configured without TASKSMACK_PACKAGE_WINDOWS_HELPER, so its .zip lacks the
    # TaskSmackHelper.exe x64's has; "Compare digests" compares that against the helper this
    # rebuild built instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            timeout: 45
          - arch: arm64
            runner: windows-11-arm
            timeout: 60
    # Advisory only -- see verify-reproducibility (Linux)'s comment; not part of
    # create-release's `needs`.
    continue-on-error: true
    permissions:
      contents: read
      actions: read  # Required to download build-windows' artifact from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        shell: pwsh
        run: |
          $epoch = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Configure
        # No ccache here (unlike build-windows) -- see verify-reproducibility (Linux)'s
        # comment: a genuinely independent rebuild must not be able to serve a cached
        # object instead of actually re-invoking the compiler.
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --preset win-release -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-release

      - name: Package
        shell: pwsh
        run: |
          cd build/win-release
          cpack -G "ZIP"

      - name: Record build inputs
        # This rebuild's manifest (see build-windows' step, #2802), for "Compare digests" to set
        # against build-windows'.
        uses: ./.github/actions/windows-build-inputs
        with:
          job: verify-reproducibility-windows

      - name: Download build-windows's unsigned package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ (matrix.arch == 'x64' && env.SIGNING_ENABLED == 'true') && 'windows-unsigned-x64' || format('windows-packages-{0}', matrix.arch) }}
          path: original-dist/

      - name: Download build-windows's build-inputs manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-build-inputs-${{ matrix.arch }}
          path: original-build-inputs/

      - name: Compare digests
        # This job's own cpack leaves CPack's _CPack_Packages staging directory in dist/
        # (CPACK_PACKAGE_DIRECTORY is dist/ itself); original-dist/ holds only the .zip, since
        # build-windows uploads just that (#2799). Get-FileHash errors on a directory, so -File
        # restricts Get-ChildItem to regular files up front.
        #
        # Identical .zip digests pass. Otherwise every file in the two .zips is compared, and the
        # only difference allowed is a TaskSmackHelper.exe only the original packages (x64, see the
        # matrix), which must match the one this rebuild built in build/win-release/bin.
        #
        # The two build-inputs manifests then say what a difference means (#2802): inputs that
        # differ (toolset, CRT/UCRT library hashes, SDK, runner image, compiler) explain it as the
        # runner image's serviced CRT, not the build; inputs that match make it the build's.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-EntryHashes([string] $zipPath) {
            $hashes = @{}
            $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName.EndsWith('/')) { continue }
                $stream = $entry.Open()
                try {
                  $hashes[$entry.FullName -replace '\\', '/'] = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash
                } finally {
                  $stream.Dispose()
                }
              }
            } finally {
              $zip.Dispose()
            }
            return $hashes
          }

          $failed = $false
          foreach ($rebuiltZip in Get-ChildItem dist/* -File) {
            $orig = Join-Path "original-dist" $rebuiltZip.Name
            if (-not (Test-Path -LiteralPath $orig -PathType Leaf)) {
              Write-Host "::warning::No matching original artifact for $($rebuiltZip.Name) -- treating as a reproducibility failure, not skipping it."
              $failed = $true
              continue
            }
            $rebuiltHash = (Get-FileHash -LiteralPath $rebuiltZip.FullName -Algorithm SHA256).Hash
            $originalHash = (Get-FileHash -LiteralPath $orig -Algorithm SHA256).Hash
            Write-Host "$($rebuiltZip.Name): rebuilt=$rebuiltHash original=$originalHash"
            if ($rebuiltHash -eq $originalHash) { continue }

            $rebuilt = Get-EntryHashes $rebuiltZip.FullName
            $original = Get-EntryHashes (Get-Item -LiteralPath $orig).FullName
            $differs = $false
            $helperOnly = $false
            foreach ($name in $original.Keys) {
              if ($rebuilt.ContainsKey($name)) {
                if ($rebuilt[$name] -ne $original[$name]) {
                  Write-Host "::warning::$name differs between the two independent builds of this tag."
                  $differs = $true
                }
              } elseif ($name -match '(^|/)TaskSmackHelper\.exe$') {
                $helperHash = (Get-FileHash -LiteralPath build/win-release/bin/TaskSmackHelper.exe -Algorithm SHA256).Hash
                Write-Host "$($name): rebuilt=$helperHash original=$($original[$name]) (not in the rebuild's .zip; compared with build/win-release/bin)"
                if ($helperHash -ne $original[$name]) {
                  Write-Host "::warning::TaskSmackHelper.exe differs between the two independent builds of this tag."
                  $differs = $true
                } else {
                  $helperOnly = $true
                }
              } else {
                Write-Host "::warning::$name is in build-windows' $($rebuiltZip.Name) but not in the rebuild's."
                $differs = $true
              }
            }
            foreach ($name in $rebuilt.Keys) {
              if (-not $original.ContainsKey($name)) {
                Write-Host "::warning::$name is in the rebuild's $($rebuiltZip.Name) but not in build-windows'."
                $differs = $true
              }
            }
            if (-not $differs -and -not $helperOnly) {
              Write-Host "::warning::$($rebuiltZip.Name)'s files match but the archives differ (entry metadata)."
              $differs = $true
            }
            if ($differs) {
              Write-Host "::warning::$($rebuiltZip.Name) differs between the two independent builds of this tag -- see CONTRIBUTING.md's Release Reproducibility section."
              $failed = $true
            } else {
              Write-Host "$($rebuiltZip.Name): every file matches; the original also packages the matching TaskSmackHelper.exe."
            }
          }

          $originalManifest = Get-ChildItem original-build-inputs/*-build-inputs.json -File | Select-Object -First 1
          $rebuiltManifest = Get-ChildItem build-inputs/*-build-inputs.json -File | Select-Object -First 1
          $inputs = 'unknown'
          if ($originalManifest -and $rebuiltManifest) {
            & .github/actions/windows-build-inputs/compare-build-inputs.ps1 $originalManifest.FullName $rebuiltManifest.FullName
            switch ($LASTEXITCODE) {
              0 { $inputs = 'same' }
              1 { $inputs = 'differ' }
              default { Write-Host "::warning::Could not compare the build-inputs manifests (compare-build-inputs.ps1 exited $LASTEXITCODE)." }
            }
          } else {
            Write-Host "::warning::A build-inputs manifest is missing (build-windows': $($null -ne $originalManifest), this rebuild's: $($null -ne $rebuiltManifest)), so a CRT change can't be told from a build change."
          }

          if ($failed) {
            if ($inputs -eq 'differ') {
              Write-Host "::warning::The build inputs differ too (above): the runner image's MSVC toolset, CRT/UCRT libraries or Windows SDK changed between build-windows' runner and this one, which explains the difference without the build being non-reproducible (#2802). Pinning the toolset is the fix if byte-identity across images is wanted."
            } elseif ($inputs -eq 'same') {
              Write-Host "::warning::The build inputs match (same MSVC toolset, CRT/UCRT library hashes, Windows SDK, runner image and compiler), so the difference is in the build itself, not the runner image."
            }
            Write-Host "Reproducibility check found differences (advisory only; did not block the release)."
            exit 1
          } else {
            if ($inputs -eq 'differ') {
              Write-Host "::notice::The packages match although the build inputs differ (above): the serviced libraries didn't change TaskSmack.exe this time."
            }
            Write-Host "All Windows packages are reproducible across two independent builds of this tag (byte-for-byte, or file-for-file plus the original's matching TaskSmackHelper.exe)."
          }

  validate-linux-package:
    name: Validate Linux Release Artifacts (${{ matrix.arch }})
    needs: [build-linux]
    # The arm64 runner pulls the arm64 ubuntu:24.04 image, so each .deb installs natively.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb-arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb-arch: arm64
    # A bare, no-dev-tools container so installing the .deb exercises exactly
    # the runtime Depends declared in cmake/Packaging.cmake, rather than
    # reusing the build-linux runner where libc++/mesa dev packages already
    # happen to be present.
    container:
      image: ubuntu:24.04
    # Container jobs default `run` steps to `sh` (dash on Ubuntu), not bash, even though
    # every other job in this workflow gets bash by default on the bare VM runner. The
    # steps below use bash-only [[ ... ]] conditions, which dash doesn't support.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read  # Required to download the linux-packages-<arch> artifact from this run
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/

      - name: Verify the .deb's architecture
        # CPackDeb takes Architecture from the build runner's dpkg, so a leg that built for the
        # other architecture fails here rather than on a user's machine.
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.deb-arch }}
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one .deb in dist/, found ${#debs[@]}." >&2
            exit 1
          fi
          arch=$(dpkg-deb -f "${debs[0]}" Architecture)
          if [[ "$arch" != "$EXPECTED_DEB_ARCH" ]]; then
            echo "${debs[0]} is for '$arch', expected '$EXPECTED_DEB_ARCH'." >&2
            exit 1
          fi
          echo "${debs[0]}: Architecture $arch"

      - name: Verify .deb contains only the app's files
        # cmake/InstallRules.cmake's rules are shared with every bundled dependency's own
        # install() calls, so a dependency that installs its static libraries, headers or CMake
        # package files (or a TaskSmack rule with a bare "." destination) silently ships them
        # to users under /usr. Allow exactly the executable, the privileged helper and its polkit
        # action, and the app's data, desktop entry, icons, docs, AppStream metadata and man pages;
        # fail on anything else.
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one .deb in dist/, found ${#debs[@]}." >&2
            exit 1
          fi
          dpkg -c "${debs[0]}"
          # usr/libexec/tasksmack and usr/share/polkit-1: the privileged helper and its polkit action (#2307).
          allowed='^(|usr/|usr/share/|usr/bin/[^/]*|usr/libexec/|usr/libexec/tasksmack(/.*)?|usr/share/(tasksmack|applications|icons|doc|metainfo|pixmaps|man|polkit-1)(/.*)?)$'
          unexpected=$(dpkg-deb --fsys-tarfile "${debs[0]}" | tar -tf - | sed -e 's|^\./||' | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            echo "The .deb ships files outside usr/bin, usr/libexec/tasksmack and usr/share/{tasksmack,applications,icons,doc,metainfo,pixmaps,man,polkit-1}:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "The .deb contains only the expected locations."

      - name: Install .deb in a clean environment
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb

      - name: Verify installed .deb layout
        # cmake/InstallRules.cmake installs the Linux executable to bin/, so
        # the .deb places it at the conventional /usr/bin/TaskSmack (on PATH).
        run: |
          BIN=$(dpkg -L tasksmack | grep -E '/bin/TaskSmack$')
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "TaskSmack binary missing or not executable after .deb install" >&2
            exit 1
          fi
          echo "Installed binary: $BIN"

      - name: Verify the privileged helper's hardening
        # tasksmack-helper runs as root, so it is built with full RELRO, immediate binding and CET
        # (x86-64) or BTI/PAC (AArch64) (#2640, cmake/CompilerOptions.cmake's
        # tasksmack_apply_privileged_hardening()). A toolchain or flag change that silently drops
        # one fails here. The CET/BTI note survives only when every linked object has it, so it's
        # checked on the packaged binary, not assumed (the CET note is confirmed on release dry
        # runs). On arm64 a missing BTI/PAC note is a warning, not a failure, until #2786: the
        # LLVM 22 AArch64 static runtimes from apt.llvm.org (libc++, libc++abi, compiler-rt
        # builtins) don't carry branch protection, so lld drops the note from the whole helper
        # and no arm64 helper has shipped with it (#2784). RELRO and BIND_NOW stay fatal there.
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          apt-get install -y binutils
          HELPER=$(dpkg -L tasksmack | grep -E '/tasksmack-helper$')
          if [[ -z "$HELPER" || ! -x "$HELPER" ]]; then
            echo "tasksmack-helper missing or not executable after .deb install" >&2
            exit 1
          fi
          failed=0
          if ! readelf -d "$HELPER" | grep -Eq 'FLAGS_1.*NOW'; then
            echo "$HELPER: no BIND_NOW (FLAGS_1 NOW): the GOT is bound lazily" >&2
            failed=1
          fi
          if ! readelf -lW "$HELPER" | grep -q GNU_RELRO; then
            echo "$HELPER: no GNU_RELRO segment" >&2
            failed=1
          fi
          notes=$(readelf -n "$HELPER")
          summary="full RELRO, BIND_NOW and the CPU control-flow note as expected"
          if [[ "$ARCH" == "x64" ]]; then
            if ! grep -Eq 'x86 feature: IBT, SHSTK' <<<"$notes"; then
              echo "$HELPER: no x86 IBT/SHSTK property note (CET)" >&2
              failed=1
            fi
          elif ! grep -Eq 'AArch64 feature: BTI, PAC' <<<"$notes"; then
            # A warning, not a failure, until #2786 gets the note for real (see the step comment).
            msg="$HELPER has no AArch64 BTI/PAC property note: the LLVM 22 AArch64 static runtimes"
            msg+=" from apt.llvm.org (libc++, libc++abi, compiler-rt builtins) don't carry branch"
            msg+=" protection, so lld drops the note from the whole helper. Fatal again once #2786"
            msg+=" (v0.9.1) gets the note for real."
            echo "::warning title=arm64 tasksmack-helper has no BTI/PAC note::$msg"
            summary="full RELRO and BIND_NOW as expected; no AArch64 BTI/PAC note (warned, #2786)"
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "$HELPER: $summary."

      - name: Install mesa software rendering
        # llvmpipe (via SDL's "offscreen" video driver, below) needs no X server at all --
        # simpler and stronger than an Xvfb-backed smoke check, and this is the same
        # mesa/GL stack Xvfb would have needed anyway. libgl1-mesa-dri alone is not enough:
        # it provides the DRI/Gallium driver modules but not the EGL loader (libEGL.so.1,
        # from libegl1) or Mesa's EGL vendor implementation (libegl-mesa0) that SDL3's
        # offscreen backend needs to create a GL context at all -- confirmed these are
        # separate packages (apt-cache depends libgl1-mesa-dri lists neither), and this
        # dev environment's own working offscreen test only succeeded because a full
        # dev-toolchain install had already pulled both packages in for unrelated reasons.
        run: apt-get install -y libgl1-mesa-dri libegl1 libegl-mesa0

      - name: Define asset-resolution smoke check
        # A bounded "is it still running" check alone doesn't prove assets loaded --
        # src/UI/AssetPath.cpp and Theme.cpp both fall back gracefully on missing
        # fonts/themes, so a broken installed/extracted asset layout would still pass a
        # plain liveness check. Assert the actual log lines that only appear once the
        # icon font and at least one theme have loaded from the real assets directory.
        run: |
          cat > /tmp/smoke-check.sh <<'SMOKE_CHECK'
          #!/usr/bin/env bash
          set -uo pipefail
          label="$1"
          bin="$2"
          log="$3"
          SDL_VIDEODRIVER=offscreen TASKSMACK_LOG_LEVEL=debug timeout 5 "$bin" > "$log" 2>&1
          status=$?
          cat "$log"
          if [[ "$status" -ne 124 ]]; then
            echo "$label: TaskSmack exited on its own (status=$status) instead of running until the timeout killed it; treating as a crash." >&2
            exit 1
          fi
          if ! grep -q "Assets directory found:" "$log"; then
            echo "$label: assets directory was not found (see the 'Assets directory not found' fallback warning above, if present); installed/extracted asset layout is broken." >&2
            exit 1
          fi
          if grep -q "Icon font not found" "$log"; then
            echo "$label: icon font failed to load even though an assets directory was found." >&2
            exit 1
          fi
          if ! grep -q "Loaded theme:" "$log"; then
            echo "$label: no themes loaded; theme directory is missing or empty." >&2
            exit 1
          fi
          echo "$label: assets (icon font + themes) resolved correctly; TaskSmack ran until the timeout as expected."
          SMOKE_CHECK
          chmod +x /tmp/smoke-check.sh

      - name: Smoke-check installed .deb binary
        run: |
          BIN=$(dpkg -L tasksmack | grep -E '/bin/TaskSmack$')
          /tmp/smoke-check.sh "deb" "$BIN" /tmp/deb-run.log

      - name: Extract and verify .tar.gz layout
        run: |
          mkdir -p /tmp/tgz-extract
          tar -xzf dist/*.tar.gz -C /tmp/tgz-extract
          BIN=$(find /tmp/tgz-extract -mindepth 3 -maxdepth 3 -type f -path '*/bin/TaskSmack')
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "TaskSmack binary missing or not executable in .tar.gz" >&2
            exit 1
          fi
          echo "tar.gz binary found: $BIN"
          echo "TGZ_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Smoke-check extracted .tar.gz binary
        run: /tmp/smoke-check.sh "tar.gz" "$TGZ_BIN" /tmp/tgz-run.log

  validate-linux-helper:
    name: Validate the Installed Helper and Its polkit Policy (x64)
    needs: [build-linux]
    # A VM runner, not validate-linux-package's container: pkexec needs a running polkitd and systemd,
    # and the job installs a polkit rule (#2723). #2489's manual check, apart from the password
    # dialog itself: the policy registers, and the installed helper answers TaskSmack's handshake
    # through pkexec.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # Required to download the linux-packages-x64 artifact from this run
    steps:
      # Only the handshake client and the protocol header it reads its version from.
      - name: Check out the handshake client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: |
            tools/helper-handshake.py
            src/Platform/BrokerProtocol.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages-x64
          path: dist/

      - name: Install the .deb with pkexec and polkitd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb pkexec polkitd

      - name: The helper's polkit action is registered
        # pkaction exits non-zero for an action polkit doesn't know. The exec.path annotation is what
        # makes pkexec show the app's own prompt and apply auth_admin_keep.
        run: |
          pkaction --action-id app.tasksmack.TaskSmack.helper --verbose | tee pkaction.txt
          grep -q 'org.freedesktop.policykit.exec.path -> /usr/libexec/tasksmack/tasksmack-helper' pkaction.txt

      - name: Allow the runner's user without a password
        # A rule for the CI runner only: the password dialog is the part that stays a manual check.
        run: |
          user="$(id -un)"
          printf '%s\n' \
            'polkit.addRule(function (action, subject) {' \
            "    if (action.id == \"app.tasksmack.TaskSmack.helper\" && subject.user == \"$user\") {" \
            '        return polkit.Result.YES;' \
            '    }' \
            '});' | sudo tee /etc/polkit-1/rules.d/49-tasksmack-ci.rules
          sudo systemctl restart polkit

      - name: The installed helper answers the handshake through pkexec
        run: python3 repo/tools/helper-handshake.py --timeout 60

  validate-windows-package:
    name: Validate Windows Release Artifacts (${{ matrix.arch }})
    # With signing on, x64's windows-packages-x64 is sign-windows' signed .zip; otherwise, and for
    # ARM64, it comes from build-windows. sign-windows is skipped while signing is off, so this runs
    # when build-windows succeeded and sign-windows succeeded, or was skipped because signing is off;
    # a failed or cancelled signing (or run) still stops it.
    needs: [build-windows, sign-windows]
    if: >-
      ${{ !cancelled() && needs.build-windows.result == 'success' &&
      (needs.sign-windows.result == 'success' ||
      (vars.SIGNPATH_SIGNING_ENABLED != 'true' && needs.sign-windows.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # pe-machine: the COFF Machine field TaskSmack.exe must carry (IMAGE_FILE_MACHINE_*).
          # signed: with SIGNING_ENABLED, the .zip is Authenticode-signed and carries
          # TaskSmackHelper.exe (build-windows' matrix).
          - arch: x64
            runner: windows-2025
            pe-machine: '0x8664'
            signed: true
          - arch: arm64
            runner: windows-11-arm
            pe-machine: '0xAA64'
            signed: false
    permissions:
      contents: read
      actions: read  # Required to download the windows-packages-<arch> artifact from this run
    steps:
      # Only the signature check's script, for "Verify the Authenticode signatures". In its own
      # folder, since a checkout cleans the folder it checks out into.
      - name: Check out the signature check
        if: matrix.signed && env.SIGNING_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: cmake/VerifyWindowsSignatures.cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages-${{ matrix.arch }}
          path: dist/

      - name: Extract and verify .zip layout
        # The documented layout (README/User Guide: "Extract and run TaskSmack.exe") is flat:
        # CPack produces one top-level directory, with TaskSmack.exe directly inside it. A
        # recursive search would also accept TaskSmack.exe nested at any depth, silently
        # passing even if it moved somewhere users can no longer find per the documented steps.
        # The signed .zip also carries TaskSmackHelper.exe beside it (#2550), where TaskSmack
        # starts it from; an unsigned one must not carry it at all.
        shell: pwsh
        env:
          SIGNED: ${{ matrix.signed && env.SIGNING_ENABLED == 'true' }}
        run: |
          $zipFile = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath extracted
          $topLevelDirs = Get-ChildItem -Path extracted -Directory
          if ($topLevelDirs.Count -ne 1) {
            Write-Error "Expected exactly one top-level directory in the extracted .zip, found $($topLevelDirs.Count)"
            exit 1
          }
          $exe = Join-Path $topLevelDirs[0].FullName "TaskSmack.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "TaskSmack.exe not found directly under the .zip's top-level directory ($($topLevelDirs[0].FullName)); documented layout requires it at the package root, not nested."
            exit 1
          }
          Write-Host "Found executable: $exe"
          $helpers = @(Get-ChildItem -Path extracted -Recurse -File -Filter TaskSmackHelper.exe)
          $helper = Join-Path $topLevelDirs[0].FullName "TaskSmackHelper.exe"
          if ($env:SIGNED -eq 'true') {
            if ($helpers.Count -ne 1 -or -not (Test-Path -LiteralPath $helper -PathType Leaf)) {
              Write-Error "Expected exactly one TaskSmackHelper.exe, directly beside TaskSmack.exe ($helper); found $($helpers.Count)."
              exit 1
            }
            Write-Host "Found helper: $helper"
          } elseif ($helpers.Count -ne 0) {
            Write-Error "This .zip isn't Authenticode-signed, so it must not carry TaskSmackHelper.exe (#2302); found $($helpers[0].FullName)."
            exit 1
          }
          "TASKSMACK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TASKSMACK_PKG_ROOT=$($topLevelDirs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify the Authenticode signatures
        # The check CPack skipped for this .zip (TASKSMACK_SIGN_AFTER_PACKAGING; #2302), run on the
        # signed .zip before create-release can publish it: cmake/VerifyWindowsSignatures.cmake
        # requires TaskSmack.exe and TaskSmackHelper.exe to be validly signed by the policy's
        # signer (WINDOWS_EXPECTED_SIGNER, from the workflow's env), timestamped, with one
        # certificate. A missing, invalid, wrongly signed or untimestamped signature fails the
        # release here.
        #
        # test-signing's certificate is self-signed, so no machine trusts it and its signatures
        # read as UnknownError, not Valid. For that policy only, this ephemeral runner first trusts
        # the certificate TaskSmack.exe was signed with, once it is self-signed and names the test
        # signer. The check still proves both files are unchanged since SignPath signed them,
        # timestamped and signed by that one certificate. release-signing's SignPath Foundation
        # certificate chains to a public root, so nothing is added to the trust store for it.
        if: matrix.signed && env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $pkg = $env:TASKSMACK_PKG_ROOT
          foreach ($name in 'TaskSmack.exe', 'TaskSmackHelper.exe') {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $pkg $name)
            Write-Host "${name}: $($sig.Status); signer $($sig.SignerCertificate.Subject) ($($sig.SignerCertificate.Thumbprint)); timestamped by $($sig.TimeStamperCertificate.Subject)"
          }
          if ($env:SIGNPATH_SIGNING_POLICY -eq 'test-signing') {
            $cert = (Get-AuthenticodeSignature -LiteralPath $env:TASKSMACK_EXE).SignerCertificate
            if (-not $cert) {
              Write-Error "TaskSmack.exe isn't signed."
              exit 1
            }
            $cn = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($cn -ne $env:WINDOWS_EXPECTED_SIGNER -or $cert.Subject -ne $cert.Issuer) {
              Write-Error "TaskSmack.exe is signed by $($cert.Subject), issued by $($cert.Issuer); test-signing expects SignPath's self-signed '$env:WINDOWS_EXPECTED_SIGNER' certificate."
              exit 1
            }
            Write-Host "Trusting the self-signed test certificate on this runner only: $($cert.Subject) ($($cert.Thumbprint))"
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
            $store.Open('ReadWrite')
            try { $store.Add($cert) } finally { $store.Close() }
          }
          cmake "-DTASKSMACK_VERIFY_DIR=$pkg" "-DTASKSMACK_EXPECTED_SIGNER=$env:WINDOWS_EXPECTED_SIGNER" -P repo/cmake/VerifyWindowsSignatures.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the executable's architecture
        # The COFF header's Machine field, read from the PE file: 0x8664 is x64 and 0xAA64 ARM64
        # (an ARM64EC image says 0x8664, so it fails the ARM64 leg too). An x64 exe would still run
        # on the ARM64 runner, emulated, and pass the smoke check below.
        shell: pwsh
        env:
          EXPECTED_MACHINE: ${{ matrix.pe-machine }}
        run: |
          $bytes = [System.IO.File]::ReadAllBytes($env:TASKSMACK_EXE)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ([System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
            Write-Error "$env:TASKSMACK_EXE has no PE signature at offset $peOffset."
            exit 1
          }
          $machine = '0x{0:X4}' -f [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne $env:EXPECTED_MACHINE) {
            Write-Error "TaskSmack.exe has COFF machine $machine, expected $env:EXPECTED_MACHINE."
            exit 1
          }
          Write-Host "TaskSmack.exe COFF machine: $machine"

      - name: Verify .zip contains no development files
        # Same reason as validate-linux-package's content check: a bundled dependency's own
        # install() rules (or a TaskSmack rule's ARCHIVE destination) can ship import/static
        # libraries, headers and CMake package files that users have no use for. Checked on the
        # archive's entry names, so it doesn't depend on how Expand-Archive lays them out.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipFile = Get-ChildItem dist/*.zip | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFile.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally {
            $zip.Dispose()
          }
          $entries | ForEach-Object { Write-Host $_ }
          $unexpected = @($entries | Where-Object {
            $_ -match '\.(lib|a)$' -or $_ -match '(^|/)include/' -or $_ -match '(^|/)lib/cmake/'
          })
          if ($unexpected.Count -gt 0) {
            Write-Host "The .zip ships development files (*.lib, *.a, include/ or lib/cmake/):"
            $unexpected | ForEach-Object { Write-Host "  $_" }
            Write-Error "Unexpected development files in $($zipFile.Name)."
            exit 1
          }
          Write-Host "The .zip contains no import/static libraries, headers or CMake package files ($($entries.Count) entries)."

      - name: Verify packaged asset layout
        # The smoke check below proves startup and rendering, not assets: src/UI/AssetPath.cpp and
        # Theme.cpp both fall back gracefully on missing assets, so a broken packaged asset
        # layout would still pass it (see the equivalent Linux assertions in
        # validate-linux-package). Windows keeps the flat "." install destination
        # (TaskSmack.exe and share/ as siblings), so assert directly on the exact
        # exeDir/share/tasksmack/assets path AssetPath.cpp resolves at runtime.
        shell: pwsh
        run: |
          $iconFont = Join-Path $env:TASKSMACK_PKG_ROOT "share\tasksmack\assets\fonts\fa-solid-900.ttf"
          if (-not (Test-Path -LiteralPath $iconFont -PathType Leaf)) {
            Write-Error "Icon font not found at $iconFont (exeDir/share/tasksmack/assets); packaged asset layout is broken."
            exit 1
          }
          $themesDir = Join-Path $env:TASKSMACK_PKG_ROOT "share\tasksmack\assets\themes"
          $themeCount = (Get-ChildItem -Path $themesDir -Filter "*.toml" -ErrorAction SilentlyContinue).Count
          if ($themeCount -lt 1) {
            Write-Error "No theme .toml files found under $themesDir; packaged asset layout is broken."
            exit 1
          }
          Write-Host "Packaged assets verified: icon font present, $themeCount theme(s) found under $themesDir"

      - name: Fetch Mesa llvmpipe (smoke check only)
        # The runner has no GPU, so its only OpenGL is GDI Generic 1.1 and TaskSmack (OpenGL 3.3)
        # stops at startup with its "OpenGL 3.3 required" box (#1398). That box keeps the process
        # alive, so a liveness check alone passes without anything having rendered. Mesa's llvmpipe
        # is a software OpenGL 4.6 driver: placed beside the exe in a temporary copy of the package
        # (never in dist/ or the published zip), it lets the real startup path run to the first frame.
        # Pinned per architecture, with the archive's SHA-256 checked before anything in it is used:
        #  - x64: mesa-dist-win 26.2.4, release-msvc build. To update, take the new release's
        #    mesa3d-<ver>-release-msvc.7z asset and its digest (gh release view -R
        #    pal1000/mesa-dist-win <ver> --json assets).
        #  - ARM64: mmozeiko/build-mesa 26.2.5's mesa-llvmpipe-arm64-<ver>.7z (#2214), whose
        #    opengl32.dll has the Gallium driver linked in. To update, take the new release's asset
        #    digest (gh release view -R mmozeiko/build-mesa <ver> --json assets).
        # Inline rather than the setup-mesa-llvmpipe action because this job checks nothing out;
        # keep both pins in step with that action's.
        shell: pwsh
        env:
          MESA_ARCH: ${{ runner.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MESA_ARCH -eq 'X64') {
            $version = '26.2.4'
            $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
            $sha256 = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
            $members = @('x64/opengl32.dll', 'x64/libgallium_wgl.dll')
          } elseif ($env:MESA_ARCH -eq 'ARM64') {
            $version = '26.2.5'
            $url = "https://github.com/mmozeiko/build-mesa/releases/download/$version/mesa-llvmpipe-arm64-$version.7z"
            $sha256 = 'e7df75398d50e07a68bbffa5cff2ece4c85e5f8ef8bda497f560dd04fe60cbbd'
            $members = @('opengl32.dll')
          } else {
            Write-Error "No pinned Mesa llvmpipe build for runner architecture $env:MESA_ARCH"
            exit 1
          }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          $archive = Join-Path $mesaRoot ([System.IO.Path]::GetFileName($url))
          # As in the action: the x64 archive keeps its DLLs under x64/, the ARM64 one at its top
          # level, so that one is extracted into arm64/.
          $dllDir = Join-Path $mesaRoot $env:MESA_ARCH.ToLowerInvariant()
          $extractRoot = if ($env:MESA_ARCH -eq 'X64') { $mesaRoot } else { $dllDir }
          New-Item -ItemType Directory -Force -Path $mesaRoot, $extractRoot | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            Write-Error "Mesa archive SHA-256 mismatch: expected $sha256, got $actual"
            exit 1
          }
          # Windows' own bsdtar reads .7z; an unqualified 'tar' can resolve to Git's GNU tar, which can't.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $extractRoot @members
          if ($LASTEXITCODE -ne 0) { Write-Error "Extracting Mesa's OpenGL DLLs failed (tar exit $LASTEXITCODE)"; exit 1 }
          Get-ChildItem -LiteralPath $dllDir -Filter *.dll | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
          "MESA_DLL_DIR=$dllDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-check extracted executable
        # Runs a temporary copy of the extracted package with llvmpipe beside the exe, a fresh
        # TASKSMACK_CONFIG_DIR and an info-level log captured from stdout (spdlog's Windows stdout
        # sink writes unbuffered with WriteFile, so nothing is lost when the process is killed).
        # Fails on an early exit, on any [critical] or [error] log line, or unless the log shows
        # OpenGL 3.3+ from llvmpipe -- proof the real renderer came up, not an error box.
        shell: pwsh
        timeout-minutes: 5
        env:
          GALLIUM_DRIVER: llvmpipe
          TASKSMACK_LOG_LEVEL: info
          STARTUP_TIMEOUT_SECONDS: "60"
          ALIVE_SECONDS: "5"
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'tasksmack-smoke'
          $pkg = Join-Path $work 'pkg'
          $configDir = Join-Path $work 'config'
          $tempDir = Join-Path $work 'temp'
          foreach ($dir in @($pkg, $configDir, $tempDir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          Copy-Item -Path (Join-Path $env:TASKSMACK_PKG_ROOT '*') -Destination $pkg -Recurse
          Copy-Item -Path (Join-Path $env:MESA_DLL_DIR '*.dll') -Destination $pkg
          $exe = Join-Path $pkg 'TaskSmack.exe'
          $stdoutLog = Join-Path $work 'stdout.log'
          $stderrLog = Join-Path $work 'stderr.log'

          # Fresh, empty settings and lock directory, and a private %TEMP% for tasksmack-debug.log.
          $env:TASKSMACK_CONFIG_DIR = $configDir
          $env:TMP = $tempDir
          $env:TEMP = $tempDir

          $proc = Start-Process -FilePath $exe -WorkingDirectory $pkg -PassThru `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $failure = $null
          try {
            # Wait for the "  Version: ..." line Window.cpp logs once the GL context is up (it follows
            # the Renderer line), then require the process to keep running for ALIVE_SECONDS more.
            $deadline = (Get-Date).AddSeconds([int]$env:STARTUP_TIMEOUT_SECONDS)
            while ((Get-Date) -lt $deadline -and -not $proc.HasExited) {
              $log = Get-Content -LiteralPath $stdoutLog -Raw -ErrorAction SilentlyContinue
              if ($log -match '\]\s+Version:') { break }
              Start-Sleep -Milliseconds 500
            }
            if ($proc.HasExited) {
              $failure = "TaskSmack.exe exited during startup (exit code $($proc.ExitCode))"
            } else {
              Start-Sleep -Seconds ([int]$env:ALIVE_SECONDS)
              if ($proc.HasExited) {
                $failure = "TaskSmack.exe exited within $env:ALIVE_SECONDS s of creating its OpenGL context (exit code $($proc.ExitCode))"
              }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              $proc.WaitForExit(10000) | Out-Null
            }
          }

          $lines = @(Get-Content -LiteralPath $stdoutLog -ErrorAction SilentlyContinue) +
            @(Get-Content -LiteralPath $stderrLog -ErrorAction SilentlyContinue)
          Write-Host "=== TaskSmack startup log ==="
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "=== end of log ==="

          $errorLines = @($lines | Where-Object { $_ -match '\[(critical|error)\]' })
          $rendererLine = $lines | Where-Object { $_ -match '\]\s+Renderer:\s*(.+)$' } | Select-Object -First 1
          $renderer = if ($rendererLine -match '\]\s+Renderer:\s*(.+)$') { $Matches[1].Trim() } else { '' }
          $versionLine = $lines | Where-Object { $_ -match '\]\s+Version:\s*(.+)$' } | Select-Object -First 1
          $version = if ($versionLine -match '\]\s+Version:\s*(.+)$') { $Matches[1].Trim() } else { '' }

          if (-not $failure -and $errorLines.Count -gt 0) {
            $failure = "The startup log has $($errorLines.Count) [critical]/[error] line(s):`n$($errorLines -join "`n")"
          }
          if (-not $failure -and -not ($lines -match '\]\s+Entering main loop')) {
            $failure = "The log never reached 'Entering main loop' (Application::run): startup never finished"
          }
          if (-not $failure -and $renderer -notmatch 'llvmpipe') {
            $failure = "Expected the llvmpipe renderer in the log, found '$renderer'"
          }
          if (-not $failure) {
            if ($version -match '^(\d+)\.(\d+)') {
              $glVersion = [version]::new([int]$Matches[1], [int]$Matches[2])
              if ($glVersion -lt [version]'3.3') { $failure = "OpenGL $glVersion is below the required 3.3 ('$version')" }
            } else {
              $failure = "No parseable OpenGL version in the log (found '$version')"
            }
          }

          $summary = @(
            "### Windows package smoke check ($env:RUNNER_ARCH)",
            '',
            "- Result: $(if ($failure) { 'FAILED' } else { 'passed' })",
            "- OpenGL renderer: ``$renderer``",
            "- OpenGL version: ``$version``",
            "- Software driver: Mesa llvmpipe from $(if ($env:RUNNER_ARCH -eq 'ARM64') { 'mmozeiko/build-mesa' } else { 'mesa-dist-win' }) (temporary copy only, not in the package)"
          )
          if ($failure) { $summary += "- Failure: $failure" }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($failure) {
            Write-Error $failure
            exit 1
          }
          Write-Host "Smoke check passed: TaskSmack.exe started on '$renderer' (OpenGL $version) with no errors and ran for $env:ALIVE_SECONDS s."

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, sign-windows, validate-linux-package, validate-linux-helper, validate-windows-package]
    # Every job it needs must succeed, except sign-windows, which is skipped while signing is off
    # (SIGNING_ENABLED). Without this `if:`, that skip would skip the release too.
    if: >-
      ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' &&
      needs.validate-linux-package.result == 'success' && needs.validate-linux-helper.result == 'success' &&
      needs.validate-windows-package.result == 'success' &&
      (needs.sign-windows.result == 'success' ||
      (vars.SIGNPATH_SIGNING_ENABLED != 'true' && needs.sign-windows.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write  # Required for keyless OIDC signing with sigstore/cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive safe version label
        id: version
        run: |
          label="${GITHUB_REF_NAME}"
          label=$(printf '%s' "$label" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Generate source SBOM
        # Generated from the source tree, not from the built Linux/Windows
        # package contents -- it inventories what went into the build, not
        # what's inside the shipped archives. Named and documented as such
        # (see CONTRIBUTING.md's Release Artifacts section) so it isn't
        # mistaken for a package-level inventory.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          output-file: ${{ runner.temp }}/sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Download packages (every OS and architecture)
        # linux-packages-{x64,arm64} and windows-packages-{x64,arm64}, merged into dist/; x64's
        # Windows .zip is sign-windows' signed one (windows-unsigned-x64 never matches). Package
        # names differ by architecture (cmake/Packaging.cmake), so nothing in one artifact
        # overwrites another's, and each artifact holds only its packages (#2799), so dist/ is
        # exactly the release's package set plus the manifests below: signing, the upload and the
        # asset-count check all see the same files.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-packages-*'
          path: dist/
          merge-multiple: true

      - name: Download the Windows build-inputs manifests
        # windows-build-inputs-{x64,arm64} (#2802): TaskSmack-<version>-win64-build-inputs.json and
        # TaskSmack-<version>-windows-arm64-build-inputs.json ship beside the .zips, with Sigstore
        # bundles like every asset, so a rebuilder can check their toolchain against the release's
        # and the post-release dry-run comparison can tell a CRT change from a build change
        # (compare-build-inputs.ps1 beside the action).
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'windows-build-inputs-*'
          path: dist/
          merge-multiple: true

      - name: Verify the package set
        # Exactly the expected files, before anything is signed: x64 keeps the names earlier
        # releases used (win64 / Linux), so existing download links still work, and ARM64's are
        # windows-arm64 / linux-aarch64 (#2214); each Windows .zip has its build-inputs manifest
        # (#2802). A missing, extra or renamed file fails here. A new package (such as #2302's NSIS
        # installers) has to be added to this list.
        run: |
          version=$(grep -oP '^project\(TaskSmack VERSION \K\S+' CMakeLists.txt || true)
          if [[ -z "$version" ]]; then
            echo "Could not determine PROJECT_VERSION from CMakeLists.txt." >&2
            exit 1
          fi
          expected=$(printf 'TaskSmack-%s-%s\n' \
            "$version" Linux.deb "$version" Linux.tar.gz "$version" win64.zip \
            "$version" linux-aarch64.deb "$version" linux-aarch64.tar.gz "$version" windows-arm64.zip \
            "$version" win64-build-inputs.json "$version" windows-arm64-build-inputs.json |
            LC_ALL=C sort)
          actual=$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$expected" != "$actual" ]]; then
            echo "dist/ does not hold exactly the expected packages and manifests (< expected, > found):" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi
          echo "dist/ holds the $(wc -l <<< "$actual") expected packages and manifests:"
          echo "$actual"

      - name: Stage SBOM into dist
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: mv -- "${{ runner.temp }}/sbom.spdx.json" "dist/tasksmack-${VERSION_LABEL}-source-sbom.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with Sigstore (keyless OIDC)
        # Produces a .bundle file alongside each release artifact.
        # Verifiable with: cosign verify-blob --bundle <file>.bundle <file>
        run: |
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            echo "Signing: $f"
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload would-be release assets (dry run)
        # A dry run creates no release; keep exactly what would have been attached to it
        # (packages, source SBOM and their Sigstore bundles) for inspection instead.
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-dry-run
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # The real release is built as a draft, filled, checked and only then published, so a
      # failure part-way through never leaves a public release with missing assets. Every
      # step below is rerun-safe: a draft left by an earlier failed attempt is reused, and
      # its assets are overwritten (--clobber) rather than duplicated.
      - name: Create or reuse draft release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # `gh release view` finds drafts by tag too (the REST releases/tags endpoint doesn't).
          err=$(mktemp)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2> "$err"); then
            if [[ "$is_draft" != "true" ]]; then
              echo "A published release for '$TAG' already exists; refusing to replace its assets." >&2
              exit 1
            fi
            echo "Reusing the existing draft release for '$TAG'."
          elif grep -qi 'release not found' "$err"; then
            # A placeholder body, not --generate-notes: GitHub's generated notes for a big release
            # exceed its 125,000-character body limit (v0.9.0's did, HTTP 422; #2801), and the
            # maintainer's approved notes replace the body after publish anyway
            # (gh release edit --notes-file; CONTRIBUTING.md's "Cutting a Release").
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Release notes follow."
            echo "Created draft release for '$TAG'."
          else
            echo "Could not check for an existing release for '$TAG':" >&2
            cat "$err" >&2
            exit 1
          fi

      - name: Upload assets to the draft
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Verify draft assets match dist
        # Same names and sizes as dist/, nothing missing, nothing extra. A stale asset from
        # an earlier attempt whose file names differed would otherwise ship alongside the
        # real ones, so extras are deleted from the draft (it isn't public yet) and the
        # comparison is then repeated.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          expected=$(find dist -maxdepth 1 -type f -printf '%f %s\n' | LC_ALL=C sort)
          list_assets() {
            gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | LC_ALL=C sort
          }
          actual=$(list_assets)
          while read -r name _; do
            [[ -n "$name" ]] || continue
            if [[ ! -f "dist/$name" ]]; then
              echo "Deleting stale draft asset: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done <<< "$actual"
          actual=$(list_assets)
          if [[ "$expected" != "$actual" ]]; then
            echo "Draft release assets do not match dist/:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi
          echo "Draft has all $(wc -l <<< "$expected") assets from dist/ with matching sizes."

      - name: Publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
