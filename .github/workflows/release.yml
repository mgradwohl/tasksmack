name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        # A dispatched run is a rehearsal unless explicitly told otherwise: it builds, tests,
        # packages, validates, generates the SBOM and signs exactly as a tag run does, but
        # skips the tag checks in `validate` and creates/publishes nothing -- create-release
        # uploads the would-be release assets as a workflow artifact instead. Dispatch it from
        # main (or a PR branch) to rehearse the whole pipeline before pushing a tag. Turning it
        # off only makes sense when dispatching against an existing tag ref, to re-run a release.
        description: 'Dry run: build, package, validate and sign, but create no release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.7'
  # Exact apt.llvm.org package version currently served for clang-22 (noble).
  # apt.llvm.org does not retain old snapshots per major version -- it only
  # ever serves the latest build for a given major -- so this pin cannot
  # survive indefinitely. When apt rotates the snapshot forward, build-linux's
  # "Assert exact LLVM package version" step fails with the new version
  # string instead of silently building with it. Review the change, then
  # update this value (found via:
  #   curl -fsSL https://apt.llvm.org/noble/dists/llvm-toolchain-noble-22/main/binary-amd64/Packages.gz \
  #     | gunzip | grep -A2 '^Package: clang-22$'
  # ) so a Linux toolchain change is always a deliberate, reviewed PR rather
  # than a change in apt repository state between two runs of the same tag.
  LLVM_LINUX_EXACT_VERSION: '1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'

  # 'true' only for a dispatched run with dry_run left on; a tag push has no inputs, so it is
  # always a real release. Read as $DRY_RUN in scripts and env.DRY_RUN in `if:` conditions.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

permissions: {}

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    permissions:
      contents: read
    steps:
      - name: Report dry run
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice::Dry run from '$TAG_NAME' ($REF_TYPE): the tag, main-ancestry, existing-release and version-equals-tag checks are skipped, and create-release creates and publishes nothing."

      - name: Validate ref is an actual tag
        # github.ref_name is just the short name with no "refs/tags/"/"refs/heads/"
        # prefix, so a workflow_dispatch run manually triggered from a branch named
        # e.g. "v0.8.0" would pass the semver regex below identically to a real tag --
        # and if that branch happened to be on main, every later check would
        # also pass, letting build/sign/publish run without an actual tag ever having
        # been pushed. Reject anything that isn't really a tag ref before checking its name.
        if: env.DRY_RUN != 'true'
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Ref '$TAG_NAME' is a $REF_TYPE, not a tag. Releases must be triggered by an actual tag push (or a workflow_dispatch run against an existing tag ref with dry_run off). Aborting release." >&2
            exit 1
          fi

      - name: Validate tag is strict semver
        # Mirrors changelog.yml's tag validation: reject anything that is not
        # exactly vMAJOR.MINOR.PATCH (pre-releases, 4-part tags, branch names
        # from a stray workflow_dispatch) before any build/sign/publish work runs.
        # Each numeric identifier must be "0" or have no leading zero (real SemVer
        # rule) -- v01.2.3 is invalid, so a bare [0-9]+ per component is too loose.
        if: env.DRY_RUN != 'true'
        run: |
          if ! [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Ref '$TAG_NAME' is not strict semver (vMAJOR.MINOR.PATCH, no leading zeroes). Aborting release." >&2
            exit 1
          fi

      - name: Refuse to replace a published release
        # A re-pushed (deleted and recreated) tag must not silently swap the assets of a
        # release users may already have downloaded and verified. The releases/tags endpoint
        # returns only published releases, never drafts, so any hit here is a public release;
        # a draft left by a failed earlier run is fine, and create-release reuses it.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err=$(mktemp)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.html_url' 2> "$err"; then
            echo "A published release for '$TAG_NAME' already exists (above). Delete it, or bump the version, before re-running; refusing to replace its assets." >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$err"; then
            echo "Could not check for an existing release for '$TAG_NAME':" >&2
            cat "$err" >&2
            exit 1
          fi
          echo "No published release for '$TAG_NAME' yet."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required to resolve the tag SHA and check it
          # against origin/main below.
          fetch-depth: 0

      - name: Verify tag is on main
        # A release must publish something that is on main: the tag's commit must be
        # main's HEAD or an ancestor of it. Ancestry rather than equality, so a merge
        # landing on main between the tag push and this job can't abort the release.
        if: env.DRY_RUN != 'true'
        run: |
          TAG_SHA=$(git rev-list -n1 "$TAG_NAME")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            MAIN_SHA=$(git rev-parse origin/main)
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is not on main (not an ancestor of origin/main, currently ${MAIN_SHA}). Aborting release." >&2
            exit 1
          fi
          echo "Tag '$TAG_NAME' (${TAG_SHA}) is on main."

      - name: Verify tag matches project version
        # Catches a missed version bump before it ships assets whose embedded
        # metadata/filenames disagree with the GitHub Release tag. A dry run still
        # reads PROJECT_VERSION, so a malformed project() line fails the rehearsal
        # too, but has no tag to compare it with.
        run: |
          # \S+ (not a fixed X.Y.Z group count) so a 4-component or otherwise malformed
          # PROJECT_VERSION is compared in full rather than silently truncated to a false
          # match. "|| true" stops a non-matching grep (exit 1) from tripping this job's
          # `set -e` before the explicit empty-value check below can report a clear error.
          PROJECT_VERSION=$(grep -oP '^project\(TaskSmack VERSION \K\S+' CMakeLists.txt || true)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "Could not determine PROJECT_VERSION from CMakeLists.txt." >&2
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: PROJECT_VERSION is $PROJECT_VERSION (a real release needs tag v$PROJECT_VERSION)."
            exit 0
          fi
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' does not match CMakeLists.txt PROJECT_VERSION '$PROJECT_VERSION'. Aborting release." >&2
            exit 1
          fi
          echo "Tag version matches PROJECT_VERSION: $PROJECT_VERSION"

  build-linux:
    name: Build Linux Packages
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        # Reproducible-builds.org SOURCE_DATE_EPOCH, derived from the tagged
        # commit rather than wall-clock time. CMake's generated version.h and
        # CPack's archive entry timestamps both honor it (see CMakeLists.txt),
        # so two independent builds of the same tag produce identical output.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          expect-exact-version: ${{ env.LLVM_LINUX_EXACT_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action's pinned, SHA-256-verified ccache (4.13.6): Ubuntu's 4.9.1 lacks the
          # --evict-older-than that evict-old-files uses, and Windows images ship 4.9.1 via Perl.
          install: binary
          key: linux-release-package-llvm${{ env.LLVM_VERSION }}
          max-size: 500M
          # Main-only saving, as in every other workflow (#1406): a cache saved by a tag run can only
          # be restored by that same tag, so tag runs only restore.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Record toolchain versions
        # Documents the exact release environment for cross-run investigation.
        run: |
          echo "=== Release toolchain versions (Linux) ==="
          clang --version
          ld.lld --version
          cmake --version
          ninja --version
          python3 --version
          dpkg-query -W -f='clang-${{ env.LLVM_VERSION }} package: ${Version}\n' "clang-${{ env.LLVM_VERSION }}"

      - name: Configure
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -j "$(nproc)" --output-on-failure --timeout 60

      - name: Package
        run: |
          cd build/release
          cpack -G "TGZ;DEB"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: dist/*
          retention-days: 90

  verify-reproducibility:
    name: Verify Linux Build Reproducibility
    needs: [validate, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Advisory only: rebuilds the same tag from a clean workspace and compares
    # digests against build-linux's packages. Surfaces regressions in the
    # reproducible-build policy (see CONTRIBUTING.md's Release Reproducibility
    # section) without blocking publishing on it -- it is not part of
    # create-release's `needs`.
    continue-on-error: true
    permissions:
      contents: read
      actions: read  # Required to download the linux-packages artifact from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          expect-exact-version: ${{ env.LLVM_LINUX_EXACT_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Configure
        # No ccache here (unlike build-linux): a genuinely independent rebuild must not
        # be able to serve a translation unit's compiled output from a prior run instead
        # of actually re-invoking the compiler, or this check would compare a cached
        # object against itself instead of testing real build determinism.
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Package
        run: |
          cd build/release
          cpack -G "TGZ;DEB"

      - name: Download build-linux's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: original-dist/

      - name: Compare digests
        # dist/* also contains CPack's _CPack_Packages staging directory (confirmed locally:
        # CPack leaves it under CPACK_PACKAGE_DIRECTORY, i.e. dist/ itself), which the
        # existing "Upload artifacts" step uploads along with the real packages. sha256sum
        # on a directory errors and, under this job's `set -e` default, would abort before
        # ever comparing anything. Restrict both operations to regular files.
        run: |
          echo "=== build-linux (first build) ==="
          find original-dist -maxdepth 1 -type f -exec sha256sum {} +
          echo "=== verify-reproducibility (second, independent build) ==="
          find dist -maxdepth 1 -type f -exec sha256sum {} +
          FAILED=0
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f")
            orig="original-dist/${name}"
            if [[ ! -f "$orig" ]]; then
              echo "::warning::No matching original artifact for $name -- treating as a reproducibility failure, not skipping it."
              FAILED=1
              continue
            fi
            if ! cmp -s "$f" "$orig"; then
              echo "::warning::$name differs between the two independent builds of this tag -- see CONTRIBUTING.md's Release Reproducibility section."
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 0 ]]; then
            echo "All Linux packages are byte-for-byte identical across two independent builds of this tag."
          else
            echo "Reproducibility check found differences (advisory only; did not block the release)." >&2
            exit 1
          fi

  build-windows:
    name: Build Windows Packages
    needs: [validate]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        # Reproducible-builds.org SOURCE_DATE_EPOCH, derived from the tagged
        # commit rather than wall-clock time. CMake's generated version.h and
        # CPack's archive entry timestamps both honor it (see CMakeLists.txt),
        # so two independent builds of the same tag produce identical output.
        shell: pwsh
        run: |
          $epoch = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # Force the action's pinned, SHA-256-verified ccache binary; 'detect' would pick up
          # Strawberry Perl's bundled ccache 4.9.1 already on the image PATH (#1406).
          install: binary
          key: windows-release-package-llvm${{ env.LLVM_SEMVER_VERSION }}
          max-size: 500M
          # Main-only saving, as in every other workflow (#1406): a cache saved by a tag run can only
          # be restored by that same tag, so tag runs only restore.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Record toolchain versions
        # Documents the exact release environment for cross-run investigation.
        shell: pwsh
        run: |
          Write-Host "=== Release toolchain versions (Windows) ==="
          clang --version
          ld.lld --version
          cmake --version
          ninja --version
          python --version

      - name: Configure
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: |
          cmake --preset win-release -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"

      - name: Build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-release

      - name: Test
        shell: pwsh
        run: ctest --preset win-release -j $env:NUMBER_OF_PROCESSORS --output-on-failure --timeout 60

      - name: Package
        shell: pwsh
        run: |
          cd build/win-release
          cpack -G "ZIP"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-packages
          path: dist/*
          retention-days: 90

  verify-reproducibility-windows:
    name: Verify Windows Build Reproducibility
    needs: [validate, build-windows]
    runs-on: windows-2025
    timeout-minutes: 30
    # Advisory only -- see verify-reproducibility (Linux)'s comment; not part of
    # create-release's `needs`.
    continue-on-error: true
    permissions:
      contents: read
      actions: read  # Required to download the windows-packages artifact from this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deterministic build timestamp
        shell: pwsh
        run: |
          $epoch = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Configure
        # No ccache here (unlike build-windows) -- see verify-reproducibility (Linux)'s
        # comment: a genuinely independent rebuild must not be able to serve a cached
        # object instead of actually re-invoking the compiler.
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --preset win-release -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" -DTASKSMACK_ENABLE_CCACHE=OFF

      - name: Build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-release

      - name: Package
        shell: pwsh
        run: |
          cd build/win-release
          cpack -G "ZIP"

      - name: Download build-windows's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages
          path: original-dist/

      - name: Compare digests
        # dist/* also contains CPack's _CPack_Packages staging directory (confirmed
        # locally on Linux; CPack leaves it under CPACK_PACKAGE_DIRECTORY, i.e. dist/
        # itself), which the existing "Upload artifacts" step uploads along with the real
        # packages. Get-FileHash errors on a directory, so -File restricts Get-ChildItem
        # to regular files up front.
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem dist/* -File | ForEach-Object {
            $orig = Join-Path "original-dist" $_.Name
            if (-not (Test-Path -LiteralPath $orig -PathType Leaf)) {
              Write-Host "::warning::No matching original artifact for $($_.Name) -- treating as a reproducibility failure, not skipping it."
              $failed = $true
              return
            }
            $rebuiltHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            $originalHash = (Get-FileHash -LiteralPath $orig -Algorithm SHA256).Hash
            Write-Host "$($_.Name): rebuilt=$rebuiltHash original=$originalHash"
            if ($rebuiltHash -ne $originalHash) {
              Write-Host "::warning::$($_.Name) differs between the two independent builds of this tag -- see CONTRIBUTING.md's Release Reproducibility section."
              $failed = $true
            }
          }
          if ($failed) {
            Write-Host "Reproducibility check found differences (advisory only; did not block the release)."
            exit 1
          } else {
            Write-Host "All Windows packages are byte-for-byte identical across two independent builds of this tag."
          }

  validate-linux-package:
    name: Validate Linux Release Artifacts
    needs: [build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A bare, no-dev-tools container so installing the .deb exercises exactly
    # the runtime Depends declared in cmake/Packaging.cmake, rather than
    # reusing the build-linux runner where libc++/mesa dev packages already
    # happen to be present.
    container:
      image: ubuntu:24.04
    # Container jobs default `run` steps to `sh` (dash on Ubuntu), not bash, even though
    # every other job in this workflow gets bash by default on the bare VM runner. The
    # steps below use bash-only [[ ... ]] conditions, which dash doesn't support.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read  # Required to download the linux-packages artifact from this run
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: dist/

      - name: Verify .deb contains only the app's files
        # cmake/InstallRules.cmake's rules are shared with every bundled dependency's own
        # install() calls, so a dependency that installs its static libraries, headers or CMake
        # package files (or a TaskSmack rule with a bare "." destination) silently ships them
        # to users under /usr. Allow exactly the executable and the app's data, desktop entry,
        # icons, docs, AppStream metadata and man pages; fail on anything else.
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one .deb in dist/, found ${#debs[@]}." >&2
            exit 1
          fi
          dpkg -c "${debs[0]}"
          allowed='^(|usr/|usr/share/|usr/bin/[^/]*|usr/share/(tasksmack|applications|icons|doc|metainfo|pixmaps|man)(/.*)?)$'
          unexpected=$(dpkg-deb --fsys-tarfile "${debs[0]}" | tar -tf - | sed -e 's|^\./||' | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            echo "The .deb ships files outside usr/bin and usr/share/{tasksmack,applications,icons,doc,metainfo,pixmaps,man}:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "The .deb contains only the expected locations."

      - name: Install .deb in a clean environment
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb

      - name: Verify installed .deb layout
        # cmake/InstallRules.cmake installs the Linux executable to bin/, so
        # the .deb places it at the conventional /usr/bin/TaskSmack (on PATH).
        run: |
          BIN=$(dpkg -L tasksmack | grep -E '/bin/TaskSmack$')
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "TaskSmack binary missing or not executable after .deb install" >&2
            exit 1
          fi
          echo "Installed binary: $BIN"

      - name: Install mesa software rendering
        # llvmpipe (via SDL's "offscreen" video driver, below) needs no X server at all --
        # simpler and stronger than an Xvfb-backed smoke check, and this is the same
        # mesa/GL stack Xvfb would have needed anyway. libgl1-mesa-dri alone is not enough:
        # it provides the DRI/Gallium driver modules but not the EGL loader (libEGL.so.1,
        # from libegl1) or Mesa's EGL vendor implementation (libegl-mesa0) that SDL3's
        # offscreen backend needs to create a GL context at all -- confirmed these are
        # separate packages (apt-cache depends libgl1-mesa-dri lists neither), and this
        # dev environment's own working offscreen test only succeeded because a full
        # dev-toolchain install had already pulled both packages in for unrelated reasons.
        run: apt-get install -y libgl1-mesa-dri libegl1 libegl-mesa0

      - name: Define asset-resolution smoke check
        # A bounded "is it still running" check alone doesn't prove assets loaded --
        # src/UI/AssetPath.cpp and Theme.cpp both fall back gracefully on missing
        # fonts/themes, so a broken installed/extracted asset layout would still pass a
        # plain liveness check. Assert the actual log lines that only appear once the
        # icon font and at least one theme have loaded from the real assets directory.
        run: |
          cat > /tmp/smoke-check.sh <<'SMOKE_CHECK'
          #!/usr/bin/env bash
          set -uo pipefail
          label="$1"
          bin="$2"
          log="$3"
          SDL_VIDEODRIVER=offscreen TASKSMACK_LOG_LEVEL=debug timeout 5 "$bin" > "$log" 2>&1
          status=$?
          cat "$log"
          if [[ "$status" -ne 124 ]]; then
            echo "$label: TaskSmack exited on its own (status=$status) instead of running until the timeout killed it; treating as a crash." >&2
            exit 1
          fi
          if ! grep -q "Assets directory found:" "$log"; then
            echo "$label: assets directory was not found (see the 'Assets directory not found' fallback warning above, if present); installed/extracted asset layout is broken." >&2
            exit 1
          fi
          if grep -q "Icon font not found" "$log"; then
            echo "$label: icon font failed to load even though an assets directory was found." >&2
            exit 1
          fi
          if ! grep -q "Loaded theme:" "$log"; then
            echo "$label: no themes loaded; theme directory is missing or empty." >&2
            exit 1
          fi
          echo "$label: assets (icon font + themes) resolved correctly; TaskSmack ran until the timeout as expected."
          SMOKE_CHECK
          chmod +x /tmp/smoke-check.sh

      - name: Smoke-check installed .deb binary
        run: |
          BIN=$(dpkg -L tasksmack | grep -E '/bin/TaskSmack$')
          /tmp/smoke-check.sh "deb" "$BIN" /tmp/deb-run.log

      - name: Extract and verify .tar.gz layout
        run: |
          mkdir -p /tmp/tgz-extract
          tar -xzf dist/*.tar.gz -C /tmp/tgz-extract
          BIN=$(find /tmp/tgz-extract -mindepth 3 -maxdepth 3 -type f -path '*/bin/TaskSmack')
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "TaskSmack binary missing or not executable in .tar.gz" >&2
            exit 1
          fi
          echo "tar.gz binary found: $BIN"
          echo "TGZ_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Smoke-check extracted .tar.gz binary
        run: /tmp/smoke-check.sh "tar.gz" "$TGZ_BIN" /tmp/tgz-run.log

  validate-windows-package:
    name: Validate Windows Release Artifacts
    needs: [build-windows]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # Required to download the windows-packages artifact from this run
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages
          path: dist/

      - name: Extract and verify .zip layout
        # The documented layout (README/User Guide: "Extract and run TaskSmack.exe") is flat:
        # CPack produces one top-level directory, with TaskSmack.exe directly inside it. A
        # recursive search would also accept TaskSmack.exe nested at any depth, silently
        # passing even if it moved somewhere users can no longer find per the documented steps.
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath extracted
          $topLevelDirs = Get-ChildItem -Path extracted -Directory
          if ($topLevelDirs.Count -ne 1) {
            Write-Error "Expected exactly one top-level directory in the extracted .zip, found $($topLevelDirs.Count)"
            exit 1
          }
          $exe = Join-Path $topLevelDirs[0].FullName "TaskSmack.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "TaskSmack.exe not found directly under the .zip's top-level directory ($($topLevelDirs[0].FullName)); documented layout requires it at the package root, not nested."
            exit 1
          }
          Write-Host "Found executable: $exe"
          "TASKSMACK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TASKSMACK_PKG_ROOT=$($topLevelDirs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify .zip contains no development files
        # Same reason as validate-linux-package's content check: a bundled dependency's own
        # install() rules (or a TaskSmack rule's ARCHIVE destination) can ship import/static
        # libraries, headers and CMake package files that users have no use for. Checked on the
        # archive's entry names, so it doesn't depend on how Expand-Archive lays them out.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipFile = Get-ChildItem dist/*.zip | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFile.FullName)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally {
            $zip.Dispose()
          }
          $entries | ForEach-Object { Write-Host $_ }
          $unexpected = @($entries | Where-Object {
            $_ -match '\.(lib|a)$' -or $_ -match '(^|/)include/' -or $_ -match '(^|/)lib/cmake/'
          })
          if ($unexpected.Count -gt 0) {
            Write-Host "The .zip ships development files (*.lib, *.a, include/ or lib/cmake/):"
            $unexpected | ForEach-Object { Write-Host "  $_" }
            Write-Error "Unexpected development files in $($zipFile.Name)."
            exit 1
          }
          Write-Host "The .zip contains no import/static libraries, headers or CMake package files ($($entries.Count) entries)."

      - name: Verify packaged asset layout
        # The smoke check below proves startup and rendering, not assets: src/UI/AssetPath.cpp and
        # Theme.cpp both fall back gracefully on missing assets, so a broken packaged asset
        # layout would still pass it (see the equivalent Linux assertions in
        # validate-linux-package). Windows keeps the flat "." install destination
        # (TaskSmack.exe and share/ as siblings), so assert directly on the exact
        # exeDir/share/tasksmack/assets path AssetPath.cpp resolves at runtime.
        shell: pwsh
        run: |
          $iconFont = Join-Path $env:TASKSMACK_PKG_ROOT "share\tasksmack\assets\fonts\fa-solid-900.ttf"
          if (-not (Test-Path -LiteralPath $iconFont -PathType Leaf)) {
            Write-Error "Icon font not found at $iconFont (exeDir/share/tasksmack/assets); packaged asset layout is broken."
            exit 1
          }
          $themesDir = Join-Path $env:TASKSMACK_PKG_ROOT "share\tasksmack\assets\themes"
          $themeCount = (Get-ChildItem -Path $themesDir -Filter "*.toml" -ErrorAction SilentlyContinue).Count
          if ($themeCount -lt 1) {
            Write-Error "No theme .toml files found under $themesDir; packaged asset layout is broken."
            exit 1
          }
          Write-Host "Packaged assets verified: icon font present, $themeCount theme(s) found under $themesDir"

      - name: Fetch Mesa llvmpipe (smoke check only)
        # The runner has no GPU, so its only OpenGL is GDI Generic 1.1 and TaskSmack (OpenGL 3.3)
        # stops at startup with its "OpenGL 3.3 required" box (#1398). That box keeps the process
        # alive, so a liveness check alone passes without anything having rendered. Mesa's llvmpipe
        # is a software OpenGL 4.6 driver: placed beside the exe in a temporary copy of the package
        # (never in dist/ or the published zip), it lets the real startup path run to the first frame.
        # Pinned: mesa-dist-win 26.2.4, release-msvc build, from the project's GitHub release, with
        # the archive's SHA-256 checked before anything in it is used. To update, take the new
        # release's mesa3d-<ver>-release-msvc.7z asset and its digest (gh release view -R
        # pal1000/mesa-dist-win <ver> --json assets).
        shell: pwsh
        env:
          MESA_VERSION: "26.2.4"
          MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $ErrorActionPreference = 'Stop'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa'
          $archive = Join-Path $mesaRoot "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          $dllDir = Join-Path $mesaRoot 'x64'
          New-Item -ItemType Directory -Force -Path $mesaRoot | Out-Null
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MESA_SHA256) {
            Write-Error "Mesa archive SHA-256 mismatch: expected $env:MESA_SHA256, got $actual"
            exit 1
          }
          # Windows' own bsdtar reads .7z; an unqualified 'tar' can resolve to Git's GNU tar, which can't.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $mesaRoot x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { Write-Error "Extracting Mesa's OpenGL DLLs failed (tar exit $LASTEXITCODE)"; exit 1 }
          Get-ChildItem -LiteralPath $dllDir | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
          "MESA_DLL_DIR=$dllDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-check extracted executable
        # Runs a temporary copy of the extracted package with llvmpipe beside the exe, a fresh
        # TASKSMACK_CONFIG_DIR and an info-level log captured from stdout (spdlog's Windows stdout
        # sink writes unbuffered with WriteFile, so nothing is lost when the process is killed).
        # Fails on an early exit, on any [critical] or [error] log line, or unless the log shows
        # OpenGL 3.3+ from llvmpipe -- proof the real renderer came up, not an error box.
        shell: pwsh
        timeout-minutes: 5
        env:
          GALLIUM_DRIVER: llvmpipe
          TASKSMACK_LOG_LEVEL: info
          STARTUP_TIMEOUT_SECONDS: "60"
          ALIVE_SECONDS: "5"
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'tasksmack-smoke'
          $pkg = Join-Path $work 'pkg'
          $configDir = Join-Path $work 'config'
          $tempDir = Join-Path $work 'temp'
          foreach ($dir in @($pkg, $configDir, $tempDir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          Copy-Item -Path (Join-Path $env:TASKSMACK_PKG_ROOT '*') -Destination $pkg -Recurse
          Copy-Item -Path (Join-Path $env:MESA_DLL_DIR '*.dll') -Destination $pkg
          $exe = Join-Path $pkg 'TaskSmack.exe'
          $stdoutLog = Join-Path $work 'stdout.log'
          $stderrLog = Join-Path $work 'stderr.log'

          # Fresh, empty settings and lock directory, and a private %TEMP% for tasksmack-debug.log.
          $env:TASKSMACK_CONFIG_DIR = $configDir
          $env:TMP = $tempDir
          $env:TEMP = $tempDir

          $proc = Start-Process -FilePath $exe -WorkingDirectory $pkg -PassThru `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $failure = $null
          try {
            # Wait for the "  Version: ..." line Window.cpp logs once the GL context is up (it follows
            # the Renderer line), then require the process to keep running for ALIVE_SECONDS more.
            $deadline = (Get-Date).AddSeconds([int]$env:STARTUP_TIMEOUT_SECONDS)
            while ((Get-Date) -lt $deadline -and -not $proc.HasExited) {
              $log = Get-Content -LiteralPath $stdoutLog -Raw -ErrorAction SilentlyContinue
              if ($log -match '\]\s+Version:') { break }
              Start-Sleep -Milliseconds 500
            }
            if ($proc.HasExited) {
              $failure = "TaskSmack.exe exited during startup (exit code $($proc.ExitCode))"
            } else {
              Start-Sleep -Seconds ([int]$env:ALIVE_SECONDS)
              if ($proc.HasExited) {
                $failure = "TaskSmack.exe exited within $env:ALIVE_SECONDS s of creating its OpenGL context (exit code $($proc.ExitCode))"
              }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              $proc.WaitForExit(10000) | Out-Null
            }
          }

          $lines = @(Get-Content -LiteralPath $stdoutLog -ErrorAction SilentlyContinue) +
            @(Get-Content -LiteralPath $stderrLog -ErrorAction SilentlyContinue)
          Write-Host "=== TaskSmack startup log ==="
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "=== end of log ==="

          $errorLines = @($lines | Where-Object { $_ -match '\[(critical|error)\]' })
          $rendererLine = $lines | Where-Object { $_ -match '\]\s+Renderer:\s*(.+)$' } | Select-Object -First 1
          $renderer = if ($rendererLine -match '\]\s+Renderer:\s*(.+)$') { $Matches[1].Trim() } else { '' }
          $versionLine = $lines | Where-Object { $_ -match '\]\s+Version:\s*(.+)$' } | Select-Object -First 1
          $version = if ($versionLine -match '\]\s+Version:\s*(.+)$') { $Matches[1].Trim() } else { '' }

          if (-not $failure -and $errorLines.Count -gt 0) {
            $failure = "The startup log has $($errorLines.Count) [critical]/[error] line(s):`n$($errorLines -join "`n")"
          }
          if (-not $failure -and -not ($lines -match '\]\s+Entering main loop')) {
            $failure = "The log never reached 'Entering main loop' (Application::run): startup never finished"
          }
          if (-not $failure -and $renderer -notmatch 'llvmpipe') {
            $failure = "Expected the llvmpipe renderer in the log, found '$renderer'"
          }
          if (-not $failure) {
            if ($version -match '^(\d+)\.(\d+)') {
              $glVersion = [version]::new([int]$Matches[1], [int]$Matches[2])
              if ($glVersion -lt [version]'3.3') { $failure = "OpenGL $glVersion is below the required 3.3 ('$version')" }
            } else {
              $failure = "No parseable OpenGL version in the log (found '$version')"
            }
          }

          $summary = @(
            '### Windows package smoke check',
            '',
            "- Result: $(if ($failure) { 'FAILED' } else { 'passed' })",
            "- OpenGL renderer: ``$renderer``",
            "- OpenGL version: ``$version``",
            "- Software driver: Mesa llvmpipe from mesa-dist-win (temporary copy only, not in the package)"
          )
          if ($failure) { $summary += "- Failure: $failure" }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($failure) {
            Write-Error $failure
            exit 1
          }
          Write-Host "Smoke check passed: TaskSmack.exe started on '$renderer' (OpenGL $version) with no errors and ran for $env:ALIVE_SECONDS s."

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, validate-linux-package, validate-windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write  # Required for keyless OIDC signing with sigstore/cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive safe version label
        id: version
        run: |
          label="${GITHUB_REF_NAME}"
          label=$(printf '%s' "$label" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Generate source SBOM
        # Generated from the source tree, not from the built Linux/Windows
        # package contents -- it inventories what went into the build, not
        # what's inside the shipped archives. Named and documented as such
        # (see CONTRIBUTING.md's Release Artifacts section) so it isn't
        # mistaken for a package-level inventory.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          output-file: ${{ runner.temp }}/sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: dist/

      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-packages
          path: dist/

      - name: Drop CPack staging directories
        # The package artifacts also carry CPack's _CPack_Packages staging directory (see
        # verify-reproducibility's comment). Only the regular files at the top of dist/ are
        # release assets, so remove everything else: signing, the upload and the asset-count
        # check below then all see exactly the same set.
        run: find dist -mindepth 1 -maxdepth 1 ! -type f -exec rm -rf -- {} +

      - name: Stage SBOM into dist
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: mv -- "${{ runner.temp }}/sbom.spdx.json" "dist/tasksmack-${VERSION_LABEL}-source-sbom.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with Sigstore (keyless OIDC)
        # Produces a .bundle file alongside each release artifact.
        # Verifiable with: cosign verify-blob --bundle <file>.bundle <file>
        run: |
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            echo "Signing: $f"
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload would-be release assets (dry run)
        # A dry run creates no release; keep exactly what would have been attached to it
        # (packages, source SBOM and their Sigstore bundles) for inspection instead.
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-dry-run
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # The real release is built as a draft, filled, checked and only then published, so a
      # failure part-way through never leaves a public release with missing assets. Every
      # step below is rerun-safe: a draft left by an earlier failed attempt is reused, and
      # its assets are overwritten (--clobber) rather than duplicated.
      - name: Create or reuse draft release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # `gh release view` finds drafts by tag too (the REST releases/tags endpoint doesn't).
          err=$(mktemp)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2> "$err"); then
            if [[ "$is_draft" != "true" ]]; then
              echo "A published release for '$TAG' already exists; refusing to replace its assets." >&2
              exit 1
            fi
            echo "Reusing the existing draft release for '$TAG'."
          elif grep -qi 'release not found' "$err"; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
            echo "Created draft release for '$TAG'."
          else
            echo "Could not check for an existing release for '$TAG':" >&2
            cat "$err" >&2
            exit 1
          fi

      - name: Upload assets to the draft
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Verify draft assets match dist
        # Same names and sizes as dist/, nothing missing, nothing extra. A stale asset from
        # an earlier attempt whose file names differed would otherwise ship alongside the
        # real ones, so extras are deleted from the draft (it isn't public yet) and the
        # comparison is then repeated.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          expected=$(find dist -maxdepth 1 -type f -printf '%f %s\n' | LC_ALL=C sort)
          list_assets() {
            gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | LC_ALL=C sort
          }
          actual=$(list_assets)
          while read -r name _; do
            [[ -n "$name" ]] || continue
            if [[ ! -f "dist/$name" ]]; then
              echo "Deleting stale draft asset: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done <<< "$actual"
          actual=$(list_assets)
          if [[ "$expected" != "$actual" ]]; then
            echo "Draft release assets do not match dist/:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi
          echo "Draft has all $(wc -l <<< "$expected") assets from dist/ with matching sizes."

      - name: Publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
