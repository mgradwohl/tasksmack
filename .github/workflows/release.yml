name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.7'

permissions: {}

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-release-package-llvm${{ env.LLVM_VERSION }}
          max-size: 500M

      - name: Configure
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -j $(nproc) --output-on-failure --timeout 60

      - name: Package
        run: |
          cd build/release
          cpack -G "TGZ;DEB"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: dist/*
          retention-days: 90

  build-windows:
    name: Build Windows Packages
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: windows-release-package-llvm${{ env.LLVM_SEMVER_VERSION }}
          max-size: 500M

      - name: Configure
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: |
          cmake --preset win-release -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"

      - name: Build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-release

      - name: Test
        shell: pwsh
        run: ctest --preset win-release -j $env:NUMBER_OF_PROCESSORS --output-on-failure --timeout 60

      - name: Package
        shell: pwsh
        run: |
          cd build/win-release
          cpack -G "ZIP"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packages
          path: dist/*
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write  # Required for keyless OIDC signing with sigstore/cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive safe version label
        id: version
        run: |
          label="${GITHUB_REF_NAME}"
          label=$(printf '%s' "$label" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: ${{ runner.temp }}/sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-packages
          path: dist/

      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-packages
          path: dist/

      - name: Stage SBOM into dist
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: mv -- "${{ runner.temp }}/sbom.spdx.json" "dist/tasksmack-${VERSION_LABEL}-sbom.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with Sigstore (keyless OIDC)
        # Produces a .bundle file alongside each release artifact.
        # Verifiable with: cosign verify-blob --bundle <file>.bundle <file>
        run: |
          for f in dist/*; do
            [[ -f "$f" ]] || continue
            echo "Signing: $f"
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
