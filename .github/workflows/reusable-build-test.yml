name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner label
        required: true
        type: string
      build_type:
        description: Build preset type (`debug` or `release`, without platform prefix)
        required: true
        type: string
      llvm-version:
        description: Linux LLVM major version
        required: false
        type: string
        default: '22'
      llvm-semver-version:
        description: Windows LLVM semantic version
        required: false
        type: string
        default: '22.1.8'
      build_benchmarks:
        description: >-
          Linux only: after the tests, reconfigure with TASKSMACK_BUILD_BENCHMARKS=ON and build
          the TaskSmackBenchmarks target (compile/link only, no timing run)
        required: false
        type: boolean
        default: false
      build:
        description: >-
          Build and test. Off for ci.yml's nightly Windows debug job, which only runs clang-tidy
          (the nightly builds Windows release instead)
        required: false
        type: boolean
        default: true
      clang_tidy:
        description: >-
          Debug only: also run clang-tidy (tools/clang-tidy.sh on Linux, tools/clang-tidy.ps1 on
          Windows) on the configured tree, after the tests, and report its result in the
          tidy-outcome output. A failure doesn't fail this job; ci.yml's "CI Success" (Linux, #2047)
          and "Static Analysis (Windows)" (#1875) jobs report it
        required: false
        type: boolean
        default: false
    outputs:
      tidy-mode:
        description: "clang-tidy's file selection: all, list, none (nothing to analyze), or empty (not run)"
        value: ${{ jobs.build-test.outputs.tidy-mode }}
      tidy-outcome:
        description: "The clang-tidy step's outcome: success, failure, skipped, or empty (never reached)"
        value: ${{ jobs.build-test.outputs.tidy-outcome }}

# Deny all permissions by default; each job must explicitly declare what it needs.
permissions: {}

jobs:
  build-test:
    name: Build & Test (${{ inputs.os }} ${{ inputs.build_type }})
    runs-on: ${{ inputs.os }}
    # clang-tidy runs after the tests in the same job; a full-tree run (a CMake, tidy-config or
    # workflow change) adds up to ~15 min on a cold result cache. The ARM64 runners (arm64.yml,
    # #2214) get 60: their builds start from a cold ccache until main has saved one.
    timeout-minutes: ${{ inputs.clang_tidy && 55 || (endsWith(inputs.os, '-arm') && 60 || 35) }}
    permissions:
      contents: read
      checks: write
    outputs:
      tidy-mode: ${{ steps.select.outputs.mode }}
      # One clang-tidy step per OS; the other OS's step always reports 'skipped'.
      tidy-outcome: ${{ runner.os == 'Windows' && steps.tidy.outcome || steps.tidy-linux.outcome }}
    env:
      # See the Configure steps: PCH stays on only for the weekly unity build.
      PCH: ${{ inputs.build_type == 'unity' && 'ON' || 'OFF' }}
      # Windows debug only, build speed only (#1875); the presets, and so local builds, are
      # unchanged. static-analysis.yml's Windows configure passes the same options, so both
      # clang-tidy runs see the same compile commands.
      #  - IPO off: the presets turn ThinLTO on for every configuration, so each debug link ran
      #    LTO code generation over every object it links, again for each test executable, and
      #    ccache only ever cached the bitcode. Release builds (Linux on every PR, Windows nightly)
      #    still build with LTO.
      #  - ghash: -gcodeview-ghash objects plus lld-link /DEBUG:GHASH, a faster PDB type merge.
      #  - No C++20 module scanning: nothing here uses modules, and CMake otherwise runs
      #    clang-scan-deps on every C++ file of every build, cache hit or not.
      WIN_DEBUG_CI_ARGS: >-
        ${{ startsWith(inputs.os, 'windows') && inputs.build_type == 'debug' &&
        '-DTASKSMACK_ENABLE_IPO=OFF -DTASKSMACK_ENABLE_GHASH=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # clang-tidy's changed-file selection diffs the PR merge commit against its first parent.
          fetch-depth: ${{ inputs.clang_tidy && 2 || 1 }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      # On a PR, check only the translation units the change can affect (#1406): changed src/ .cpp
      # files plus every .cpp that includes a changed src/ header, or everything when the tidy
      # config, tidy scripts, CMake files or a workflow changed (tools/tidy-changed-files.py).
      # The nightly schedule and manual runs analyze every file.
      - name: Select files for clang-tidy
        id: select
        if: inputs.clang_tidy
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != 'pull_request' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python -I -X utf8 tools/tidy-changed-files.py --base HEAD^1 --head HEAD --platform ${{ runner.os == 'Windows' && 'windows' || 'linux' }} > tidy-files.txt
          # Strip CR in case a Windows Python wrote CRLF (the selector writes LF, belt and braces).
          sed -i 's/\r$//' tidy-files.txt
          if [[ "$(head -n1 tidy-files.txt)" == 'ALL' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [[ ! -s tidy-files.txt ]]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No translation unit affected by this change; clang-tidy skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=list" >> "$GITHUB_OUTPUT"
            { echo "clang-tidy on $(wc -l < tidy-files.txt) changed/affected file(s):"; echo '```'; cat tidy-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup LLVM
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ inputs.llvm-version }}
          install-clang-tidy: ${{ inputs.clang_tidy && 'true' || 'false' }}
          generate-test-locales: ${{ inputs.build && 'true' || 'false' }}

      - name: Setup Windows LLVM
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ inputs.llvm-semver-version }}

      # Skipped when nothing is built (the nightly clang-tidy-only run): with evict-old-files a
      # build-less main run would save an empty cache.
      - name: Setup ccache
        if: inputs.build
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action's pinned, SHA-256-verified ccache (4.13.6) on both OSes: Ubuntu's apt ccache
          # 4.9.1 lacks the --evict-older-than that evict-old-files uses (4.11+), and 'detect' on
          # Windows would pick up Strawberry Perl's bundled 4.9.1 from the image PATH (#1406).
          install: binary
          # Include the LLVM version so caches from different toolchains don't mix, and the
          # architecture on a non-x64 runner (#2214; x64 keeps its existing key).
          key: ${{ runner.os }}-${{ runner.arch != 'X64' && format('{0}-', runner.arch) || '' }}${{ inputs.build_type }}-llvm${{ runner.os == 'Windows' && inputs.llvm-semver-version || inputs.llvm-version }}
          # Windows debug outgrew 500M: full on every run, with 70-120 cleanups and ~60% hits on
          # main. Its working set without ThinLTO is ~0.35 GB compressed (a cold build on top of
          # the restored cache), so 750M also holds the stale entries a flag change leaves behind
          # until main's evict-old-files drops them (#1875).
          max-size: ${{ runner.os == 'Windows' && inputs.build_type == 'debug' && '750M' || '500M' }}
          # Pull requests restore main's cache but never save their own: a PR-ref entry is
          # readable only by that PR and pushed main's entries out of the 10 GB quota (#1406).
          # Main runs drop entries this build didn't touch, so the saved cache tracks the tree.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job
          # The post step prints `ccache -s -vv`: hits, misses and why calls were uncacheable.
          verbose: 2

      # inode_cache: remember each source and header's hash by file ID and timestamps, so a hit
      # doesn't re-hash every include. ccache leaves it off by default on Windows (#1875).
      - name: Configure ccache (Windows)
        if: inputs.build && runner.os == 'Windows'
        shell: bash
        run: |
          ccache --set-config=inode_cache=true
          ccache -p | grep -E 'inode_cache|max_size|sloppiness|compiler_check'

      - name: Restore FetchContent dependencies
        id: fetchcontent
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: restore

      # CI configures with precompiled headers OFF (#1406): ccache can't cache a TU that uses a PCH
      # without extra sloppiness settings, so with PCH on ~89% of compiles here were uncacheable and
      # every build was effectively cold. The presets keep PCH on for local builds, and the weekly
      # unity build and release.yml still build with PCH on. PCH off is also the stricter build:
      # a missing #include that the PCH would have supplied fails here.
      # Without a build (the nightly clang-tidy-only run) there is no ccache to use. The launcher
      # isn't part of compile_commands.json, so clang-tidy sees the same commands either way.
      - name: Configure (Linux)
        id: configure-linux
        if: runner.os == 'Linux'
        run: cmake --preset ${{ inputs.build_type }} -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_PCH=${{ env.PCH }} -DTASKSMACK_ENABLE_CCACHE=${{ inputs.build && 'ON' || 'OFF' }}

      # Windows only: SDL3's ~180 configure checks cost 110-130 s there (~20 s on Linux). Preload
      # the results of an earlier configure with the same toolchain, image and CMake inputs (#1406).
      - name: Restore configure-check results (Windows)
        id: cmake-checks
        if: runner.os == 'Windows'
        uses: ./.github/actions/cmake-check-cache
        with:
          mode: restore
          preset: win-${{ inputs.build_type }}
          # Check results differ by target architecture (#2214); x64 keeps its existing key.
          toolchain: llvm-${{ inputs.llvm-semver-version }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}

      # Without a build (the nightly clang-tidy-only run) there is no ccache; keep CMake from
      # finding the stale one Strawberry Perl puts on the image PATH. The launcher isn't part of
      # compile_commands.json, so clang-tidy sees the same commands either way.
      - name: Configure (Windows)
        id: configure-windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --preset win-${{ inputs.build_type }} -DPython3_EXECUTABLE="$env:pythonLocation\python.exe" -DTASKSMACK_ENABLE_PCH=${{ env.PCH }} -DTASKSMACK_ENABLE_CCACHE=${{ inputs.build && 'ON' || 'OFF' }} ${{ env.WIN_DEBUG_CI_ARGS }} ${{ steps.cmake-checks.outputs.cmake-args }}

      # Each Windows build job saves its own preset's results (the debug job's configure also
      # serves its clang-tidy run), so two jobs never race for one key.
      - name: Save configure-check results (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/cmake-check-cache
        with:
          mode: save
          preset: win-${{ inputs.build_type }}
          toolchain: llvm-${{ inputs.llvm-semver-version }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}
          build-dir: build/win-${{ inputs.build_type }}
          cache-hit: ${{ steps.cmake-checks.outputs.cache-hit }}

      # One saver per OS so parallel jobs don't race to reserve the same key. Windows saves from
      # the debug build here; Linux saves from the benchmark-enabled build further down, so the
      # saved sources include Google Benchmark too. The sources don't depend on the architecture,
      # so the ARM64 jobs (arm64.yml, #2214) restore the same entry and leave saving to x64.
      - name: Save FetchContent dependencies (Windows)
        if: runner.os == 'Windows' && inputs.build_type == 'debug' && runner.arch == 'X64'
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: save
          cache-hit: ${{ steps.fetchcontent.outputs.cache-hit }}

      - name: Build (Linux)
        if: runner.os == 'Linux' && inputs.build
        run: cmake --build --preset ${{ inputs.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows' && inputs.build
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-${{ inputs.build_type }}

      # The runner has a desktop but no GPU: its only OpenGL is GDI Generic 1.1, below the 3.3 core
      # the window, title bar, HWND and GL icon suites need, so they skipped and Windows-only window
      # code never ran in CI (#2134). Mesa's llvmpipe beside the test executables (in the build
      # tree; the test binaries load it before System32's opengl32.dll) is a software GL 4.6.
      - name: Software OpenGL for the display tests (Windows)
        if: runner.os == 'Windows' && inputs.build
        uses: ./.github/actions/setup-mesa-llvmpipe
        with:
          copy-to: build/win-${{ inputs.build_type }}/tests

      # Where the build's time went (scans, compiles, links, the slowest links), from .ninja_log,
      # so a flag change can be measured from the job summary (#1875).
      - name: Build profile
        if: always() && inputs.build
        shell: bash
        env:
          BUILD_DIR: build/${{ runner.os == 'Windows' && 'win-' || '' }}${{ inputs.build_type }}
        run: python -I -X utf8 tools/ninja-build-profile.py "$BUILD_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install virtual display (Linux)
        # Xvfb plus Mesa's software GL (llvmpipe) gives the Application/Window/IconLoader GL
        # suites a real X11 display with a GL 3.3 core context, the same setup heavy-checks.yml's
        # coverage job already runs the suite under (#1132). The Mesa packages are listed
        # explicitly rather than relied on as transitive runner-image dependencies.
        if: runner.os == 'Linux' && inputs.build
        run: sudo timeout --kill-after=10s 300s apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0

      - name: Test (Linux)
        if: runner.os == 'Linux' && inputs.build
        env:
          # A display is guaranteed here, so the display-dependent suites must fail rather than
          # skip if it goes missing or construction throws (tests/Core/HeadlessVideoDriverTestUtils.h).
          TASKSMACK_REQUIRE_DISPLAY: '1'
          # libsystemd-dev and dbus-daemon are installed (setup-llvm), so the D-Bus fake suites must
          # run: SystemdBusFakeEnvironmentTest fails if they would skip or compiled out (#2133).
          TASKSMACK_REQUIRE_SDBUS: '1'
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -noreset" ctest --preset ${{ inputs.build_type }} -j "$(nproc)" --schedule-random --output-on-failure --timeout 60 --output-junit test-results.xml

      # tasksmack-helper's privilege drop and seccomp filter, as root (#3058). TasksmackHelperRootTest skips
      # unless it runs as root, and the runner's passwordless sudo is the only root CI has: without this
      # step the helper's drop to 65534 with four capabilities ran only when the maintainer ran it by hand.
      # A skip fails the step as well, so a root run that quietly skips can't pass.
      - name: Helper root test (Linux)
        if: runner.os == 'Linux' && inputs.build && inputs.build_type == 'debug'
        run: |
          set -o pipefail
          sudo -E build/debug/tests/TaskSmackTests --gtest_filter='TasksmackHelperRootTest.*' 2>&1 | tee helper-root-test.log
          if grep -q '\[  SKIPPED \]' helper-root-test.log || ! grep -q '\[  PASSED  \] 1 test' helper-root-test.log; then
            echo "::error title=Helper root test::TasksmackHelperRootTest didn't run and pass as root"
            exit 1
          fi

      # Build-only check that the benchmark target still compiles and links (#1348: a PR removed
      # a function bench_Format.cpp still used, and nothing on the PR built benchmarks). The
      # timing run and regression gate stay in heavy-checks.yml. Runs after the tests so a
      # benchmark-only break doesn't hide test results; reconfiguring the same tree only adds the
      # benchmarks subdirectory, so the targets already built stay up to date.
      - name: Build benchmarks (Linux)
        if: runner.os == 'Linux' && inputs.build && inputs.build_benchmarks
        run: |
          cmake --preset ${{ inputs.build_type }} -DPython3_EXECUTABLE="$(which python)" -DTASKSMACK_ENABLE_PCH=${{ env.PCH }} -DTASKSMACK_BUILD_BENCHMARKS=ON
          cmake --build --preset ${{ inputs.build_type }} --target TaskSmackBenchmarks

      # Linux's single saver: this configure also fetched the benchmark-only dependencies.
      - name: Save FetchContent dependencies (Linux)
        if: runner.os == 'Linux' && inputs.build_benchmarks
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: save
          cache-hit: ${{ steps.fetchcontent.outputs.cache-hit }}

      - name: Test (Windows)
        if: runner.os == 'Windows' && runner.arch != 'ARM64' && inputs.build
        shell: pwsh
        env:
          # llvmpipe (beside the test executables, see "Software OpenGL for the display tests")
          # gives the display suites a GL 3.3+ context on the runner's desktop, so they must fail
          # rather than skip if it goes missing, as on Linux (#2134).
          TASKSMACK_REQUIRE_DISPLAY: '1'
          GALLIUM_DRIVER: llvmpipe
        run: ctest --preset win-${{ inputs.build_type }} -j $env:NUMBER_OF_PROCESSORS --schedule-random --output-on-failure --timeout 60 --output-junit test-results.xml

      # windows-11-arm (arm64.yml) runs the same ctest, in two parts (#2832). On that runner, and never
      # on x64, pwsh itself (7.6.6, the version the windows-2025 image ships too) dies a few seconds
      # into one of the PowerShell script tests with .NET's "Fatal error. Internal CLR error.
      # (0x80131506)", which ctest reports as SEGFAULT: one script test in about one run of several,
      # green on re-run (runs 39844666038, 39864985825, 40090045726, 40111717096). The entries with
      # the `pwsh-script` label (tests/CMakeLists.txt), and only those, get a second attempt
      # (--repeat until-pass:2); everything else runs exactly as on x64, first. The two reports are
      # merged below, so the Job Summary and the artifact still list every entry.
      - name: Test (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && inputs.build
        shell: pwsh
        env:
          TASKSMACK_REQUIRE_DISPLAY: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          $common = @('--preset', 'win-${{ inputs.build_type }}', '-j', $env:NUMBER_OF_PROCESSORS, '--schedule-random', '--output-on-failure', '--timeout', '60')
          ctest @common -LE pwsh-script --output-junit test-results.xml
          $suites = $LASTEXITCODE
          ctest @common -L pwsh-script --repeat until-pass:2 --output-junit test-results-pwsh-script.xml
          $scripts = $LASTEXITCODE
          if ($suites -ne 0) { Write-Host "::error::ctest (every entry but the pwsh-script label) exited $suites" }
          if ($scripts -ne 0) { Write-Host "::error::ctest (the pwsh-script label, two attempts each) exited $scripts" }
          if ($suites -ne 0 -or $scripts -ne 0) { exit 1 }

      # ctest runs one entry per gtest suite (#1871); each entry also writes gtest's own report, one
      # testcase per case, to gtest-results/. Fold those into one JUnit file so the artifact and the
      # Job Summary still list every case. A missing ctest report (the build failed) writes nothing.
      # Windows ARM64 writes a second ctest report, the script tests' (#2832); elsewhere it doesn't
      # exist and is skipped.
      - name: Merge test results
        if: always() && inputs.build
        shell: bash
        env:
          BUILD_DIR: build/${{ runner.os == 'Windows' && 'win-' || '' }}${{ inputs.build_type }}
        run: python tools/merge-gtest-results.py "$BUILD_DIR/test-results.xml" "$BUILD_DIR/test-results-pwsh-script.xml" "$BUILD_DIR/gtest-results" "$BUILD_DIR/test-results-cases.xml"

      - name: Upload test results (Linux)
        if: always() && runner.os == 'Linux' && inputs.build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ inputs.build_type }}-test-results
          path: |
            build/${{ inputs.build_type }}/test-results.xml
            build/${{ inputs.build_type }}/test-results-cases.xml
          retention-days: 5

      - name: Upload test results (Windows)
        if: always() && runner.os == 'Windows' && inputs.build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ inputs.build_type }}-test-results
          path: |
            build/win-${{ inputs.build_type }}/test-results.xml
            build/win-${{ inputs.build_type }}/test-results-pwsh-script.xml
            build/win-${{ inputs.build_type }}/test-results-cases.xml
          retention-days: 5

      - name: Publish test results to Job Summary
        if: >-
          always() && inputs.build &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test Results (${{ inputs.os }} ${{ inputs.build_type }})
          path: |
            build/${{ inputs.build_type }}/test-results-cases.xml
            build/win-${{ inputs.build_type }}/test-results-cases.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # -- clang-tidy ------------------------------------------------------------------------------
      # Each OS's debug job runs clang-tidy over the tree it configured above, after the tests, and
      # whether or not the build or tests passed. These were separate jobs ("static-analysis" on
      # Linux, "Static Analysis (Windows)") that set up LLVM, Python and the FetchContent sources
      # and configured the same debug tree a second time per PR head (#1875 Windows, #2047 Linux).
      # A tidy failure doesn't fail this job (continue-on-error), so the build check stays about the
      # build; ci.yml gates on the tidy-outcome output: "CI Success" for Linux, and "Static
      # Analysis (Windows)", the required check of that name, for Windows.

      # A full build already built it; the nightly clang-tidy-only run builds just the generated
      # GL loader the sources include.
      - name: Build GLAD for clang-tidy (Linux)
        if: >-
          !cancelled() && inputs.clang_tidy && steps.select.outputs.mode != 'none' &&
          steps.configure-linux.outcome == 'success'
        run: cmake --build --preset ${{ inputs.build_type }} --target glad_gl_core_33

      - name: Build GLAD for clang-tidy (Windows)
        if: >-
          !cancelled() && inputs.clang_tidy && steps.select.outputs.mode != 'none' &&
          steps.configure-windows.outcome == 'success'
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-${{ inputs.build_type }} --target glad_gl_core_33

      # Per-file result cache (#1785): a file that passed before with identical inputs (its
      # includes, flags, config, clang-tidy build) is skipped. Sunday's full run starts empty, a
      # weekly ground truth that re-seeds the cache.
      - name: Restore clang-tidy results
        id: tidy-cache
        if: >-
          !cancelled() && inputs.clang_tidy && steps.select.outputs.mode != 'none' &&
          (steps.configure-linux.outcome == 'success' || steps.configure-windows.outcome == 'success')
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: restore
          fresh: ${{ github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0' }}

      - name: Run clang-tidy (Linux)
        id: tidy-linux
        if: >-
          !cancelled() && inputs.clang_tidy && steps.select.outputs.mode != 'none' &&
          steps.configure-linux.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RESULT_CACHE: ${{ steps.tidy-cache.outputs.cache-dir }}
          TIDY_MODE: ${{ steps.select.outputs.mode }}
        run: |
          files=()
          if [[ "$TIDY_MODE" == 'list' ]]; then
            mapfile -t files < tidy-files.txt
          fi
          ./tools/clang-tidy.sh --cache-dir "$RESULT_CACHE" ${{ inputs.build_type }} "${files[@]}" 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      # The summary also says which result-cache baseline was restored, or why none was, and how many
      # files were reused from it (#3101).
      - name: Summarize clang-tidy findings (Linux)
        if: always() && (steps.tidy-linux.outcome == 'success' || steps.tidy-linux.outcome == 'failure')
        shell: bash
        env:
          CACHE_KEY: ${{ steps.tidy-cache.outputs.restored-key }}
          CACHE_FRESH: ${{ steps.tidy-cache.outputs.fresh }}
        run: python -I -X utf8 tools/tidy-findings.py clang-tidy-output.txt --title 'clang-tidy findings (Linux)' --cache-key "$CACHE_KEY" --cache-fresh "$CACHE_FRESH" >> "$GITHUB_STEP_SUMMARY"

      - name: Run clang-tidy (Windows)
        id: tidy
        if: >-
          !cancelled() && inputs.clang_tidy && steps.select.outputs.mode != 'none' &&
          steps.configure-windows.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
          RESULT_CACHE: ${{ steps.tidy-cache.outputs.cache-dir }}
          TIDY_MODE: ${{ steps.select.outputs.mode }}
        run: |
          if ($env:TIDY_MODE -eq 'list') {
            $files = @(Get-Content tidy-files.txt | Where-Object { $_ })
            # *>&1, not 2>&1: the script prints findings with Write-Host (information stream).
            & ./tools/clang-tidy.ps1 ${{ inputs.build_type }} -Files $files -CacheDir $env:RESULT_CACHE *>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          } else {
            & ./tools/clang-tidy.ps1 ${{ inputs.build_type }} -CacheDir $env:RESULT_CACHE *>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          }
          exit $LASTEXITCODE

      - name: Summarize clang-tidy findings (Windows)
        if: always() && (steps.tidy.outcome == 'success' || steps.tidy.outcome == 'failure')
        shell: bash
        env:
          CACHE_KEY: ${{ steps.tidy-cache.outputs.restored-key }}
          CACHE_FRESH: ${{ steps.tidy-cache.outputs.fresh }}
        run: python -I -X utf8 tools/tidy-findings.py clang-tidy-windows-output.txt --title 'clang-tidy findings (Windows)' --cache-key "$CACHE_KEY" --cache-fresh "$CACHE_FRESH" >> "$GITHUB_STEP_SUMMARY"

      # Clean results are valid whether or not other files failed, so save after a failure too.
      # Never from a pull request (#1554).
      - name: Save clang-tidy results
        if: always() && steps.tidy-cache.outcome == 'success' && github.event_name != 'pull_request'
        uses: ./.github/actions/tidy-result-cache
        with:
          mode: save

      - name: Upload clang-tidy results (Linux)
        if: always() && inputs.clang_tidy && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload clang-tidy results (Windows)
        if: always() && inputs.clang_tidy && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clang-tidy-results-windows
          path: clang-tidy-windows-output.txt
          if-no-files-found: ignore
          retention-days: 5
