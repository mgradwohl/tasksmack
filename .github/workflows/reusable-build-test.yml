name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner label
        required: true
        type: string
      build_type:
        description: Build preset type (`debug` or `release`, without platform prefix)
        required: true
        type: string
      llvm-version:
        description: Linux LLVM major version
        required: false
        type: string
        default: '22'
      llvm-semver-version:
        description: Windows LLVM semantic version
        required: false
        type: string
        default: '22.1.7'

# Deny all permissions by default; each job must explicitly declare what it needs.
permissions: {}

jobs:
  build-test:
    name: Build & Test (${{ inputs.os }} ${{ inputs.build_type }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup LLVM
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Setup Windows LLVM
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ inputs.llvm-semver-version }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ runner.os }}-${{ inputs.build_type }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake --preset ${{ inputs.build_type }} -DPython3_EXECUTABLE="$(which python)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --preset win-${{ inputs.build_type }} -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build --preset ${{ inputs.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_ROOT: C:\Program Files\LLVM
        run: cmake --build --preset win-${{ inputs.build_type }}

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --preset ${{ inputs.build_type }} -j $(nproc) --schedule-random --output-on-failure --timeout 60 --output-junit test-results.xml

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --preset win-${{ inputs.build_type }} -j $env:NUMBER_OF_PROCESSORS --schedule-random --output-on-failure --timeout 60 --output-junit test-results.xml

      - name: Upload test results (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-${{ inputs.build_type }}-test-results
          path: build/${{ inputs.build_type }}/test-results.xml
          retention-days: 30

      - name: Upload test results (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ inputs.build_type }}-test-results
          path: build/win-${{ inputs.build_type }}/test-results.xml
          retention-days: 30

      - name: Publish test results to Job Summary
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results (${{ inputs.os }} ${{ inputs.build_type }})
          path: |
            build/${{ inputs.build_type }}/test-results.xml
            build/win-${{ inputs.build_type }}/test-results.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
