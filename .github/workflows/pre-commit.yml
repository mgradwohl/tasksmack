name: Pre-commit

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# A new push to a PR cancels that PR's superseded run; pushes to main or a release branch get one
# group per commit and are never cancelled.
concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # The hooks read and rewrite text (check-utf8, fix-byte-order-marker, clang-format): run them in
    # UTF-8, not the runner's POSIX default (#1648).
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pre-commit
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # The branch's version is not below a release already published (#3371): main reads the next minor
  # between releases, and a release/X.Y branch is not below its own latest vX.Y.* tag. The rule is in
  # tools/check-version-ahead.py's header. It reads the public tags with git ls-remote, so it needs no
  # token or secret, and it runs for pull requests from forks too.
  version-ahead:
    name: Version is not behind the latest release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull request's version lands on its base branch; a push's is on the pushed branch. Both
      # reach the shell as environment variables, never as inline expressions.
      - name: Compare PROJECT_VERSION with the published release tags
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          python3 -I tools/check-version-ahead.py --self-test
          git ls-remote --tags --refs origin 'v*' > "$RUNNER_TEMP/release-tags.txt"
          python3 -I tools/check-version-ahead.py --branch "$BRANCH" --tags-file "$RUNNER_TEMP/release-tags.txt"
