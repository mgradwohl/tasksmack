name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  merge_group:
  schedule:
    # Nightly at 06:00 UTC: the full clang-tidy runs (PRs only check what they touch), Linux and
    # Windows release builds (no longer run on every push to main, #1406).
    - cron: '0 6 * * *'
    # Weekly on Sundays at 09:00 UTC: additionally the unity build.
    - cron: '0 9 * * 0'
  workflow_dispatch:

# Pushes to main get one group per commit and are never cancelled, so back-to-back merges each get a
# complete run and a regression is blamed on the commit that caused it (#1187). A run on any other
# ref (a PR, dev/**, a merge group, a manual run off main) still cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.7'
  # IWYU tracks LLVM's major version via its own "clang_<N>" branches, but a branch ref is
  # mutable -- pin to the exact commit this branch pointed to instead, matching every other
  # SHA-pinned dependency/action in this repo. Verified compatible with LLVM 22 directly: this
  # is the tip of upstream's clang_22 branch, and its own commit message ("[ci] Pin to LLVM 22
  # for clang_22 branch") confirms the branch's intent. To update: check
  # https://github.com/include-what-you-use/include-what-you-use/commits/clang_22 for a newer
  # commit, review the diff, then update this value.
  IWYU_COMMIT_SHA: '01a091d16b3dedb808db21f32ed3e761737a3691'

permissions: {}

jobs:
  detect-docs-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.set_output.outputs.docs_only }}
      linux_only: ${{ steps.set_output.outputs.linux_only }}
      windows_only: ${{ steps.set_output.outputs.windows_only }}
    steps:
      - name: Detect docs-only and platform-only pull request changes
        id: filter
        # merge_group is included: dorny/paths-filter natively supports it (it uses the
        # merge_group event's own base/head commits when `base`/`ref` are left unset), and
        # without this, docs_only always defaulted to "false" for merge_group runs below,
        # so a docs-only PR entering the merge queue still ran the full (and, for
        # static-analysis, ~9-minute) build/lint matrix.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # With predicate-quantifier=every a FILE matches a filter only if it matches all of the
          # filter's patterns, and the filter is true if ANY changed file matches. So each filter
          # below is "**" minus a set (negated patterns): it is true when some changed file lies
          # outside that set, and false only when every changed file lies inside it. The filters
          # used to list the set itself, which made windows_platform true for any PR touching one
          # Windows platform file -- skipping the Linux build of a PR that also changed shared code
          # -- and docs_only never true (no file matches all of its patterns).
          predicate-quantifier: every
          filters: |
            outside_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!.github/PULL_REQUEST_TEMPLATE/**'
              - '!LICENSE'
            outside_linux_platform:
              - '**'
              - '!src/Platform/Linux/**'
            outside_windows_platform:
              - '**'
              - '!src/Platform/Windows/**'

      - name: Normalize outputs
        id: set_output
        # github.head_ref is attacker-controlled (the PR branch name); passing it
        # directly into an inline shell expression enables script injection. Bind it
        # to an env var first so the shell treats it as data, not as code.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Shared by both the pull_request (non-bot-PR) and merge_group branches below --
          # steps.filter only actually ran (see its own `if:`) for those two event types.
          emit_platform_outputs() {
            # A set's "only" output is true when no changed file lies outside it (see the filter
            # step). paths-filter reports 'false' for a filter no file matched, and an empty
            # change set can't occur for a pull request or merge group.
            if [[ "${{ steps.filter.outputs.outside_docs }}" = 'false' ]]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ "${{ steps.filter.outputs.outside_linux_platform }}" = 'false' ]]; then
              echo "linux_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "linux_only=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ "${{ steps.filter.outputs.outside_windows_platform }}" = 'false' ]]; then
              echo "windows_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "windows_only=false" >> "$GITHUB_OUTPUT"
            fi
          }

          if [[ "${{ github.event_name }}" = 'pull_request' ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" && \
                  "${{ github.event.pull_request.user.login }}" = 'github-actions[bot]' && \
                  "${HEAD_REF}" == chore/changelog-* ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "linux_only=false" >> "$GITHUB_OUTPUT"
              echo "windows_only=false" >> "$GITHUB_OUTPUT"
            else
              emit_platform_outputs
            fi
          elif [[ "${{ github.event_name }}" = 'merge_group' ]]; then
            emit_platform_outputs
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "linux_only=false" >> "$GITHUB_OUTPUT"
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux-debug:
    needs: [detect-docs-only]
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.detect-docs-only.outputs.docs_only != 'true') &&
      github.event_name != 'schedule' &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: debug

  # Release differs from Debug in NDEBUG paths, IPO/LTO, hardening flags and -Werror at -O3, so
  # it is built and tested on every event that builds Debug (and on the weekly schedule), not just
  # at release time (#1134). Linux only on PRs: it runs in parallel with the longer Windows debug
  # and static-analysis jobs, so it adds runner minutes but no wall-clock time. It also builds
  # the benchmark target (build only), the one PR job that does.
  build-linux-release:
    needs: [detect-docs-only]
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.detect-docs-only.outputs.docs_only != 'true') &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: release
      # Also compile and link TaskSmackBenchmarks (no timing run), so a PR that breaks the
      # benchmark build fails here rather than on main (#1348).
      build_benchmarks: true

  build-windows-debug:
    needs: [detect-docs-only]
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.detect-docs-only.outputs.docs_only != 'true') &&
      github.event_name != 'schedule' &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: debug

  # Windows release (~12 min) runs nightly and on manual runs, not on every PR or every push to
  # main (#1134, #1406); Linux release above covers the PR gate and every push.
  build-windows-release:
    needs: [detect-docs-only]
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: release

  # Weekly (and manual) unity/jumbo build: no PR or push workflow builds this preset otherwise,
  # and unity builds break on file-local name clashes that normal builds never see (#1134).
  build-linux-unity:
    needs: [detect-docs-only]
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: unity

  docs-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit markdown links
        run: ./tools/md-link-audit.sh

  static-analysis:
    needs: [detect-docs-only]
    # Runs on pull_request (the PR gate -- #833; changed files only, see "Select files") plus the
    # nightly schedule and workflow_dispatch (all files), skipping docs-only changes. Never on push
    # to main: the PR already checked the same merge tree, and the nightly full run catches
    # anything a file-scoped PR check could miss (#1406).
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.detect-docs-only.outputs.docs_only != 'true') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent (the base), for the changed-file diff.
          fetch-depth: 2

      # On a PR, check only the translation units the change can affect (#1406): changed src/ .cpp
      # files plus every .cpp that includes a changed src/ header, or everything when the tidy
      # config, tidy scripts, CMake files or this workflow changed (tools/tidy-changed-files.py).
      # The nightly schedule and manual runs analyze every file.
      - name: Select files to analyze
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != 'pull_request' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -I tools/tidy-changed-files.py --base HEAD^1 --head HEAD --platform linux > tidy-files.txt
          # Strip CR in case a Windows Python wrote CRLF (the selector writes LF, belt and braces).
          sed -i 's/\r$//' tidy-files.txt
          if [[ "$(head -n1 tidy-files.txt)" == 'ALL' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [[ ! -s tidy-files.txt ]]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No translation unit affected by this change; clang-tidy skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=list" >> "$GITHUB_OUTPUT"
            { echo "clang-tidy on $(wc -l < tidy-files.txt) changed/affected file(s):"; echo '```'; cat tidy-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup LLVM
        if: steps.select.outputs.mode != 'none'
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-tidy-llvm${{ env.LLVM_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        if: steps.select.outputs.mode != 'none'
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build GLAD
        if: steps.select.outputs.mode != 'none'
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Run clang-tidy
        if: steps.select.outputs.mode != 'none'
        shell: bash
        run: |
          files=()
          if [[ "${{ steps.select.outputs.mode }}" == 'list' ]]; then
            mapfile -t files < tidy-files.txt
          fi
          ./tools/clang-tidy.sh debug "${files[@]}" 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          if-no-files-found: ignore
          retention-days: 14

  # Blocking clang-tidy for Windows-only code (#1233). The Linux job above can't see
  # src/Platform/Windows/** or the _WIN32 branches of shared files, so a finding there merged
  # without failing anything. Same event rules as static-analysis (PRs check changed files only,
  # nightly checks everything), and also skipped when every change is Linux-only.
  static-analysis-windows:
    name: Static Analysis (Windows)
    needs: [detect-docs-only]
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.detect-docs-only.outputs.docs_only != 'true') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LLVM_ROOT: C:\Program Files\LLVM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent (the base), for the changed-file diff.
          fetch-depth: 2

      # On a PR, check only the translation units the change can affect (#1406): changed src/ .cpp
      # files plus every .cpp that includes a changed src/ header, or everything when the tidy
      # config, tidy scripts, CMake files or this workflow changed (tools/tidy-changed-files.py).
      # The nightly schedule and manual runs analyze every file.
      - name: Select files to analyze
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != 'pull_request' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python -I tools/tidy-changed-files.py --base HEAD^1 --head HEAD --platform windows > tidy-files.txt
          # Strip CR in case a Windows Python wrote CRLF (the selector writes LF, belt and braces).
          sed -i 's/\r$//' tidy-files.txt
          if [[ "$(head -n1 tidy-files.txt)" == 'ALL' ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [[ ! -s tidy-files.txt ]]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No translation unit affected by this change; clang-tidy skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=list" >> "$GITHUB_OUTPUT"
            { echo "clang-tidy on $(wc -l < tidy-files.txt) changed/affected file(s):"; echo '```'; cat tidy-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Windows LLVM
        if: steps.select.outputs.mode != 'none'
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows-tidy-llvm${{ env.LLVM_SEMVER_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        if: steps.select.outputs.mode != 'none'
        shell: pwsh
        run: cmake --preset win-debug -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"

      - name: Build GLAD
        if: steps.select.outputs.mode != 'none'
        shell: pwsh
        run: cmake --build --preset win-debug --target glad_gl_core_33

      - name: Run clang-tidy (Windows)
        if: steps.select.outputs.mode != 'none'
        shell: pwsh
        run: |
          if ('${{ steps.select.outputs.mode }}' -eq 'list') {
            $files = @(Get-Content tidy-files.txt | Where-Object { $_ })
            # *>&1, not 2>&1: the script prints findings with Write-Host (information stream).
            & ./tools/clang-tidy.ps1 debug -Files $files *>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          } else {
            & ./tools/clang-tidy.ps1 debug *>&1 | Tee-Object -FilePath clang-tidy-windows-output.txt
          }
          exit $LASTEXITCODE

      - name: Upload clang-tidy results (Windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results-windows
          path: clang-tidy-windows-output.txt
          if-no-files-found: ignore
          retention-days: 14

  include-analysis:
    needs: [detect-docs-only, build-linux-debug]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Cache IWYU build
        id: cache-iwyu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/iwyu-install
          key: iwyu-llvm${{ env.LLVM_VERSION }}-${{ env.IWYU_COMMIT_SHA }}-${{ runner.os }}-v1

      - name: Build include-what-you-use from source
        if: steps.cache-iwyu.outputs.cache-hit != 'true'
        run: |
          # IWYU links against the static clang/LLVM libraries, which the
          # base clang packages do not ship; install the -dev packages.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev
          # Pinned to an immutable commit SHA (env.IWYU_COMMIT_SHA above), not the mutable
          # clang_${{ env.LLVM_VERSION }} branch, for reproducible reruns.
          mkdir -p /tmp/iwyu-src
          git -C /tmp/iwyu-src init -q
          git -C /tmp/iwyu-src remote add origin \
            https://github.com/include-what-you-use/include-what-you-use.git
          git -C /tmp/iwyu-src fetch --depth 1 origin "${{ env.IWYU_COMMIT_SHA }}"
          git -C /tmp/iwyu-src checkout --quiet FETCH_HEAD
          cmake -G "Ninja" \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ env.LLVM_VERSION }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/iwyu-install \
            -S /tmp/iwyu-src \
            -B /tmp/iwyu-build
          cmake --build /tmp/iwyu-build --parallel "$(nproc)"
          cmake --install /tmp/iwyu-build --strip

      - name: Install IWYU binaries to PATH
        run: |
          sudo install -m 755 /tmp/iwyu-install/bin/include-what-you-use /usr/local/bin/
          sudo install -m 755 /tmp/iwyu-install/bin/iwyu_tool.py /usr/local/bin/iwyu_tool.py
          sudo install -m 755 /tmp/iwyu-install/bin/fix_includes.py /usr/local/bin/fix_includes.py
          include-what-you-use --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-iwyu-llvm${{ env.LLVM_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure (debug preset)
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build (debug preset)
        run: cmake --build --preset debug

      - name: Run include-what-you-use
        run: ./tools/iwyu.sh --report debug 2>&1 | tee iwyu-output.txt

      - name: Add IWYU summary to workflow summary
        if: always()
        run: |
          echo "## Include-What-You-Use Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ ! -f iwyu-output.txt ]] || [[ ! -s iwyu-output.txt ]]; then
            echo "⚠️ **Status:** No IWYU output file generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if grep -qE "should add these lines:|should remove these lines:" iwyu-output.txt 2>/dev/null; then
            echo "⚠️ **Status:** Include suggestions found (advisory)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL_SUGGESTION_LINES=$(grep -cE "(should add|should remove|has correct)" iwyu-output.txt 2>/dev/null || echo 0)
            TOTAL_SUGGESTION_LINES=$(echo "$TOTAL_SUGGESTION_LINES" | tr -d ' ')

            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(should add|should remove|has correct)" iwyu-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "$TOTAL_SUGGESTION_LINES" =~ ^[0-9]+$ ]] && [[ "$TOTAL_SUGGESTION_LINES" -gt 50 ]]; then
              echo "_Note: Showing first 50 of $TOTAL_SUGGESTION_LINES suggestion lines. See artifacts for the full report._" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            SUGGESTED_FILES=$(
              set -o pipefail
              grep -E "(should add these lines:|should remove these lines:)" iwyu-output.txt 2>/dev/null \
                | sed -E 's/ should (add|remove) these lines:.*$//' \
                | sort -u \
                | wc -l
            )
            PIPELINE_STATUS=$?
            SUGGESTED_FILES=$(echo "$SUGGESTED_FILES" | tr -d ' ')

            if [[ "$PIPELINE_STATUS" -ge 2 ]]; then
              echo "⚠️ Warning: Pipeline command failed; falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            elif ! [[ "$SUGGESTED_FILES" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Warning: IWYU output format changed or parse error (got: '$SUGGESTED_FILES'); falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            fi

            echo "**Files with suggestions:** $SUGGESTED_FILES" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** No include issues found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Full report available in artifacts (retention: 14 days)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** IWYU suggestions are advisory and context-dependent. Review each suggestion before applying." >> $GITHUB_STEP_SUMMARY

      - name: Upload IWYU results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iwyu-results
          path: iwyu-output.txt
          retention-days: 14

  # Advisory asan-ubsan run on PRs — non-blocking; promotes awareness of memory/UB issues
  # before they reach main.  Promoted to blocking in sanitizers.yml on push to main.
  asan-ubsan-advisory:
    needs: [detect-docs-only]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-asan-ubsan-advisory-llvm${{ env.LLVM_VERSION }}
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Sources and population stamps only: <dep>-build holds objects compiled with this
          # job's flags (sanitizer, coverage, ...), which another job must not restore (#1137).
          path: |
            .cache/fetchcontent/*
            !.cache/fetchcontent/*-build
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'tests/CMakeLists.txt', 'benchmarks/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset asan-ubsan -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test (advisory — failure annotates but does not block)
        run: |
          ctest --preset asan-ubsan -j "$(nproc)" --output-on-failure --timeout 120 \
            2>&1 | tee asan-ubsan-output.txt || true
          echo "## ASan+UBSan Advisory" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "ERROR:|runtime error:|SUMMARY:" asan-ubsan-output.txt; then
            echo "⚠️ **Status:** Issues detected (advisory — does not block merge)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Status:** No sanitizer issues detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitizer output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-ubsan-advisory
          path: asan-ubsan-output.txt
          retention-days: 7

  # ── Gate job ────────────────────────────────────────────────────────────────
  # A single required check for branch protection.  All required jobs must succeed
  # for this job to pass, giving a single status check to configure in branch settings.
  # Uses `always()` so the gate always runs even when upstream jobs are skipped.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - detect-docs-only
      - build-linux-debug
      - build-linux-release
      - build-windows-debug
      - build-windows-release
      - build-linux-unity
      - docs-hygiene
      - static-analysis
      - static-analysis-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all required jobs passed
        env:
          DETECT_RESULT:  ${{ needs.detect-docs-only.result }}
          DOCS_ONLY:      ${{ needs.detect-docs-only.outputs.docs_only }}
          LINUX_ONLY:     ${{ needs.detect-docs-only.outputs.linux_only }}
          WINDOWS_ONLY:   ${{ needs.detect-docs-only.outputs.windows_only }}
          EVENT_NAME:     ${{ github.event_name }}
          SCHEDULE:       ${{ github.event.schedule }}
          REF:            ${{ github.ref }}
          LINUX_RESULT:   ${{ needs.build-linux-debug.result }}
          WINDOWS_RESULT: ${{ needs.build-windows-debug.result }}
          LINUX_RELEASE_RESULT:   ${{ needs.build-linux-release.result }}
          WINDOWS_RELEASE_RESULT: ${{ needs.build-windows-release.result }}
          LINUX_UNITY_RESULT:     ${{ needs.build-linux-unity.result }}
          DOCS_RESULT:    ${{ needs.docs-hygiene.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          STATIC_ANALYSIS_WINDOWS_RESULT: ${{ needs.static-analysis-windows.result }}
        run: |
          failed=false

          if [[ "$DETECT_RESULT" != 'success' ]]; then
            echo "❌ Change detection did not succeed: $DETECT_RESULT"
            failed=true
          fi
          if [[ "$DOCS_RESULT" != 'success' ]]; then
            echo "❌ Documentation hygiene did not succeed: $DOCS_RESULT"
            failed=true
          fi
          if [[ "$EVENT_NAME" != 'schedule' ]]; then
            if [[ "$LINUX_RESULT" != 'success' &&
                  ! ("$LINUX_RESULT" == 'skipped' &&
                     ("$DOCS_ONLY" == 'true' || "$WINDOWS_ONLY" == 'true')) ]]; then
              echo "❌ Linux debug build did not succeed or have an intentional skip: $LINUX_RESULT"
              failed=true
            fi
            if [[ "$WINDOWS_RESULT" != 'success' &&
                  ! ("$WINDOWS_RESULT" == 'skipped' &&
                     ("$DOCS_ONLY" == 'true' || "$LINUX_ONLY" == 'true')) ]]; then
              echo "❌ Windows debug build did not succeed or have an intentional skip: $WINDOWS_RESULT"
              failed=true
            fi
          fi

          # Linux release runs on every event (#1134); it may only skip for docs-only or
          # Windows-only changes, exactly like Linux debug.
          if [[ "$LINUX_RELEASE_RESULT" != 'success' &&
                ! ("$LINUX_RELEASE_RESULT" == 'skipped' &&
                   ("$DOCS_ONLY" == 'true' || "$WINDOWS_ONLY" == 'true')) ]]; then
            echo "❌ Linux release build did not succeed or have an intentional skip: $LINUX_RELEASE_RESULT"
            failed=true
          fi

          # Windows release runs on schedule and workflow_dispatch only (skipped on PRs and pushes
          # by design, #1406).
          if [[ "$EVENT_NAME" == 'schedule' || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$WINDOWS_RELEASE_RESULT" != 'success' ]]; then
              echo "❌ Windows release build did not succeed: $WINDOWS_RELEASE_RESULT"
              failed=true
            fi
          fi

          if [[ ("$EVENT_NAME" == 'schedule' && "$SCHEDULE" == '0 9 * * 0') || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$LINUX_UNITY_RESULT" != 'success' ]]; then
              echo "❌ Linux unity build did not succeed: $LINUX_UNITY_RESULT"
              failed=true
            fi
          fi

          # static-analysis is skipped on push to main specifically (static-analysis.yml
          # already covers that) and on docs-only PRs (both intentional); require success
          # everywhere else, including push to dev/** branches.
          if [[ "$EVENT_NAME" != 'push' || "$REF" != 'refs/heads/main' ]]; then
            if [[ "$STATIC_ANALYSIS_RESULT" != 'success' &&
                  ! ("$STATIC_ANALYSIS_RESULT" == 'skipped' && "$DOCS_ONLY" == 'true') ]]; then
              echo "❌ Static analysis (clang-tidy) did not succeed or have an intentional skip: $STATIC_ANALYSIS_RESULT"
              failed=true
            fi
            # The Windows job is also skipped, intentionally, when every change is Linux-only.
            if [[ "$STATIC_ANALYSIS_WINDOWS_RESULT" != 'success' &&
                  ! ("$STATIC_ANALYSIS_WINDOWS_RESULT" == 'skipped' &&
                     ("$DOCS_ONLY" == 'true' || "$LINUX_ONLY" == 'true')) ]]; then
              echo "❌ Windows static analysis (clang-tidy) did not succeed or have an intentional skip: $STATIC_ANALYSIS_WINDOWS_RESULT"
              failed=true
            fi
          fi

          if $failed; then
            echo "CI gate FAILED — one or more required jobs did not pass."
            exit 1
          fi
          echo "✅ All required CI jobs passed."
