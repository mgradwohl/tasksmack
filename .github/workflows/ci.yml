name: CI

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main, 'dev/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.0'

jobs:
  detect-docs-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.set_output.outputs.docs_only }}
    steps:
      - name: Detect docs-only pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/pull_request_template.md'
              - '.github/PULL_REQUEST_TEMPLATE/**'
              - 'LICENSE'

      - name: Normalize docs-only output
        id: set_output
        run: |
          if [[ "${{ github.event_name }}" = 'pull_request' ]]; then
            echo "docs_only=${{ steps.filter.outputs.docs_only }}" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  validate-environment:
    needs: [detect-docs-only]
    if: github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-format: 'true'
          install-clang-tidy: 'true'
          install-clangd: 'true'
          install-coverage-tools: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Validate prerequisites
        run: ./tools/check-prereqs.sh

  validate-environment-windows:
    needs: [detect-docs-only]
    if: github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Windows LLVM
        uses: ./.github/actions/setup-windows-llvm
        with:
          llvm-version: ${{ env.LLVM_SEMVER_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Validate prerequisites
        shell: pwsh
        run: ./tools/check-prereqs.ps1

  build-linux:
    needs: [detect-docs-only, validate-environment]
    if: github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug, release]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: ${{ matrix.build_type }}
      llvm-version: '22'

  build-windows:
    needs: [detect-docs-only, validate-environment-windows]
    if: github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true'
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug, release]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-latest
      build_type: ${{ matrix.build_type }}
      llvm-semver-version: '22.1.0'

  docs-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Audit markdown links
        run: ./tools/md-link-audit.sh

  static-analysis:
    needs: [detect-docs-only, validate-environment, build-linux]
    if: github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: linux-tidy
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build GLAD
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Run clang-tidy
        shell: bash
        run: |
          ./tools/clang-tidy.sh debug 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          retention-days: 14

  include-analysis:
    needs: [detect-docs-only, validate-environment, build-linux]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Cache IWYU build
        id: cache-iwyu
        uses: actions/cache@v5
        with:
          path: /tmp/iwyu-install
          key: iwyu-llvm${{ env.LLVM_VERSION }}-${{ runner.os }}-v1

      - name: Build include-what-you-use from source
        if: steps.cache-iwyu.outputs.cache-hit != 'true'
        run: |
          git clone --branch clang_${{ env.LLVM_VERSION }} --depth 1 \
            https://github.com/include-what-you-use/include-what-you-use.git /tmp/iwyu-src
          cmake -G "Ninja" \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ env.LLVM_VERSION }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/iwyu-install \
            -S /tmp/iwyu-src \
            -B /tmp/iwyu-build
          cmake --build /tmp/iwyu-build --parallel "$(nproc)"
          cmake --install /tmp/iwyu-build --strip

      - name: Install IWYU binaries to PATH
        run: |
          sudo install -m 755 /tmp/iwyu-install/bin/include-what-you-use /usr/local/bin/
          sudo install -m 755 /tmp/iwyu-install/bin/iwyu_tool.py /usr/local/bin/iwyu_tool.py
          sudo install -m 755 /tmp/iwyu-install/bin/fix_includes.py /usr/local/bin/fix_includes.py
          include-what-you-use --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: linux-iwyu
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure (debug preset)
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build (debug preset)
        run: cmake --build --preset debug

      - name: Run include-what-you-use
        run: ./tools/iwyu.sh --report debug 2>&1 | tee iwyu-output.txt

      - name: Add IWYU summary to workflow summary
        if: always()
        run: |
          echo "## Include-What-You-Use Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ ! -f iwyu-output.txt ]] || [[ ! -s iwyu-output.txt ]]; then
            echo "⚠️ **Status:** No IWYU output file generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if grep -qE "should add these lines:|should remove these lines:" iwyu-output.txt 2>/dev/null; then
            echo "⚠️ **Status:** Include suggestions found (advisory)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL_SUGGESTION_LINES=$(grep -cE "(should add|should remove|has correct)" iwyu-output.txt 2>/dev/null || echo 0)
            TOTAL_SUGGESTION_LINES=$(echo "$TOTAL_SUGGESTION_LINES" | tr -d ' ')

            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(should add|should remove|has correct)" iwyu-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "$TOTAL_SUGGESTION_LINES" =~ ^[0-9]+$ ]] && [[ "$TOTAL_SUGGESTION_LINES" -gt 50 ]]; then
              echo "_Note: Showing first 50 of $TOTAL_SUGGESTION_LINES suggestion lines. See artifacts for the full report._" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            SUGGESTED_FILES=$(
              set -o pipefail
              grep -E "(should add these lines:|should remove these lines:)" iwyu-output.txt 2>/dev/null \
                | sed -E 's/ should (add|remove) these lines:.*$//' \
                | sort -u \
                | wc -l
            )
            PIPELINE_STATUS=$?
            SUGGESTED_FILES=$(echo "$SUGGESTED_FILES" | tr -d ' ')

            if [[ "$PIPELINE_STATUS" -ge 2 ]]; then
              echo "⚠️ Warning: Pipeline command failed; falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            elif ! [[ "$SUGGESTED_FILES" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Warning: IWYU output format changed or parse error (got: '$SUGGESTED_FILES'); falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            fi

            echo "**Files with suggestions:** $SUGGESTED_FILES" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** No include issues found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Full report available in artifacts (retention: 14 days)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** IWYU suggestions are advisory and context-dependent. Review each suggestion before applying." >> $GITHUB_STEP_SUMMARY

      - name: Upload IWYU results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iwyu-results
          path: iwyu-output.txt
          retention-days: 14
