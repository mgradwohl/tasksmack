name: CI

on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main, 'dev/**']
  merge_group:
  schedule:
    # Run weekly on Sundays at 09:00 UTC
    - cron: '0 9 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.0'

permissions: read-all

jobs:
  detect-docs-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.set_output.outputs.docs_only }}
      linux_only: ${{ steps.set_output.outputs.linux_only }}
      windows_only: ${{ steps.set_output.outputs.windows_only }}
    steps:
      - name: Detect docs-only and platform-only pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/pull_request_template.md'
              - '.github/PULL_REQUEST_TEMPLATE/**'
              - 'LICENSE'
            linux_platform:
              - 'src/Platform/Linux/**'
            windows_platform:
              - 'src/Platform/Windows/**'

      - name: Normalize outputs
        id: set_output
        # github.head_ref is attacker-controlled (the PR branch name); passing it
        # directly into an inline shell expression enables script injection. Bind it
        # to an env var first so the shell treats it as data, not as code.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${{ github.event_name }}" = 'pull_request' ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" && \
                  "${{ github.event.pull_request.user.login }}" = 'github-actions[bot]' && \
                  "${HEAD_REF}" == chore/changelog-* ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "linux_only=false" >> "$GITHUB_OUTPUT"
              echo "windows_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=${{ steps.filter.outputs.docs_only }}" >> "$GITHUB_OUTPUT"
              # With predicate-quantifier=every, linux_platform=true only when every changed
              # file matches the Linux-specific allowlist.
              if [[ "${{ steps.filter.outputs.linux_platform }}" = 'true' && \
                    "${{ steps.filter.outputs.windows_platform }}" = 'false' ]]; then
                echo "linux_only=true" >> "$GITHUB_OUTPUT"
              else
                echo "linux_only=false" >> "$GITHUB_OUTPUT"
              fi
              # With predicate-quantifier=every, windows_platform=true only when every changed
              # file matches the Windows-specific allowlist.
              if [[ "${{ steps.filter.outputs.windows_platform }}" = 'true' && \
                    "${{ steps.filter.outputs.linux_platform }}" = 'false' ]]; then
                echo "windows_only=true" >> "$GITHUB_OUTPUT"
              else
                echo "windows_only=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "linux_only=false" >> "$GITHUB_OUTPUT"
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux-debug:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true') &&
      github.event_name != 'schedule' &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: debug

  build-linux-release:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: release

  build-windows-debug:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true') &&
      github.event_name != 'schedule' &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: debug

  build-windows-release:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: release

  docs-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit markdown links
        run: ./tools/md-link-audit.sh

  static-analysis:
    needs: [detect-docs-only]
    if: (github.event_name != 'pull_request' || needs.detect-docs-only.outputs.docs_only != 'true') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          install-clang-tidy: 'true'

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-tidy
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build GLAD
        run: cmake --build --preset debug --target glad_gl_core_33

      - name: Run clang-tidy
        shell: bash
        run: |
          ./tools/clang-tidy.sh debug 2>&1 | tee clang-tidy-output.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          retention-days: 14

  include-analysis:
    needs: [detect-docs-only, build-linux-debug]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Cache IWYU build
        id: cache-iwyu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: /tmp/iwyu-install
          key: iwyu-llvm${{ env.LLVM_VERSION }}-${{ runner.os }}-v1

      - name: Build include-what-you-use from source
        if: steps.cache-iwyu.outputs.cache-hit != 'true'
        run: |
          git clone --branch clang_${{ env.LLVM_VERSION }} --depth 1 \
            https://github.com/include-what-you-use/include-what-you-use.git /tmp/iwyu-src
          cmake -G "Ninja" \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ env.LLVM_VERSION }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/iwyu-install \
            -S /tmp/iwyu-src \
            -B /tmp/iwyu-build
          cmake --build /tmp/iwyu-build --parallel "$(nproc)"
          cmake --install /tmp/iwyu-build --strip

      - name: Install IWYU binaries to PATH
        run: |
          sudo install -m 755 /tmp/iwyu-install/bin/include-what-you-use /usr/local/bin/
          sudo install -m 755 /tmp/iwyu-install/bin/iwyu_tool.py /usr/local/bin/iwyu_tool.py
          sudo install -m 755 /tmp/iwyu-install/bin/fix_includes.py /usr/local/bin/fix_includes.py
          include-what-you-use --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-iwyu
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure (debug preset)
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build (debug preset)
        run: cmake --build --preset debug

      - name: Run include-what-you-use
        run: ./tools/iwyu.sh --report debug 2>&1 | tee iwyu-output.txt

      - name: Add IWYU summary to workflow summary
        if: always()
        run: |
          echo "## Include-What-You-Use Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ ! -f iwyu-output.txt ]] || [[ ! -s iwyu-output.txt ]]; then
            echo "⚠️ **Status:** No IWYU output file generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if grep -qE "should add these lines:|should remove these lines:" iwyu-output.txt 2>/dev/null; then
            echo "⚠️ **Status:** Include suggestions found (advisory)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL_SUGGESTION_LINES=$(grep -cE "(should add|should remove|has correct)" iwyu-output.txt 2>/dev/null || echo 0)
            TOTAL_SUGGESTION_LINES=$(echo "$TOTAL_SUGGESTION_LINES" | tr -d ' ')

            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(should add|should remove|has correct)" iwyu-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "$TOTAL_SUGGESTION_LINES" =~ ^[0-9]+$ ]] && [[ "$TOTAL_SUGGESTION_LINES" -gt 50 ]]; then
              echo "_Note: Showing first 50 of $TOTAL_SUGGESTION_LINES suggestion lines. See artifacts for the full report._" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            SUGGESTED_FILES=$(
              set -o pipefail
              grep -E "(should add these lines:|should remove these lines:)" iwyu-output.txt 2>/dev/null \
                | sed -E 's/ should (add|remove) these lines:.*$//' \
                | sort -u \
                | wc -l
            )
            PIPELINE_STATUS=$?
            SUGGESTED_FILES=$(echo "$SUGGESTED_FILES" | tr -d ' ')

            if [[ "$PIPELINE_STATUS" -ge 2 ]]; then
              echo "⚠️ Warning: Pipeline command failed; falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            elif ! [[ "$SUGGESTED_FILES" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Warning: IWYU output format changed or parse error (got: '$SUGGESTED_FILES'); falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            fi

            echo "**Files with suggestions:** $SUGGESTED_FILES" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** No include issues found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Full report available in artifacts (retention: 14 days)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** IWYU suggestions are advisory and context-dependent. Review each suggestion before applying." >> $GITHUB_STEP_SUMMARY

      - name: Upload IWYU results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iwyu-results
          path: iwyu-output.txt
          retention-days: 14

  # Advisory asan-ubsan run on PRs — non-blocking; promotes awareness of memory/UB issues
  # before they reach main.  Promoted to blocking in sanitizers.yml on push to main.
  asan-ubsan-advisory:
    needs: [detect-docs-only]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-asan-ubsan-advisory
          max-size: 500M

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure
        run: cmake --preset asan-ubsan -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test (advisory — failure annotates but does not block)
        run: |
          ctest --preset asan-ubsan -j "$(nproc)" --output-on-failure --timeout 120 \
            2>&1 | tee asan-ubsan-output.txt || true
          echo "## ASan+UBSan Advisory" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "ERROR:|runtime error:|SUMMARY:" asan-ubsan-output.txt; then
            echo "⚠️ **Status:** Issues detected (advisory — does not block merge)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **Status:** No sanitizer issues detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitizer output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-ubsan-advisory
          path: asan-ubsan-output.txt
          retention-days: 7

  # ── Gate job ────────────────────────────────────────────────────────────────
  # A single required check for branch protection.  All required jobs must succeed
  # for this job to pass, giving a single status check to configure in branch settings.
  # Uses `always()` so the gate always runs even when upstream jobs are skipped.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - detect-docs-only
      - build-linux-debug
      - build-windows-debug
      - docs-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all required jobs passed
        env:
          DETECT_RESULT:  ${{ needs.detect-docs-only.result }}
          DOCS_ONLY:      ${{ needs.detect-docs-only.outputs.docs_only }}
          LINUX_ONLY:     ${{ needs.detect-docs-only.outputs.linux_only }}
          WINDOWS_ONLY:   ${{ needs.detect-docs-only.outputs.windows_only }}
          LINUX_RESULT:   ${{ needs.build-linux-debug.result }}
          WINDOWS_RESULT: ${{ needs.build-windows-debug.result }}
          DOCS_RESULT:    ${{ needs.docs-hygiene.result }}
        run: |
          failed=false

          if [[ "$DETECT_RESULT" != 'success' ]]; then
            echo "❌ Change detection did not succeed: $DETECT_RESULT"
            failed=true
          fi
          if [[ "$DOCS_RESULT" != 'success' ]]; then
            echo "❌ Documentation hygiene did not succeed: $DOCS_RESULT"
            failed=true
          fi
          if [[ "$LINUX_RESULT" != 'success' &&
                ! ("$LINUX_RESULT" == 'skipped' &&
                   ("$DOCS_ONLY" == 'true' || "$WINDOWS_ONLY" == 'true')) ]]; then
            echo "❌ Linux debug build did not succeed or have an intentional skip: $LINUX_RESULT"
            failed=true
          fi
          if [[ "$WINDOWS_RESULT" != 'success' &&
                ! ("$WINDOWS_RESULT" == 'skipped' &&
                   ("$DOCS_ONLY" == 'true' || "$LINUX_ONLY" == 'true')) ]]; then
            echo "❌ Windows debug build did not succeed or have an intentional skip: $WINDOWS_RESULT"
            failed=true
          fi

          if $failed; then
            echo "CI gate FAILED — one or more required jobs did not pass."
            exit 1
          fi
          echo "✅ All required CI jobs passed."
