name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    # Nightly at 06:00 UTC, Monday to Saturday: the full clang-tidy runs (PRs only check what they
    # touch; files unchanged since a clean run are skipped, #1785), Linux and Windows release
    # builds (no longer run on every push to main, #1406). A red nightly opens or updates
    # main-health.yml's single `ci-red-main` issue, and the tidy jobs' summaries count findings by check.
    - cron: '0 6 * * 1-6'
    # Sundays at 09:00 UTC: the same full run plus the unity build, with clang-tidy's per-file result
    # cache ignored, so every file is analyzed from scratch once a week (#1785). Sunday is left out
    # of the nightly cron above, which would otherwise run the full checks twice that day.
    - cron: '0 9 * * 0'
  workflow_dispatch:

# Pushes to main or a release/* branch get one group per commit and are never cancelled, so
# back-to-back merges each get a complete run and a regression is blamed on the commit that caused
# it (#1187). A run on any other ref (a PR, a manual run off another branch) still cancels the run
# it supersedes.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  LLVM_VERSION: '22'
  LLVM_SEMVER_VERSION: '22.1.8'
  # IWYU tracks LLVM's major version via its own "clang_<N>" branches, but a branch ref is
  # mutable -- pin to the exact commit this branch pointed to instead, matching every other
  # SHA-pinned dependency/action in this repo. Verified compatible with LLVM 22 directly: this
  # is the tip of upstream's clang_22 branch, and its own commit message ("[ci] Pin to LLVM 22
  # for clang_22 branch") confirms the branch's intent. To update: check
  # https://github.com/include-what-you-use/include-what-you-use/commits/clang_22 for a newer
  # commit, review the diff, then update this value.
  IWYU_COMMIT_SHA: '01a091d16b3dedb808db21f32ed3e761737a3691'

permissions: {}

jobs:
  # Classifies a pull request's changes with tools/ci-change-classifier.py, whose header documents
  # each output and every file it lets skip the C++ jobs (#3104). A push, the schedule and a manual
  # run always get every output's safe value (the full suite). The outputs are never left unset: a
  # failed or unexpected classification gives the safe values too, so the worst a classifier fault
  # can do is run jobs it didn't need to, and a failed job still fails CI Success.
  detect-docs-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.set_output.outputs.docs_only }}
      linux_only: ${{ steps.set_output.outputs.linux_only }}
      windows_only: ${{ steps.set_output.outputs.windows_only }}
      automation_only: ${{ steps.set_output.outputs.automation_only }}
    steps:
      # The merge commit GitHub builds (refs/pull/N/merge) and its two parents, so HEAD^1..HEAD is
      # exactly what the pull request changes on the base branch it would merge into.
      - name: Check out the pull request's merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # github.head_ref and the other pull request fields are attacker-controlled (a fork names its
      # own branch); they reach the shell only as environment variables, never as inline expressions.
      - name: Classify the changes
        id: set_output
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Every output, in the classifier's order, with its safe value (the one that runs every job
          # the output can skip). Keep it in step with OUTPUTS in tools/ci-change-classifier.py;
          # tests/tools/test_ci_change_classifier.py checks that it is.
          SAFE_OUTPUTS='docs_only=false linux_only=false windows_only=false automation_only=false'
          read -r -a safe <<<"$SAFE_OUTPUTS"

          report() {
            echo "$1"
            {
              echo "## Change classification"
              echo ""
              echo "$1"
              echo ""
              echo '```'
              cat
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          full_validation() {
            printf '%s\n' "${safe[@]}" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${safe[@]}" | report "Full validation: $1."
          }

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            full_validation "a ${EVENT_NAME} run always gets every job"
            exit 0
          fi
          # changelog.yml's CHANGELOG.md pull request is docs only, but it is the release's last
          # check before the tag, so it gets every job.
          if [[ "$HEAD_REPO" == "$REPOSITORY" && "$PR_AUTHOR" == 'github-actions[bot]' &&
                "$HEAD_REF" == chore/changelog-* ]]; then
            full_validation "the changelog pull request always gets every job"
            exit 0
          fi
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::warning title=Change classification::HEAD is not the pull request's merge commit; running every job."
            full_validation "HEAD is not a merge commit"
            exit 0
          fi

          # The base branch's copy of the classifier, never the pull request's: a change to the
          # classifier is judged by the reviewed version, which gives that change every job.
          classifier="${RUNNER_TEMP}/ci-change-classifier.py"
          if ! git show 'HEAD^1:tools/ci-change-classifier.py' > "$classifier" 2> /dev/null; then
            full_validation "the base branch has no tools/ci-change-classifier.py"
            exit 0
          fi
          if ! result="$(python3 -I "$classifier" --base 'HEAD^1' --head HEAD)"; then
            echo "::warning title=Change classification::tools/ci-change-classifier.py failed; running every job."
            full_validation "the classifier failed"
            exit 0
          fi

          # Exactly one name=true|false line per output, in order, or the result isn't used.
          mapfile -t lines <<<"$result"
          valid=true
          if [[ "${#lines[@]}" -ne "${#safe[@]}" ]]; then
            valid=false
          else
            for i in "${!safe[@]}"; do
              if [[ ! "${lines[$i]}" =~ ^${safe[$i]%%=*}=(true|false)$ ]]; then
                valid=false
              fi
            done
          fi
          if [[ "$valid" != 'true' ]]; then
            echo "::warning title=Change classification::unexpected classifier output; running every job."
            printf '%s\n' "$result"
            full_validation "the classifier's output was not the expected outputs"
            exit 0
          fi
          printf '%s\n' "${lines[@]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${lines[@]}" | report "Classified by the base branch's tools/ci-change-classifier.py (per-file categories in the step log)."

  # Linux debug build and test, plus the Linux clang-tidy run (#2047), the same way as Windows
  # below: clang-tidy runs after the tests on the tree this job configured, so it reuses its LLVM
  # setup, configure and generated headers instead of a separate job doing them all again. PRs
  # check changed files only, the nightly schedule and manual runs everything, and push to main
  # or a release/* branch never (the PR already checked the same tree). The nightly only runs
  # clang-tidy here (no build). "CI Success" gates on the tidy-outcome output; skipped for
  # docs-only and Windows-only changes, whose Linux file selection would be empty anyway. Every C++
  # job skips for an automation-only pull request too (#3104): see automation-checks below.
  build-linux-debug:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' ||
       (needs.detect-docs-only.outputs.docs_only != 'true' &&
        needs.detect-docs-only.outputs.automation_only != 'true')) &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: debug
      build: ${{ github.event_name != 'schedule' }}
      clang_tidy: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')) }}

  # Release differs from Debug in NDEBUG paths, IPO/LTO, hardening flags and -Werror at -O3, so
  # it is built and tested on every event that builds Debug (and on the weekly schedule), not just
  # at release time (#1134). Linux only on PRs: it runs in parallel with the debug jobs (each with
  # its clang-tidy run), so it adds runner minutes but little or no wall-clock time. It also builds
  # the benchmark target (build only), the one PR job that does.
  build-linux-release:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' ||
       (needs.detect-docs-only.outputs.docs_only != 'true' &&
        needs.detect-docs-only.outputs.automation_only != 'true')) &&
      needs.detect-docs-only.outputs.windows_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: release
      # Also compile and link TaskSmackBenchmarks (no timing run), so a PR that breaks the
      # benchmark build fails here rather than on main (#1348).
      build_benchmarks: true

  # Windows debug build and test, plus the Windows clang-tidy run (#1875): one job, so the LLVM
  # restore, configure-check seed, configure and FetchContent restore happen once per PR head
  # instead of twice. clang-tidy runs after the tests (PRs check changed files only, the nightly
  # schedule and manual runs everything), never on push to main or a release/* branch (the PR
  # already checked the same tree). The nightly only runs clang-tidy here: it builds Windows
  # release instead.
  build-windows-debug:
    needs: [detect-docs-only]
    if: >-
      (github.event_name != 'pull_request' ||
       (needs.detect-docs-only.outputs.docs_only != 'true' &&
        needs.detect-docs-only.outputs.automation_only != 'true')) &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: debug
      build: ${{ github.event_name != 'schedule' }}
      clang_tidy: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')) }}

  # Windows release (~12 min) runs nightly and on manual runs, not on every PR or every push to
  # main (#1134, #1406); Linux release above covers the PR gate and every push.
  build-windows-release:
    needs: [detect-docs-only]
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: windows-2025
      build_type: release

  # Weekly (and manual) unity/jumbo build: no PR or push workflow builds this preset otherwise,
  # and unity builds break on file-local name clashes that normal builds never see (#1134).
  build-linux-unity:
    needs: [detect-docs-only]
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      os: ubuntu-24.04
      build_type: unity

  docs-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit markdown links
        run: ./tools/md-link-audit.sh

      # The audit checks link targets in the source tree; this drives the Docsify site itself, served
      # under /tasksmack/ as GitHub Pages serves it, in headless Chromium (#2967): routes, section
      # anchors, screenshots, the 404 page's recovery, JavaScript errors.
      - name: Setup Python for the docs site check
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements-docs-site.txt'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs-site.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Browser smoke test of the docs site
        run: python tools/docs-site-smoke.py

  # An automation-only pull request (tools/ci-change-classifier.py's automation_only, #3104) skips
  # the C++ jobs, and with them ctest's tool tests (tests/tools). The ones that read the files the
  # classifier lets skip those jobs run here instead, in about a minute and with no build:
  # test_workflow_run_steps.py runs renovate.yml's dry-run step, and test_check_cache_prune_triggers.py
  # reads every workflow. test_ci_change_classifier.py fails when a tests/tools script names one of
  # those files without this step running it. pre-commit.yml (actionlint), CodeQL's Actions analysis,
  # Dependency Review and OSV-Scanner run for the pull request as for any other.
  automation-checks:
    name: Automation checks
    needs: [detect-docs-only]
    if: github.event_name == 'pull_request' && needs.detect-docs-only.outputs.automation_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run the tool tests that read automation files
        run: |
          status=0
          for test in \
              tests/tools/test_ci_change_classifier.py \
              tests/tools/test_workflow_run_steps.py \
              tests/tools/test_check_cache_prune_triggers.py; do
            echo "::group::${test}"
            python -X utf8 "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Blocking clang-tidy for Windows-only code (#1233). The Linux run in build-linux-debug can't see
  # src/Platform/Windows/** or the _WIN32 branches of shared files, so a finding there merged
  # without failing anything. clang-tidy itself runs inside build-windows-debug (#1875); this job
  # only reports its result, under the name the "Main Builds" ruleset requires. Same event rules
  # as before: skipped on push to main or a release/* branch, for docs-only and automation-only
  # changes and when every change is Linux-only.
  # always(): a failed or cancelled build-windows-debug must fail this check, not skip it (a
  # skipped required check counts as passing).
  static-analysis-windows:
    name: Static Analysis (Windows)
    needs: [detect-docs-only, build-windows-debug]
    if: >-
      always() &&
      needs.detect-docs-only.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (needs.detect-docs-only.outputs.docs_only != 'true' &&
        needs.detect-docs-only.outputs.automation_only != 'true')) &&
      (github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/'))) &&
      needs.detect-docs-only.outputs.linux_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the clang-tidy (Windows) result
        env:
          JOB_RESULT: ${{ needs.build-windows-debug.result }}
          TIDY_MODE: ${{ needs.build-windows-debug.outputs.tidy-mode }}
          TIDY_OUTCOME: ${{ needs.build-windows-debug.outputs.tidy-outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          where="the \"Run clang-tidy (Windows)\" step of build-windows-debug / Build & Test (windows-2025 debug), ${RUN_URL}"
          if [[ "$TIDY_OUTCOME" == 'success' ]]; then
            echo "✅ clang-tidy (Windows) passed (${TIDY_MODE} files)."
            exit 0
          fi
          if [[ "$TIDY_MODE" == 'none' ]]; then
            echo "✅ No translation unit affected by this change; clang-tidy (Windows) skipped."
            exit 0
          fi
          if [[ "$TIDY_OUTCOME" == 'failure' ]]; then
            msg="clang-tidy (Windows) found problems: see ${where}, and its job summary."
          else
            msg="clang-tidy (Windows) did not run (build-windows-debug: ${JOB_RESULT:-not run}, clang-tidy step: ${TIDY_OUTCOME:-not reached}); see ${RUN_URL}."
          fi
          echo "::error title=Static Analysis (Windows)::${msg}"
          echo "## Static Analysis (Windows)" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ ${msg}" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  include-analysis:
    needs: [detect-docs-only, build-linux-debug]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Dispatch-only, so the cap never delays a pull request. 45 was the job's normal duration, not
    # headroom (#2798): 31 minutes on a normal runner (debug build 12, IWYU 17) and over 55 on a
    # slow one (build 20, IWYU 24+ with a quarter of the translation units still to go), where two
    # runs hit the cap. tools/iwyu.sh already runs nproc IWYU jobs. A job that hits the cap reports
    # "cancelled", as a manual cancel does; the summary step flags a cut-off IWYU run so its
    # partial report is not read as complete.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Cache IWYU build
        id: cache-iwyu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/iwyu-install
          key: iwyu-llvm${{ env.LLVM_VERSION }}-${{ env.IWYU_COMMIT_SHA }}-${{ runner.os }}-v1

      - name: Build include-what-you-use from source
        if: steps.cache-iwyu.outputs.cache-hit != 'true'
        run: |
          # IWYU links against the static clang/LLVM libraries, which the
          # base clang packages do not ship; install the -dev packages.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libclang-${{ env.LLVM_VERSION }}-dev
          # Pinned to an immutable commit SHA (env.IWYU_COMMIT_SHA above), not the mutable
          # clang_${{ env.LLVM_VERSION }} branch, for reproducible reruns.
          mkdir -p /tmp/iwyu-src
          git -C /tmp/iwyu-src init -q
          git -C /tmp/iwyu-src remote add origin \
            https://github.com/include-what-you-use/include-what-you-use.git
          git -C /tmp/iwyu-src fetch --depth 1 origin "${{ env.IWYU_COMMIT_SHA }}"
          git -C /tmp/iwyu-src checkout --quiet FETCH_HEAD
          cmake -G "Ninja" \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ env.LLVM_VERSION }} \
            -DCMAKE_INSTALL_PREFIX=/tmp/iwyu-install \
            -S /tmp/iwyu-src \
            -B /tmp/iwyu-build
          cmake --build /tmp/iwyu-build --parallel "$(nproc)"
          cmake --install /tmp/iwyu-build --strip

      - name: Install IWYU binaries to PATH
        run: |
          sudo install -m 755 /tmp/iwyu-install/bin/include-what-you-use /usr/local/bin/
          sudo install -m 755 /tmp/iwyu-install/bin/iwyu_tool.py /usr/local/bin/iwyu_tool.py
          sudo install -m 755 /tmp/iwyu-install/bin/fix_includes.py /usr/local/bin/fix_includes.py
          include-what-you-use --version

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action's pinned, SHA-256-verified ccache (4.13.6): Ubuntu's 4.9.1 lacks the
          # --evict-older-than that evict-old-files uses, and Windows images ship 4.9.1 via Perl.
          install: binary
          key: linux-iwyu-llvm${{ env.LLVM_VERSION }}
          max-size: 500M
          # Pull requests restore main's cache but never save their own: a PR-ref entry is
          # readable only by that PR and pushed main's entries out of the 10 GB quota (#1406).
          # Main runs drop entries this build didn't touch, so the saved cache tracks the tree.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      # Restore only; reusable-build-test.yml's main-branch builds save it (#1406).
      - name: Restore FetchContent dependencies
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: restore

      - name: Configure (debug preset)
        run: cmake --preset debug -DPython3_EXECUTABLE="$(which python)"

      - name: Build (debug preset)
        run: cmake --build --preset debug

      - name: Run include-what-you-use
        id: iwyu
        run: ./tools/iwyu.sh --report debug 2>&1 | tee iwyu-output.txt

      - name: Add IWYU summary to workflow summary
        if: always()
        env:
          IWYU_OUTCOME: ${{ steps.iwyu.outcome }}
        run: |
          echo "## Include-What-You-Use Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # A cancelled IWYU step (the job's timeout-minutes cap, or a manual cancel) stops where
          # IWYU did, so this report and the artifact below are partial (#2798).
          if [[ "$IWYU_OUTCOME" == "cancelled" ]]; then
            echo "::warning title=include-analysis::Run include-what-you-use was cancelled before it finished (the job's timeout-minutes cap, or a manual cancel); the IWYU report is partial."
            echo "⚠️ **Status:** IWYU was cancelled before it finished (the job's timeout-minutes cap, or a manual cancel), so this report and the artifact are partial" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ! -f iwyu-output.txt ]] || [[ ! -s iwyu-output.txt ]]; then
            echo "⚠️ **Status:** No IWYU output file generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if grep -qE "should add these lines:|should remove these lines:" iwyu-output.txt 2>/dev/null; then
            echo "⚠️ **Status:** Include suggestions found (advisory)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL_SUGGESTION_LINES=$(grep -cE "(should add|should remove|has correct)" iwyu-output.txt 2>/dev/null || echo 0)
            TOTAL_SUGGESTION_LINES=$(echo "$TOTAL_SUGGESTION_LINES" | tr -d ' ')

            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(should add|should remove|has correct)" iwyu-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "$TOTAL_SUGGESTION_LINES" =~ ^[0-9]+$ ]] && [[ "$TOTAL_SUGGESTION_LINES" -gt 50 ]]; then
              echo "_Note: Showing first 50 of $TOTAL_SUGGESTION_LINES suggestion lines. See artifacts for the full report._" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            SUGGESTED_FILES=$(
              set -o pipefail
              grep -E "(should add these lines:|should remove these lines:)" iwyu-output.txt 2>/dev/null \
                | sed -E 's/ should (add|remove) these lines:.*$//' \
                | sort -u \
                | wc -l
            )
            PIPELINE_STATUS=$?
            SUGGESTED_FILES=$(echo "$SUGGESTED_FILES" | tr -d ' ')

            if [[ "$PIPELINE_STATUS" -ge 2 ]]; then
              echo "⚠️ Warning: Pipeline command failed; falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            elif ! [[ "$SUGGESTED_FILES" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Warning: IWYU output format changed or parse error (got: '$SUGGESTED_FILES'); falling back to 0 suggested files." >> $GITHUB_STEP_SUMMARY
              SUGGESTED_FILES=0
            fi

            echo "**Files with suggestions:** $SUGGESTED_FILES" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Status:** No include issues found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Full report available in artifacts (retention: 5 days)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** IWYU suggestions are advisory and context-dependent. Review each suggestion before applying." >> $GITHUB_STEP_SUMMARY

      - name: Upload IWYU results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iwyu-results
          path: iwyu-output.txt
          retention-days: 5

  # Blocking ASan+UBSan run on PRs (#1406). It used to be advisory (`|| true` plus
  # continue-on-error), so a PR could merge with a sanitizer finding and only the push-to-main run
  # in sanitizers.yml failed -- after the fact, where nothing gated on it (#1541). It is now one of
  # CI Success's needs, and sanitizers.yml no longer repeats it on every push (nightly in
  # heavy-checks.yml and on manual dispatch instead).
  asan-ubsan:
    name: ASan+UBSan
    needs: [detect-docs-only]
    if: >-
      github.event_name == 'pull_request' &&
      needs.detect-docs-only.outputs.docs_only != 'true' &&
      needs.detect-docs-only.outputs.automation_only != 'true'
    runs-on: ubuntu-24.04
    # 45, not 30: a PR into release/X.Y restores main's ccache, which matches little of the release
    # branch's sources, so its build runs near cold. Backport #2862 took 28 minutes and backport
    # #2820 was cancelled three times at 30 with one test left; main's PRs take 15 to 21.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Setup Python for GLAD
        uses: ./.github/actions/setup-python-glad

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # The action's pinned, SHA-256-verified ccache (4.13.6): Ubuntu's 4.9.1 lacks the
          # --evict-older-than that evict-old-files uses, and Windows images ship 4.9.1 via Perl.
          install: binary
          # Same key as sanitizers.yml's asan-ubsan job, so this PR-only job restores the cache
          # main's runs save (it never saves one itself).
          key: linux-asan-ubsan-llvm${{ env.LLVM_VERSION }}
          max-size: 500M
          # Pull requests restore main's cache but never save their own: a PR-ref entry is
          # readable only by that PR and pushed main's entries out of the 10 GB quota (#1406).
          # Main runs drop entries this build didn't touch, so the saved cache tracks the tree.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      # Restore only; reusable-build-test.yml's main-branch builds save it (#1406).
      - name: Restore FetchContent dependencies
        uses: ./.github/actions/fetchcontent-cache
        with:
          mode: restore

      - name: Configure
        run: cmake --preset asan-ubsan -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        env:
          # The D-Bus fake suites must run under the sanitizers, not skip (#2133).
          TASKSMACK_REQUIRE_SDBUS: '1'
        run: |
          set +e
          ctest --preset asan-ubsan -j "$(nproc)" --output-on-failure --timeout 120 \
            2>&1 | tee asan-ubsan-output.txt
          ctest_exit=${PIPESTATUS[0]}
          set -e
          echo "## ASan+UBSan" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ctest_exit" -ne 0 ]]; then
            echo "❌ **Status:** tests failed under ASan+UBSan (ctest exit $ctest_exit)" >> "$GITHUB_STEP_SUMMARY"
            {
              echo '```'
              # Diagnostic only: under pipefail, head closing early (SIGPIPE, 141) or no match (1)
              # must not end the step before it reports ctest's own exit status.
              grep -E "runtime error:|ERROR: AddressSanitizer|SUMMARY:|\*\*\*Failed|\(Failed\)" asan-ubsan-output.txt | head -30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -m 10 -E "runtime error:|ERROR: AddressSanitizer" asan-ubsan-output.txt | while IFS= read -r finding; do
              echo "::error title=ASan+UBSan::${finding//%/%25}"
            done || true
            exit "$ctest_exit"
          fi
          echo "✅ **Status:** all tests passed under ASan+UBSan" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitizer output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asan-ubsan
          path: asan-ubsan-output.txt
          retention-days: 5

  # ── Gate job ────────────────────────────────────────────────────────────────
  # A single required check for branch protection.  All required jobs must succeed
  # for this job to pass, giving a single status check to configure in branch settings.
  # Uses `always()` so the gate always runs even when upstream jobs are skipped or cancelled.
  # Never change that to `!cancelled()`: a skipped required check counts as passing, so a
  # cancelled run would then look green. A cancelled job therefore still fails the gate, but the
  # first step says plainly that it was a cancellation (superseded push or a manual stop), not a
  # code failure, so nobody goes looking for a bug that isn't there.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - detect-docs-only
      - build-linux-debug
      - build-linux-release
      - build-windows-debug
      - build-windows-release
      - build-linux-unity
      - docs-hygiene
      - automation-checks
      - static-analysis-windows
      - asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Both steps use always(): when the run itself was cancelled a step's default success()
      # condition can be false, which would skip the check and leave the gate green.
      - name: Report cancelled jobs
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          cancelled="$(jq -r 'to_entries[] | select(.value.result == "cancelled") | .key' <<<"$NEEDS_JSON")"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS_JSON")"
          if [[ -z "$cancelled" ]]; then
            exit 0
          fi
          list="$(paste -sd, - <<<"$cancelled" | sed 's/,/, /g')"
          if [[ -z "$failed" ]]; then
            msg="CANCELLED, not a code failure: ${list} did not finish (superseded by a newer push or stopped by hand). Re-run the workflow if this head still needs a result."
          else
            msg="Cancelled: ${list}. Other jobs also FAILED; see the next step for the real failures."
          fi
          echo "::error title=CI cancelled::${msg}"
          {
            echo "## CI Success: cancelled"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Keep going: the next step lists every job's result and fails the gate.

      - name: Check all required jobs passed
        if: always()
        env:
          DETECT_RESULT:  ${{ needs.detect-docs-only.result }}
          DOCS_ONLY:      ${{ needs.detect-docs-only.outputs.docs_only }}
          LINUX_ONLY:     ${{ needs.detect-docs-only.outputs.linux_only }}
          WINDOWS_ONLY:   ${{ needs.detect-docs-only.outputs.windows_only }}
          AUTOMATION_ONLY: ${{ needs.detect-docs-only.outputs.automation_only }}
          AUTOMATION_RESULT: ${{ needs.automation-checks.result }}
          EVENT_NAME:     ${{ github.event_name }}
          SCHEDULE:       ${{ github.event.schedule }}
          REF:            ${{ github.ref }}
          LINUX_RESULT:   ${{ needs.build-linux-debug.result }}
          WINDOWS_RESULT: ${{ needs.build-windows-debug.result }}
          LINUX_RELEASE_RESULT:   ${{ needs.build-linux-release.result }}
          WINDOWS_RELEASE_RESULT: ${{ needs.build-windows-release.result }}
          LINUX_UNITY_RESULT:     ${{ needs.build-linux-unity.result }}
          DOCS_RESULT:    ${{ needs.docs-hygiene.result }}
          LINUX_TIDY_MODE:    ${{ needs.build-linux-debug.outputs.tidy-mode }}
          LINUX_TIDY_OUTCOME: ${{ needs.build-linux-debug.outputs.tidy-outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATIC_ANALYSIS_WINDOWS_RESULT: ${{ needs.static-analysis-windows.result }}
          ASAN_UBSAN_RESULT: ${{ needs.asan-ubsan.result }}
        run: |
          failed=false

          if [[ "$DETECT_RESULT" != 'success' ]]; then
            echo "❌ Change detection did not succeed: $DETECT_RESULT"
            failed=true
          else
            # The detect job always writes every output. An unset or odd one, both skips at once,
            # or an automation-only skip outside a pull request is a broken classification: fail
            # rather than trust it.
            for flag in DOCS_ONLY LINUX_ONLY WINDOWS_ONLY AUTOMATION_ONLY; do
              if [[ "${!flag}" != 'true' && "${!flag}" != 'false' ]]; then
                echo "❌ Change detection output ${flag,,} is '${!flag}', not true or false"
                failed=true
              fi
            done
            if [[ "$DOCS_ONLY" == 'true' && "$AUTOMATION_ONLY" == 'true' ]]; then
              echo "❌ Change detection said both docs_only and automation_only"
              failed=true
            fi
            if [[ "$AUTOMATION_ONLY" == 'true' && "$EVENT_NAME" != 'pull_request' ]]; then
              echo "❌ Change detection said automation_only for a ${EVENT_NAME} run"
              failed=true
            fi
          fi
          # A docs-only or an automation-only pull request changes no C++ job's input (#3104,
          # tools/ci-change-classifier.py), so those jobs may skip; nothing else lets them.
          no_cpp_change=false
          if [[ "$DOCS_ONLY" == 'true' || ("$AUTOMATION_ONLY" == 'true' && "$EVENT_NAME" == 'pull_request') ]]; then
            no_cpp_change=true
          fi
          # automation-checks runs the tool tests the skipped C++ jobs would have, so it must pass
          # whenever they skip for automation_only; otherwise it is skipped.
          if [[ "$AUTOMATION_ONLY" == 'true' && "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$AUTOMATION_RESULT" != 'success' ]]; then
              echo "❌ Automation checks did not succeed: $AUTOMATION_RESULT"
              failed=true
            fi
          elif [[ "$AUTOMATION_RESULT" != 'skipped' && "$AUTOMATION_RESULT" != 'success' ]]; then
            echo "❌ Automation checks did not succeed: $AUTOMATION_RESULT"
            failed=true
          fi
          if [[ "$DOCS_RESULT" != 'success' ]]; then
            echo "❌ Documentation hygiene did not succeed: $DOCS_RESULT"
            failed=true
          fi
          if [[ "$EVENT_NAME" != 'schedule' ]]; then
            if [[ "$LINUX_RESULT" != 'success' &&
                  ! ("$LINUX_RESULT" == 'skipped' &&
                     ("$no_cpp_change" == 'true' || "$WINDOWS_ONLY" == 'true')) ]]; then
              echo "❌ Linux debug build did not succeed or have an intentional skip: $LINUX_RESULT"
              failed=true
            fi
            if [[ "$WINDOWS_RESULT" != 'success' &&
                  ! ("$WINDOWS_RESULT" == 'skipped' &&
                     ("$no_cpp_change" == 'true' || "$LINUX_ONLY" == 'true')) ]]; then
              echo "❌ Windows debug build did not succeed or have an intentional skip: $WINDOWS_RESULT"
              failed=true
            fi
          fi

          # Linux release runs on every event (#1134); it may only skip for docs-only,
          # automation-only or Windows-only changes, exactly like Linux debug.
          if [[ "$LINUX_RELEASE_RESULT" != 'success' &&
                ! ("$LINUX_RELEASE_RESULT" == 'skipped' &&
                   ("$no_cpp_change" == 'true' || "$WINDOWS_ONLY" == 'true')) ]]; then
            echo "❌ Linux release build did not succeed or have an intentional skip: $LINUX_RELEASE_RESULT"
            failed=true
          fi

          # Windows release runs on schedule and workflow_dispatch only (skipped on PRs and pushes
          # by design, #1406).
          if [[ "$EVENT_NAME" == 'schedule' || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$WINDOWS_RELEASE_RESULT" != 'success' ]]; then
              echo "❌ Windows release build did not succeed: $WINDOWS_RELEASE_RESULT"
              failed=true
            fi
          fi

          if [[ ("$EVENT_NAME" == 'schedule' && "$SCHEDULE" == '0 9 * * 0') || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$LINUX_UNITY_RESULT" != 'success' ]]; then
              echo "❌ Linux unity build did not succeed: $LINUX_UNITY_RESULT"
              failed=true
            fi
          fi

          # clang-tidy (Linux) runs inside build-linux-debug (#2047) on every event but push to
          # main or a release/* branch (the PR already checked the same tree; the nightly runs
          # every file). Its step is
          # continue-on-error, so the job result can't show a finding: read the step's outcome.
          # Like the job, it skips docs-only, automation-only and Windows-only changes; a selection with no
          # translation unit ('none') passes. Anything else -- a finding, or a tidy step that
          # never ran because the job failed or was cancelled first -- fails the gate.
          if [[ "$EVENT_NAME" != 'push' || ("$REF" != 'refs/heads/main' && "$REF" != refs/heads/release/*) ]]; then
            if [[ "$LINUX_RESULT" == 'skipped' && ("$no_cpp_change" == 'true' || "$WINDOWS_ONLY" == 'true') ]]; then
              echo "✅ clang-tidy (Linux) skipped: no Linux-relevant change."
            elif [[ "$LINUX_TIDY_OUTCOME" == 'success' ]]; then
              echo "✅ clang-tidy (Linux) passed (${LINUX_TIDY_MODE} files)."
            elif [[ "$LINUX_TIDY_MODE" == 'none' ]]; then
              echo "✅ No translation unit affected by this change; clang-tidy (Linux) skipped."
            else
              if [[ "$LINUX_TIDY_OUTCOME" == 'failure' ]]; then
                msg="clang-tidy (Linux) found problems: see the \"Run clang-tidy (Linux)\" step of build-linux-debug / Build & Test (ubuntu-24.04 debug), and its job summary, ${RUN_URL}"
              else
                msg="clang-tidy (Linux) did not run (build-linux-debug: ${LINUX_RESULT:-not run}, clang-tidy step: ${LINUX_TIDY_OUTCOME:-not reached}); see ${RUN_URL}"
              fi
              echo "::error title=clang-tidy (Linux)::${msg}"
              echo "## clang-tidy (Linux)" >> "$GITHUB_STEP_SUMMARY"
              echo "❌ ${msg}" >> "$GITHUB_STEP_SUMMARY"
              echo "❌ ${msg}"
              failed=true
            fi
            # The Windows job is also skipped, intentionally, when every change is Linux-only.
            if [[ "$STATIC_ANALYSIS_WINDOWS_RESULT" != 'success' &&
                  ! ("$STATIC_ANALYSIS_WINDOWS_RESULT" == 'skipped' &&
                     ("$no_cpp_change" == 'true' || "$LINUX_ONLY" == 'true')) ]]; then
              echo "❌ Windows static analysis (clang-tidy) did not succeed or have an intentional skip: $STATIC_ANALYSIS_WINDOWS_RESULT"
              failed=true
            fi
          fi

          # ASan+UBSan runs on pull requests only (push/schedule/dispatch get it from sanitizers.yml
          # and heavy-checks.yml), and is skipped for docs-only and automation-only PRs.
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$ASAN_UBSAN_RESULT" != 'success' &&
                  ! ("$ASAN_UBSAN_RESULT" == 'skipped' && "$no_cpp_change" == 'true') ]]; then
              echo "❌ ASan+UBSan did not succeed or have an intentional skip: $ASAN_UBSAN_RESULT"
              failed=true
            fi
          fi

          if $failed; then
            echo "CI gate FAILED — one or more required jobs did not pass."
            exit 1
          fi
          echo "✅ All required CI jobs passed."
