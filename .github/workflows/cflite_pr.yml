name: ClusterFuzzLite PR Fuzzing

on:
  pull_request:
    branches: [main]
    paths:
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_*.yml'
      - 'assets/themes/**'
      - 'cmake/Dependencies.cmake'
      - 'cmake/patches/**'
      - 'src/App/ProcessColumnConfig.h'
      - 'src/App/UserConfig.cpp'
      - 'src/App/UserConfig.h'
      - 'src/App/UserConfigHelpers.h'
      - 'src/Core/ConfigDirOverride.*'
      - 'src/Platform/BrokerProtocol.h'
      - 'src/Platform/DnsMessage.h'
      - 'src/Platform/EdidParser.h'
      - 'src/Platform/HwIdsParser.h'
      - 'src/Platform/IProcessModules.h'
      - 'src/Platform/IProcessOpenFiles.h'
      - 'src/Platform/ISystemInfoProbe.h'
      - 'src/Platform/Linux/DesktopEntryIcons.h'
      - 'src/Platform/Linux/LinuxCommitPaging.h'
      - 'src/Platform/Linux/LinuxCoredumps.h'
      - 'src/Platform/Linux/LinuxKernelModules.h'
      - 'src/Platform/Linux/LinuxNetworkAdapters.h'
      - 'src/Platform/Linux/LinuxStorage.h'
      - 'src/Platform/Linux/NetworkdLinkJson.h'
      - 'src/Platform/Linux/ProcFdParser.h'
      - 'src/Platform/Linux/ProcMapsParser.h'
      - 'src/Platform/Linux/ProcParsing.h'
      - 'src/Platform/Linux/ProcStatusSecurityParser.h'
      - 'src/Platform/PartitionTable.h'
      - 'src/Platform/SmbiosParser.h'
      - 'src/UI/Theme.h'
      - 'src/UI/ThemeLoader.cpp'
      - 'src/UI/ThemeLoader.h'
      - 'tests/Mocks/ThemeStub.cpp'
      - 'tests/fuzz/**'

concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  fuzz:
    name: Fuzz changed parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Step timeouts well above the normal times (about 2 min to build; 120 s of fuzzing shared out
      # among the targets a change reaches, plus a corpus download of about 15 s per target), so a
      # stalled download (#1406: the artifacts API rate limit) or a hung build fails in minutes rather
      # than holding the job for its whole 20. A change to a header every fuzzer includes (UserConfig.h)
      # reaches all 15 targets: about 6 min of downloads and fuzzing, so Run fuzzers gets 10.
      - name: Build fuzzers
        timeout-minutes: 6
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address

      - name: Run fuzzers
        timeout-minutes: 10
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
          output-sarif: false
