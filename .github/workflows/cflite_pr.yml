name: ClusterFuzzLite PR Fuzzing

on:
  pull_request:
    branches: [main]
    # Must match cflite_build.yml's paths, so the main baseline this job fuzzes against is rebuilt for
    # every path it watches; tools/check-cflite-paths.py (a pre-commit hook) fails if they drift (#2533).
    paths:
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_*.yml'
      - 'assets/themes/**'
      - 'cmake/Dependencies.cmake'
      - 'cmake/patches/**'
      - 'src/App/ProcessColumnConfig.h'
      - 'src/App/UserConfig.cpp'
      - 'src/App/UserConfig.h'
      - 'src/App/UserConfigHelpers.h'
      - 'src/Core/ConfigDirOverride.*'
      - 'src/Domain/UpdateCheck.*'
      - 'src/Domain/Utf8Sanitize.h'
      - 'src/Domain/VirusTotal.*'
      - 'src/Domain/JsonReader.h'
      - 'src/Domain/Utf8Sanitize.h'
      - 'src/Platform/AsciiTrim.h'
      - 'src/Platform/BrokerProtocol.*'
      - 'src/Platform/DnsMessage.h'
      - 'src/Platform/EdidParser.h'
      - 'src/Platform/HwIdsParser.h'
      - 'src/Platform/IProcessModules.h'
      - 'src/Platform/IProcessOpenFiles.h'
      - 'src/Platform/IStartupProbe.h'
      - 'src/Platform/ISystemInfoProbe.h'
      - 'src/Platform/IUdpTrafficCollector.h'
      - 'src/Platform/Linux/CronTab.h'
      - 'src/Platform/Linux/DesktopEntryIcons.h'
      - 'src/Platform/Linux/LinuxCommitPaging.h'
      - 'src/Platform/Linux/LinuxCoredumps.h'
      - 'src/Platform/Linux/LinuxKernelModules.h'
      - 'src/Platform/Linux/LinuxNetworkAdapters.h'
      - 'src/Platform/Linux/LinuxOsInfo.h'
      - 'src/Platform/Linux/LinuxStorage.h'
      - 'src/Platform/Linux/NetworkdLinkJson.h'
      - 'src/Platform/Linux/PressureParser.h'
      - 'src/Platform/Linux/ProcFdParser.h'
      - 'src/Platform/Linux/ProcIoParser.h'
      - 'src/Platform/Linux/ProcMapsParser.h'
      - 'src/Platform/Linux/ProcParsing.h'
      - 'src/Platform/Linux/ProcStatusSecurityParser.h'
      - 'src/Platform/Linux/SmapsRollupParser.h'
      - 'src/Platform/Linux/SystemdUnitFile.h'
      - 'src/Platform/Linux/XdgAutostart.h'
      - 'src/Platform/PartitionTable.h'
      - 'src/Platform/SmbiosParser.h'
      - 'src/Platform/UdpTrafficSamples.h'
      - 'src/Platform/Windows/WindowsCrashEvents.h'
      - 'src/Platform/Windows/WindowsEnergyMeterMath.h'
      - 'src/Platform/Windows/WindowsEtwNetMath.h'
      - 'src/Platform/Windows/WindowsStartupImpact.h'
      - 'src/Platform/Windows/WindowsStorageSmartMath.h'
      - 'src/Platform/Windows/WindowsVersionResourceMath.h'
      - 'src/UI/Theme.h'
      - 'src/UI/ThemeLoader.cpp'
      - 'src/UI/FallbackTheme.h.in'
      - 'assets/themes/arctic-fire.toml'
      - 'src/UI/ThemeLoader.h'
      - 'tests/Mocks/ThemeStub.cpp'
      - 'tests/fuzz/**'

concurrency:
  group: cflite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  fuzz:
    name: Fuzz changed parsers (${{ matrix.sanitizer }})
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    # AddressSanitizer and UndefinedBehaviorSanitizer (#4343): the harnesses drive hand-written byte and integer
    # parsers, whose typical defects (a signed overflow in an offset-plus-length check, a shift by the operand's width,
    # a misaligned load) only UBSan reports. Each leg fuzzes against its own sanitizer's baseline build from
    # cflite_build.yml; code-change mode only downloads the shared corpus, so the legs can't collide. They run side by
    # side, each with the full budget.
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      # Step timeouts well above the normal times, so a stalled download (#1406: the artifacts API rate
      # limit) or a hung build fails in minutes rather than holding the job for its whole run. Building
      # took 90-260 s over the 30 runs before #2354, and Run fuzzers is 120 s of fuzzing shared out among
      # the targets a change reaches, plus a corpus download of about 15 s per target (4-7 min). But an
      # artifact that doesn't exist yet (a new target's corpus, a new sanitizer's baseline build) is
      # looked for by listing every artifact in the repository, 2-3 min each at 8,198 (#4617), so a PR
      # adding targets needs room for several misses: 15 to build (one baseline miss), 30 to fuzz (a
      # few corpus misses), 50 for the job.
      - name: Build fuzzers
        timeout-minutes: 15
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers
        timeout-minutes: 30
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: false
