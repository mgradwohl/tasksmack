name: Changelog

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG_NAME: ${{ github.ref_name }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Validate tag is strict semver
        # Reject pre-release/4-part tags (e.g. v1.2.3-rc1, v1.2.3.4) so the
        # generated changelog always contains a proper release section.
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG_NAME' is not strict semver (vMAJOR.MINOR.PATCH). Aborting changelog generation."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so git-cliff can read all commits and tags
          fetch-depth: 0
          # Check out main so we can commit CHANGELOG.md back to the branch
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        # Abort if the tag was not pushed from main to prevent generating a
        # changelog from the wrong set of commits and committing it to main.
        run: |
          TAG_SHA=$(git rev-list -n1 "$TAG_NAME")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is not the current HEAD of main (${MAIN_SHA}). Aborting."
            exit 1
          fi

      - name: Prepare changelog branch
        # Reset the branch before generation so reruns always start from the
        # existing changelog PR branch when it exists, or from main on first run.
        run: |
          BRANCH="chore/changelog-$TAG_NAME"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git push origin --delete "$BRANCH"
            fi
            git checkout -B "$BRANCH" origin/main
          else
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md via PR
        # Branch protection rulesets on main require status checks to pass,
        # so we cannot push directly. Instead, open a PR via the GitHub CLI.
        # This step is rerun-safe: it reuses the same branch/PR if they exist.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/changelog-$TAG_NAME"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            PR_EXISTS=false
          else
            PR_EXISTS=true
          fi
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            if [ "$PR_EXISTS" = true ]; then
              echo "PR for $BRANCH already exists — nothing to update."
            fi
            exit 0
          fi
          # Use a non-conventional commit message so git-cliff does not
          # include this generated changelog commit in future release notes.
          git commit -m "Update CHANGELOG.md for $TAG_NAME"
          git push origin "$BRANCH"
          if [ "$PR_EXISTS" = false ]; then
            PR_CREATE_ERROR_FILE=$(mktemp)
            # Guarantee temp file cleanup on all exits (success, error, and restricted-token fallback)
            # shellcheck disable=SC2064
            trap "rm -f \"$PR_CREATE_ERROR_FILE\"" EXIT
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update CHANGELOG.md for $TAG_NAME" \
              --body "Auto-generated changelog for the $TAG_NAME release via git-cliff." \
              --label "documentation" 2>"$PR_CREATE_ERROR_FILE"; then
              if grep -Eq 'not permitted to create or approve pull requests|Resource not accessible by integration|createPullRequest' "$PR_CREATE_ERROR_FILE"; then
                echo "Unable to create PR from workflow token."
                # Encode slashes in branch name so the compare URL works correctly
                ENCODED_BRANCH="${BRANCH//\//%2F}"
                echo "Create it manually: https://github.com/${{ github.repository }}/compare/main...${ENCODED_BRANCH}?expand=1"
                exit 0
              fi

              cat "$PR_CREATE_ERROR_FILE" >&2
              exit 1
            fi
          else
            echo "PR for $BRANCH already exists — branch updated."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
