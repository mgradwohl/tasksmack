name: Changelog

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Validate tag is strict semver
        # Reject pre-release/4-part tags (e.g. v1.2.3-rc1, v1.2.3.4) so the
        # generated changelog always contains a proper release section.
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${{ github.ref_name }}' is not strict semver (vMAJOR.MINOR.PATCH). Skipping changelog generation."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          # Full history is required so git-cliff can read all commits and tags
          fetch-depth: 0
          # Check out main so we can commit CHANGELOG.md back to the branch
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        # Abort if the tag was not pushed from main to prevent generating a
        # changelog from the wrong set of commits and committing it to main.
        run: |
          TAG_SHA=$(git rev-list -n1 "${{ github.ref_name }}")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Tag '${{ github.ref_name }}' (${TAG_SHA}) is not the current HEAD of main (${MAIN_SHA}). Aborting."
            exit 1
          fi

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md
        # NOTE: This step pushes directly to main. For this to work with branch
        # protection rules, the repository must allow the github-actions[bot] to
        # bypass push restrictions (Settings → Branches → Allow specified actors
        # to bypass required pull requests → add github-actions[bot]).
        # Tags should only be pushed from main to avoid branch mismatches.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit if the file actually changed
          git diff --staged --quiet || \
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name }}"
          git push origin main
