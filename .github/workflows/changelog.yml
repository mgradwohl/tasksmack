name: Changelog

# Tag pushes only. release.yml's dispatched dry runs never push a tag, so they never
# trigger this workflow, and there is deliberately no workflow_dispatch trigger here.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG_NAME: ${{ github.ref_name }}
    # contents/pull-requests: write are only used by the GITHUB_TOKEN fallback below; with
    # CHANGELOG_TOKEN set, the branch push and the PR use that token instead. Labelling the
    # PR is covered by pull-requests: write, so no issues permission is needed.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate tag is strict semver
        # Reject pre-release/4-part tags (e.g. v1.2.3-rc1, v1.2.3.4) so the
        # generated changelog always contains a proper release section. Each numeric
        # identifier must be "0" or have no leading zero (real SemVer rule) -- v01.2.3
        # is invalid, so a bare [0-9]+ per component is too loose. Kept in sync with
        # release.yml's identical check.
        run: |
          if ! [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag '$TAG_NAME' is not strict semver (vMAJOR.MINOR.PATCH, no leading zeroes). Aborting changelog generation."
            exit 1
          fi

      - name: Check changelog token
        # Pushes and pull requests made with GITHUB_TOKEN don't trigger other workflows, so a
        # changelog PR opened with it never gets the required CI checks. CHANGELOG_TOKEN is a
        # fine-grained PAT for this repository only (Contents: read/write, Pull requests:
        # read/write; see CONTRIBUTING.md's Release section) whose pushes and PRs do run CI.
        env:
          HAS_CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN != '' }}
        run: |
          if [ "$HAS_CHANGELOG_TOKEN" != "true" ]; then
            echo "::warning title=CHANGELOG_TOKEN not set::Falling back to GITHUB_TOKEN, so required CI will not run on the changelog PR and it cannot merge until CI is triggered another way. Add the CHANGELOG_TOKEN repository secret (see CONTRIBUTING.md's Release section)."
          fi

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required so git-cliff can read all commits and tags
          fetch-depth: 0
          # Check out main so we can commit CHANGELOG.md back to the branch
          ref: main
          # The branch pushes below use these persisted credentials, so they must be the PAT
          # too, or a rerun's push to an existing changelog PR wouldn't re-run its CI.
          token: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify tag is on main
        # Abort if the tag's commit is not on main (main's HEAD or an ancestor of it), so a
        # changelog is never generated from the wrong set of commits and committed to main.
        # Ancestry rather than equality, so a merge landing on main right after the tag push
        # can't abort the changelog; such commits are listed under [Unreleased].
        run: |
          TAG_SHA=$(git rev-list -n1 "$TAG_NAME")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            MAIN_SHA=$(git rev-parse origin/main)
            echo "Tag '$TAG_NAME' (${TAG_SHA}) is not on main (not an ancestor of origin/main, currently ${MAIN_SHA}). Aborting."
            exit 1
          fi

      - name: Prepare changelog branch
        # Reset the branch before generation so reruns always start from the
        # existing changelog PR branch when it exists, or from main on first run.
        run: |
          BRANCH="chore/changelog-$TAG_NAME"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git push origin --delete "$BRANCH"
            fi
            git checkout -B "$BRANCH" origin/main
          else
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: git-cliff
        with:
          # Pinned explicitly rather than taking the action's default, so a git-cliff
          # upgrade (template or config semantics) is a reviewed change here.
          version: v2.14.2
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push CHANGELOG.md via PR
        # Branch protection rulesets on main require status checks to pass,
        # so we cannot push directly. Instead, open a PR via the GitHub CLI.
        # This step is rerun-safe: it reuses the same branch/PR if they exist.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/changelog-$TAG_NAME"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            PR_EXISTS=false
          else
            PR_EXISTS=true
          fi
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            if [ "$PR_EXISTS" = true ]; then
              echo "PR for $BRANCH already exists — nothing to update."
            fi
            exit 0
          fi
          # Use a non-conventional commit message so git-cliff does not
          # include this generated changelog commit in future release notes.
          git commit -m "Update CHANGELOG.md for $TAG_NAME"
          git push origin "$BRANCH"
          if [ "$PR_EXISTS" = false ]; then
            PR_CREATE_ERROR_FILE=$(mktemp)
            # Guarantee temp file cleanup on all exits (success, error, and restricted-token fallback)
            # shellcheck disable=SC2064
            trap "rm -f \"$PR_CREATE_ERROR_FILE\"" EXIT
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update CHANGELOG.md for $TAG_NAME" \
              --body "Auto-generated changelog for the $TAG_NAME release via git-cliff." \
              --label "documentation" 2>"$PR_CREATE_ERROR_FILE"; then
              cat "$PR_CREATE_ERROR_FILE" >&2
              # Encode slashes in branch name so the compare URL works correctly
              ENCODED_BRANCH="${BRANCH//\//%2F}"
              COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${ENCODED_BRANCH}?expand=1"
              if grep -Eq 'not permitted to create or approve pull requests|Resource not accessible|createPullRequest' "$PR_CREATE_ERROR_FILE"; then
                echo "::error title=Changelog PR not created::The token was not allowed to open the changelog PR (check CHANGELOG_TOKEN's Pull requests: read/write permission). The branch $BRANCH was pushed; open the PR manually: $COMPARE_URL"
              else
                echo "::error title=Changelog PR not created::gh pr create failed (see the log above). The branch $BRANCH was pushed; open the PR manually: $COMPARE_URL"
              fi
              exit 1
            fi
          else
            echo "PR for $BRANCH already exists — branch updated."
          fi
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}
