name: Dependency Review

# Block PRs that introduce dependencies with known CVEs.
# Uses GitHub's dependency review API (requires the dependency graph to be enabled).
# Complements the OSV scanner workflow (which runs on push); this blocks at the PR gate.

on:
  pull_request:
    branches: [main, 'release/**']
  # "Dependency Review" is a required check, so a merge queue's merge group runs it too (#3818). The
  # action (v5) reads the base and head from the event: merge_group.base_sha and merge_group.head_sha,
  # what the merge group adds on top of its base branch.
  merge_group:
    types: [checks_requested]

# A new push to a PR cancels that PR's superseded review. A merge group has no pull request number, so
# it is keyed on its own ref (refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>, one per queue entry):
# with the number alone every queue run shared one group and cancelled the one before it (#3818).
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies for CVEs
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
