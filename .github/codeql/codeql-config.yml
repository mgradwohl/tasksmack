name: "TaskSmack CodeQL Config"

# Report results for application source code.
# paths and paths-ignore apply only to the interpreted languages and to compiled languages analyzed
# with build-mode: none. For the traced (manual) C/C++ build in codeql.yml they filter nothing
# (#2794): with this file in place, 110 of main's 113 results were in .cache/fetchcontent/ headers
# that src/ includes. What keeps third-party and generated code out of the alerts is the "Keep
# results under src/" step in .github/workflows/codeql.yml, which drops every SARIF result whose
# primary location is outside src/ before the upload. The lists below state the same intent and
# would take effect if the analysis ever moved to build-mode: none. Compiled code is kept out of
# the database by compiling it outside the traced build step (see the "Configure" and "Build
# third-party dependencies (untraced)" steps there). The tests are not built at all (#1786), so
# tests/ is not listed: it could not report anything.
paths:
  - src

# Do not report results in third-party, generated or build-artifact paths
paths-ignore:
  - '**/deps'
  - '**/dependencies'
  - '**/node_modules'
  - '**/vendor'
  - '**/third_party'
  - '**/external'
  - '**/build/**'  # Exclude all files in build directories (generated outputs trigger doc-only alerts like 912-915)
  - '**/CMakeFiles/**'       # CMake-generated scratch/try-compile files
  - '**/CMakeScratch/**'     # Additional guard for nested CMake scratch dirs
  - '**/CMakeFiles/CMakeScratch/**'  # Explicit pattern for TryCompile artifacts
  - '**/tools'
  - '**/.cache/**'  # Exclude all files in cache directories
  - '**/gladsources/**'   # Generated OpenGL loader (GLAD) – documented in upstream headers, skip cpp/poorly-documented-function
  - 'dist/**'             # Distribution packages
  - 'coverage/**'         # Coverage reports
  - 'benchmarks/**'       # Benchmark code
  - 'assets/**'           # Assets and resources
