name: "TaskSmack CodeQL Config"

# Only scan our source code
paths:
  - src
  - tests

# Exclude third-party dependencies and build artifacts
paths-ignore:
  - '**/deps'
  - '**/dependencies'
  - '**/node_modules'
  - '**/vendor'
  - '**/third_party'
  - '**/external'
  - '**/build/**'  # Exclude all files in build directories
  - '**/tools'
  - '**/.cache/**'  # Exclude all files in cache directories
  - '**/gladsources/**'   # Generated OpenGL loader
  - 'dist/**'             # Distribution packages
  - 'coverage/**'         # Coverage reports
  - 'benchmarks/**'       # Benchmark code
  - 'assets/**'           # Assets and resources
