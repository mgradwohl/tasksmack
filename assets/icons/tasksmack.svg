<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- TaskSmack app icon, "Impact" (#1508): a comic-book impact burst ("SMACK!") around a small bar chart.
       Master art for 32 px and up; tasksmack-small.svg is the simplified variant for the smallest renders
       (see tools/generate-icons.sh). Original work, MIT (REUSE.toml). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <!-- 12-point burst centred on (128,128): outer radius 98, inner radius 64. -->
  <polygon points="128,30 144.6,66.2 177,43.1 173.3,82.7 212.9,79 189.8,111.4 226,128 189.8,144.6 212.9,177 173.3,173.3 177,212.9 144.6,189.8 128,226 111.4,189.8 79,212.9 82.7,173.3 43.1,177 66.2,144.6 30,128 66.2,111.4 43.1,79 82.7,82.7 79,43.1 111.4,66.2"
           fill="#fde047" stroke="#7f1d1d" stroke-width="7" stroke-linejoin="round"/>
  <!-- Rising bars, 18 wide with 6 gaps, bounding box centred on (128,128). -->
  <rect x="95" y="133" width="18" height="30" rx="5" fill="#7f1d1d"/>
  <rect x="119" y="113" width="18" height="50" rx="5" fill="#7f1d1d"/>
  <rect x="143" y="93" width="18" height="70" rx="5" fill="#7f1d1d"/>
</svg>
