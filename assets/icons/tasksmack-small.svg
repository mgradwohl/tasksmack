<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- TaskSmack app icon, "Impact" (#1508), simplified for the 16 and 24 px renders (tools/generate-icons.sh):
       a near full-bleed tile, an 8-point burst with a 16-unit outline (1 px at 16 px), and two bold bars,
       so it still reads as an orange tile with a yellow burst. Master art: tasksmack.svg.
       Original work, MIT (REUSE.toml). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- 8-point burst centred on (128,128): outer radius 104, inner radius 70. -->
  <polygon points="128,24 154.8,63.3 201.5,54.5 192.7,101.2 232,128 192.7,154.8 201.5,201.5 154.8,192.7 128,232 101.2,192.7 54.5,201.5 63.3,154.8 24,128 63.3,101.2 54.5,54.5 101.2,63.3"
           fill="#fde047" stroke="#7f1d1d" stroke-width="16" stroke-linejoin="round"/>
  <!-- Two rising bars, 36 wide with a 12 gap, bounding box centred on (128,128). -->
  <rect x="86" y="118" width="36" height="52" rx="6" fill="#7f1d1d"/>
  <rect x="134" y="86" width="36" height="84" rx="6" fill="#7f1d1d"/>
</svg>
