# Ubuntu Dark Theme
# Inspired by Ubuntu 24.04 dark mode (GNOME Adwaita)
# Orange accent with clean, modern design
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Ubuntu Dark"
description = "Inspired by Ubuntu 24.04 dark mode with orange accent"
author = "TaskSmack"
version = "1.0"

# =============================================================================
# ACCENT COLORS
# 8 colors for charts, legends, and UI highlights
# Ubuntu color palette
# =============================================================================
[accents]
colors = [
    "#E95420",  # Ubuntu Orange
    "#19B6EE",  # Ubuntu Blue
    "#77DD77",  # Light Green
    "#9A66AE",  # Purple
    "#ED7014",  # Dark Orange
    "#3584E4",  # Blue
    "#FFBE00",  # Yellow
    "#E2383E",  # Red
]

# =============================================================================
# PROGRESS BAR COLORS
# Colors for progress bars based on percentage thresholds
# =============================================================================
[progress]
low = "#33D17A"       # 0-50%   - Green (healthy)
medium = "#ED7014"    # 50-80%  - Orange (caution)
high = "#EB2A2B"      # 80-100% - Red (critical)

# =============================================================================
# SEMANTIC TEXT COLORS
# Colors for different types of text/messages
# =============================================================================
[semantic]
text_primary = "#F8F8F8"   # Bright white for maximum contrast on dark bg
text_disabled = "#C0C0C0"  # Brighter gray for disabled text
text_muted = "#CCCCCC"     # Much brighter for chart axis labels
text_error = "#FF655E"     # Light Red - error messages
text_warning = "#FD9F4E"   # Orange - warning messages
text_success = "#51D384"   # Light Green - success messages
text_info = "#62A0EA"      # Light Blue - informational text

# =============================================================================
# PROCESS STATUS COLORS
# Colors for process states in the process list
# =============================================================================
[status]
running = "#33D17A"    # Light Green - active/running (R)
sleeping = "#76B2FE"   # Light Blue - sleeping (S)
disk_sleep = "#FFA348" # Light Orange - uninterruptible I/O (D)
zombie = "#FF907E"     # Light Magenta - defunct process (Z) - distinct from charts.io red
stopped = "#A6A6FF"    # Light Purple - stopped/traced (T/t)
idle = "#AFAFAF"       # Gray - idle kernel thread (I)

# =============================================================================
# CHART LINE COLORS
# Colors for specific metric lines in graphs
# =============================================================================
[charts]
cpu = "#3584E4"       # Blue - CPU usage line
memory = "#79C93A"    # Lime - memory usage line
io = "#E16B16"        # Orange - I/O read usage line
io_write = "#8C8A55"        # Olive - I/O write usage line
net_tx = "#DFA527"          # Amber - Network transmit (sent) line
net_rx = "#41C2D8"          # Cyan - Network receive line
cpu_fill = "#3584E44D"       # Blue with 30% alpha - CPU fill
memory_fill = "#79C93A4D"    # Lime with 30% alpha - memory fill
io_fill = "#E16B164D"        # Orange with 30% alpha - I/O read fill
io_write_fill = "#8C8A554D"   # Olive with 30% alpha - I/O write fill
net_tx_fill = "#DFA5274D"    # Amber with 30% alpha - Network TX fill
net_rx_fill = "#41C2D84D"    # Cyan with 30% alpha - Network RX fill
peak_line = "#F5C211B3"      # Gold with 70% alpha - peak reference line

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#3584E4"   # Blue - CPU Total line over the User/System bands
memory_cached = "#ACE6B3"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#A074E1"   # Violet - Memory: Swap (also Process Virtual)
power         = "#E8DF2F"   # Pale yellow - Power draw: system, process and GPU
battery       = "#2DC6BF"   # Teal - Battery charge
threads       = "#E5638F"   # Rose - Thread count
handles       = "#9BA3AD"   # Gray - Handles / file descriptors
page_faults   = "#9EA2FA"   # Violet - Page faults per second
gdi           = "#1A9D8C"   # Teal - GDI objects (Windows)

# =============================================================================
# GPU METRICS COLORS
# Colors for GPU monitoring graphs, bars, and badges
# =============================================================================
[charts.gpu]
utilization = "#DC37AE"           # Magenta - GPU utilization line
utilization_fill = "#DC37AE4D"    # Magenta with 30% alpha - GPU fill
memory = "#76C431"                # Lime - GPU memory line (#1197)
memory_fill = "#76C4314D"         # Lime with 30% alpha - GPU memory fill
temperature = "#F47217"           # Orange - GPU temperature line
power = "#E8DF2F"                 # Pale yellow - GPU power draw line
encoder = "#33C7DE"               # Teal - GPU encoder utilization
decoder = "#899EFD"               # Blue - GPU decoder utilization
clock = "#2B8FCA"             # Blue - GPU clock speed line
clock_fill = "#2B8FCACC"      # Blue with 80% alpha - GPU clock fill
fan = "#7C7C7C"               # Neutral Gray - GPU fan speed line

# =============================================================================
# CPU BREAKDOWN COLORS
# Colors for the stacked CPU usage bar
# =============================================================================
[cpu_breakdown]
user = "#6FAEFF"      # Blue - user CPU time
system = "#F86F15"    # Orange - system/kernel time
iowait = "#FDB230"    # Amber - I/O wait time
idle = "#3D3D3D"      # Dark gray - idle time
user_fill = "#6FAEFF59"      # Blue with 35% alpha - user fill
system_fill = "#F86F1559"    # Orange with 35% alpha - system fill
iowait_fill = "#FDB23059"    # Amber with 35% alpha - iowait fill
idle_fill = "#3D3D3D33"      # Dark gray with 20% alpha - idle fill

[priority]
high   = "#E01B24"     # Ubuntu Red
normal = "#33D17A"     # Ubuntu Green
low    = "#9A9CFF"     # Light Purple
badge_text_color = "#FFFFFF"  # Preferred badge text; a fill it is too faint on gets the other text colour (#1130)

[buttons.close]
hovered = "#CC1A1A"     # Dark red hover
active  = "#E63333"     # Brighter red active

[buttons.success]
normal = "#26A269"     # Ubuntu green
hovered = "#33D17A"    # Bright green
active = "#1A7447"     # Dark green

# =============================================================================
# WINDOW COLORS
# Base colors for windows, popups, and borders - Ubuntu/Adwaita dark
# =============================================================================
[ui.window]
background = "#242424"            # Dark background
child_background = "#24242400"    # Transparent
popup_background = "#2D2D2DF0"    # Slightly lighter, semi-opaque (F0 = 94%)
border = "#3D3D3D80"              # Dark border (80 = 50%)
border_shadow = "#00000000"       # Transparent - no border shadow

# =============================================================================
# FRAME COLORS
# Input fields, combo boxes, sliders background
# =============================================================================
[ui.frame]
background = "#303030"
background_hovered = "#383838"
background_active = "#404040"

# =============================================================================
# TITLE BAR COLORS
# Window title bars - Ubuntu/GNOME dark style
# =============================================================================
[ui.title]
background = "#1E1E1E"
background_active = "#242424"
background_collapsed = "#1E1E1E80"    # 80 = 50% alpha

# =============================================================================
# BAR COLORS
# Menu bar and status bar
# =============================================================================
[ui.bars]
menu = "#303030"
status = "#242424"

# =============================================================================
# SCROLLBAR COLORS
# =============================================================================
[ui.scrollbar]
background = "#30303080"          # 80 = 50% alpha
grab = "#4D4D4D"
grab_hovered = "#5A5A5A"
grab_active = "#707070"

# =============================================================================
# CONTROL COLORS
# Checkboxes, sliders, etc. - Ubuntu orange accent
# =============================================================================
[ui.controls]
check_mark = "#E95420"
slider_grab = "#E95420"
slider_grab_active = "#C94017"

# =============================================================================
# BUTTON COLORS
# Standard buttons (not danger buttons) - Ubuntu/Adwaita dark style
# =============================================================================
[ui.button]
normal = "#404040"          # Lighter gray for better contrast
hovered = "#4A4A4A"
active = "#E95420"           # Ubuntu Orange on click

# =============================================================================
# HEADER COLORS
# Collapsible headers, tree nodes
# =============================================================================
[ui.header]
normal = "#424242"
hovered = "#383838"
active = "#505050"

# =============================================================================
# SEPARATOR COLORS
# Horizontal/vertical separators
# =============================================================================
[ui.separator]
normal = "#3D3D3D80"              # 80 = 50% alpha
hovered = "#E95420"
active = "#C94017"

# =============================================================================
# RESIZE GRIP COLORS
# Window resize handles
# =============================================================================
[ui.resize_grip]
normal = "#4D4D4D33"              # 33 = 20% alpha
hovered = "#E95420"
active = "#C94017"

# =============================================================================
# TAB COLORS
# Tab bar tabs - Ubuntu/GNOME dark style
# =============================================================================
[ui.tab]
normal = "#434343"
hovered = "#474747"
active = "#303030"
active_overline = "#E95420"             # Ubuntu orange overline
unfocused = "#303030"
unfocused_active = "#3D3D3D"
unfocused_active_overline = "#E9542080" # Semi-transparent orange overline

# =============================================================================
# DOCKING COLORS
# Docking preview and empty space
# =============================================================================
[ui.docking]
preview = "#E95420B3"             # B3 = 70% alpha
empty_background = "#242424"

# =============================================================================
# PLOT COLORS
# ImGui plot widgets
# =============================================================================
[ui.plot]
grid = "#494949"
lines = "#62A0EA"
lines_hovered = "#ED333B"
histogram = "#33D17A"
histogram_hovered = "#77DD77"

# =============================================================================
# TABLE COLORS
# Table widget colors
# =============================================================================
[ui.table]
header_background = "#303030"
border_strong = "#3D3D3D"
border_light = "#383838"
row_background = "#00000000"      # Transparent
row_background_alt = "#FFFFFF08"  # 08 = 3% alpha

# =============================================================================
# MISCELLANEOUS UI COLORS
# =============================================================================
[ui.misc]
text_selected_background = "#E9542059"    # 59 = 35% alpha
drag_drop_target = "#FFBE00"
nav_highlight = "#E95420"
nav_windowing_highlight = "#FFFFFF66"     # 66 = 40% alpha
nav_windowing_dim_background = "#00000033" # 33 = 20% alpha
modal_window_dim_background = "#00000099"  # 99 = 60% alpha
