# Arctic Fire Light Theme
# A cool-to-warm gradient on a frosted, blue-tinted light background: Blue → Emerald → Amber → Red
# Light variant that keeps the polar chill of the dark arctic-fire theme
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Arctic Fire Light"
description = "Blue → Emerald → Amber → Red gradient with light background"
author = "TaskSmack"
version = "1.0"

# =============================================================================
# ACCENT COLORS
# 8 colors for charts, legends, and UI highlights
# =============================================================================
[accents]
colors = [
    "#2E7FCB",  # Glacial Blue
    "#D96A32",  # Warm Ember
    "#3A9B68",  # Alpine Green
    "#7C64C8",  # Aurora Purple
    "#AC8500",  # Polar Gold
    "#D8638D",  # Sunlit Rose
    "#5C9A00",  # Ice Lime
    "#CC7250",  # Soft Coral
]

# =============================================================================
# PROGRESS BAR COLORS
# Colors for progress bars based on percentage thresholds
# =============================================================================
[progress]
low = "#459B4D"       # 0-50%   - Green (healthy)
medium = "#B77F00"    # 50-80%  - Amber (caution)
high = "#E53935"      # 80-100% - Red (critical)

# =============================================================================
# SEMANTIC TEXT COLORS
# Colors for different types of text/messages
# =============================================================================
[semantic]
text_primary = "#0F1419"   # Dark charcoal for contrast on light bg
text_disabled = "#666666"  # Muted gray for disabled text
text_muted = "#6A6A6A"     # Gray - dimmed/secondary text
text_error = "#CC272A"     # Red - error messages
text_warning = "#A85300"   # Orange - warning messages
text_success = "#207A2A"   # Green - success messages
text_info = "#006BC3"      # Blue - informational text

# =============================================================================
# PROCESS STATUS COLORS
# Colors for process states in the process list
# =============================================================================
[status]
running = "#006618"    # Green - active/running (R)
sleeping = "#0058A3"   # Blue - sleeping (S)
disk_sleep = "#8B4400" # Orange - uninterruptible I/O (D)
zombie = "#B2001A"     # Red - defunct process (Z)
stopped = "#A82500"    # Orange - stopped/traced (T/t)
idle = "#575757"       # Gray - idle kernel thread (I)

# =============================================================================
# CHART LINE COLORS
# Colors for specific metric lines in graphs
# =============================================================================
[charts]
cpu = "#1976D2"       # Blue - CPU usage line
memory = "#388E3C"    # Green - memory usage line
io = "#B2001A"        # Red - I/O read usage line
io_write = "#0098AC"        # Cyan - I/O write usage line
net_tx = "#AC8500"          # Polar Gold - Network transmit (sent) line
net_rx = "#7C64C8"          # Aurora Purple - Network receive line
cpu_fill = "#1976D24D"       # Blue with 30% alpha - CPU fill
memory_fill = "#388E3C4D"    # Green with 30% alpha - memory fill
io_fill = "#B2001A4D"        # Red with 30% alpha - I/O read fill
io_write_fill = "#0098AC4D"   # Cyan with 30% alpha - I/O write fill
net_tx_fill = "#AC85004D"    # Polar Gold with 30% alpha - Network TX fill
net_rx_fill = "#7C64C84D"    # Aurora Purple with 30% alpha - Network RX fill
peak_line = "#9E4E00B3"      # Orange with 70% alpha - peak reference line

# =============================================================================
# GPU METRICS COLORS
# Colors for GPU monitoring graphs, bars, and badges
# =============================================================================
[charts.gpu]
utilization = "#7B1FA2"           # Purple - GPU utilization line
utilization_fill = "#7B1FA24D"    # Purple with 30% alpha - GPU fill
memory = "#D25E88"                # Sunlit Rose - GPU memory line (distinct from io Red)
memory_fill = "#D25E884D"         # Sunlit Rose with 30% alpha - GPU memory fill
temperature = "#D86D00"           # Gold - GPU temperature line
power = "#459B4D"                 # Green - GPU power draw line
encoder = "#0097A7"               # Teal - GPU encoder utilization
decoder = "#C2185B"               # Magenta - GPU decoder utilization
clock = "#3691CF"             # Light Blue - GPU clock speed line
clock_fill = "#3691CFCC"      # Light Blue with 80% alpha - GPU clock fill
fan = "#546E7A"               # Dark Blue Gray - GPU fan speed line

# =============================================================================
# CPU BREAKDOWN COLORS
# Colors for the stacked CPU usage bar
# =============================================================================
[cpu_breakdown]
user = "#004DA3"      # Blue - user CPU time
system = "#D32F2F"    # Red - system/kernel time
iowait = "#DD6800"    # Orange - I/O wait time
idle = "#D0D0D0"      # Light gray - idle time
user_fill = "#004DA359"      # Blue with 35% alpha - user fill
system_fill = "#D32F2F59"    # Red with 35% alpha - system fill
iowait_fill = "#DD680059"    # Orange with 35% alpha - iowait fill
idle_fill = "#D0D0D033"      # Light gray with 20% alpha - idle fill

[priority]
high   = "#E53935"     # Crimson (matches progress.high)
normal = "#388E3C"     # Alpine Green (matches status.running)
low    = "#1976D2"     # Blue (matches charts.cpu)
badge_text_color = "#1A1A1A"  # Preferred badge text; a fill it is too faint on gets the other text colour (#1130)

[buttons.close]
hovered = "#CC1A1A"     # Dark red hover
active  = "#E63333"     # Brighter red active

[buttons.success]
normal = "#0097A7"     # Teal
hovered = "#00ACC1"    # Bright cyan
active = "#00838F"     # Dark teal

# =============================================================================
# WINDOW COLORS
# Base colors for windows, popups, and borders
# =============================================================================
[ui.window]
background = "#F4F7FB"            # Frosted blue-white background
child_background = "#F4F7FB00"    # Transparent
popup_background = "#F1F5FAF0"    # Light blue-tinted popup, semi-opaque (F0 = 94%)
border = "#C6D4E880"              # Cool gray-blue border (80 = 50%)
border_shadow = "#00000000"       # Transparent - no border shadow

# =============================================================================
# FRAME COLORS
# Input fields, combo boxes, sliders background
# =============================================================================
[ui.frame]
background = "#EDF2F8"
background_hovered = "#E3ECF5"
background_active = "#D9E4F1"

# =============================================================================
# TITLE BAR COLORS
# Window title bars
# =============================================================================
[ui.title]
background = "#EAF0F7"
background_active = "#DFE8F3"
background_collapsed = "#EAF0F780"    # 80 = 50% alpha

# =============================================================================
# BAR COLORS
# Menu bar and status bar
# =============================================================================
[ui.bars]
menu = "#EAF0F7"
status = "#E3ECF5"

# =============================================================================
# SCROLLBAR COLORS
# =============================================================================
[ui.scrollbar]
background = "#F8F8F880"          # 80 = 50% alpha
grab = "#BBBBBB"
grab_hovered = "#999999"
grab_active = "#777777"

# =============================================================================
# CONTROL COLORS
# Checkboxes, sliders, etc.
# =============================================================================
[ui.controls]
check_mark = "#1976D2"
slider_grab = "#1976D2"
slider_grab_active = "#1565C0"

# =============================================================================
# BUTTON COLORS
# Standard buttons (not danger buttons)
# =============================================================================
[ui.button]
normal = "#C8D8E8"          # Visible blue-gray
hovered = "#B0C8E0"          # Darker on hover
active = "#00A8E8"           # Cyan on click

# =============================================================================
# HEADER COLORS
# Collapsible headers, tree nodes
# =============================================================================
[ui.header]
normal = "#B9D1E9"
hovered = "#D6E4F2"
active = "#A0C0E0"

# =============================================================================
# SEPARATOR COLORS
# Horizontal/vertical separators
# =============================================================================
[ui.separator]
normal = "#CCCCCC80"              # 80 = 50% alpha
hovered = "#1976D2"
active = "#1565C0"

# =============================================================================
# RESIZE GRIP COLORS
# Window resize handles
# =============================================================================
[ui.resize_grip]
normal = "#BBBBBB33"              # 33 = 20% alpha
hovered = "#1976D2"
active = "#1565C0"

# =============================================================================
# TAB COLORS
# Tab bar tabs
# =============================================================================
[ui.tab]
normal = "#B8D5ED"
hovered = "#C0D8F0"
active = "#E8F0F8"
active_overline = "#1976D2"           # Blue accent overline for visibility
unfocused = "#E0EAF5"
unfocused_active = "#D0E0F0"
unfocused_active_overline = "#1976D280" # Semi-transparent blue overline

# =============================================================================
# DOCKING COLORS
# Docking preview and empty space
# =============================================================================
[ui.docking]
preview = "#1976D2B3"             # B3 = 70% alpha
empty_background = "#FAFAFA"

# =============================================================================
# PLOT COLORS
# ImGui plot widgets
# =============================================================================
[ui.plot]
grid = "#BDCBDF"
lines = "#1976D2"
lines_hovered = "#D32F2F"
histogram = "#388E3C"
histogram_hovered = "#66BB6A"

# =============================================================================
# TABLE COLORS
# Table widget colors
# =============================================================================
[ui.table]
header_background = "#F5F5F5"
border_strong = "#CCCCCC"
border_light = "#E0E0E0"
row_background = "#00000000"      # Transparent
row_background_alt = "#00000008"  # 08 = 3% alpha

# =============================================================================
# MISCELLANEOUS UI COLORS
# =============================================================================
[ui.misc]
text_selected_background = "#1976D259"    # 59 = 35% alpha
drag_drop_target = "#FFB300"
nav_highlight = "#1976D2"
nav_windowing_highlight = "#00000066"     # 66 = 40% alpha
nav_windowing_dim_background = "#00000033" # 33 = 20% alpha
modal_window_dim_background = "#00000099"  # 99 = 60% alpha
