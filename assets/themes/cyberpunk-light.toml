# Cyberpunk Light Theme
# Light neon aesthetic with punchy cyan/magenta on a cool violet-tinted base
# Light variant that echoes the synthwave glow of the dark theme
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Cyberpunk Light"
description = "Light neon aesthetic with bright base and vibrant neon accents"
author = "TaskSmack"
version = "1.0"

# =============================================================================
# ACCENT COLORS
# 8 colors for charts, legends, and UI highlights
# =============================================================================
[accents]
colors = [
    "#F14097",  # Neon Pink
    "#0094B1",  # Electric Cyan
    "#815CFF",  # Vivid Violet
    "#1E9D00",  # Neon Lime
    "#FF315A",  # Crimson Neon
    "#E134ED",  # Magenta
    "#998800",  # Laser Yellow
    "#DD6300",  # Hot Orange
]

# =============================================================================
# SEMANTIC TEXT COLORS
# Colors for different types of text/messages
# =============================================================================
[semantic]
text_primary = "#0D0D12"   # Dark near-black for contrast on light bg
text_disabled = "#5E5E6A"  # Muted gray-violet for disabled text
text_muted = "#676767"     # Gray
text_error = "#A00517"     # Red - error messages
text_warning = "#A94B0E"   # Orange - warning messages
text_success = "#017646"   # Green - success messages
text_info = "#0068BE"      # Blue - informational text

# =============================================================================
# PROCESS STATUS COLORS
# Colors for process states in the process list
# =============================================================================
[status]
running = "#065F2D"    # Deep green - active/running (R)
sleeping = "#5730DE"   # Violet - sleeping (S)
disk_sleep = "#8A4300" # Orange - uninterruptible I/O (D)
zombie = "#B1001A"     # Red - defunct process (Z)
stopped = "#AC004D"    # Hot Pink - stopped/traced (T/t)
idle = "#565656"       # Light gray - idle kernel thread (I)

# =============================================================================
# CHART LINE COLORS
# Colors for specific metric lines in graphs
# =============================================================================
[charts]
cpu = "#1976D2"       # Blue - CPU usage line
memory = "#217202"    # Green - memory usage line
io = "#B6684D"        # Rust orange - I/O read usage line
io_write = "#69541F"        # Sand - I/O write usage line
net_tx = "#A56507"          # Amber - Network transmit (sent) line
net_rx = "#0094B1"          # Electric Cyan - Network receive line
cpu_fill = "#1976D24D"       # Blue with 30% alpha - CPU fill
memory_fill = "#2172024D"    # Green with 30% alpha - memory fill
io_fill = "#B6684D4D"        # Rust orange with 30% alpha - I/O read fill
io_write_fill = "#69541F4D"   # Sand with 30% alpha - I/O write fill
net_tx_fill = "#A565074D"    # Amber with 30% alpha - Network TX fill
net_rx_fill = "#0094B14D"    # Electric Cyan with 30% alpha - Network RX fill
peak_line = "#9B4C00B3"      # Orange with 70% alpha - peak reference line

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#1976D2"   # Blue - CPU Total line over the User/System bands
memory_cached = "#094D3E"   # Deep teal - Memory: Cached (also Process Shared)
swap          = "#805BF6"   # Violet - Memory: Swap (also Process Virtual)
power         = "#6C732C"   # Olive - Power draw: system, process and GPU
battery       = "#067A73"   # Teal - Battery charge
threads       = "#C33388"   # Magenta - Thread count
handles       = "#414851"   # Gray - Handles / file descriptors
page_faults   = "#5437DE"   # Violet - Page faults per second
gdi           = "#0A6F61"   # Teal - GDI objects (Windows)

# =============================================================================
# GPU METRICS COLORS
# Colors for GPU monitoring graphs, bars, and badges
# =============================================================================
[charts.gpu]
utilization = "#9C1488"           # Magenta - GPU utilization line
utilization_fill = "#9C14884D"    # Magenta with 30% alpha - GPU fill
memory = "#457A25"                # Green - GPU memory line
memory_fill = "#457A254D"         # Green with 30% alpha - GPU memory fill
temperature = "#9F8518"           # Olive - GPU temperature line
power = "#6C732C"                 # Olive - GPU power draw line
encoder = "#0097A7"               # Teal - GPU encoder utilization
decoder = "#A24FB5"               # Magenta - GPU decoder utilization
clock = "#815CFF"             # Vivid Violet - GPU clock speed line (theme-native)
clock_fill = "#815CFFCC"      # Vivid Violet with 80% alpha - GPU clock fill
fan = "#E134ED"               # Magenta - GPU fan speed line (theme-native)

# =============================================================================
# CPU BREAKDOWN COLORS
# Colors for the stacked CPU usage bar
# =============================================================================
[cpu_breakdown]
user = "#004DA3"      # Blue - user CPU time
system = "#BA1755"    # Rose - system/kernel time
iowait = "#C5770E"    # Orange - I/O wait time
idle = "#B0B0B0"      # Light gray - idle time
user_fill = "#004DA359"      # Blue with 35% alpha - user fill
system_fill = "#BA175559"    # Rose with 35% alpha - system fill
iowait_fill = "#C5770E59"    # Orange with 35% alpha - iowait fill
idle_fill = "#B0B0B033"      # Light gray with 20% alpha - idle fill

[priority]
high   = "#FF315A"     # Crimson Neon (accents[4])
normal = "#7DFF5A"     # Neon Lime (accents[3])
low    = "#815CFF"     # Vivid Violet (accents[2])
badge_text_color = "#1A1A1A"  # Preferred badge text; a fill it is too faint on gets the other text colour (#1130)

[buttons.close]
hovered = "#CC1A1A"     # Dark red hover
active  = "#E63333"     # Brighter red active

[buttons.success]
normal = "#0097A7"     # Cyan
hovered = "#00ACC1"    # Bright cyan
active = "#00838F"     # Dark cyan

# =============================================================================
# WINDOW COLORS
# Base colors for windows, popups, and borders
# =============================================================================
[ui.window]
background = "#F7F4FC"            # Cool violet-tinted light base
child_background = "#F7F4FC00"    # Transparent
popup_background = "#F3EDFBF0"    # Violet-tinted popup, semi-opaque (F0 = 94%)
border = "#D7CFF580"              # Soft violet-gray border (80 = 50%)
border_shadow = "#00000000"       # Transparent - no border shadow

# =============================================================================
# FRAME COLORS
# Input fields, combo boxes, sliders background
# =============================================================================
[ui.frame]
background = "#F0ECF8"
background_hovered = "#E6DFF5"
background_active = "#DBD2F0"

# =============================================================================
# TITLE BAR COLORS
# Window title bars
# =============================================================================
[ui.title]
background = "#EFE9F7"
background_active = "#E4DAF3"
background_collapsed = "#EFE9F780"    # 80 = 50% alpha

# =============================================================================
# BAR COLORS
# Menu bar and status bar
# =============================================================================
[ui.bars]
menu = "#EFE9F7"
status = "#E6DFF5"

# =============================================================================
# SCROLLBAR COLORS
# =============================================================================
[ui.scrollbar]
background = "#F5F5F580"          # 80 = 50% alpha
grab = "#BBBBBB"
grab_hovered = "#999999"
grab_active = "#777777"

# =============================================================================
# CONTROL COLORS
# Checkboxes, sliders, etc.
# =============================================================================
[ui.controls]
check_mark = "#815CFF"
slider_grab = "#815CFF"
slider_grab_active = "#6B4CE6"

# =============================================================================
# BUTTON COLORS
# Standard buttons (not danger buttons)
# =============================================================================
[ui.button]
normal = "#D8D0E8"          # Visible purple-tinted gray
hovered = "#C8C0E0"          # Darker on hover
active = "#9C27B0"           # Purple on click

# =============================================================================
# HEADER COLORS
# Collapsible headers, tree nodes
# =============================================================================
[ui.header]
normal = "#D3C7EA"
hovered = "#E5DEF3"
active = "#7C4DFF"

# =============================================================================
# SEPARATOR COLORS
# Horizontal/vertical separators
# =============================================================================
[ui.separator]
normal = "#CCCCCC80"              # 80 = 50% alpha
hovered = "#FF4081"
active = "#7C4DFF"

# =============================================================================
# RESIZE GRIP COLORS
# Window resize handles
# =============================================================================
[ui.resize_grip]
normal = "#BBBBBB33"              # 33 = 20% alpha
hovered = "#FF4081"
active = "#7C4DFF"

# =============================================================================
# TAB COLORS
# Tab bar tabs
# =============================================================================
[ui.tab]
normal = "#D5C7ED"
hovered = "#7C4DFF"
active = "#F0E8FA"
active_overline = "#FF2670"           # Hot pink accent overline for visibility
unfocused = "#F0EAF8"
unfocused_active = "#E8E0F5"
unfocused_active_overline = "#FF267080" # Semi-transparent pink overline

# =============================================================================
# DOCKING COLORS
# Docking preview and empty space
# =============================================================================
[ui.docking]
preview = "#7C4DFFB3"             # B3 = 70% alpha
empty_background = "#FAFAFA"

# =============================================================================
# PLOT COLORS
# ImGui plot widgets
# =============================================================================
[ui.plot]
grid = "#CAC2E7"
lines = "#1976D2"
lines_hovered = "#D32F2F"
histogram = "#388E3C"
histogram_hovered = "#76FF03"

# =============================================================================
# TABLE COLORS
# Table widget colors
# =============================================================================
[ui.table]
header_background = "#F5F5F5"
border_strong = "#CCCCCC"
border_light = "#E0E0E0"
row_background = "#00000000"      # Transparent
row_background_alt = "#00000008"  # 08 = 3% alpha

# =============================================================================
# MISCELLANEOUS UI COLORS
# =============================================================================
[ui.misc]
text_selected_background = "#7C4DFF59"    # 59 = 35% alpha
drag_drop_target = "#FFD600"
nav_highlight = "#FF4081"
nav_windowing_highlight = "#00000066"     # 66 = 40% alpha
nav_windowing_dim_background = "#00000033" # 33 = 20% alpha
modal_window_dim_background = "#00000099"  # 99 = 60% alpha
