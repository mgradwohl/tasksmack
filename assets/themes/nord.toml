# Nord Theme
# Arctic polar palette - blue-gray tones with cool, muted accents
# Inspired by the Nord color palette (nordtheme.com)
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Nord"
description = "Arctic polar palette - blue-gray tones with cool, muted accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#88C0D0",  # Nord Frost 2 (cyan-blue)
    "#D2727A",  # Aurora Red
    "#A3BE8C",  # Aurora Green
    "#B18FAB",  # Aurora Purple
    "#F1CF88",  # Aurora Yellow
    "#D08770",  # Aurora Orange
    "#81A1C1",  # Nord Frost 3 (blue)
    "#6D90BC",  # Nord Frost 4 (deep blue)
]

[semantic]
text_primary = "#ECEFF4"
text_disabled = "#D8DEE9"
text_muted = "#D8DEE9"
text_error = "#FDB4B8"
text_warning = "#EDD69D"
text_success = "#87BD76"
text_info = "#88C0D0"

[status]
running = "#ADCA8C"
sleeping = "#8FC7D7"
disk_sleep = "#EBCB8B"
zombie = "#FFA6AC"
stopped = "#F9AC93"
idle = "#B5BFD6"

[charts]
cpu = "#829CBD"
memory = "#9AB198"
io = "#D68D5F"
io_write = "#ADA688"
net_tx = "#F3BE8D"
net_rx = "#9CCED1"
cpu_fill = "#829CBD4D"
memory_fill = "#9AB1984D"
io_fill = "#D68D5F4D"
io_write_fill = "#ADA6884D"
net_tx_fill = "#F3BE8D4D"
net_rx_fill = "#9CCED14D"
peak_line = "#ECEFF4B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#829CBD"   # Blue - CPU Total line over the User/System bands
memory_cached = "#D3F9E3"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#A298BB"   # Violet - Memory: Swap (also Process Virtual)
power         = "#F3FDBB"   # Pale yellow - Power draw: system, process and GPU
battery       = "#8BC2BC"   # Teal - Battery charge
threads       = "#CF92AF"   # Magenta - Thread count
handles       = "#C7CACE"   # Gray - Handles / file descriptors
page_faults   = "#C2C5F0"   # Violet - Page faults per second
gdi           = "#86C0A5"   # Green - GDI objects (Windows)

[charts.gpu]
utilization = "#B48EAD"
utilization_fill = "#B48EAD4D"
memory = "#A8D8BC"
memory_fill = "#A8D8BC4D"
temperature = "#D08770"
power = "#F3FDBB"
encoder = "#98C1CC"
decoder = "#AAA5DD"
clock = "#B2D8FF"
clock_fill = "#B2D8FFCC"
fan = "#848EA4"

[cpu_breakdown]
user = "#B2ECFD"
system = "#F7B199"
iowait = "#FBBF6B"
idle = "#4C566A"
user_fill = "#B2ECFD59"
system_fill = "#F7B19959"
iowait_fill = "#FBBF6B59"
idle_fill = "#4C566A33"

[priority]
high   = "#BF616A"
normal = "#A3BE8C"
low    = "#81A1C1"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#A3BE8C"
hovered = "#AECF9C"
active = "#8CAE6A"

[ui.window]
background = "#2E3440"
child_background = "#2E344000"
popup_background = "#3B4252F0"
border = "#4C566A80"
border_shadow = "#00000000"

[ui.frame]
background = "#3B4252"
background_hovered = "#434C5E"
background_active = "#4C566A"

[ui.title]
background = "#2E3440"
background_active = "#3B4252"
background_collapsed = "#2E344080"

[ui.bars]
menu = "#3B4252"
status = "#2E3440"

[ui.scrollbar]
background = "#2E344080"
grab = "#4C566A"
grab_hovered = "#81A1C1"
grab_active = "#88C0D0"

[ui.controls]
check_mark = "#88C0D0"
slider_grab = "#88C0D0"
slider_grab_active = "#81A1C1"

[ui.button]
normal = "#3B4252"
hovered = "#434C5E"
active = "#88C0D0"

[ui.header]
normal = "#454D5F"
hovered = "#39404F"
active = "#4C566A"

[ui.separator]
normal = "#4C566A80"
hovered = "#88C0D0"
active = "#81A1C1"

[ui.resize_grip]
normal = "#4C566A33"
hovered = "#88C0D0"
active = "#81A1C1"

[ui.tab]
normal = "#3B4252"
hovered = "#434C5E"
active = "#4C566A"
active_overline = "#88C0D0"
unfocused = "#2E3440"
unfocused_active = "#3B4252"
unfocused_active_overline = "#88C0D080"

[ui.docking]
preview = "#88C0D0B3"
empty_background = "#2E3440"

[ui.plot]
grid = "#505A6E"
lines = "#88C0D0"
lines_hovered = "#BF616A"
histogram = "#A3BE8C"
