[ui.table]
header_background = "#3B4252"
border_strong = "#434C5E"
border_light = "#3B4252"
row_background = "#00000000"
row_background_alt = "#FFFFFF06"

[ui.misc]
text_selected_background = "#88C0D059"
drag_drop_target = "#EBCB8B"
nav_highlight = "#88C0D0"
nav_windowing_highlight = "#FFFFFFB3"
nav_windowing_dim_background = "#CCCCCC33"
modal_window_dim_background = "#00000099"
