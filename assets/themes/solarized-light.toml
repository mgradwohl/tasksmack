# Solarized Light Theme
# Ethan Schoonover's precision color scheme for light backgrounds
# Inverted base tones for bright environments while preserving accent relationships
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Solarized Light"
description = "Ethan Schoonover's precision color scheme for light backgrounds"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#2075BA",  # Dark blue
    "#4A6600",  # Dark green
    "#1D8C82",  # Dark cyan
    "#8F7606",  # Dark yellow
    "#9F563A",  # Dark orange
    "#5A5AAA",  # Dark violet
    "#B02662",  # Dark magenta
    "#C0291F",  # Dark red
]

[semantic]
text_primary = "#2E3E43"
text_disabled = "#93A1A1"
text_muted = "#586566"
text_error = "#9A4948"
text_warning = "#57431F"
text_success = "#4A6600"
text_info = "#0066A7"

[status]
running = "#466000"
sleeping = "#005B96"
disk_sleep = "#6F5300"
zombie = "#B30017"
stopped = "#AB0062"
idle = "#4D5A5A"

[charts]
cpu = "#2075BA"
memory = "#166C2D"
io = "#A1532A"
io_write = "#56553C"
net_tx = "#AF6F05"
net_rx = "#118B84"
cpu_fill = "#2075BA4D"
memory_fill = "#166C2D4D"
io_fill = "#A1532A4D"
io_write_fill = "#56553C4D"
net_tx_fill = "#AF6F054D"
net_rx_fill = "#118B844D"
peak_line = "#485D65B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#2075BA"   # Blue - CPU Total line over the User/System bands
memory_cached = "#033F20"   # Deep green - Memory: Cached (also Process Shared)
swap          = "#703F93"   # Violet - Memory: Swap (also Process Virtual)
power         = "#8C870A"   # Olive - Power draw: system, process and GPU
battery       = "#168F86"   # Teal - Battery charge
threads       = "#BA1F55"   # Rose - Thread count
handles       = "#5F6671"   # Gray - Handles / file descriptors
page_faults   = "#5D5FAE"   # Violet - Page faults per second
gdi           = "#236353"   # Teal - GDI objects (Windows)

[charts.gpu]
utilization = "#8C187B"
utilization_fill = "#8C187B4D"
memory = "#1A6945"
memory_fill = "#1A69454D"
temperature = "#755C16"
power = "#8C870A"
encoder = "#1D8C82"
decoder = "#BD1E53"
clock = "#2075BA"
clock_fill = "#2075BACC"
fan = "#798686"

[cpu_breakdown]
user = "#004D8D"
system = "#9C5B3B"
iowait = "#A67D00"
idle = "#C0BFB3"
user_fill = "#004D8D59"
system_fill = "#9C5B3B59"
iowait_fill = "#A67D0059"
idle_fill = "#C0BFB333"

[priority]
high   = "#DC322F"
normal = "#4A6600"
low    = "#2075BA"
badge_text_color = "#1A1A1A"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#4A6600"
hovered = "#5E8000"
active = "#3A5200"

[ui.window]
background = "#FDF6E3"
child_background = "#FDF6E300"
popup_background = "#EEE8D5F0"
border = "#C5BEAB80"
border_shadow = "#00000000"

[ui.frame]
background = "#EEE8D5"
background_hovered = "#DDD6C5"
background_active = "#CCC5B0"

[ui.title]
background = "#EEE8D5"
background_active = "#DDD6C5"
background_collapsed = "#EEE8D580"

[ui.bars]
menu = "#EEE8D5"
status = "#E5DFD0"

[ui.scrollbar]
background = "#FDF6E380"
grab = "#C5BEAB"
grab_hovered = "#93A1A1"
grab_active = "#657B83"

[ui.controls]
check_mark = "#2075BA"
slider_grab = "#2075BA"
slider_grab_active = "#1960A0"

[ui.button]
normal = "#EEE8D5"
hovered = "#DDD6C5"
active = "#2075BA"

[ui.header]
normal = "#DBCEA6"
hovered = "#ECE2C4"
active = "#CCC5B0"

[ui.separator]
normal = "#C5BEAB80"
hovered = "#2075BA"
active = "#1D8C82"

[ui.resize_grip]
normal = "#2075BA33"
hovered = "#2075BA"
active = "#1D8C82"

[ui.tab]
normal = "#E2D7B6"
hovered = "#DDD6C5"
active = "#FDF6E3"
active_overline = "#2075BA"
unfocused = "#FDF6E3"
unfocused_active = "#EEE8D5"
unfocused_active_overline = "#2075BA80"

[ui.docking]
preview = "#2075BAB3"
empty_background = "#FDF6E3"

[ui.plot]
grid = "#C9C2AF"
lines = "#2075BA"
lines_hovered = "#DC322F"
histogram = "#4A6600"
histogram_hovered = "#B58900"

[ui.table]
header_background = "#F5F0E5"
border_strong = "#D5CFC0"
border_light = "#E8E2D5"
row_background = "#00000000"
row_background_alt = "#00000008"

[ui.misc]
text_selected_background = "#2075BA59"
drag_drop_target = "#B58900"
nav_highlight = "#2075BA"
nav_windowing_highlight = "#00000066"
nav_windowing_dim_background = "#00000033"
modal_window_dim_background = "#00000099"
