# Gruvbox Theme
# Retro groove dark theme with warm earthy tones
# Based on the Gruvbox color palette by morhetz
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Gruvbox"
description = "Retro groove dark theme with warm earthy tones"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#83A598",  # Bright Blue (aqua-blue)
    "#FB4934",  # Bright Red
    "#B8BB26",  # Bright Yellow-Green
    "#EE97AF",  # Bright Purple
    "#F9C86D",  # Bright Yellow
    "#8EC07C",  # Bright Aqua
    "#FE8019",  # Bright Orange
    "#928374",  # Neutral Gray
]

[progress]
low = "#BBB868"       # 0-50%   - Bright green-yellow (healthy)
medium = "#FABD2F"    # 50-80%  - Bright yellow (caution)
high = "#FB4934"      # 80-100% - Bright red (critical)

[semantic]
text_primary = "#EBDBB2"
text_disabled = "#928374"
text_muted = "#B0A18C"
text_error = "#F78068"
text_warning = "#FDCA89"
text_success = "#B8BB26"
text_info = "#88AA9D"

[status]
running = "#B8BB26"
sleeping = "#94B7A9"
disk_sleep = "#FABD2F"
zombie = "#FF917A"
stopped = "#E799AE"
idle = "#BDAD9D"

[charts]
cpu = "#769DC9"
memory = "#8EBE75"
io = "#F37A21"
io_write = "#A4936A"
net_tx = "#FABD2F"
net_rx = "#7BC1C8"
cpu_fill = "#769DC94D"
memory_fill = "#8EBE754D"
io_fill = "#F37A214D"
io_write_fill = "#A4936A4D"
net_tx_fill = "#FABD2F4D"
net_rx_fill = "#7BC1C84D"
peak_line = "#EBDBB2B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#769DC9"   # Blue - CPU Total line over the User/System bands
memory_cached = "#C0EDC8"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#9B8FD4"   # Violet - Memory: Swap (also Process Virtual)
power         = "#C4B470"   # Olive - Power draw: system, process and GPU
battery       = "#79CCC4"   # Teal - Battery charge
threads       = "#CB86B9"   # Magenta - Thread count
handles       = "#ADADAD"   # Gray - Handles / file descriptors
page_faults   = "#B1B7E3"   # Violet - Page faults per second
gdi           = "#80D8D1"   # Teal - GDI objects (Windows)

[charts.gpu]
utilization = "#C277BF"
utilization_fill = "#C277BF4D"
memory = "#8EC07C"
memory_fill = "#8EC07C4D"
temperature = "#FABD2F"
power = "#C4B470"
encoder = "#FE8019"
decoder = "#D6B9DE"
clock = "#928374"
clock_fill = "#928374CC"
fan = "#928374"

[cpu_breakdown]
user = "#B3D7F0"
system = "#F5860F"
iowait = "#FABD2F"
idle = "#504945"
user_fill = "#B3D7F059"
system_fill = "#F5860F59"
iowait_fill = "#FABD2F59"
idle_fill = "#50494533"

[priority]
high   = "#FB4934"
normal = "#B8BB26"
low    = "#83A598"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#458588"
hovered = "#83A598"
active = "#35676A"

[ui.window]
background = "#282828"
child_background = "#1D202100"
popup_background = "#1D2021F0"
border = "#50494580"
border_shadow = "#00000000"

[ui.frame]
background = "#3C3836"
background_hovered = "#504945"
background_active = "#665C54"

[ui.title]
background = "#1D2021"
background_active = "#3C3836"
background_collapsed = "#1D202180"

[ui.bars]
menu = "#1D2021"
status = "#282828"

[ui.scrollbar]
background = "#28282880"
grab = "#3C3836"
grab_hovered = "#504945"
grab_active = "#665C54"

[ui.controls]
check_mark = "#B8BB26"
slider_grab = "#83A598"
slider_grab_active = "#458588"

[ui.button]
normal = "#3C3836"
hovered = "#504945"
active = "#83A598"

[ui.header]
normal = "#444240"
hovered = "#363534"
active = "#3C3836"

[ui.separator]
normal = "#504945B0"
hovered = "#83A598"
active = "#8EC07C"

[ui.resize_grip]
normal = "#83A59833"
hovered = "#83A598"
active = "#8EC07C"

[ui.tab]
normal = "#3F3B38"
hovered = "#504945"
active = "#282828"
active_overline = "#83A598"
unfocused = "#282828"
unfocused_active = "#3C3836"
unfocused_active_overline = "#83A59880"

[ui.docking]
preview = "#83A598B3"
empty_background = "#282828"

[ui.plot]
grid = "#57504C"
lines = "#83A598"
lines_hovered = "#FB4934"
histogram = "#B8BB26"
histogram_hovered = "#FABD2F"

[ui.table]
header_background = "#3C3836"
border_strong = "#504945"
border_light = "#3C3836"
row_background = "#00000000"
row_background_alt = "#FFFFFF07"

[ui.misc]
