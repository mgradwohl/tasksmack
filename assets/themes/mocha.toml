# Mocha Theme
# Catppuccin Mocha - warm dark background with pastel neon accents
# Part of the Catppuccin color scheme family (catppuccin.com)
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Mocha"
description = "Catppuccin Mocha - warm dark background with pastel neon accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#89B4FA",  # Blue
    "#F38BA8",  # Red/Pink
    "#A6E3A1",  # Green
    "#B39DCC",  # Mauve
    "#FAA773",  # Peach
    "#F5C2E7",  # Pink (Flamingo)
    "#F9E2AF",  # Yellow
    "#74C7EC",  # Sapphire
]

[semantic]
text_primary = "#CDD6F4"
text_disabled = "#6C7086"
text_muted = "#959BB4"
text_error = "#F38BA8"
text_warning = "#FAA773"
text_success = "#A6E3A1"
text_info = "#89B4FA"

[status]
running = "#A6E3A1"
sleeping = "#89B4FA"
disk_sleep = "#FAB387"
zombie = "#F38BA8"
stopped = "#CBA6F7"
idle = "#A5A8C0"

[charts]
cpu = "#89B4FA"
memory = "#ACD865"
io = "#FEC1AC"
io_write = "#A6A084"
net_tx = "#E5B672"
net_rx = "#94E2D5"
cpu_fill = "#89B4FA4D"
memory_fill = "#ACD8654D"
io_fill = "#FEC1AC4D"
io_write_fill = "#A6A0844D"
net_tx_fill = "#E5B6724D"
net_rx_fill = "#94E2D54D"
peak_line = "#CDD6F4B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#89B4FA"   # Blue - CPU Total line over the User/System bands
memory_cached = "#CBF6DB"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#AF99C7"   # Violet - Memory: Swap (also Process Virtual)
power         = "#FEF18F"   # Pale yellow - Power draw: system, process and GPU
battery       = "#90E1D7"   # Pale teal - Battery charge
threads       = "#D88FC4"   # Magenta - Thread count
handles       = "#BDC3CA"   # Gray - Handles / file descriptors
page_faults   = "#BEC6F6"   # Blue - Page faults per second
gdi           = "#A8E4CB"   # Pale green - GDI objects (Windows)

[charts.gpu]
utilization = "#FFCAEC"
utilization_fill = "#FFCAEC4D"
memory = "#8CECC9"
memory_fill = "#8CECC94D"
temperature = "#E8B09E"
power = "#FEF18F"
encoder = "#5589A1"
decoder = "#A593CD"
clock = "#95BCFB"
clock_fill = "#95BCFBCC"
fan = "#797C92"

[cpu_breakdown]
user = "#B8E2FF"
system = "#EEA645"
iowait = "#E8BF96"
idle = "#45475A"
user_fill = "#B8E2FF59"
system_fill = "#EEA64559"
iowait_fill = "#E8BF9659"
idle_fill = "#45475A33"

[priority]
high   = "#F38BA8"
normal = "#A6E3A1"
low    = "#89B4FA"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#A6E3A1"
hovered = "#BAF0BB"
active = "#85C992"

[ui.window]
background = "#1E1E2E"
child_background = "#18182500"
popup_background = "#181825F0"
border = "#45475A80"
border_shadow = "#00000000"

[ui.frame]
background = "#313244"
background_hovered = "#45475A"
background_active = "#585B70"

[ui.title]
background = "#181825"
background_active = "#313244"
background_collapsed = "#18182580"

[ui.bars]
menu = "#181825"
status = "#1E1E2E"

[ui.scrollbar]
background = "#1E1E2E80"
grab = "#45475A"
grab_hovered = "#585B70"
grab_active = "#6C7086"

[ui.controls]
check_mark = "#A6E3A1"
slider_grab = "#CBA6F7"
slider_grab_active = "#89B4FA"

[ui.button]
normal = "#313244"
hovered = "#45475A"
active = "#CBA6F7"

[ui.header]
normal = "#3B3C55"
hovered = "#323349"
active = "#313244"

[ui.separator]
normal = "#45475A80"
hovered = "#89B4FA"
active = "#74C7EC"

[ui.resize_grip]
normal = "#CBA6F733"
hovered = "#CBA6F7"
active = "#89B4FA"

[ui.tab]
normal = "#181825"
hovered = "#313244"
active = "#2E2E47"
active_overline = "#CBA6F7"
unfocused = "#181825"
unfocused_active = "#1E1E2E"
unfocused_active_overline = "#CBA6F780"

[ui.docking]
preview = "#CBA6F7B3"
empty_background = "#1E1E2E"

[ui.plot]
grid = "#494B5E"
lines = "#89B4FA"
lines_hovered = "#F38BA8"
histogram = "#A6E3A1"
histogram_hovered = "#FAB387"

[ui.table]
header_background = "#313244"
border_strong = "#45475A"
border_light = "#313244"
row_background = "#00000000"
row_background_alt = "#FFFFFF08"

[ui.misc]
text_selected_background = "#89B4FA59"
drag_drop_target = "#FAB387"
nav_highlight = "#CBA6F7"
nav_windowing_highlight = "#FFFFFFB3"
nav_windowing_dim_background = "#CCCCCC33"
modal_window_dim_background = "#00000099"
