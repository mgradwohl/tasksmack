# Tokyo Night Theme
# Dark urban night sky - deep navy with vibrant city-light accents
# Inspired by the Tokyo Night color palette
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Tokyo Night"
description = "Dark urban night sky - deep navy with vibrant city-light accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#7AA2F7",  # Blue
    "#F7768E",  # Red/Pink
    "#9ECE6A",  # Green
    "#CCB3F5",  # Purple/Magenta
    "#C2A279",  # Yellow/Amber
    "#7DCFFF",  # Cyan
    "#FF9E64",  # Orange
    "#2AC3DE",  # Teal
]

[progress]
low = "#BFDF99"       # 0-50%   - Green (healthy)
medium = "#E0AF68"    # 50-80%  - Amber (caution)
high = "#F7768E"      # 80-100% - Red/Pink (critical)

[semantic]
text_primary = "#C0CAF5"
text_disabled = "#565F89"
text_muted = "#A9B1D6"
text_error = "#F7768E"
text_warning = "#C1934E"
text_success = "#A5CC68"
text_info = "#7AA2F7"

[status]
running = "#9FCE5E"
sleeping = "#7DA5FA"
disk_sleep = "#E0AF68"
zombie = "#FF7D95"
stopped = "#BB9AF7"
idle = "#9EA4C9"

[charts]
cpu = "#689FF1"
memory = "#79DA8C"
io = "#FBA164"
io_write = "#9A8D61"
net_tx = "#F3CD9B"
net_rx = "#5ED2DF"
cpu_fill = "#689FF14D"
memory_fill = "#79DA8C4D"
io_fill = "#FBA1644D"
io_write_fill = "#9A8D614D"
net_tx_fill = "#F3CD9B4D"
net_rx_fill = "#5ED2DF4D"
peak_line = "#C0CAF5B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#689FF1"   # Blue - CPU Total line over the User/System bands
memory_cached = "#C6F1CE"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#C095EB"   # Violet - Memory: Swap (also Process Virtual)
power         = "#F7E56E"   # Pale yellow - Power draw: system, process and GPU
battery       = "#63DFCB"   # Teal - Battery charge
threads       = "#C96B91"   # Rose - Thread count
handles       = "#B0B6C1"   # Gray - Handles / file descriptors
page_faults   = "#99A1D7"   # Blue - Page faults per second
gdi           = "#7CF4EB"   # Pale teal - GDI objects (Windows)

[charts.gpu]
utilization = "#D66BAF"
utilization_fill = "#D66BAF4D"
memory = "#68DA9A"
memory_fill = "#68DA9A4D"
temperature = "#F3B171"
power = "#F7E56E"
encoder = "#78E2D1"
decoder = "#CCA6FC"
clock = "#718CF3"
clock_fill = "#718CF3CC"
fan = "#6E76A2"

[cpu_breakdown]
user = "#ABD0FF"
system = "#FDB69E"
iowait = "#EDB457"
idle = "#414868"
user_fill = "#ABD0FF59"
system_fill = "#FDB69E59"
iowait_fill = "#EDB45759"
idle_fill = "#41486833"

[priority]
high   = "#F7768E"
normal = "#9ECE6A"
low    = "#7AA2F7"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#4A7825"
hovered = "#9ECE6A"
active = "#38601C"

[ui.window]
background = "#1A1B26"
child_background = "#16161E00"
popup_background = "#16161EF0"
border = "#29303E80"
border_shadow = "#00000000"

[ui.frame]
background = "#292E42"
background_hovered = "#343B58"
background_active = "#414868"

[ui.title]
background = "#16161E"
background_active = "#292E42"
background_collapsed = "#16161E80"

[ui.bars]
menu = "#16161E"
status = "#1A1B26"

[ui.scrollbar]
background = "#1A1B2680"
grab = "#292E42"
grab_hovered = "#414868"
grab_active = "#565F89"

[ui.controls]
check_mark = "#9ECE6A"
slider_grab = "#7AA2F7"
slider_grab_active = "#6A92E7"

[ui.button]
normal = "#292E42"
hovered = "#343B58"
active = "#7AA2F7"

[ui.header]
normal = "#363A52"
hovered = "#2D3145"
active = "#292E42"

[ui.separator]
normal = "#41486880"
hovered = "#7AA2F7"
active = "#7DCFFF"

[ui.resize_grip]
normal = "#7AA2F733"
hovered = "#7AA2F7"
active = "#7DCFFF"

[ui.tab]
