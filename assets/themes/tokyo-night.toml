grab = "#292E42"
grab_hovered = "#414868"
grab_active = "#565F89"

[ui.controls]
check_mark = "#9ECE6A"
slider_grab = "#7AA2F7"
slider_grab_active = "#6A92E7"

[ui.button]
normal = "#292E42"
hovered = "#343B58"
active = "#7AA2F7"

[ui.header]
normal = "#292E4280"
hovered = "#343B58"
active = "#292E42"

[ui.separator]
