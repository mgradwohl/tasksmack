# Dracula Theme
# Iconic dark purple theme with vivid neon accents
# Based on the Dracula color palette (draculatheme.com)
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Dracula"
description = "Iconic dark purple theme with vivid neon accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#FF79C6",  # Pink
    "#8BE9FD",  # Cyan
    "#50FA7B",  # Green
    "#BD93F9",  # Purple
    "#ECA24F",  # Orange
    "#FF5E5C",  # Red
    "#F1FA8C",  # Yellow
    "#8594C8",  # Comment (muted blue)
]

[progress]
low = "#50FA7B"       # 0-50%   - Green (healthy)
medium = "#FFA73C"    # 50-80%  - Orange (caution)
high = "#FF5E5C"      # 80-100% - Red (critical)

[semantic]
text_primary = "#F8F8F2"
text_disabled = "#6272A4"
text_muted = "#A7B5EC"
text_error = "#FF9D94"
text_warning = "#FFA73C"
text_success = "#50FA7B"
text_info = "#8BE9FD"

[status]
running = "#50FA7B"
sleeping = "#8BE9FD"
disk_sleep = "#FFB86C"
zombie = "#FF9A91"
stopped = "#FF93CF"
idle = "#A5B4EA"

[charts]
cpu = "#5BADFC"
memory = "#75FEC0"
io = "#FC8429"
io_write = "#A39B61"
net_tx = "#FDC793"
net_rx = "#4BD9E6"
cpu_fill = "#5BADFC4D"
memory_fill = "#75FEC04D"
io_fill = "#FC84294D"
io_write_fill = "#A39B614D"
net_tx_fill = "#FDC7934D"
net_rx_fill = "#4BD9E64D"
peak_line = "#F8F8F2B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#5BADFC"   # Blue - CPU Total line over the User/System bands
memory_cached = "#DDFFEC"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#C894FD"   # Violet - Memory: Swap (also Process Virtual)
power         = "#F4E954"   # Pale yellow - Power draw: system, process and GPU
battery       = "#76CDC2"   # Teal - Battery charge
threads       = "#F66CC2"   # Magenta - Thread count
handles       = "#BCC5CE"   # Gray - Handles / file descriptors
page_faults   = "#A5B4E9"   # Blue - Page faults per second
gdi           = "#64CFAA"   # Green - GDI objects (Windows)

[charts.gpu]
utilization = "#DF6CD0"
utilization_fill = "#DF6CD04D"
memory = "#78FDBE"
memory_fill = "#78FDBE4D"
temperature = "#EB9A68"
power = "#F4E954"
encoder = "#8BE9FD"
decoder = "#BAAFFB"
clock = "#8E98AC"
clock_fill = "#8E98ACCC"
fan = "#9194A9"

[cpu_breakdown]
user = "#B1E1FD"
system = "#FA935E"
iowait = "#FECA98"
idle = "#44475A"
user_fill = "#B1E1FD59"
system_fill = "#FA935E59"
iowait_fill = "#FECA9859"
idle_fill = "#44475A33"

[priority]
high   = "#FF5555"
normal = "#50FA7B"
low    = "#BD93F9"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#279847"
hovered = "#50FA7B"
active = "#1D7A39"

[ui.window]
background = "#282A36"
child_background = "#21222C00"
popup_background = "#21222CF0"
border = "#6272A480"
border_shadow = "#00000000"

[ui.frame]
background = "#44475A"
background_hovered = "#525563"
background_active = "#6272A4"

[ui.title]
background = "#21222C"
background_active = "#44475A"
background_collapsed = "#21222C80"

[ui.bars]
menu = "#21222C"
status = "#282A36"

[ui.scrollbar]
background = "#28293680"
grab = "#44475A"
grab_hovered = "#6272A4"
grab_active = "#BD93F9"

[ui.controls]
check_mark = "#50FA7B"
slider_grab = "#BD93F9"
slider_grab_active = "#FF79C6"

[ui.button]
normal = "#44475A"
hovered = "#6272A4"
active = "#BD93F9"

[ui.header]
normal = "#434659"
hovered = "#3B3D4E"
active = "#44475A"

[ui.separator]
normal = "#6272A480"
hovered = "#BD93F9"
active = "#FF79C6"

[ui.resize_grip]
normal = "#BD93F933"
hovered = "#BD93F9"
active = "#FF79C6"

[ui.tab]
normal = "#111116"
hovered = "#44475A"
active = "#282A36"
active_overline = "#BD93F9"
unfocused = "#21222C"
unfocused_active = "#282A36"
unfocused_active_overline = "#BD93F980"

[ui.docking]
preview = "#BD93F9B3"
empty_background = "#282A36"

[ui.plot]
grid = "#555F83"
lines = "#8BE9FD"
lines_hovered = "#FF5555"
histogram = "#50FA7B"
histogram_hovered = "#F1FA8C"

[ui.table]
header_background = "#44475A"
border_strong = "#525563"
border_light = "#44475A"
row_background = "#00000000"
row_background_alt = "#FFFFFF08"

[ui.misc]
text_selected_background = "#6272A459"
drag_drop_target = "#F1FA8C"
nav_highlight = "#BD93F9"
nav_windowing_highlight = "#FFFFFFB3"
nav_windowing_dim_background = "#CCCCCC33"
modal_window_dim_background = "#00000099"
