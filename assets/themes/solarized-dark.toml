# Solarized Dark Theme
# Ethan Schoonover's precision color scheme for dark backgrounds
# Carefully tuned color relationships with semantic meaning
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Solarized Dark"
description = "Ethan Schoonover's precision color scheme for dark backgrounds"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#268BD2",  # Blue
    "#859900",  # Green
    "#2AA198",  # Cyan
    "#BC9B59",  # Yellow
    "#BA6948",  # Orange
    "#6E73C6",  # Violet
    "#D93D87",  # Magenta
    "#E43A35",  # Red
]

[progress]
low = "#859900"       # 0-50%   - Green (healthy)
medium = "#BC9B59"    # 50-80%  - Yellow (caution)
high = "#CA574A"      # 80-100% - Red (critical)

[semantic]
text_primary = "#CEDADC"
text_disabled = "#586E75"
text_muted = "#869DA4"
text_error = "#EE7666"
text_warning = "#DFB458"
text_success = "#8FA315"
text_info = "#469FE7"

[status]
running = "#A5B82F"
sleeping = "#61B4FE"
disk_sleep = "#D7A72E"
zombie = "#FF8F7E"
stopped = "#FF88B8"
idle = "#9BB2BA"

[charts]
cpu = "#268BD2"
memory = "#859900"
io = "#FF6959"
io_write = "#D2511C"
net_tx = "#2AA198"
net_rx = "#6E73C6"
cpu_fill = "#268BD24D"
memory_fill = "#8599004D"
io_fill = "#FF69594D"
io_write_fill = "#D2511C4D"
net_tx_fill = "#2AA1984D"
net_rx_fill = "#6E73C64D"
peak_line = "#93A1A1B3"

[charts.gpu]
utilization = "#6E73C6"
utilization_fill = "#6E73C64D"
memory = "#D93D87"
memory_fill = "#D93D874D"
temperature = "#B58900"
power = "#A5B82F"
encoder = "#2AA198"
decoder = "#FF88B8"
clock = "#469FE7"
clock_fill = "#469FE7CC"
fan = "#697F86"

[cpu_breakdown]
user = "#5FB3FD"
system = "#E43A35"
iowait = "#C09314"
idle = "#586E75"
user_fill = "#5FB3FD59"
system_fill = "#E43A3559"
iowait_fill = "#C0931459"
idle_fill = "#586E7533"

[priority]
high   = "#DC322F"
normal = "#859900"
low    = "#268BD2"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#859900"
hovered = "#9AAF00"
active = "#6A7A00"

[ui.window]
background = "#002B36"
child_background = "#002B3600"
popup_background = "#073642F0"
border = "#586E7580"
border_shadow = "#00000000"

[ui.frame]
background = "#073642"
background_hovered = "#0D4555"
background_active = "#14576A"

[ui.title]
background = "#073642"
background_active = "#073642"
background_collapsed = "#07364280"

[ui.bars]
menu = "#073642"
status = "#073642"

[ui.scrollbar]
background = "#002B3680"
grab = "#073642"
grab_hovered = "#586E75"
grab_active = "#839496"

[ui.controls]
check_mark = "#268BD2"
slider_grab = "#268BD2"
slider_grab_active = "#2075BA"

[ui.button]
normal = "#073642"
hovered = "#0D4555"
active = "#268BD2"

[ui.header]
normal = "#054859"
hovered = "#033947"
active = "#073642"

[ui.separator]
normal = "#586E7580"
hovered = "#268BD2"
active = "#2AA198"

[ui.resize_grip]
normal = "#268BD233"
hovered = "#268BD2"
active = "#2AA198"

[ui.tab]
normal = "#084150"
hovered = "#0D4555"
active = "#002B36"
active_overline = "#268BD2"
unfocused = "#002B36"
unfocused_active = "#073642"
unfocused_active_overline = "#268BD280"

[ui.docking]
preview = "#268BD2B3"
empty_background = "#002B36"

[ui.plot]
