# Solarized Dark Theme
# Ethan Schoonover's precision color scheme for dark backgrounds
# Carefully tuned color relationships with semantic meaning
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Solarized Dark"
description = "Ethan Schoonover's precision color scheme for dark backgrounds"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#268BD2",  # Blue
    "#859900",  # Green
    "#2AA198",  # Cyan
    "#BC9B59",  # Yellow
    "#BA6948",  # Orange
    "#6E73C6",  # Violet
    "#D93D87",  # Magenta
    "#E43A35",  # Red
]

[semantic]
text_primary = "#CEDADC"
text_disabled = "#586E75"
text_muted = "#869DA4"
text_error = "#EE7666"
text_warning = "#E0B761"
text_success = "#87A711"
text_info = "#469FE7"

[status]
running = "#A5B82F"
sleeping = "#61B4FE"
disk_sleep = "#D7A72E"
zombie = "#FF8F7E"
stopped = "#FF88B8"
idle = "#9BB2BA"

[charts]
cpu = "#268BD2"
memory = "#67B758"
io = "#BE693B"
io_write = "#928D68"
net_tx = "#E9992F"
net_rx = "#34C1C0"
cpu_fill = "#268BD24D"
memory_fill = "#67B7584D"
io_fill = "#BE693B4D"
io_write_fill = "#928D684D"
net_tx_fill = "#E9992F4D"
net_rx_fill = "#34C1C04D"
peak_line = "#93A1A1B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#268BD2"   # Blue - CPU Total line over the User/System bands
memory_cached = "#A3E5C6"   # Pale green - Memory: Cached (also Process Shared)
swap          = "#A384D7"   # Violet - Memory: Swap (also Process Virtual)
power         = "#E8D852"   # Pale yellow - Power draw: system, process and GPU
battery       = "#1FA599"   # Teal - Battery charge
threads       = "#E8477B"   # Rose - Thread count
handles       = "#95A7C1"   # Blue - Handles / file descriptors
page_faults   = "#6C74D3"   # Blue - Page faults per second
gdi           = "#1CB5A1"   # Teal - GDI objects (Windows)

[charts.gpu]
utilization = "#C15FAF"
utilization_fill = "#C15FAF4D"
memory = "#5CCA7C"
memory_fill = "#5CCA7C4D"
temperature = "#B58900"
power = "#E8D852"
encoder = "#2AA198"
decoder = "#FF88B8"
clock = "#469FE7"
clock_fill = "#469FE7CC"
fan = "#697F86"

[cpu_breakdown]
user = "#5FB3FD"
system = "#B76845"
iowait = "#C09314"
idle = "#586E75"
user_fill = "#5FB3FD59"
system_fill = "#B7684559"
iowait_fill = "#C0931459"
idle_fill = "#586E7533"

[priority]
high   = "#DC322F"
normal = "#859900"
low    = "#268BD2"
badge_text_color = "#FFFFFF"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#859900"
hovered = "#9AAF00"
active = "#6A7A00"

[ui.window]
background = "#002B36"
child_background = "#002B3600"
popup_background = "#073642F0"
border = "#586E7580"
border_shadow = "#00000000"

[ui.frame]
background = "#073642"
background_hovered = "#0D4555"
background_active = "#14576A"

[ui.title]
background = "#073642"
background_active = "#073642"
background_collapsed = "#07364280"

[ui.bars]
menu = "#073642"
status = "#073642"

[ui.scrollbar]
background = "#002B3680"
grab = "#073642"
grab_hovered = "#586E75"
grab_active = "#839496"

[ui.controls]
check_mark = "#268BD2"
slider_grab = "#268BD2"
slider_grab_active = "#2075BA"

[ui.button]
normal = "#073642"
hovered = "#0D4555"
active = "#268BD2"

[ui.header]
normal = "#054859"
hovered = "#033947"
active = "#073642"

[ui.separator]
normal = "#586E7580"
hovered = "#268BD2"
active = "#2AA198"

[ui.resize_grip]
normal = "#268BD233"
hovered = "#268BD2"
active = "#2AA198"

[ui.tab]
normal = "#084150"
hovered = "#0D4555"
active = "#002B36"
active_overline = "#268BD2"
unfocused = "#002B36"
unfocused_active = "#073642"
unfocused_active_overline = "#268BD280"

[ui.docking]
preview = "#268BD2B3"
empty_background = "#002B36"

[ui.plot]
grid = "#2B4F58"
lines = "#268BD2"
lines_hovered = "#DC322F"
histogram = "#859900"
histogram_hovered = "#B58900"

[ui.table]
header_background = "#073642"
border_strong = "#0D4555"
border_light = "#073642"
row_background = "#00000000"
row_background_alt = "#FFFFFF06"

[ui.misc]
text_selected_background = "#268BD259"
drag_drop_target = "#B58900"
nav_highlight = "#268BD2"
nav_windowing_highlight = "#FFFFFFB3"
nav_windowing_dim_background = "#CCCCCC33"
modal_window_dim_background = "#00000099"
