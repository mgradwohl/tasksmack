# Windows Light Theme
# Inspired by Windows 11 light mode with a cooler, mica-like tint and punchier accents
# Light variant that mirrors the crisp contrast of the dark theme
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Windows Light"
description = "Inspired by Windows 11 light mode - clean and modern"
author = "TaskSmack"
version = "1.0"

# =============================================================================
# ACCENT COLORS
# 8 colors for charts, legends, and UI highlights
# Based on Windows 11 accent colors
# =============================================================================
[accents]
colors = [
    "#0A7ED8",  # Windows Blue (slightly brighter)
    "#E35C63",  # Red
    "#0F8E42",  # Green
    "#9089CA",  # Purple
    "#E86B05",  # Orange
    "#009FAF",  # Teal
    "#B78800",  # Gold
    "#D9008A",  # Magenta
]

# =============================================================================
# SEMANTIC TEXT COLORS
# Colors for different types of text/messages
# =============================================================================
[semantic]
text_primary = "#0F0F0F"   # Near-black for strong contrast on light bg
text_disabled = "#666666"  # Muted gray for disabled text
text_muted = "#6A6A6A"     # Gray - dimmed text
text_error = "#950E16"     # Red - error messages
text_warning = "#BA4300"   # Orange - warning messages
text_success = "#17773A"   # Green - success messages
text_info = "#006BBF"      # Blue - informational text

# =============================================================================
# PROCESS STATUS COLORS
# Colors for process states in the process list
# =============================================================================
[status]
running = "#006605"    # Green - active/running (R)
sleeping = "#00589F"   # Blue - sleeping (S)
disk_sleep = "#9B3600" # Orange - uninterruptible I/O (D)
zombie = "#B30019"     # Red - defunct process (Z)
stopped = "#4D5095"    # Purple - stopped/traced (T/t)
idle = "#575757"       # Gray - idle kernel thread (I)

# =============================================================================
# CHART LINE COLORS
# Colors for specific metric lines in graphs
# =============================================================================
[charts]
cpu = "#0078D4"       # Windows Blue - CPU usage line
memory = "#4F7E0B"    # Lime - memory usage line
io = "#A75E03"        # Orange - I/O read usage line
io_write = "#686339"        # Olive - I/O write usage line
net_tx = "#B58216"          # Amber - Network transmit (sent) line
net_rx = "#009FAF"          # Teal - Network receive line
cpu_fill = "#0078D44D"       # Windows Blue with 30% alpha - CPU fill
memory_fill = "#4F7E0B4D"    # Lime with 30% alpha - memory fill
io_fill = "#A75E034D"        # Orange with 30% alpha - I/O read fill
io_write_fill = "#6863394D"   # Olive with 30% alpha - I/O write fill
net_tx_fill = "#B582164D"    # Amber with 30% alpha - Network TX fill
net_rx_fill = "#009FAF4D"    # Teal with 30% alpha - Network RX fill
peak_line = "#BB4600B3"      # Orange with 70% alpha - peak reference line

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#0078D4"   # Blue - CPU Total line over the User/System bands
memory_cached = "#20593A"   # Deep green - Memory: Cached (also Process Shared)
swap          = "#8C65B7"   # Violet - Memory: Swap (also Process Virtual)
power         = "#88915A"   # Olive - Power draw: system, process and GPU
battery       = "#29878A"   # Teal - Battery charge
threads       = "#B23B5D"   # Rose - Thread count
handles       = "#5A6C80"   # Blue - Handles / file descriptors
page_faults   = "#4E468F"   # Deep violet - Page faults per second
gdi           = "#16816E"   # Teal - GDI objects (Windows)

# =============================================================================
# GPU METRICS COLORS
# Colors for GPU monitoring graphs, bars, and badges
# =============================================================================
[charts.gpu]
utilization = "#B430A8"           # Magenta - GPU utilization line
utilization_fill = "#B430A84D"    # Magenta with 30% alpha - GPU fill
memory = "#169751"                # Green - GPU memory line
memory_fill = "#1697514D"         # Green with 30% alpha - GPU memory fill
temperature = "#F46007"           # Orange - GPU temperature line
power = "#88915A"                 # Olive - GPU power draw line
encoder = "#009FAF"               # Teal - GPU encoder utilization
decoder = "#603280"               # Deep violet - GPU decoder utilization
clock = "#338DE9"             # Windows Blue - GPU clock speed line (theme-native)
clock_fill = "#338DE9CC"      # Windows Blue with 80% alpha - GPU clock fill
fan = "#808080"               # Neutral Gray - GPU fan speed line

# =============================================================================
# CPU BREAKDOWN COLORS
# Colors for the stacked CPU usage bar
# =============================================================================
[cpu_breakdown]
user = "#004FA5"      # Windows Blue - user CPU time
system = "#AC6110"    # Orange - system/kernel time
iowait = "#BD8100"    # Gold - I/O wait time
idle = "#D0D0D0"      # Light gray - idle time
user_fill = "#004FA559"      # Windows Blue with 35% alpha - user fill
system_fill = "#AC611059"    # Orange with 35% alpha - system fill
iowait_fill = "#BD810059"    # Gold with 35% alpha - iowait fill
idle_fill = "#D0D0D033"      # Light gray with 20% alpha - idle fill

[priority]
high   = "#E74856"     # Red
normal = "#107C10"     # Green
low    = "#7F7AD6"     # Purple
badge_text_color = "#1A1A1A"  # Preferred badge text; a fill it is too faint on gets the other text colour (#1130)

[buttons.close]
hovered = "#CC1A1A"     # Dark red hover
active  = "#E63333"     # Brighter red active

[buttons.success]
normal = "#16825D"     # Windows green
hovered = "#20A271"    # Bright green
active = "#106B4E"     # Dark green

# =============================================================================
# WINDOW COLORS
# Base colors for windows, popups, and borders - Windows 11 Mica effect inspired
# =============================================================================
[ui.window]
background = "#F5F7FA"            # Cool mica-like light gray
child_background = "#F5F7FA00"    # Transparent
popup_background = "#F1F5FAF0"    # Cool blue-tinted popup, semi-opaque (F0 = 94%)
border = "#DDE3EB80"              # Cool gray-blue border (80 = 50%)
border_shadow = "#00000000"       # Transparent - no border shadow

# =============================================================================
# FRAME COLORS
# Input fields, combo boxes, sliders background
# =============================================================================
[ui.frame]
background = "#F7FAFF"
background_hovered = "#EDF3FB"
background_active = "#E2EBF7"

# =============================================================================
# TITLE BAR COLORS
# Window title bars - Windows 11 style
# =============================================================================
[ui.title]
background = "#EDF1F7"
background_active = "#E4EAF2"
background_collapsed = "#EDF1F780"    # 80 = 50% alpha

# =============================================================================
# BAR COLORS
# Menu bar and status bar
# =============================================================================
[ui.bars]
menu = "#EDF1F7"
status = "#F0F4FA"

# =============================================================================
# SCROLLBAR COLORS
# =============================================================================
[ui.scrollbar]
background = "#F9F9F980"          # 80 = 50% alpha
grab = "#C8C8C8"
grab_hovered = "#A8A8A8"
grab_active = "#888888"

# =============================================================================
# CONTROL COLORS
# Checkboxes, sliders, etc. - Windows 11 accent
# =============================================================================
[ui.controls]
check_mark = "#0078D4"
slider_grab = "#0078D4"
slider_grab_active = "#005A9E"

# =============================================================================
# BUTTON COLORS
# Standard buttons (not danger buttons) - Windows 11 style
# =============================================================================
[ui.button]
normal = "#D0D0D0"          # Medium gray - visible on light popup
hovered = "#C0C0C0"          # Darker on hover
active = "#0078D4"           # Windows Blue on click

# =============================================================================
# HEADER COLORS
# Collapsible headers, tree nodes
# =============================================================================
[ui.header]
normal = "#CECECE"
hovered = "#E2E3E4"
active = "#E0E0E0"

# =============================================================================
# SEPARATOR COLORS
# Horizontal/vertical separators
# =============================================================================
[ui.separator]
normal = "#E5E5E580"              # 80 = 50% alpha
hovered = "#0078D4"
active = "#005A9E"

# =============================================================================
# RESIZE GRIP COLORS
# Window resize handles
# =============================================================================
[ui.resize_grip]
normal = "#C8C8C833"              # 33 = 20% alpha
hovered = "#0078D4"
active = "#005A9E"

# =============================================================================
# TAB COLORS
# Tab bar tabs - Windows 11 style
# =============================================================================
[ui.tab]
normal = "#E0E0E0"
hovered = "#EBEBEB"
active = "#FFFFFF"
active_overline = "#0078D4"             # Windows accent color overline
unfocused = "#F9F9F9"
unfocused_active = "#F3F3F3"
unfocused_active_overline = "#0078D480" # Semi-transparent accent overline

# =============================================================================
# DOCKING COLORS
# Docking preview and empty space
# =============================================================================
[ui.docking]
preview = "#0078D4B3"             # B3 = 70% alpha
empty_background = "#F3F3F3"

# =============================================================================
# PLOT COLORS
# ImGui plot widgets
# =============================================================================
[ui.plot]
grid = "#CCD2DA"
lines = "#0078D4"
lines_hovered = "#E74856"
histogram = "#107C10"
histogram_hovered = "#10893E"

# =============================================================================
# TABLE COLORS
# Table widget colors
# =============================================================================
[ui.table]
header_background = "#F9F9F9"
border_strong = "#E5E5E5"
border_light = "#F0F0F0"
row_background = "#00000000"      # Transparent
row_background_alt = "#00000008"  # 08 = 3% alpha

# =============================================================================
# MISCELLANEOUS UI COLORS
# =============================================================================
[ui.misc]
text_selected_background = "#0078D459"    # 59 = 35% alpha
drag_drop_target = "#FFB900"
nav_highlight = "#0078D4"
nav_windowing_highlight = "#00000066"     # 66 = 40% alpha
nav_windowing_dim_background = "#00000033" # 33 = 20% alpha
modal_window_dim_background = "#00000099"  # 99 = 60% alpha
