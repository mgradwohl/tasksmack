# Ubuntu Light Theme
# Inspired by Ubuntu 24.04 light mode (GNOME Adwaita) with warmer, paper-like base
# Orange accent pushed a bit brighter to mirror the dark theme’s warmth
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Ubuntu Light"
description = "Inspired by Ubuntu 24.04 light mode with orange accent"
author = "TaskSmack"
version = "1.0"

# =============================================================================
# ACCENT COLORS
# 8 colors for charts, legends, and UI highlights
# Ubuntu color palette
# =============================================================================
[accents]
colors = [
    "#F16322",  # Ubuntu Orange (brighter)
    "#0098D3",  # Ubuntu Blue (crisper)
    "#36A33E",  # Light Green
    "#8B4CC6",  # Purple
    "#DE7108",  # Dark Orange
    "#3A8FEA",  # Blue
    "#B58800",  # Yellow
    "#CC2333",  # Red
]

# =============================================================================
# PROGRESS BAR COLORS
# Colors for progress bars based on percentage thresholds
# =============================================================================
[progress]
low = "#529F52"       # 0-50%   - Light Green (healthy)
medium = "#CF7B00"    # 50-80%  - Orange (caution)
high = "#DC2925"      # 80-100% - Red (critical)

# =============================================================================
# SEMANTIC TEXT COLORS
# Colors for different types of text/messages
# =============================================================================
[semantic]
text_primary = "#111111"   # Near-black for high contrast on light bg
text_disabled = "#6B6B6B"  # Muted gray for disabled text
text_muted = "#686868"     # Gray - dimmed text
text_error = "#A72E2D"     # Red - error messages
text_warning = "#B14900"   # Orange - warning messages
text_success = "#007849"   # Green - success messages
text_info = "#0067CA"      # Blue - informational text

# =============================================================================
# PROCESS STATUS COLORS
# Colors for process states in the process list
# =============================================================================
[status]
running = "#00663E"    # Green - active/running (R)
sleeping = "#0057AD"   # Blue - sleeping (S)
disk_sleep = "#973D00" # Orange - uninterruptible I/O (D)
zombie = "#A51D2D"     # Deep red - defunct process (Z)
stopped = "#80379F"    # Purple - stopped/traced (T/t)
idle = "#585858"       # Gray - idle kernel thread (I)

# =============================================================================
# CHART LINE COLORS
# Colors for specific metric lines in graphs
# =============================================================================
[charts]
cpu = "#3B88E8"       # Blue - CPU usage line
memory = "#26A269"    # Green - memory usage line
io = "#B66444"        # Orange - I/O read usage line
io_write = "#5B5B1B"        # Olive - I/O write usage line
net_tx = "#AB800C"          # Amber - Network transmit (sent) line
net_rx = "#0C9AB1"          # Cyan - Network receive line
cpu_fill = "#3B88E84D"       # Blue with 30% alpha - CPU fill
memory_fill = "#26A2694D"    # Green with 30% alpha - memory fill
io_fill = "#B664444D"        # Orange with 30% alpha - I/O read fill
io_write_fill = "#5B5B1B4D"   # Olive with 30% alpha - I/O write fill
net_tx_fill = "#AB800C4D"    # Amber with 30% alpha - Network TX fill
net_rx_fill = "#0C9AB14D"    # Cyan with 30% alpha - Network RX fill
peak_line = "#845D00B3"      # Gold with 70% alpha - peak reference line

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#3B88E8"   # Blue - CPU Total line over the User/System bands
memory_cached = "#144517"   # Deep green - Memory: Cached (also Process Shared)
swap          = "#8F4ACA"   # Violet - Memory: Swap (also Process Virtual)
power         = "#797714"   # Olive - Power draw: system, process and GPU
battery       = "#327C77"   # Teal - Battery charge
threads       = "#AF2A5F"   # Rose - Thread count
handles       = "#53657F"   # Blue - Handles / file descriptors
page_faults   = "#5548B1"   # Violet - Page faults per second
gdi           = "#046F63"   # Teal - GDI objects (Windows)

# =============================================================================
# GPU METRICS COLORS
# Colors for GPU monitoring graphs, bars, and badges
# =============================================================================
[charts.gpu]
utilization = "#AA0386"           # Magenta - GPU utilization line
utilization_fill = "#AA03864D"    # Magenta with 30% alpha - GPU fill
memory = "#5B9C56"                # Green - GPU memory line
memory_fill = "#5B9C564D"         # Green with 30% alpha - GPU memory fill
temperature = "#BA833D"           # Amber - GPU temperature line
power = "#797714"                 # Olive - GPU power draw line
encoder = "#139BAC"               # Cyan - GPU encoder utilization
decoder = "#3153B8"               # Blue - GPU decoder utilization
clock = "#0098D3"             # Ubuntu Blue - GPU clock speed line (theme-native)
clock_fill = "#0098D3CC"      # Ubuntu Blue with 80% alpha - GPU clock fill
fan = "#8C8C8C"               # Neutral Gray - GPU fan speed line

# =============================================================================
# CPU BREAKDOWN COLORS
# Colors for the stacked CPU usage bar
# =============================================================================
[cpu_breakdown]
user = "#005CB5"      # Blue - user CPU time
system = "#8E5308"    # Orange - system/kernel time
iowait = "#E66100"    # Orange - I/O wait time
idle = "#D0D0D0"      # Light gray - idle time
user_fill = "#005CB559"      # Blue with 35% alpha - user fill
system_fill = "#8E530859"    # Orange with 35% alpha - system fill
iowait_fill = "#E6610059"    # Orange with 35% alpha - iowait fill
idle_fill = "#D0D0D033"      # Light gray with 20% alpha - idle fill

[priority]
high   = "#C01C28"     # Ubuntu Red
normal = "#26A269"     # Ubuntu Green
low    = "#8B4CC6"     # Purple
badge_text_color = "#1A1A1A"  # Preferred badge text; a fill it is too faint on gets the other text colour (#1130)

[buttons.close]
hovered = "#CC1A1A"     # Dark red hover
active  = "#E63333"     # Brighter red active

[buttons.success]
normal = "#26A269"     # Ubuntu green
hovered = "#33D17A"    # Bright green
active = "#1A7447"     # Dark green

# =============================================================================
# WINDOW COLORS
# Base colors for windows, popups, and borders - Ubuntu/Adwaita light
# =============================================================================
[ui.window]
background = "#FBF8F4"            # Warm paper-like background
child_background = "#FBF8F400"    # Transparent
popup_background = "#F8F1EAF0"    # Warm parchment-tinted popup, semi-opaque (F0 = 94%)
border = "#D7CFC480"              # Warm gray-beige border (80 = 50%)
border_shadow = "#00000000"       # Transparent - no border shadow

# =============================================================================
# FRAME COLORS
# Input fields, combo boxes, sliders background
# =============================================================================
[ui.frame]
background = "#FFF7F0"
background_hovered = "#F6EFE6"
background_active = "#EDE4D9"

# =============================================================================
# TITLE BAR COLORS
# Window title bars - Ubuntu/GNOME style
# =============================================================================
[ui.title]
background = "#F1E8DE"
background_active = "#E7DDCF"
background_collapsed = "#F1E8DE80"    # 80 = 50% alpha

# =============================================================================
# BAR COLORS
# Menu bar and status bar
# =============================================================================
[ui.bars]
menu = "#F1E8DE"
status = "#F6EFE6"

# =============================================================================
# SCROLLBAR COLORS
# =============================================================================
[ui.scrollbar]
background = "#F5F5F580"          # 80 = 50% alpha
grab = "#CCCCCC"
grab_hovered = "#AAAAAA"
grab_active = "#888888"

# =============================================================================
# CONTROL COLORS
# Checkboxes, sliders, etc. - Ubuntu orange accent
# =============================================================================
[ui.controls]
check_mark = "#E95420"
slider_grab = "#E95420"
slider_grab_active = "#C94017"

# =============================================================================
# BUTTON COLORS
# Standard buttons (not danger buttons) - Ubuntu/Adwaita style
# =============================================================================
[ui.button]
normal = "#D8D8D8"          # Medium gray - visible on light popup
hovered = "#C8C8C8"          # Darker on hover
active = "#E95420"           # Ubuntu Orange on click

# =============================================================================
# HEADER COLORS
# Collapsible headers, tree nodes
# =============================================================================
[ui.header]
normal = "#D0D0D0"
hovered = "#E5E4E2"
active = "#EEEEEE"

# =============================================================================
# SEPARATOR COLORS
# Horizontal/vertical separators
# =============================================================================
[ui.separator]
normal = "#CCCCCC80"              # 80 = 50% alpha
hovered = "#E95420"
active = "#C94017"

# =============================================================================
# RESIZE GRIP COLORS
# Window resize handles
# =============================================================================
[ui.resize_grip]
normal = "#CCCCCC33"              # 33 = 20% alpha
hovered = "#E95420"
active = "#C94017"

# =============================================================================
# TAB COLORS
# Tab bar tabs - Ubuntu/GNOME style
# =============================================================================
[ui.tab]
normal = "#DADADA"
hovered = "#E1E1E1"
active = "#FAFAFA"
active_overline = "#E95420"             # Ubuntu orange overline
unfocused = "#F5F5F5"
unfocused_active = "#EBEBEB"
unfocused_active_overline = "#E9542080" # Semi-transparent orange overline

# =============================================================================
# DOCKING COLORS
# Docking preview and empty space
# =============================================================================
[ui.docking]
preview = "#E95420B3"             # B3 = 70% alpha
empty_background = "#FAFAFA"

# =============================================================================
# PLOT COLORS
# ImGui plot widgets
# =============================================================================
[ui.plot]
grid = "#D7CFC4"
lines = "#3584E4"
lines_hovered = "#C01C28"
histogram = "#26A269"
histogram_hovered = "#77DD77"

# =============================================================================
# TABLE COLORS
# Table widget colors
# =============================================================================
[ui.table]
header_background = "#F5F5F5"
border_strong = "#CCCCCC"
border_light = "#E0E0E0"
row_background = "#00000000"      # Transparent
row_background_alt = "#00000008"  # 08 = 3% alpha

# =============================================================================
# MISCELLANEOUS UI COLORS
# =============================================================================
[ui.misc]
text_selected_background = "#E9542059"    # 59 = 35% alpha
drag_drop_target = "#FFBE00"
nav_highlight = "#E95420"
nav_windowing_highlight = "#00000066"     # 66 = 40% alpha
nav_windowing_dim_background = "#00000033" # 33 = 20% alpha
modal_window_dim_background = "#00000099"  # 99 = 60% alpha
