[meta]
name = "High Contrast"
description = "High contrast dark palette for accessible reading and chart interpretation"
author = "TaskSmack"
version = "1.0"
[accents]
colors = [
    "#56B4E9",
    "#E69F00",
    "#009E73",
    "#CC79A7",
    "#F0E442",
    "#0072B2",
    "#D55E00",
    "#00A6A6",
]
[semantic]
text_primary = "#F0FFF0"
text_disabled = "#A8D8A8"
text_muted = "#C8E8C8"
text_error = "#FF7373"
text_warning = "#FFD166"
text_success = "#8FFFA0"
text_info = "#66BB6A"
[status]
running = "#9BE3A1"
sleeping = "#AEE28F"
disk_sleep = "#9CDF95"
zombie = "#B9F6CA"
stopped = "#B0E6A3"
idle = "#7EBF79"
[charts]
cpu = "#709CC7"
memory = "#71A28A"
io = "#DB9564"
io_write = "#94844C"
net_tx = "#C0AB91"
net_rx = "#77BEC8"
cpu_fill = "#709CC74D"
memory_fill = "#71A28A4D"
io_fill = "#DB95644D"
io_write_fill = "#94844C4D"
net_tx_fill = "#C0AB914D"
net_rx_fill = "#77BEC84D"
peak_line = "#9CCC65B3"
cpu_total     = "#709CC7"
memory_cached = "#ADEAC3"
swap          = "#9783C4"
memory_private = "#2E7D32"
memory_swap    = "#ACAEE1"
power         = "#DAE0A1"
battery       = "#6FBDBA"
threads       = "#B97FAA"
handles       = "#9A9A9A"
page_faults   = "#ACAEE1"
gdi           = "#85C0BE"
[charts.gpu]
utilization = "#B382A5"
utilization_fill = "#B382A54D"
memory = "#94AB98"
memory_fill = "#94AB984D"
temperature = "#C89A83"
power = "#DAE0A1"
encoder = "#B9F6CA"
decoder = "#397939"
clock = "#95C4DC"
clock_fill = "#95C4DCCC"
fan = "#2E7D32"
[cpu_breakdown]
user = "#97D1F2"
system = "#CB967D"
iowait = "#C3B4A7"
idle = "#2E7D32"
user_fill = "#97D1F259"
system_fill = "#CB967D59"
iowait_fill = "#C3B4A759"
idle_fill = "#2E7D3233"
[priority]
high   = "#B9F6CA"
normal = "#4CAF50"
low    = "#2E7D32"
badge_text_color = "#FFFFFF"
[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"
[buttons.success]
normal = "#66BB6A"
hovered = "#A5D6A7"
active = "#43A047"
[ui.window]
background = "#000000"
child_background = "#00000000"
popup_background = "#000000F0"
border = "#6B6B6BFF"
border_shadow = "#00000000"
[ui.frame]
background = "#080808"
background_hovered = "#111111"
background_active = "#1C1C1C"
[ui.title]
background = "#000000"
background_active = "#141414"
background_collapsed = "#00000080"
[ui.bars]
menu = "#080808"
status = "#111111"
[ui.scrollbar]
background = "#00000080"
grab = "#6B6B6B"
grab_hovered = "#8A8A8A"
grab_active = "#B0B0B0"
[ui.controls]
check_mark = "#F0E442"
slider_grab = "#56B4E9"
slider_grab_active = "#0072B2"
[ui.button]
normal = "#174A70"
hovered = "#1C5E8C"
active = "#0072B2"
[ui.header]
normal = "#005A9C"
hovered = "#003350"
active = "#56B4E9AA"
[ui.separator]
normal = "#3A3A3A80"
hovered = "#8A8A8A"
active = "#B0B0B0"
[ui.resize_grip]
normal = "#6B6B6B33"
hovered = "#8A8A8A"
active = "#B0B0B0"
[ui.tab]
normal = "#292929"
hovered = "#005A9C"
active = "#080808"
active_overline = "#F0E442"
unfocused = "#141414"
unfocused_active = "#242424"
unfocused_active_overline = "#F0E44280"
[ui.docking]
preview = "#56B4E9B3"
empty_background = "#000000"
[ui.plot]
grid = "#292929"
lines = "#F0F0F0"
lines_hovered = "#FFFFFF"
histogram = "#56B4E9"
histogram_hovered = "#F0E442"
[ui.table]
header_background = "#101010"
border_strong = "#6B6B6B"
border_light = "#292929"
row_background = "#FFFFFF04"
row_background_alt = "#FFFFFF0C"
[ui.misc]
text_selected_background = "#005A9C59"
drag_drop_target = "#F0E442"
nav_highlight = "#F0E442"
nav_windowing_highlight = "#FFFFFFB3"
nav_windowing_dim_background = "#FFFFFF33"
modal_window_dim_background = "#00000099"
