# Latte Theme
# Catppuccin Latte - warm light background with vivid pastel accents
# Part of the Catppuccin color scheme family (catppuccin.com)
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Latte"
description = "Catppuccin Latte - warm light background with vivid pastel accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#1E66F5",  # Blue
    "#D20F39",  # Red
    "#1D850A",  # Green
    "#7134BE",  # Mauve
    "#007F92",  # Sapphire
    "#B8489D",  # Pink
    "#A46400",  # Yellow
    "#C74A00",  # Peach
]

[progress]
low = "#4E7540"       # 0-50%   - Green (healthy)
medium = "#83510B"    # 50-80%  - Yellow (caution)
high = "#D20F39"      # 80-100% - Red (critical)

[semantic]
text_primary = "#33364E"
text_disabled = "#9CA0B0"
text_muted = "#555869"
text_error = "#943C3F"
text_warning = "#622100"
text_success = "#0C6700"
text_info = "#004FC7"

[status]
running = "#0B6200"
sleeping = "#004CBF"
disk_sleep = "#953500"
zombie = "#AB002B"
stopped = "#6C1DD5"
idle = "#505462"

[charts]
cpu = "#1174D1"
memory = "#1D850A"
io = "#904B07"
io_write = "#4F3D08"
net_tx = "#9C6A0A"
net_rx = "#008087"
cpu_fill = "#1174D14D"
memory_fill = "#1D850A4D"
io_fill = "#904B074D"
io_write_fill = "#4F3D084D"
net_tx_fill = "#9C6A0A4D"
net_rx_fill = "#0080874D"
peak_line = "#474A64B3"

# Metric roles (#1196): every metric has its own colour; a theme without them borrows the old fields.
cpu_total     = "#1174D1"   # Blue - CPU Total line over the User/System bands
memory_cached = "#07583F"   # Deep green - Memory: Cached (also Process Shared)
swap          = "#7C2AB5"   # Violet - Memory: Swap (also Process Virtual)
power         = "#65630C"   # Olive - Power draw: system, process and GPU
battery       = "#097F6B"   # Teal - Battery charge
threads       = "#AA50AC"   # Magenta - Thread count
handles       = "#586A80"   # Blue - Handles / file descriptors
page_faults   = "#5462EF"   # Blue - Page faults per second
gdi           = "#037652"   # Green - GDI objects (Windows)

[charts.gpu]
utilization = "#B54B99"
utilization_fill = "#B54B994D"
memory = "#097B62"
memory_fill = "#097B624D"
temperature = "#AA5B3D"
power = "#65630C"
encoder = "#3F6A7D"
decoder = "#6937B6"
clock = "#1E66F5"
clock_fill = "#1E66F5CC"
fan = "#6F7382"

[cpu_breakdown]
user = "#003DC1"
system = "#A15F02"
iowait = "#816543"
idle = "#CCD0DA"
user_fill = "#003DC159"
system_fill = "#A15F0259"
iowait_fill = "#81654359"
idle_fill = "#CCD0DA33"

[priority]
high   = "#D20F39"
normal = "#40A02B"
low    = "#1E66F5"
badge_text_color = "#1A1A1A"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#40A02B"
hovered = "#50C037"
active = "#30801F"

[ui.window]
background = "#EFF1F5"
child_background = "#E6E9EF00"
popup_background = "#E6E9EFF0"
border = "#BCC0CC80"
border_shadow = "#00000000"

[ui.frame]
background = "#CCD0DA"
background_hovered = "#BCC0CC"
background_active = "#ACB0BE"

[ui.title]
background = "#E6E9EF"
background_active = "#CCD0DA"
background_collapsed = "#E6E9EF80"

[ui.bars]
menu = "#E6E9EF"
status = "#DDE0E8"

[ui.scrollbar]
background = "#EFF1F580"
grab = "#BCC0CC"
grab_hovered = "#9CA0B0"
grab_active = "#7C7F93"

[ui.controls]
check_mark = "#1E66F5"
slider_grab = "#1E66F5"
slider_grab_active = "#1858DC"

[ui.button]
normal = "#CCD0DA"
hovered = "#BCC0CC"
active = "#1E66F5"

[ui.header]
normal = "#C5C9D5"
hovered = "#DADDE5"
active = "#ACB0BE"

[ui.separator]
normal = "#ACB0BE80"
hovered = "#1E66F5"
active = "#209FB5"

[ui.resize_grip]
normal = "#1E66F533"
hovered = "#1E66F5"
active = "#209FB5"

[ui.tab]
normal = "#CDD3DF"
hovered = "#CCD0DA"
active = "#EFF1F5"
active_overline = "#8839EF"
unfocused = "#EFF1F5"
unfocused_active = "#E6E9EF"
unfocused_active_overline = "#8839EF80"

[ui.docking]
preview = "#8839EFB3"
empty_background = "#EFF1F5"

[ui.plot]
grid = "#A9ADB9"
lines = "#1E66F5"
lines_hovered = "#D20F39"
histogram = "#40A02B"
histogram_hovered = "#FE640B"

[ui.table]
header_background = "#F5F6FA"
border_strong = "#C0C4D0"
border_light = "#D5D8E5"
row_background = "#00000000"
row_background_alt = "#00000008"

[ui.misc]
text_selected_background = "#1E66F559"
drag_drop_target = "#DF8E1D"
nav_highlight = "#8839EF"
nav_windowing_highlight = "#00000066"
nav_windowing_dim_background = "#00000033"
modal_window_dim_background = "#00000099"
