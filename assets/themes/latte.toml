# Latte Theme
# Catppuccin Latte - warm light background with vivid pastel accents
# Part of the Catppuccin color scheme family (catppuccin.com)
#
# Color format: "#RRGGBB" or "#RRGGBBAA" (with alpha)
# Alpha: 00 = transparent, FF = opaque

[meta]
name = "Latte"
description = "Catppuccin Latte - warm light background with vivid pastel accents"
author = "TaskSmack"
version = "1.0"

[accents]
colors = [
    "#1E66F5",  # Blue
    "#D20F39",  # Red
    "#1D850A",  # Green
    "#8839EF",  # Mauve
    "#C74A00",  # Peach
    "#B8489D",  # Pink
    "#A46400",  # Yellow
    "#007F92",  # Sapphire
]

[progress]
low = "#1D850A"       # 0-50%   - Green (healthy)
medium = "#A46400"    # 50-80%  - Yellow (caution)
high = "#D20F39"      # 80-100% - Red (critical)

[semantic]
text_primary = "#33364E"
text_disabled = "#9CA0B0"
text_muted = "#555869"
text_error = "#B4002E"
text_warning = "#9C3800"
text_success = "#0C6700"
text_info = "#004FC7"

[status]
running = "#0B6200"
sleeping = "#004CBF"
disk_sleep = "#953500"
zombie = "#AB002B"
stopped = "#6C1DD5"
idle = "#505462"

[charts]
cpu = "#1E66F5"
memory = "#1D850A"
io = "#C34C50"
io_write = "#C74A00"
net_tx = "#8839EF"
net_rx = "#008087"
cpu_fill = "#1E66F54D"
memory_fill = "#1D850A4D"
io_fill = "#C34C504D"
io_write_fill = "#C74A004D"
net_tx_fill = "#8839EF4D"
net_rx_fill = "#0080874D"
peak_line = "#474A64B3"

[charts.gpu]
utilization = "#6C1DD5"
utilization_fill = "#6C1DD54D"
memory = "#A46400"
memory_fill = "#A464004D"
temperature = "#C74A00"
power = "#458034"
encoder = "#1E7383"
decoder = "#B8489D"
clock = "#1E66F5"
clock_fill = "#1E66F5CC"
fan = "#6F7382"

[cpu_breakdown]
user = "#003DC1"
system = "#B4002E"
iowait = "#D23F00"
idle = "#CCD0DA"
user_fill = "#003DC159"
system_fill = "#B4002E59"
iowait_fill = "#D23F0059"
idle_fill = "#CCD0DA33"

[priority]
high   = "#D20F39"
normal = "#40A02B"
low    = "#1E66F5"
badge_text_color = "#1A1A1A"

[buttons.close]
hovered = "#CC1A1A"
active  = "#E63333"

[buttons.success]
normal = "#40A02B"
hovered = "#50C037"
active = "#30801F"

[ui.window]
background = "#EFF1F5"
child_background = "#E6E9EF00"
popup_background = "#E6E9EFF0"
border = "#BCC0CC80"
border_shadow = "#00000000"

[ui.frame]
background = "#CCD0DA"
background_hovered = "#BCC0CC"
background_active = "#ACB0BE"

[ui.title]
background = "#E6E9EF"
background_active = "#CCD0DA"
background_collapsed = "#E6E9EF80"

[ui.bars]
menu = "#E6E9EF"
status = "#DDE0E8"

[ui.scrollbar]
background = "#EFF1F580"
grab = "#BCC0CC"
grab_hovered = "#9CA0B0"
grab_active = "#7C7F93"

[ui.controls]
check_mark = "#1E66F5"
slider_grab = "#1E66F5"
slider_grab_active = "#1858DC"

[ui.button]
normal = "#CCD0DA"
hovered = "#BCC0CC"
active = "#1E66F5"

[ui.header]
normal = "#C5C9D5"
hovered = "#DADDE5"
active = "#ACB0BE"

[ui.separator]
normal = "#ACB0BE80"
hovered = "#1E66F5"
active = "#209FB5"

[ui.resize_grip]
normal = "#1E66F533"
hovered = "#1E66F5"
active = "#209FB5"

[ui.tab]
normal = "#CDD3DF"
hovered = "#CCD0DA"
active = "#EFF1F5"
active_overline = "#8839EF"
unfocused = "#EFF1F5"
unfocused_active = "#E6E9EF"
unfocused_active_overline = "#8839EF80"

[ui.docking]
preview = "#8839EFB3"
empty_background = "#EFF1F5"

[ui.plot]
grid = "#A9ADB9"
lines = "#1E66F5"
lines_hovered = "#D20F39"
histogram = "#40A02B"
histogram_hovered = "#FE640B"

[ui.table]
header_background = "#F5F6FA"
border_strong = "#C0C4D0"
border_light = "#D5D8E5"
row_background = "#00000000"
row_background_alt = "#00000008"

[ui.misc]
text_selected_background = "#1E66F559"
drag_drop_target = "#DF8E1D"
nav_highlight = "#8839EF"
nav_windowing_highlight = "#00000066"
nav_windowing_dim_background = "#00000033"
modal_window_dim_background = "#00000099"
