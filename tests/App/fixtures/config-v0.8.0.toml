# TaskSmack user configuration
# This file is auto-generated. Manual edits are preserved.
# Notes:
#   [sampling] interval_ms: refresh cadence (100-5000ms); affects all samplers
#   [sampling] history_max_seconds: timeline history window (10-1800s)
#   [sampling] pdh_instance_refresh_seconds: Windows only; GPU process discovery interval (1-60s)
#   [sampling] socket_stats_cache_ttl_ms: Linux only; per-process network stat cache TTL (0-5000ms)
#   [metrics] min_time_for_rate_seconds: delay before computing network rates (0.0-5.0s); avoids early spikes
#   [metrics] max_sane_rate_bps: sanity check for network/IO rates (bytes/sec); clamps outliers
#   [metrics] integrated_gpu_vram_threshold_mb: GPU classification threshold (16-512MB)
#   [ui] chart_smooth_factor: exponential smoothing for charts (0.0-0.95); 0=no smoothing, 0.95=max smoothing
#   [ui] chart_tau_ms_min/max: adaptive smoothing time constant range (ms); affects chart responsiveness
#   [ui] progress_color_low/high_threshold: color change percentages for progress bars
#   [ui] show_privilege_notice: show startup dialog when running without elevated privileges (true/false)
#   [process_columns]: toggle columns on/off; true shows the column
#   Themes: built-in themes in assets/themes. Add custom .toml themes beside this config under a 'themes' folder.

[font]
size = 'large'

[metrics]
integrated_gpu_vram_threshold_mb = 128
max_sane_rate_bps = 12500000000.0
min_time_for_rate_seconds = 0.5

[process_columns]
affinity = false
command = true
cpu_percent = true
cpu_time = true
gdi_objects = false
gpu_device = false
gpu_engine = false
gpu_memory = false
gpu_percent = false
handles = false
io_read = false
io_write = false
mem_percent = true
name = true
net_recv = true
net_sent = true
nice = false
page_faults = false
peak_resident = false
pid = true
power = true
ppid = false
publisher = false
resident = true
shared = false
start_time = false
state = true
status = false
threads = true
type = false
user = false
virtual = false

[sampling]
history_max_seconds = 600
interval_ms = 2000
pdh_instance_refresh_seconds = 5
socket_stats_cache_ttl_ms = 500

[theme]
id = 'dracula'

[ui]
chart_smooth_factor = 0.5
chart_tau_ms_max = 400
chart_tau_ms_min = 20
progress_color_high_threshold = 80.0
progress_color_low_threshold = 50.0
show_privilege_notice = false

[window]
height = 860
maximized = false
width = 1500
x = 150
y = 90
