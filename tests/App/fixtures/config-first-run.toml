# TaskSmack user configuration
# Written by TaskSmack. Keys it doesn't use are kept, but comments in this file are not.
# Edits made while TaskSmack is running are kept unless TaskSmack changes the same setting.
# Notes:
#   [sampling] interval_ms: refresh cadence (100-5000ms); affects all samplers
#   [sampling] history_max_seconds: timeline history window (10-1800s)
#   [sampling] socket_stats_cache_ttl_ms: Linux only; per-process network stat cache TTL (0-5000ms)
#   [sampling] udp_event_trace: Windows only; count UDP per process through a kernel network event trace when TaskSmack runs as administrator (true/false, default false: TCP only)
#   [metrics] max_sane_rate_bps: network rate ceiling for process and interface rates (1e9-1e11 bytes/sec); a higher rate is taken for a bad reading and shown as 0 (an interface's is also a gap in its chart); read at startup
#   [ui] chart_smooth_factor: how slowly live values and the bars beside charts follow each sample (0.0-0.95), as a fraction of the refresh interval; read at startup
#   [ui] chart_tau_ms_min/max: the shortest (5-100ms) and longest (100-2000ms) that easing may take; read at startup
#   [ui] show_privilege_notice: show startup dialog when running without elevated privileges (true/false)
#   [ui] cpu_details_expanded: whether the Overview's CPU Details block is expanded (true/false); its heading toggles it
#   [ui] chart_anti_aliasing: smooth chart line/fill edges (true/false); disable for lower CPU/GPU cost on integrated GPUs
#   [window] width/height/x/y: the window's normal (restored) size and position, kept while it is maximized; a position off every connected display is ignored at startup
#   [window] maximized: reopen maximized; Restore returns to width/height/x/y
#   config_version: the format of this file (written by TaskSmack; don't change it)
#   [process_columns]: columns you showed (true) or hid (false); a column not listed follows the defaults, which hide one this system can't fill
#   [process_meters]: what a column draws behind its value: "off", "bar" or "sparkline" (recent history); Columns > Show meter
#   [process_table] layout: saved column widths, order and sort (written by TaskSmack; delete it to reset)
#   Themes: built-in themes in assets/themes. Add custom .toml themes beside this config under a 'themes' folder.

config_version = 2

[dumps]
folder = ''

[font]
size = 'medium'

[metrics]
max_sane_rate_bps = 12500000000.0

[process_meters]
cpu_percent = 'bar'
gpu_memory = 'off'
gpu_percent = 'off'
io_read = 'off'
io_write = 'off'
mem_percent = 'off'
net_recv = 'off'
net_sent = 'off'
npu_memory = 'off'
npu_percent = 'off'
resident = 'off'

[process_table]
layout = "<masked>"

[sampling]
history_max_seconds = 300
interval_ms = 1000
socket_stats_cache_ttl_ms = 500
udp_event_trace = false

[theme]
id = 'arctic-fire'

[ui]
chart_anti_aliasing = true
chart_smooth_factor = 0.5
chart_tau_ms_max = 400
chart_tau_ms_min = 20
cpu_details_expanded = true
highlight_new_processes = true
show_privilege_notice = true
show_process_icons = true

[window]
force_native_decorations_on_wayland = false
height = "<masked>"
maximized = false
scale = "<masked>"
width = "<masked>"
x = "<masked>"
y = "<masked>"
